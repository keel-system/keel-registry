reviewedBy: keel-design-review
reviewedAt: 0.2.0
findings:
- id: REV-DOMAIN-VAGUE-INVARIANT
  scope: domain.entities.Refund.invariants, domain.entities.Payment.invariants
  verdict: ok
  note: >-
    Las invariantes de Refund se deciden mirando el estado actual o un cambio concreto: la nueva «El
    requestedAmount de una devolución no cambia después de crearla» nombra el campo y la condición, y la de la
    suma («la suma de los amount de las devoluciones succeeded y pending de un cobro nunca supera el amount del
    cobro») sigue usando amount, que es lo que de verdad se devolvió. Las de Payment que quedan en prosa
    (titularidad del medio, una sola devolución pending y solo en refunding, moneda inmutable, decimales ISO 4217)
    son verificables. Observación menor, sin hallazgo: la description de Refund.amount empieza por «Importe
    pedido», y desde v0.2.0 el importe pedido que no cambia es requestedAmount; el resto de la frase deja claro
    que amount es el importe resuelto y después el informado, así que no hay dos lecturas.
- id: REV-DOMAIN-ENUM-NO-LIFECYCLE
  scope: domain.entities.Refund, domain.entities.PaymentMethod
  verdict: accepted
  note: >-
    Refund.status (RefundStatus) y PaymentMethod.status (PaymentMethodStatus) no tienen lifecycle. El propio
    diseño explica por qué en prosa: «El status de una devolución lo gobierna la raíz: nace en pending al entrar
    el cobro en refunding, y pasa a succeeded o failed en el mismo cambio en que el cobro sale de refunding» y
    «El status de un medio lo gobierna su Wallet: pasa de active a removed al retirarlo, y removed es terminal».
    Son entidades internas y un lifecycle propio lo marcaría CHK-DOMAIN-INNER-LIFECYCLE. Las transiciones las
    ejecutan refundPayment, markRefunded y sweepPendingPayments (Refund) y removePaymentMethod (PaymentMethod).
    Nada de v0.2.0 cambia esto.
- id: REV-DOMAIN-INVARIANT-IS-TRANSITION
  scope: domain.entities.Refund.invariants, domain.entities.PaymentMethod.invariants
  verdict: accepted
  note: >-
    Mismo motivo que REV-DOMAIN-ENUM-NO-LIFECYCLE: tres invariantes describen la máquina de las entidades
    internas (Refund: «lo gobierna la raíz…» y «succeeded o failed no vuelve a cambiar»; PaymentMethod: «pasa
    de active a removed… removed es terminal»), y el diseño explica en ellas que la gobierna su raíz. La nueva
    de v0.2.0, «El requestedAmount de una devolución no cambia después de crearla», no es una transición de
    estado sino una regla de inmutabilidad de un campo, como la de la moneda de Payment: no entra en este id.
- id: REV-DOMAIN-COMPUTED-NOT-DERIVABLE
  scope: domain.entities.Payment.fields.refundedAmount, domain.entities.PaymentMethod.fields.expired
  verdict: ok
  note: >-
    refundedAmount = suma de Refund.amount con status succeeded: Payment tiene refunds one-to-many y Refund
    tiene amount y status dentro del agregado. Con v0.2.0 sigue sumando amount (el importe informado por la
    pasarela, que es lo devuelto), no requestedAmount, y es lo correcto para el check refundedAmount lte amount.
    expired sale de card.expYear y card.expMonth, y v0.2.0 garantiza que ambos existan siempre (savePaymentMethod
    rechaza un resumen incompleto).
- id: REV-DOMAIN-INVARIANT-PROSE
  scope: domain.entities.Refund.invariants, domain.entities.Payment.invariants, domain.entities.Wallet.invariants
  verdict: ok
  note: >-
    Las presencias por estado y las comparaciones de Payment ya son checks (awaitingSince, cancelOrigin,
    failureReason, customerAction, actionRequiredSince, refundedAmount contra amount), y PaymentMethod tiene el
    de isDefault en removed. La invariante nueva de Refund (requestedAmount no cambia) habla de un cambio, no de
    un estado: el vocabulario de checks (requires, forbids, op contra campo o literal) no la expresa, igual que la
    moneda inmutable de Payment. Tampoco hay comparación fija entre requestedAmount y amount que pasar a check:
    markRefunded puede dejar amount por encima o por debajo del pedido. El resto en prosa sigue con razón: cruza
    agregados (titularidad), depende de tabla externa (ISO 4217) o cuenta/suma hijas filtradas por status.
- id: REV-DOMAIN-PROMISED-STATE
  scope: use-cases.operations.refundPayment, use-cases.operations.savePaymentMethod
  verdict: ok
  note: >-
    Lo que promete v0.2.0 la entidad lo puede representar. refundPayment compara la repetición «contra
    requestedAmount, no contra el amount que haya informado la pasarela»: Refund.requestedAmount (Amount,
    required) existe, lo escribe la rule de creación («con amount y requestedAmount iguales al importe resuelto»)
    y ninguna otra operación lo toca (markRefunded solo reescribe amount). savePaymentMethod promete que con un
    resumen incompleto «aquí no se guarda nada»: no hay estado intermedio que representar, y CardDetails exige
    brand, last4, expMonth y expYear, así que un medio guardado siempre tiene el resumen que listPaymentMethods y
    expired necesitan. Las promesas de anulación (cancelOrigin, customerAction conservado) siguen sostenidas por
    los checks de Payment.
- id: REV-PERSONAL-CLASSIFICATION
  scope: domain.entities
  verdict: ok
  note: >-
    Marcados personal: Payment.customerRef, Wallet.customerRef, PaymentMethod.gatewayMethodRef (además
    sensitive), PaymentMethod.card y Refund.reason, y customerRef/reason en inputs y payloads. El campo nuevo
    Refund.requestedAmount es un importe, no habla de una persona, como amount. El resto (chargeRequestId,
    refundRequestId, gatewayPaymentId, customerAction, failureReason, estados, fechas) no identifica al titular.
- id: REV-DOMAIN-PARTIAL-WRITER
  scope: domain.entities.Payment.lifecycle, domain.entities.Refund.fields.status
  verdict: ok
  note: >-
    failed lo escribe siempre markFailed con failureReason obligatorio (desde la petición, la anulación o el
    barrido). La vuelta a authorized, actionRequired o captured tras un rechazo tiene las mismas reglas de
    vaciado y renovación en cancelPayment, capturePayment, refundPayment y el barrido. canceled no guarda el
    motivo en la entidad por ninguna de sus vías (requested viaja solo en PaymentCanceled), así que es simétrico
    y lo conserva audit.history de Payment. Refund failed tampoco lleva motivo por ninguna vía (rechazo en
    refundPayment o en el barrido). v0.2.0 no añade vías nuevas a ningún estado: savePaymentMethod con resumen
    incompleto no escribe nada.
- id: REV-USECASES-INTERNAL-REPEAT
  scope: use-cases.operations
  verdict: ok
  note: >-
    refundPayment sigue frenado por la naturalKey refundRequestId de Refund (persistence, REFUND_REQUEST_CONFLICT),
    y v0.2.0 lo refuerza: la repetición se compara contra requestedAmount, que no cambia, así que reintentar la
    petición original tras un ajuste de importe de la pasarela devuelve el cobro en vez de un 409 que el
    consumidor no sabría leer. capturePayment y cancelPayment son idempotentes por estado; los mark* no hacen nada
    fuera de su estado de origen; setDefaultPaymentMethod y removePaymentMethod fijan. savePaymentMethod tiene
    client-key, y su rama nueva (resumen incompleto) no guarda nada y deja la clave libre, sin efecto interno que
    se acumule; el posible medio huérfano en la pasarela está dicho en la rule («nunca se cobra»).
- id: REV-USECASES-GUARD-ORDER
  scope: use-cases.operations.refundPayment, use-cases.operations.savePaymentMethod, use-cases.operations.requestCharge
  verdict: ok
  note: >-
    refundPayment: PAYMENT_NOT_FOUND, después la clave («justo después de que el cobro exista y antes que
    cualquier otra guarda»), y solo entonces escala, estado y REFUND_AMOUNT_EXCEEDED. Comparar contra
    requestedAmount es implementable porque el dato está en la Refund ya leída por la clave; una repetición con
    amount de escala inválida da REFUND_REQUEST_CONFLICT y no AMOUNT_SCALE_INVALID, consecuencia determinista
    del orden declarado. savePaymentMethod: clave de idempotencia, tope de 10 «antes de llamar a la pasarela»,
    llamada, y después la comprobación del resumen, que solo puede ir tras la respuesta: el orden es el único
    posible. requestCharge sin cambios: la repetición antes que la precondición del medio.
- id: REV-API-DELETE-BODY
  scope: api.endpoints.removePaymentMethod
  verdict: ok
  note: El único DELETE (removePaymentMethod) declara successStatus 204 y la operación tiene output "void".
- id: REV-SEC-M2M-AUDIENCE
  scope: security.authentication.serviceAuth
  verdict: ok
  note: >-
    serviceAuth declara validateAudience true con audience payment: un token emitido para otro servicio del
    mismo servidor de autenticación no vale aquí.
- id: REV-MSG-MISSING-CHANNEL
  scope: messaging.publishing.events
  verdict: ok
  note: >-
    Los siete eventos (PaymentAuthorized, PaymentActionRequired, PaymentCaptured, PaymentFailed, PaymentCanceled,
    PaymentRefunded, PaymentActionRejected) declaran channel paymentEvents, canal lógico declarado en channels. No
    hay suscripciones.
- id: REV-HISTORY-SCOPE
  scope: persistence.audit.history
  verdict: ok
  note: >-
    history: [Payment, Wallet] cubre las dos raíces persistidas: Payment mueve dinero (y con él sus Refund,
    incluido el nuevo requestedAmount), y Wallet guarda datos personales y la autorización de cobro sin el
    titular. Que nadie lo lea por la API está aceptado en decisions.yaml (OBL-HISTORY-UNREAD para las dos).
- id: REV-PERSIST-MISSING-INDEX
  scope: persistence.entities
  verdict: ok
  note: >-
    Payment: naturalKey chargeRequestId (getPaymentByChargeRequest, repetición), [status, awaitingSince] (barrido)
    y [customerRef, createdAt] (listPaymentsByCustomer). Refund: naturalKey refundRequestId (la búsqueda de la
    repetición, que ahora lee requestedAmount de esa misma fila) e [payment, createdAt]. Wallet: naturalKey
    customerRef. PaymentMethod: [wallet, status] y el único parcial del default. v0.2.0 no añade ninguna consulta.
- id: REV-PAYMENTS-AMOUNT-SOURCE
  scope: payments.charge.amount
  verdict: accepted
  note: >-
    El importe viaja en el input de requestCharge y nada lo contrasta. Lo explica el propio diseño: Payment.amount
    («Lo fija el servidor consumidor, que es de confianza: el servicio no lo contrasta con nada») y la rule de
    requestCharge («El importe lo fija el servidor consumidor, que es de confianza; el servicio no le pone tope ni
    lo contrasta con nada»), con un único público M2M (security.serviceClients checkout y backoffice).
- id: REV-PAYMENTS-CARD-DATA
  scope: use-cases.operations, messaging.publishing.events
  verdict: ok
  note: >-
    Las fuentes de pago entran como referencias opacas: paymentToken (no se guarda) y paymentMethodId en
    requestCharge, paymentToken en savePaymentMethod. CardDetails (brand, last4, expMonth, expYear) solo llega
    de la pasarela y solo sale en outputs; la regla nueva de v0.2.0 lo valida a la vuelta de la pasarela y
    rechaza sin guardar si está incompleto, sin pedirlo nunca al consumidor. gatewayMethodRef es sensitive y se
    excluye de todas las salidas. Ningún payload de evento lleva datos de tarjeta.
- id: REV-PAYMENTS-SAVED-OWNERSHIP
  scope: use-cases.operations.requestCharge.preconditions
  verdict: ok
  note: >-
    La titularidad la atan la invariante de Payment («si el cobro tiene paymentMethodId, el medio pertenece al
    Wallet cuyo customerRef es el del cobro») y la precondición de requestCharge («el medio existe, está active y
    pertenece al Wallet de customerRef»), con 422 PAYMENT_METHOD_UNAVAILABLE sin distinguir el motivo;
    setDefaultPaymentMethod y removePaymentMethod responden PAYMENT_METHOD_NOT_FOUND igual. Que customerRef lo
    ponga el consumidor está aceptado en decisions.yaml (OBL-CALLER-IDENTITY).
- id: REV-PAYMENTS-FAILED-RECORD
  scope: use-cases.operations.requestCharge
  verdict: ok
  note: >-
    Los rechazos previos a la pasarela (medio inexistente, retirado o ajeno; fuente ausente o doble) son
    precondiciones con error de petición (PAYMENT_METHOD_UNAVAILABLE 422, PAYMENT_SOURCE_INVALID 400): no se crea
    cobro failed, así que «el cobro anota su paymentMethodId» no choca con la titularidad. En el fallo de la
    pasarela y en el notReceived del barrido el cobro ya existe con su paymentMethodId. Sin cambios en v0.2.0.
- id: REV-PAYMENTS-RECONCILE-INFLIGHT-NOTFOUND
  scope: use-cases.operations.sweepPendingPayments
  verdict: ok
  note: >-
    notReceived se limita a pending («Un cobro en pending que la pasarela no conoce se da por fallido con
    failureReason notReceived»); para capturing, canceling y refunding la rule siguiente dice que, si la acción
    fue rechazada o la pasarela nunca la recibió, el cobro vuelve al estado del que salió (cancelOrigin en una
    anulación; la devolución pasa a failed) y se publica PaymentActionRejected. Las transitions del barrido lo
    respaldan (capturing→authorized, canceling→authorized|actionRequired, refunding→captured) y markFailed no
    admite capturing ni refunding. Sin cambios en v0.2.0; la Refund que pasa a failed conserva su requestedAmount,
    así que una repetición posterior de la misma petición sigue respondiendo el cobro sin conflicto.
