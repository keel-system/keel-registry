findings:
- flow: FL-REC-003
  step: Then 3
  kind: other
  artifact: use-cases.cancelPayment.rules
  evidence: 'El Then dice que ch-322, cuya anulación la pasarela contesta «el cliente falló la autenticación», termina
    en failed con failureReason authenticationFailed y un PaymentFailed. El barrido pide esa anulación «como en
    cancelPayment», y cancelPayment solo declara tres respuestas a una anulación: anula (markCanceled), no contesta
    (se queda en canceling) o rechaza («el cobro vuelve al estado que dice cancelOrigin ..., se publica PaymentActionRejected
    y responde CANCEL_REJECTED»). Una respuesta a la anulación que no anula se lee, según esas rules, como rechazo:
    ch-322 volvería a actionRequired con awaitingSince renovado y un PaymentActionRejected (action cancel, status
    actionRequired), no a failed. Que exista canceling -> failed en el lifecycle y en markFailed muestra la intención,
    pero ninguna rule dice qué respuesta de la pasarela a una anulación se aplica con markFailed (la rule del barrido
    «aplica el desenlace que diga la pasarela» habla de la consulta, no de la anulación).'
  proposal: En el diseño, añadir a cancelPayment (y por tanto al barrido) que si la pasarela contesta a la anulación
    que el cobro ya falló (p. ej. el cliente falló la autenticación), se aplica markFailed con ese motivo en vez
    de tratarlo como rechazo; o, en el escenario, afirmar el camino del rechazo (vuelta a actionRequired y PaymentActionRejected)
    si es lo que se quiere.
  resolution: accepted
  reason: 'El diseñador mantiene el escenario tal como está y corrige el diseño para sostenerlo: cancelPayment declara
    ahora que, si la pasarela responde que el cobro ya terminó fallido (el cliente falló la autenticación), se aplica
    markFailed con su motivo y responde 200 con el cobro en failed, usando la arista canceling → failed que ya existía.
    Ese cambio del YAML no se ha careado porque el presupuesto de tres pasadas de la v0.1.0 estaba agotado; queda
    registrado aquí para que la próxima versión lo carée.'
