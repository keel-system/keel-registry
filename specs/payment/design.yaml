# Metadatos de publicación en el registry. No forma parte del DSL: describe cómo se distribuye y
# se descubre el diseño, no lo que el servicio hace.

family: payment
summary: >
  Cobros con tarjeta a través de una pasarela intercambiable, pedidos por los servidores de una
  aplicación: autorizar y capturar o anular, autenticación del cliente (3DS) con plazo, devoluciones
  parciales con clave propia, y medios de pago guardados por titular (tope, preferente, caducidad)
  para cobrar sin el cliente presente. Claves de negocio permanentes contra el doble cargo y la doble
  devolución, estados en vuelo con barrido de reconciliación que nunca repite a ciegas, moneda por
  petición con escala ISO 4217, y desenlaces publicados por outbox.
maturity: draft
