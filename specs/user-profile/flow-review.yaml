findings:
  - flow: FL-BO-001
    step: "Given; Then 1, 3, 4 y 12"
    kind: carried-state
    resolution: scenario
    sealAfter: 560de429014e3ad7ccb3e618c178b7d9eb42451c8010236d1facedf8ed78ef60
    artifact: use-cases.listProfiles.output.sort
    evidence: >-
      Los Then afirman un orden exacto (dora, cleo, beto, ana; [dora, cleo] / [beto, ana] al paginar;
      [dora, cleo, ana] tras el borrado). listProfiles ordena por createdAt:desc y desempata por id,
      que es un uuid generado. El Given dice que «los createdAt quedan en ese orden», pero nada en el
      diseño ni en las convenciones lo garantiza: las convenciones fijan los instantes con precisión de
      milisegundo y solo por forma y relación. Si dos de los cuatro GET /me/profile seguidos confirman
      en el mismo milisegundo, sus createdAt empatan, decide el desempate por uuid y el orden afirmado
      deja de deducirse. La paginación de Then 3 y 4 depende de lo mismo.
    proposal: >-
      Fijarlo en el Given: «entre cada aprovisionamiento pasa al menos 1 ms, así que sus createdAt
      son estrictamente crecientes» (o «el Given comprueba que los createdAt devueltos son estrictamente
      crecientes»). La otra opción es afirmar el orden en función de los createdAt leídos en el Given
      (desc, con desempate por id) en vez de con nombres fijos.

  - flow: FL-ADR-004
    step: "Casos borde"
    kind: other
    resolution: scenario
    sealAfter: 9cab6a69237a442b9788d684022a159525381df41264211f292b9333797ede20
    artifact: validation-scenarios.md (FL-ADR-004, encabezado de Casos borde)
    evidence: >-
      El encabezado dice «Casos borde (todos `400`, sin cambios)», pero dos de sus tres viñetas
      esperan `201`: la dirección sin adminAreaCode/adminAreaName/postalCode y la de
      adminAreaCode "CO-ZZZ". Las dos viñetas se deducen del diseño (solo line1, countryCode y
      localityName son obligatorios; SubdivisionCode solo valida la forma y "CO-ZZZ" la cumple), pero
      un 201 sí es un cambio: sube lockVersion, añade una dirección y publica AddressAdded. Quien
      traduzca el bloque no sabe si manda el encabezado o la viñeta, ni si esos casos se ejecutan antes
      del Then 5 («lockVersion 1 y solo a1, ningún evento»), que dejaría de cumplirse.
    proposal: >-
      Partir el bloque: «Casos borde (todos 400, sin cambios)» para la primera viñeta y otro
      «Casos borde (201; cada uno sobre un perfil propio, fuera de la secuencia del Then 5)» para las
      otras dos.
