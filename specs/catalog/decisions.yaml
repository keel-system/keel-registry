# Obligaciones de diseño que este servicio deja sin declarar a sabiendas, con su motivo.
# No es una capa del DSL: no dice lo que el servicio hace, sino qué se decidió no declarar.

decisions:

  - id: OBL-IDEM-RACE-CODE
    scope: use-cases
    reason: >
      El código canónico 409 IDEMPOTENCY_KEY_IN_PROGRESS es el contrato público de este servicio
      para la carrera de la clave, y se declara igualmente en los errors de las cuatro operaciones
      idempotentes para que el integrador lo vea en el contrato. No se sustituye por uno de dominio
      porque el hecho no es del catálogo: es del mecanismo, y tener el mismo nombre en cualquier
      stack que se genere de este diseño es exactamente lo que se quiere de él.
    since: 0.1.0

  - id: OBL-IDEM-REUSE-CODE
    scope: use-cases
    reason: >
      Igual que la carrera: 409 IDEMPOTENCY_KEY_REUSED es el contrato público del servicio cuando
      la misma clave llega con otro cuerpo, y está declarado en las cuatro operaciones idempotentes.
      Un código propio de dominio no añadiría nada: el rechazo no depende de qué producto se estaba
      creando, sino de que la clave ya prometió otra respuesta.
    since: 0.1.0

  - id: OBL-CONCURRENCY-CODE
    scope: persistence
    reason: >
      El conflicto de escritura concurrente sobre un producto se devuelve con el código canónico
      409 CONCURRENT_MODIFICATION. Se acepta como contrato público en vez de declarar un
      PRODUCT_VERSION_CONFLICT propio: el back-office trata el conflicto igual venga de donde venga,
      y un código estable entre stacks vale más aquí que la cercanía al dominio.
    since: 0.1.0

  - id: OBL-CALLER-IDENTITY
    scope: security
    reason: >
      La identidad del cliente máquina no entra en el trabajo. Los dos endpoints M2M son lecturas
      del catálogo completo: orders-service, cart-service y search-service reciben exactamente la
      misma respuesta para el mismo id, así que la credencial decide si se puede leer, no qué se lee.
      No hay inquilino, ni recurso en cuyo nombre se actúe, ni campo de entrada que atribuir. El día
      que el catálogo sirviera vistas distintas por consumidor, esta aceptación caduca con el minor.
    since: 0.1.0
