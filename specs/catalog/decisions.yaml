# Obligaciones de diseño que este servicio deja abiertas a sabiendas.
# No es una capa del DSL: no describe lo que el servicio hace, sino qué se decidió
# no declarar y por qué. Ver docs/design-obligations.md.

decisions:
  - id: OBL-IDEM-RACE-CODE
    scope: use-cases
    reason: >
      No está sin decidir: createProduct y addProductImage DECLARAN
      IDEMPOTENCY_KEY_IN_PROGRESS (409) en sus errors, que es el código canónico, y los
      escenarios lo afirman. La obligación sigue listada por un defecto del comprobador:
      overrideFor exige exactamente un candidato entre los errors agregados del servicio, y
      no deduplica por code — así que declarar el mismo código canónico en las DOS
      operaciones que encienden idempotency produce dos candidatos y la da por no cerrada.
      Verificado en 0.4.0 dejando el code en una sola operación: la obligación se cerró.
      La salida que el comprobador pide —declararlo en una sola— publicaría el 409 en el
      openapi de un endpoint y lo callaría en el otro, que es peor contrato. Se mantiene
      declarado en ambas y se acepta el aviso. Reportado al repo de la herramienta.
      createBrand y createCategory, que el aviso también lista, deduplican por clave natural
      (payload-field: name) y responden por su NAME_ALREADY_EXISTS: este 409 no les aplica.
      Reafirmada sin cambios en 0.6.0: el aviso sigue listando exactamente las mismas cuatro
      operaciones, porque deleteProduct —lo único que 0.6.0 añade— no declara idempotency: su
      guarda es la ausencia de la fila, que no caduca ni necesita registro de claves.
    since: 0.6.0
  - id: OBL-IDEM-REUSE-CODE
    scope: use-cases
    reason: >
      Mismo caso y misma causa que OBL-IDEM-RACE-CODE: createProduct y addProductImage
      declaran IDEMPOTENCY_KEY_REUSED (409) desde antes de esta migración, y el comprobador
      no lo ve porque hay dos candidatos con el mismo code. Se mantiene declarado en ambas
      operaciones —es el contrato que reciben los integradores por los dos endpoints— y se
      acepta el aviso hasta que overrideFor deduplique por code. Tampoco aplica a createBrand
      ni a createCategory (clave natural, no clave de cliente).
      Reafirmada sin cambios en 0.6.0, por lo mismo que OBL-IDEM-RACE-CODE.
    since: 0.6.0
  - id: OBL-CALLER-IDENTITY
    scope: security
    reason: >
      Quién llama NO cambia el trabajo, y por eso no hay identidad que estampar. El disparador
      de la obligación es deliberadamente grueso —hay clientes máquina y hay entrada—, pero en
      este servicio las dos mitades no se tocan: los tres serviceClients (order-service,
      inventory-service, search-service) tienen product:read y nada más, y las únicas dos
      operaciones con level: service —getProductForServices y listProductsBatchForServices— son
      LECTURAS. Ninguna escritura del catálogo es alcanzable por un cliente máquina: crear,
      modificar y publicar son back-office con rol catalog-admin, es decir, un usuario.
      El riesgo que la obligación existe para cerrar tampoco se da: no hay ningún campo que
      atribuya el trabajo a un sistema, porque el catálogo no es multi-inquilino. Un producto,
      una marca y una categoría son de la tienda, no del servidor que los consulta, así que no
      existe la clave ajena que un cliente autenticado pudiera escribir en el cuerpo para operar
      sobre datos de otro. Declarar callerIdentity sería nombrar un campo que no existe.
      Se revisa el día que un cliente máquina reciba scope de escritura, o que aparezca en el
      dominio cualquier campo que diga de quién es una fila.
      Reafirmada en 0.5.0: listProductsBatchForServices pasó de POST a GET con cota de 50 y
      sigue siendo una lectura con product:read; nada de lo anterior cambia.
      Reafirmada en 0.6.0, que es la versión que más obliga a mirarla porque añade una escritura y
      un rol: deleteProduct es back-office con permiso product:write —lo ejerce una persona, no una
      máquina— y catalog-editor es otro perfil de persona. Los tres serviceClients siguen con
      product:read y nada más, así que ninguna escritura del catálogo es alcanzable por un cliente
      máquina, que era la mitad del disparador. La otra mitad tampoco se mueve: 0.6.0 no añade
      ningún campo que diga de quién es una fila, y el catálogo sigue sin ser multi-inquilino.
    since: 0.6.0
