findings:

  - flow: FL-CCH-001
    step: "Then 6-7"
    kind: unobservable
    artifact: use-cases.getPublicProduct.cache
    evidence: >-
      El Then 6 afirma que «el servidor informa de que la segunda se sirvió de la caché: un acierto
      para esa clave, sin volver al almacén» y el Then 7 que, pasada la ventana de 60 s, «ya no es un
      acierto». El diseño declara cache: { ttlSeconds: 60, keyFields: [slug], invalidatedBy: [...] }
      y nada más: no hay señal, cabecera ni contador de aciertos declarado que un consumidor pueda
      observar. Las notas del escenario lo comparan con el «ningún evento abandonado» de FL-OBX-001,
      pero allí la señal sí está en el YAML (el comentario de publishing.reliability dice que el
      servidor lo cuenta y lo señala); aquí no hay nada equivalente. Se reporta porque sigue siendo
      la misma contradicción, no como algo que corregir.
    proposal: >-
      Ya decidido en la vuelta anterior. Si se quisiera cerrar: diseño, declarar la señal en cache
      al modo del comentario de publishing.reliability; escenario, quedarse solo con las aserciones
      de invalidación.
    resolution: accepted
    reason: >-
      La retención de esta caché no es observable comparando cuerpos: toda vía por la que la ficha
      cambia está declarada en invalidatedBy —que es justo lo que se quiere de ella— y sustituir el
      objeto de la imagen en el bucket con la misma clave no cambia ningún campo, porque el image es
      una URL estable. O se afirma sobre la señal del servidor, o no se afirma, y sin ella una
      implementación que no cachea nada pasa todas las aserciones de invalidación, que es el peor
      fallo posible de una caché (docs/validation-scenarios.md § toda caché con TTL). Se acepta el
      mismo trato que el «ningún evento abandonado» del outbox: el escenario nombra la señal como lo
      que es —un acierto de caché para esa clave—, nunca por el nombre de la métrica, que es del
      generador. El DSL no tiene hoy dónde declararla: cache admite ttlSeconds, keyFields e
      invalidatedBy y nada más, y el DSL no se toca para acomodar a un generador.

  - flow: FL-CCH-010
    step: "Then 6-7"
    kind: unobservable
    artifact: use-cases.getProductForServices.cache
    evidence: >-
      El mismo caso que FL-CCH-001: el Then 6 afirma que «el servidor informa de que la segunda se
      sirvió de la caché» sobre una cache que solo declara ttlSeconds, keyFields e invalidatedBy.
      Nada en el diseño dice que el acierto de caché se señale. Se reporta por coherencia con
      FL-CCH-001, no como algo que corregir.
    proposal: La misma decisión que en FL-CCH-001, para que las dos cachés se afirmen igual.
    resolution: accepted
    reason: La misma que FL-CCH-001, y por coherencia se afirman las dos cachés igual.

  - flow: FL-CCH-010
    step: "When (las mutaciones)"
    kind: unreachable-given
    artifact: security.access.rules
    evidence: >-
      La convención nueva «Preparación del Given» cubre los datos de partida («los datos de partida
      se crean por la API, cada operación con la identidad que su regla de acceso exige») y cierra
      los Given, pero estos flujos mutan dentro del **When**, donde la convención dice justo lo
      contrario: «la credencial que el escenario nombra es la del When». FL-CCH-010 nombra una sola
      identidad, «credencial de máquina del cliente orders-service», y su When «se muta por cada vía»:
      updateProduct, addProductImage, updateBrand, updateCategory y discontinueProduct. Con esa
      credencial ninguna de las cinco es alcanzable — security declara updateBrand y updateCategory
      como level: admin con roles: [catalog-admin], las otras tres como level: required con
      permissions: [product:write], y orders-service solo tiene scopes: [product:read], que sirve
      para los dos endpoints level: service y para nada más. El mismo hueco, en versión más suave, en
      FL-CCH-001 (su When muta por las cuatro vías y el escenario no nombra ninguna identidad) y en
      FL-PRD-040 (el When son dos updateProduct y el Given no nombra credencial; ahí cualquiera de
      los dos roles vale, así que el hueco no cambia el desenlace).
    proposal: >-
      Escenario: extender la convención para que cubra también las mutaciones que un When usa como
      atrezo («toda mutación se hace con la identidad que su regla de acceso exige; la credencial
      nombrada es la del sujeto del escenario»), o nombrar en FL-CCH-010 y FL-CCH-001 las dos
      identidades — la de máquina para la lectura y la de gestión para cada mutación.
    resolution: scenario
    reason: >-
      Se tomó la primera opción: la convención «Preparación del Given» dice ahora que la credencial
      nombrada es la de las llamadas que el escenario está probando, y que las mutaciones que un
      When usa como medio y no como sujeto —las que pueblan o invalidan una caché, las que provocan
      una carrera— se hacen cada una con la identidad que su regla exige. Cubre FL-CCH-010,
      FL-CCH-001 y FL-PRD-040 de una vez, sin repetir dos identidades en cada Given.

  - flow: FL-IDM-001
    step: "Then 8 (y el «Orden de evaluación» de FL-PRD-001 y FL-IMG-001)"
    kind: evaluation-order
    artifact: use-cases.createProduct.errors
    evidence: >-
      El «Orden de evaluación» de FL-PRD-001 pone la guarda de idempotencia la primera («1. La
      cabecera Idempotency-Key viene → IDEMPOTENCY_KEY_REQUIRED (400). 2. El sku no existe →
      SKU_ALREADY_EXISTS (409)»), y el de FL-IMG-001 hace lo mismo con addProductImage. El YAML
      declara el orden contrario: createProduct.errors enumera SKU_ALREADY_EXISTS,
      BRAND_REFERENCE_NOT_FOUND, CATEGORY_REFERENCE_NOT_FOUND y solo después
      IDEMPOTENCY_KEY_REQUIRED / IN_PROGRESS / REUSED, y addProductImage.errors pone los tres de
      idempotencia detrás de UNSUPPORTED_CONTENT_TYPE. El resto del documento sí lee ese orden como
      normativo («la guarda 2 precede», «la guarda 3 precede a la 4»), así que los dos criterios
      conviven en el mismo bloque. Donde se mide es FL-IDM-001 Then 8: «createProduct sin cabecera
      Idempotency-Key» llega después de que SKU-100 ya exista y no dice que el cuerpo cambie; si es
      el mismo cuerpo, fallan dos guardas a la vez y el escenario espera 400 IDEMPOTENCY_KEY_REQUIRED
      donde el orden declarado en use-cases da 409 SKU_ALREADY_EXISTS. Nada en el diseño dice que el
      bloque idempotency: { keySource: client-key } se evalúe antes de las precondiciones de negocio.
    proposal: >-
      Diseño: colocar los errores de idempotencia al principio de la lista errors de las cuatro
      operaciones con clave (createProduct, addProductImage, createBrand, createCategory), que es lo
      que el documento ya asume. Escenario: si el orden del YAML es el bueno, invertir las dos
      listas de «Orden de evaluación» y decir en FL-IDM-001 Then 8 que la petición sin clave lleva un
      sku nuevo, para que solo falle una guarda.
    resolution: design
    reason: >-
      Se corrigió el YAML, que es donde estaba el error: los tres errores de idempotencia van ahora
      los primeros en createProduct, addProductImage, createBrand y createCategory, con un comentario
      que dice que el orden es el de evaluación. Es lo que el mecanismo exige —un reintento tiene que
      reproducir la respuesta original sin volver a chocar con el sku—, así que el orden que el
      documento ya asumía era el bueno.
