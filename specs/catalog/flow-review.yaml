findings:
  - flow: FL-PRD-040
    resolution: accepted
    reason: "La afirmación de coste la exige el método para toda colección con embed; afirma la forma y su medición es del generador (keel-spring instrumenta las consultas). Se cita en las convenciones."
    step: "Then 8"
    kind: unobservable
    artifact: use-cases.listProducts.output
    evidence: >-
      «Una página de 3 productos con marca, categoría e imágenes embebidas no cuesta más
      consultas al almacén que una de 1». El número de consultas al almacén es interno: ninguna
      prueba de caja negra contra la API lo observa, y el diseño no declara ninguna superficie
      (métrica, cabecera) que lo exponga.
    proposal: >-
      Sacarlo de los Then y dejarlo en «Lo que no tiene escenario» como verificación estática o
      propia del generador, o reformularlo como algo observable desde fuera.
  - flow: FL-PUB-002
    resolution: accepted
    reason: "Mismo motivo que FL-PRD-040: coste exigido por el método, medido por el generador."
    step: "Then 4"
    kind: unobservable
    artifact: use-cases.listPublicProducts.output
    evidence: >-
      «Servir una página de 24 productos no cuesta más consultas al almacén que servir una de 2».
      Como en FL-PRD-040 Then 8: las consultas al almacén no son observables por la API y el
      diseño no declara superficie que las cuente.
    proposal: Mover a verificación estática/del generador, o reformular como aserción observable.
  - flow: FL-M2M-002
    resolution: accepted
    reason: "Mismo motivo que FL-PRD-040: coste exigido por el método, medido por el generador."
    step: "Then 4"
    kind: unobservable
    artifact: use-cases.listProductsBatchForServices.output
    evidence: >-
      «Resolver 100 ids no cuesta más consultas al almacén que resolver 2». No es observable por
      caja negra y nada en el diseño expone el número de consultas.
    proposal: Mover a verificación estática/del generador, o reformular como aserción observable.
  - flow: FL-M2M-003
    resolution: scenario
    step: "Then 2"
    kind: unreachable-given
    artifact: security.serviceClients
    evidence: >-
      El Then usa «un token de máquina válido emitido para otra audiencia». security solo declara
      los clientes orders y cart (audience catalog), y la convención Identidades del propio
      documento dice «Ninguna otra identidad aparece en este documento». La identidad que el paso
      exige no está declarada ni en el diseño ni en la lista de identidades.
    proposal: >-
      Añadir a la convención Identidades un «token de máquina de otra audiencia» (emitido por el
      mismo proveedor para una audiencia distinta de catalog) y cómo se obtiene.
  - flow: FL-M2M-003
    resolution: accepted
    reason: "El status del rechazo por audiencia no lo decide el diseño: lo fija el generador (keel-spring responde 403, token legítimo emitido para otro servicio), y el método pide escribirlo así. Se cita en las convenciones."
    step: "Then 2, Then 3"
    kind: other
    artifact: security.authentication.serviceAuth.validateAudience
    evidence: >-
      El Then espera 403 para un token de otra audiencia. El diseño solo dice validateAudience:
      true con audience catalog; no fija con qué status se rechaza un token cuya audiencia no casa.
      Un token con audiencia ajena es un token no válido para este servicio, y lo habitual es 401
      (invalid_token), no 403 (autenticado sin permiso). El 403 no se deduce del YAML.
    proposal: >-
      Afirmar 401 (o «401 o 403» si se quiere dejar libre), o fijar el status en una convención
      del documento si el diseñador quiere 403.
  - flow: FL-OBX-001
    resolution: scenario
    step: "Then 4"
    kind: count
    artifact: messaging.publishing.reliability
    evidence: >-
      «En ≤ 10 s productEvents recibe exactamente un ProductCreated». El diseño solo declara
      reliability: outbox; ningún artefacto fija un plazo de entrega tras recuperarse el canal,
      así que los 10 s no se deducen del YAML.
    proposal: >-
      Declarar el plazo como parámetro del entorno de prueba en las convenciones (no contrato del
      diseño), o quitar el número y afirmar «dentro del timeout del arnés».
  - flow: FL-OBX-001
    resolution: scenario
    step: "Then 5"
    kind: unobservable
    artifact: messaging.publishing.reliability
    evidence: >-
      «Ningún evento abandonado». El diseño no declara ninguna superficie (operación, métrica,
      canal) por la que se observe que un evento se abandonó; desde la API y los canales no se
      distingue «no abandonado» de «abandonado sin rastro».
    proposal: >-
      Citar la superficie por la que se observa el abandono si la fija la semántica canónica del
      outbox, o quitar la aserción (el Then 4 ya prueba la entrega).
  - flow: FL-OBX-002
    resolution: scenario
    step: "When"
    kind: unreachable-given
    artifact: messaging.publishing.reliability
    evidence: >-
      El When es «se agota el presupuesto de reintentos de ese evento». Ningún artefacto del
      diseño declara un presupuesto de reintentos del relay (número, backoff, duración): la prueba
      no puede saber cuándo se alcanza ese estado ni provocarlo desde lo declarado.
    proposal: >-
      Fijar en las convenciones el presupuesto como parámetro del entorno de prueba (y cómo se
      configura), o declararlo en messaging si es parte del contrato.
  - flow: FL-OBX-002
    resolution: scenario
    step: "Then 1, Then 2"
    kind: unobservable
    artifact: messaging.publishing.reliability
    evidence: >-
      Then 1: «El servidor informa de un evento abandonado», pero el diseño no declara por dónde
      informa (log, métrica, canal de abandonados). Then 2: «Restablecido el canal, ese
      ProductCreated no se publica», pero nada en el YAML fija que un evento abandonado no se
      reintente más tarde; reliability: outbox solo promete que el evento sale con el agregado.
    proposal: >-
      Nombrar la superficie observable del abandono y la regla «abandonado = no se vuelve a
      publicar» (en las convenciones, si es semántica canónica del outbox), o mover el flujo a
      «Lo que no tiene escenario».
