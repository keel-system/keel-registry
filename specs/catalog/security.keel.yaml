# Capa security — autenticación y autorización, por operación.
# Agnóstica del proveedor: se declara el protocolo, nunca el producto (Keycloak, Auth0...).

authentication:
  protocol: oidc
  tokenLocation: header
  serviceAuth:
    protocol: client-credentials
    validateAudience: true
    audience: catalog

roles:
  catalog-admin:  { description: "Gestiona el catálogo completo, incluidas marcas, categorías y publicación." }
  catalog-editor: { description: "Redacta fichas de producto pero no las publica ni toca marcas y categorías." }

permissions:
  product:read:    { description: Leer productos en cualquier estado. }
  product:write:   { description: "Crear y editar productos, incluida su galería de imágenes." }
  product:publish: { description: Publicar y retirar productos del catálogo. }
  brand:read:      { description: Leer marcas. }
  brand:write:     { description: "Crear, editar y activar o desactivar marcas." }
  category:read:   { description: Leer categorías. }
  category:write:  { description: "Crear, editar y activar o desactivar categorías." }

roleGrants:
  catalog-admin:  [product:read, product:write, product:publish, brand:read, brand:write, category:read, category:write]
  catalog-editor: [product:read, product:write, brand:read, category:read]

serviceClients:
  order-service:
    description: Mantiene una copia local de la ficha de producto para componer pedidos, alimentada por los eventos del catálogo y reconciliada con los endpoints por lote.
    scopes: [product:read]

# Autorización a nivel de dato (decisión del diseñador): el catálogo es único y corporativo, así que
# no existe noción de "producto propio". Cualquier catalog-editor edita cualquier producto y
# listProducts devuelve el catálogo entero; lo que separa a los dos roles es la publicación, las
# marcas y las categorías, no el subconjunto de productos.

access:
  default: { level: required, permissions: [product:read] }
  rules:
    # Catálogo público: sin token.
    getPublishedProduct:     { level: public }
    listPublishedProducts:   { level: public }
    listPublishedBrands:     { level: public }
    listPublishedCategories: { level: public }

    # Gestión de productos.
    createProduct:      { level: required, permissions: [product:write] }
    updateProduct:      { level: required, permissions: [product:write] }
    addProductImage:      { level: required, permissions: [product:write] }
    removeProductImage:   { level: required, permissions: [product:write] }
    reorderProductImages: { level: required, permissions: [product:write] }
    getProduct:         { level: required, permissions: [product:read] }
    listProducts:       { level: required, permissions: [product:read] }
    publishProduct:     { level: required, permissions: [product:publish] }
    retireProduct:      { level: required, permissions: [product:publish] }

    # Marcas y categorías.
    getBrand:       { level: required, permissions: [brand:read] }
    listBrands:     { level: required, permissions: [brand:read] }
    createBrand:    { level: required, permissions: [brand:write] }
    updateBrand:    { level: required, permissions: [brand:write] }
    deactivateBrand: { level: required, permissions: [brand:write] }
    activateBrand:   { level: required, permissions: [brand:write] }
    getCategory:    { level: required, permissions: [category:read] }
    listCategories: { level: required, permissions: [category:read] }
    createCategory: { level: required, permissions: [category:write] }
    updateCategory: { level: required, permissions: [category:write] }
    deactivateCategory: { level: required, permissions: [category:write] }
    activateCategory:   { level: required, permissions: [category:write] }

    # Superficie servidor-a-servidor: token de cliente máquina con audiencia validada.
    getProductForServices: { level: service, scopes: [product:read] }
    getProductsByIds:      { level: service, scopes: [product:read] }

cors:
  description: El catálogo público lo consume directamente el navegador de la tienda web, y el back-office es una SPA.
  allowCredentials: false
  allowedHeaders: [Authorization, Content-Type, Idempotency-Key]
  exposedHeaders: [X-Correlation-Id]
  maxAgeSeconds: 3600
