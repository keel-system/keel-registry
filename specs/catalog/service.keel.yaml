# Manifiesto del servicio — punto de entrada del diseño.
# Declara la identidad del servicio y qué capas de diseño existen.
# Regla: una capa opcional existe si y solo si está declarada aquí (y su archivo existe).
keel: "2.17"

service:
  name: catalog
  version: 0.1.1
  # keel validate trata cualquier description que empiece por "TODO" como placeholder pendiente.
  description: "Gestiona el catálogo comercial —productos con sus imágenes, marcas y categorías—, lo expone filtrable al público de la tienda, lo sirve a otros servidores por contrato y publica las altas y cambios de producto como eventos."
  domain: commerce
  # basedOn: billing@1.2.0         # linaje: diseño@versión del que se derivó (lo escribe `keel new --from`)

parameters:
  currency:
    type: string
    description: "Moneda en la que opera el catálogo (ISO 4217), siempre una moneda de 2 decimales (EUR, USD, GBP, MXN…). Todo price de Product va en ella; el servicio no convierte divisas. Se fija en el primer despliegue y no cambia nunca: cambiarla con productos existentes es una migración de datos, fuera del servicio."
    constraints: { pattern: "^[A-Z]{3}$" }
    testValue: EUR
    requiredInProduction: true   # en producción viene del entorno, sin default: un despliegue que lo olvide no arranca

conventions:
  nulls: include     # un campo sin valor viaja como null, en respuestas y en eventos

layers:
  domain: domain.keel.yaml         # obligatoria
  use-cases: use-cases.keel.yaml   # obligatoria
  # Descomenta las capas que apliquen y crea el archivo desde templates/service/:
  api: api.keel.yaml
  security: security.keel.yaml
  messaging: messaging.keel.yaml
  # http-clients: http-clients.keel.yaml
  # dependencies: dependencies.keel.yaml
  persistence: persistence.keel.yaml
  storage: storage.keel.yaml
  # mail: mail.keel.yaml
