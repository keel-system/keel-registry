# Manifiesto del servicio — punto de entrada del diseño.
# Declara la identidad del servicio y qué capas de diseño existen.
# Regla: una capa opcional existe si y solo si está declarada aquí (y su archivo existe).
keel: "2.14"

service:
  name: catalog
  version: 0.1.2
  description: >
    Catálogo comercial de una tienda: es la fuente de verdad de los productos, sus marcas y sus
    categorías. Los publica a los consumidores con búsqueda y filtros, los gestiona el personal de
    la tienda con rastro de autoría, y difunde sus altas y sus cambios al resto de servidores por
    consulta directa y por eventos.
  domain: commerce

conventions:
  # Un campo sin valor no viaja: ni en las respuestas ni en los payloads de evento aparece como null.
  nulls: omit

layers:
  domain: domain.keel.yaml         # obligatoria
  use-cases: use-cases.keel.yaml   # obligatoria
  api: api.keel.yaml
  security: security.keel.yaml
  messaging: messaging.keel.yaml
  persistence: persistence.keel.yaml
  storage: storage.keel.yaml
  # http-clients: no aplica — el catálogo no llama a nadie
  # dependencies: no aplica — no necesita ningún dato ajeno
  # mail: no aplica — no manda correo
