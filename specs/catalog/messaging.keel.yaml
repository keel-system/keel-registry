# Capa messaging — qué eventos publica el servicio y por qué canales lógicos.
# El broker concreto (Kafka, RabbitMQ...) no se menciona: es decisión de generación.
# Este servicio no consume eventos de nadie: no hay subscriptions.

channels:
  productEvents:
    description: Ciclo de vida del producto que publica este servicio para que otros mantengan su copia al día.

publishing:
  # Decisión del diseñador: se acepta perder un evento si el broker está caído en el instante
  # del commit. Sin outbox no hay reconciliación automática; getProductsByIds es la vía por la
  # que un consumidor resincroniza su copia cuando lo necesita.
  reliability: best-effort
  events:

    ProductCreated:
      description: Se dio de alta un producto, siempre en estado draft.
      channel: productEvents
      payload:
        productId:   { type: uuid, required: true }
        sku:         { type: SKU, required: true }
        name:        { type: string, required: true }
        description: { type: string }
        price:       { type: Money, required: true }
        status:      { type: ProductStatus, required: true }
        brandId:     { type: uuid, required: true }
        categoryId:  { type: uuid, required: true }
        tags:        { type: string, list: true, constraints: { maxItems: 10 } }
        createdAt:   { type: timestamp, required: true }

    ProductUpdated:
      description: Cambió la ficha de un producto. Cubre también la publicación, que llega como status active.
      channel: productEvents
      payload:
        productId:   { type: uuid, required: true }
        sku:         { type: SKU, required: true }
        name:        { type: string, required: true }
        description: { type: string }
        price:       { type: Money, required: true }
        status:      { type: ProductStatus, required: true }
        brandId:     { type: uuid, required: true }
        categoryId:  { type: uuid, required: true }
        tags:        { type: string, list: true, constraints: { maxItems: 10 } }
        imageUrls:   { type: string, list: true, constraints: { maxItems: 8 }, description: "URLs públicas de la galería, ordenadas por posición; la primera es la principal. Ausente si el producto no tiene imágenes." }
        updatedAt:   { type: timestamp, required: true }

    ProductRetired:
      description: Un producto se retiró del catálogo de forma definitiva. Es la vía de baja de toda copia local.
      channel: productEvents
      payload:
        productId: { type: uuid, required: true }
        sku:       { type: SKU, required: true }
        retiredAt: { type: timestamp, required: true }

# Los eventos llevan brandId y categoryId, nunca los nombres de marca y categoría: un renombrado
# dejaría rancio el nombre en cada copia local sin forma de detectarlo. El consumidor que necesite
# el nombre lo resuelve por la superficie servidor-a-servidor, que lo devuelve incorporado.
