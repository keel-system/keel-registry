# Capa messaging — los eventos que este servicio publica y por qué canales lógicos.
# El broker concreto no se menciona: un canal se materializa en topic o cola al generar.
# Este servicio no consume eventos de nadie: no hay subscriptions ni canales external.

channels:
  productEvents:
    description: Ciclo de vida de los productos del catálogo. Lo consume quien mantiene una copia de la ficha o un índice de búsqueda.
  taxonomyEvents:
    description: >
      Ciclo de vida de marcas y categorías. Canal aparte del de productos a propósito: quien solo
      sigue productos no tiene por qué tragar el ruido de la taxonomía, que cambia mucho menos.
      Quien copie brandName o categoryName dentro de su propia ficha de producto TIENE que escuchar
      este canal: al renombrarse una marca, el catálogo no re-emite los eventos de sus productos
      —serían miles de golpe— así que la corrección llega solo por aquí, y el consumidor actualiza
      sus copias por brandId o categoryId.

publishing:
  # Un cambio confirmado no se queda sin anunciar por una caída del canal: el evento se escribe en
  # la misma transacción que el agregado y un relay lo publica después, cuando el canal vuelve. Lo
  # exige que search-service mantenga su índice solo con estos eventos — un evento perdido es un
  # producto que no aparece en la búsqueda. El relay sí tiene un presupuesto de reintentos (lo fija
  # el generador, no este diseño): el evento que lo agota se da por abandonado, no se publica ya, y
  # el servidor lo cuenta y lo señala para que alguien lo reponga. Perderlo en silencio, nunca.
  reliability: outbox

  events:

    # ── Productos ──────────────────────────────────────────────────────────────
    # El payload lleva la ficha completa para que el consumidor se actualice sin llamar de vuelta.
    # Eso lo convierte en contrato público: cambiarlo de forma incompatible es subir eventVersion.
    ProductCreated:
      description: Se dio de alta un producto. Nace en draft, así que todavía no se vende.
      channel: productEvents
      payload:
        productId:       { type: uuid, required: true }
        sku:             { type: SKU, required: true }
        name:            { type: string, required: true }
        slug:            { type: Slug, required: true }
        description:     { type: text }
        price:           { type: Price, required: true }
        status:          { type: ProductStatus, required: true }
        brandId:         { type: uuid, required: true }
        brandName:       { type: string, required: true }
        categoryId:      { type: uuid, required: true }
        categoryName:    { type: string, required: true }
        primaryImageUrl: { type: string, description: URL pública de la imagen principal; ausente mientras el producto no tenga ninguna. }

    ProductUpdated:
      description: >
        Cambió la ficha comercial de un producto: su nombre, descripción, precio, marca, categoría
        o su galería de imágenes. El payload es el estado resultante, no el diff.
      channel: productEvents
      payload:
        productId:       { type: uuid, required: true }
        sku:             { type: SKU, required: true }
        name:            { type: string, required: true }
        slug:            { type: Slug, required: true }
        description:     { type: text }
        price:           { type: Price, required: true }
        status:          { type: ProductStatus, required: true }
        brandId:         { type: uuid, required: true }
        brandName:       { type: string, required: true }
        categoryId:      { type: uuid, required: true }
        categoryName:    { type: string, required: true }
        primaryImageUrl: { type: string, description: URL pública de la imagen principal; ausente si el producto no tiene ninguna. }

    ProductStatusChanged:
      description: >
        Un producto entró o salió de la venta (publicado, retirado a borrador, descontinuado o
        reactivado). Lleva el estado anterior para que el consumidor sepa qué transición fue.
      channel: productEvents
      payload:
        productId:       { type: uuid, required: true }
        sku:             { type: SKU, required: true }
        name:            { type: string, required: true }
        slug:            { type: Slug, required: true }
        price:           { type: Price, required: true }
        previousStatus:  { type: ProductStatus, required: true }
        status:          { type: ProductStatus, required: true }
        brandId:         { type: uuid, required: true }
        brandName:       { type: string, required: true }
        categoryId:      { type: uuid, required: true }
        categoryName:    { type: string, required: true }
        primaryImageUrl: { type: string, description: URL pública de la imagen principal; ausente si el producto no tiene ninguna. }

    ProductDeleted:
      description: >
        Se eliminó definitivamente un producto en borrador. Es la vía de baja del consumidor: sin
        ella, una copia local se queda rancia para siempre. No repite la ficha porque el producto
        ya no existe — lleva lo justo para localizar la copia y borrarla.
      channel: productEvents
      payload:
        productId: { type: uuid, required: true }
        sku:       { type: SKU, required: true }
        name:      { type: string, required: true }

    # ── Taxonomía ──────────────────────────────────────────────────────────────
    BrandCreated:
      description: Se dio de alta una marca.
      channel: taxonomyEvents
      payload:
        brandId:     { type: uuid, required: true }
        name:        { type: string, required: true }
        slug:        { type: Slug, required: true }
        description: { type: text }

    BrandUpdated:
      description: Cambió el nombre o la reseña de una marca; con el nombre cambia también su slug público.
      channel: taxonomyEvents
      payload:
        brandId:     { type: uuid, required: true }
        name:        { type: string, required: true }
        slug:        { type: Slug, required: true }
        description: { type: text }

    BrandDeleted:
      description: Se eliminó una marca que ningún producto referenciaba.
      channel: taxonomyEvents
      payload:
        brandId: { type: uuid, required: true }
        name:    { type: string, required: true }

    CategoryCreated:
      description: Se dio de alta una categoría.
      channel: taxonomyEvents
      payload:
        categoryId:  { type: uuid, required: true }
        name:        { type: string, required: true }
        slug:        { type: Slug, required: true }
        description: { type: text }

    CategoryUpdated:
      description: Cambió el nombre o el texto de cabecera de una categoría; con el nombre cambia también su slug público.
      channel: taxonomyEvents
      payload:
        categoryId:  { type: uuid, required: true }
        name:        { type: string, required: true }
        slug:        { type: Slug, required: true }
        description: { type: text }

    CategoryDeleted:
      description: Se eliminó una categoría que ningún producto referenciaba.
      channel: taxonomyEvents
      payload:
        categoryId: { type: uuid, required: true }
        name:       { type: string, required: true }
