# Capa api — cómo se exponen las operaciones por REST.
# Tres superficies: gestión (/admin, usuarios autenticados), tienda (pública) y servidor-a-servidor (/internal).

style: rest
basePath: /api/v1
defaultAudience: users

endpoints:
  # --- Marcas — gestión ---
  createBrand:        { method: POST,   path: "/admin/brands", successStatus: 201 }
  updateBrand:        { method: PATCH,  path: "/admin/brands/{id}" }
  deactivateBrand:    { method: POST,   path: "/admin/brands/{id}/deactivate", successStatus: 200 }
  reactivateBrand:    { method: POST,   path: "/admin/brands/{id}/reactivate", successStatus: 200 }
  getBrand:           { method: GET,    path: "/admin/brands/{id}" }
  listBrands:         { method: GET,    path: "/admin/brands" }

  # --- Categorías — gestión ---
  createCategory:     { method: POST,   path: "/admin/categories", successStatus: 201 }
  updateCategory:     { method: PATCH,  path: "/admin/categories/{id}" }
  deactivateCategory: { method: POST,   path: "/admin/categories/{id}/deactivate", successStatus: 200 }
  reactivateCategory: { method: POST,   path: "/admin/categories/{id}/reactivate", successStatus: 200 }
  getCategory:        { method: GET,    path: "/admin/categories/{id}" }
  listCategories:     { method: GET,    path: "/admin/categories" }

  # --- Productos — gestión ---
  createProduct:      { method: POST,   path: "/admin/products", successStatus: 201 }
  updateProduct:      { method: PATCH,  path: "/admin/products/{id}" }
  publishProduct:     { method: POST,   path: "/admin/products/{id}/publish", successStatus: 200 }
  unpublishProduct:   { method: POST,   path: "/admin/products/{id}/unpublish", successStatus: 200 }
  retireProduct:      { method: POST,   path: "/admin/products/{id}/retire", successStatus: 200 }
  getProduct:         { method: GET,    path: "/admin/products/{id}" }
  searchProducts:     { method: GET,    path: "/admin/products" }

  # --- Imágenes — gestión (devuelven la ficha completa: cambian posiciones y portada de las demás) ---
  addProductImage:    { method: POST,   path: "/admin/products/{productId}/images", successStatus: 201 }
  updateProductImage: { method: PATCH,  path: "/admin/products/{productId}/images/{imageId}" }
  removeProductImage: { method: DELETE, path: "/admin/products/{productId}/images/{imageId}", successStatus: 200 }

  # --- Tienda (público) ---
  searchPublishedProducts: { method: GET, path: "/products" }
  getPublishedProduct:     { method: GET, path: "/products/{id}" }
  listPublicBrands:        { method: GET, path: "/brands" }
  listPublicCategories:    { method: GET, path: "/categories" }

  # --- Servidor a servidor ---
  getProductForServices: { method: GET,  path: "/internal/products/{id}", audience: services }
  getProductsBatch:      { method: POST, path: "/internal/products/batch", successStatus: 200, audience: services }

pagination: { style: offset, defaultSize: 20, maxSize: 100 }
