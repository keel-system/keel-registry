# Capa api — cómo se exponen las operaciones al cliente vía REST.
# Qué es público o protegido no va aquí, va en security (por operación, no por ruta).

style: rest
basePath: /api/v1
defaultAudience: users

endpoints:
  # ─── Marcas ───────────────────────────────────────────────────────────────
  createBrand: { method: POST, path: "/brands", successStatus: 201 }
  getBrand:    { method: GET, path: "/brands/{id}" }
  listBrands:  { method: GET, path: "/brands" }
  updateBrand:     { method: PUT, path: "/brands/{id}" }
  deactivateBrand: { method: POST, path: "/brands/{id}/deactivate", successStatus: 200 }
  activateBrand:   { method: POST, path: "/brands/{id}/activate", successStatus: 200 }

  # ─── Categorías ───────────────────────────────────────────────────────────
  createCategory: { method: POST, path: "/categories", successStatus: 201 }
  getCategory:    { method: GET, path: "/categories/{id}" }
  listCategories: { method: GET, path: "/categories" }
  updateCategory:     { method: PUT, path: "/categories/{id}" }
  deactivateCategory: { method: POST, path: "/categories/{id}/deactivate", successStatus: 200 }
  activateCategory:   { method: POST, path: "/categories/{id}/activate", successStatus: 200 }

  # ─── Productos: gestión ───────────────────────────────────────────────────
  createProduct:      { method: POST, path: "/products", successStatus: 201 }
  getProduct:         { method: GET, path: "/products/{productId}" }
  listProducts:       { method: GET, path: "/products" }
  updateProduct:      { method: PUT, path: "/products/{productId}" }
  publishProduct:     { method: POST, path: "/products/{productId}/publish", successStatus: 200 }
  retireProduct:      { method: POST, path: "/products/{productId}/retire", successStatus: 200 }
  addProductImage:      { method: POST, path: "/products/{productId}/images", successStatus: 201 }
  removeProductImage:   { method: DELETE, path: "/products/{productId}/images/{imageId}", successStatus: 200 }
  reorderProductImages: { method: PUT, path: "/products/{productId}/images/order", successStatus: 200 }

  # ─── Productos: catálogo público ──────────────────────────────────────────
  getPublishedProduct:     { method: GET, path: "/catalog/products/{productId}" }
  listPublishedProducts:   { method: GET, path: "/catalog/products" }
  listPublishedBrands:     { method: GET, path: "/catalog/brands" }
  listPublishedCategories: { method: GET, path: "/catalog/categories" }

  # ─── Superficie servidor-a-servidor ───────────────────────────────────────
  # Operaciones y endpoints propios: su contrato crece hacia lotes y campos estables,
  # el de usuarios hacia la pantalla. Nada de audience: both aquí.
  getProductForServices: { method: GET, path: "/internal/products/{productId}", audience: services }
  getProductsByIds:      { method: POST, path: "/internal/products/batch", successStatus: 200, audience: services }

pagination: { style: offset, defaultSize: 20, maxSize: 100 }
