# Veredicto de la revisión semántica de catalog, por id. No forma parte del DSL: dice qué se miró
# al revisar el diseño y con qué resultado.

reviewedAt: 0.1.0

findings:

  - id: REV-DOMAIN-VAGUE-INVARIANT
    scope: domain
    verdict: fixed
    note: >
      Se recorrieron las invariantes una a una. Tres no se podían decidir mirando la entidad:
      las dos de la taxonomía ("no puede eliminarse mientras exista algún producto que la
      referencie") dependían de Product, que es OTRO agregado, y la del sku ("es inmutable")
      no se decide mirando una fila sino dos en el tiempo. Las tres se retiraron de domain
      porque su guarda real ya estaba donde sí se comprueba: precondición + BRAND_IN_USE /
      CATEGORY_IN_USE en deleteBrand y deleteCategory, y la rule de updateProduct que deja el
      sku fuera de la entrada. Las que quedan son decidibles sobre los campos declarados:
      price > 0 en active, unicidad de name ignorando mayúsculas y acentos, y las tres de la
      galería (una sola primary, exactamente una si está active y tiene imágenes, sin dos
      imágenes en la misma position), todas dentro del agregado Product.

  - id: REV-DOMAIN-INVARIANT-IS-TRANSITION
    scope: domain
    verdict: ok

  - id: REV-DOMAIN-COMPUTED-NOT-DERIVABLE
    scope: domain.entities.Product
    verdict: fixed
    note: >
      Los tres slug (Brand, Category, Product) se derivan del name, que la entidad tiene. El
      cuarto no: slugFrozen decía "pasa a verdadero la primera vez que el producto se publica",
      que es historia y no una fórmula sobre los campos de la fila — ningún campo de Product
      permite recalcularlo. Se pasó de computed a generated, que es lo que sí es cierto (el
      cliente nunca lo envía; lo escribe publishProduct), con quién lo escribe dicho en la
      description en vez de una regla derivada que no existe.

  - id: REV-DOMAIN-PROMISED-STATE
    scope: domain
    verdict: ok
    note: >
      Se buscaron los verbos de conservación, ocultación y marcado en descriptions y rules, y
      cada uno tiene su campo o su transición: "los borradores y los descontinuados nunca salen
      en la tienda" → Product.status con su lifecycle; "un producto que ya estuvo publicado no
      se borra, se descontinúa" → slugFrozen, que es justo lo que la precondición de
      deleteProduct mira; "las imágenes se eliminan con el producto" → el agregado
      Product + ProductImage; "updatedAt viaja para que el consumidor sepa de cuándo es la
      ficha" → campo declarado con audit.timestamps: declared.

  - id: REV-DOMAIN-PARTIAL-WRITER
    scope: domain.entities.Product
    verdict: ok
    note: >
      A active se llega por dos vías: publishProduct (draft → active) y reactivateProduct
      (discontinued → active). Las dos dejan la fila igual de informativa: status, updatedAt y
      updatedBy. Ningún campo lo rellena una y lo deja nulo la otra — slugFrozen solo lo escribe
      publishProduct, pero todo producto que llega por reactivateProduct ya lo tiene en verdadero,
      porque estuvo active antes. No hay dos filas indistinguibles en la API que hayan llegado por
      caminos distintos.

  - id: REV-USECASES-INTERNAL-REPEAT
    scope: use-cases
    verdict: ok
    note: >
      Se recorrieron los commands sin idempotency declarada. Todos son PUT o DELETE (updateProduct,
      updateBrand, updateCategory, setPrimaryProductImage, reorderProductImages, deleteProduct,
      removeProductImage, deleteBrand, deleteCategory), que el protocolo define idempotentes, o
      tienen una transición irrepetible por construcción: publishProduct, unpublishProduct,
      discontinueProduct y reactivateProduct declaran transitions cuyo 'to' no está entre sus
      'from', así que el segundo intento lo rechaza el guard del lifecycle. Los cuatro que sí
      podían repetir un efecto fuera del proceso (createProduct, addProductImage, createBrand,
      createCategory) declaran idempotency con client-key y exigen la cabecera con
      IDEMPOTENCY_KEY_REQUIRED.

  - id: REV-USECASES-CACHE-NON-EVENT-PATHS
    scope: use-cases
    verdict: accepted
    note: >
      Las dos cachés (getPublicProduct, getProductForServices) proyectan la ficha con marca y
      categoría embebidas y la URL de la imagen principal. Todo lo que muta eso pasa por una
      operación de este servicio y emite evento, y los eventos están en invalidatedBy —
      incluidas las mutaciones de galería, que emiten ProductUpdated a propósito. Queda una vía
      que no es evento y se acepta: reemplazar el objeto del bucket conservando su clave cambiaría
      la foto sin que nada invalide, y el consumidor vería la vieja hasta 60s. No hay operación que
      sobrescriba una imagen (addProductImage siempre crea una nueva), así que solo ocurriría
      tocando el bucket por fuera del servicio.

  - id: REV-USECASES-GUARD-ORDER
    scope: use-cases
    verdict: ok
    note: >
      Se recorrió el orden de las guardas de los commands con rules. Ninguna depende de un dato
      que no esté disponible cuando le toca: en createProduct la unicidad del sku se comprueba
      sobre el sku ya normalizado (la rule de normalización va antes) y la resolución de marca y
      categoría es independiente de él; en publishProduct la cadena existe → está en draft →
      price > 0 → tiene imágenes → tiene primary solo mira campos del propio agregado, cargado en
      el primer paso; en removeProductImage la guarda de "última imagen de un producto active"
      necesita el estado y la galería, que vienen con la raíz.

  - id: REV-API-DELETE-BODY
    scope: api
    verdict: ok
    note: >
      Los cuatro DELETE (deleteProduct, removeProductImage, deleteBrand, deleteCategory) declaran
      204 con output void. El único que cambia algo vecino es removeProductImage, que puede
      promover una nueva imagen primary — pero la regla lo hace predecible para el cliente (pasa a
      primary la de menor position), así que no necesita cuerpo para saber cómo quedó la galería.

  - id: REV-SEC-M2M-AUDIENCE
    scope: security
    verdict: ok
    note: >
      serviceAuth declara validateAudience: true con audience 'catalog', así que un token emitido
      para otro servicio del mismo servidor de autenticación no vale aquí. Los tres consumidores
      (orders-service, cart-service, search-service) tienen cada uno su cliente y su scope mínimo,
      product:read, que es el único que sus dos endpoints exigen.

  - id: REV-SEC-RESOURCE-SCOPE
    scope: security
    verdict: ok
    note: >
      El catálogo no es multi-inquilino: no hay nada "de cada uno". Un catalog-editor gestiona
      todos los productos de la tienda y los tres consumidores M2M reciben la misma respuesta para
      el mismo id, así que roles, permissions y scopes globales son exactamente la semántica que se
      quiere. Ninguna operación declara un 403, y por eso OBL-RESOURCE-SCOPE no se levanta.

  - id: REV-MSG-MISSING-CHANNEL
    scope: messaging
    verdict: ok
    note: >
      Los diez eventos declaran channel: los cuatro de producto en productEvents y los seis de
      taxonomía en taxonomyEvents. Los dos canales son contrato de integración con nombre lógico
      estable, y están separados a propósito para que quien solo sigue productos no trague el
      ruido de la taxonomía. No hay suscripciones: este servicio no consume eventos de nadie.

  - id: REV-PERSIST-MISSING-INDEX
    scope: persistence
    verdict: ok
    note: >
      Se derivaron los índices de los filtros y órdenes declarados. Tienda pública: [status, name]
      (orden por defecto), [status, brandId], [status, categoryId] y [status, price] para el rango,
      todos con la igualdad de estado delante; la ficha por slug con índice único. Back-office:
      [updatedAt] para su orden descendente, y sku por naturalKey. Taxonomía: slug por naturalKey
      (que es como llegan los filtros públicos brandSlug/categorySlug) y [name] para su orden.
      Galería: [productId, position], que es como se lee siempre. El filtro por name es coincidencia
      parcial ignorando mayúsculas y acentos, y eso no lo resuelve un índice de campo: es una
      decisión de cómo se implementa la búsqueda, no un índice que falte en el diseño.

  - id: REV-STORAGE-PUBLIC-SENSITIVE
    scope: storage.buckets.productImages
    verdict: ok
    note: >
      Lo único que se sube son fotos de producto para el escaparate: no hay datos personales, ni
      documentos, ni nada con titular. Público significa que cualquiera con la URL las ve para
      siempre, y eso se decidió a sabiendas y está escrito en la description del bucket, con su
      contrapartida: la foto de un producto en borrador es alcanzable por quien tenga el enlace.

  - id: REV-STORAGE-UPLOAD-ERRORS
    scope: use-cases.addProductImage
    verdict: ok
    note: >
      La única operación que sube declara FILE_TOO_LARGE (413) contra el maxSizeMb de 5 y
      UNSUPPORTED_CONTENT_TYPE (415) contra los tres content types admitidos. No hace falta el
      error de lectura ausente (FILE_NOT_FOUND): el bucket es público y ninguna operación del
      servicio lee un archivo por su clave — el consumidor va directo a la URL.
