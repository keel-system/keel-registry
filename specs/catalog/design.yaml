family: catalog
summary: >
  Catálogo comercial de productos con su marca y su categoría: gestión interna con publicación y
  retirada, catálogo público de solo lectura, y superficie servidor-a-servidor (ficha por id y por
  lote) más eventos de alta, cambio y baja para que otros servidores mantengan su copia al día.
