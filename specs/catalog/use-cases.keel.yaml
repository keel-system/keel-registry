# Capa use-cases — los casos de uso del servicio.
# Tres audiencias, tres contratos distintos: la tienda pública (consumidores anónimos),
# el back-office (personal de la tienda, con rastro de autoría) y otros servidores (M2M).

operations:

  # ── Gestión de productos (back-office) ────────────────────────────────────────

  createProduct:
    description: Da de alta un producto en estado draft, invisible para la tienda.
    kind: command
    input:
      fields:
        sku:         { type: SKU, required: true }
        name:        { type: string, required: true, constraints: { maxLength: 140 } }
        description: { type: text, constraints: { maxLength: 4000 } }
        price:       { type: Price, required: true }
        brandId:     { type: uuid, required: true }
        categoryId:  { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    idempotency: { keySource: client-key, ttlSeconds: 86400 }
    preconditions:
      - La marca indicada existe.
      - La categoría indicada existe.
    rules:
      - El sku se normaliza a mayúsculas antes de comprobar su unicidad.
      - El producto nace en draft con slugFrozen falso, así que su slug sigue al nombre hasta que se publique.
      - El slug se deriva del name; si el slug resultante ya existe, se le añade un sufijo numérico.
    errors:
      - { code: SKU_ALREADY_EXISTS, when: Ya existe un producto con ese sku., http: 409 }
      - { code: BRAND_REFERENCE_NOT_FOUND, when: El brandId indicado no corresponde a ninguna marca existente., http: 422 }
      - { code: CATEGORY_REFERENCE_NOT_FOUND, when: El categoryId indicado no corresponde a ninguna categoría existente., http: 422 }
      - { code: IDEMPOTENCY_KEY_REQUIRED, when: "La petición llega sin la cabecera Idempotency-Key, que esta operación exige.", http: 400 }
      - { code: IDEMPOTENCY_KEY_IN_PROGRESS, when: Otra petición con la misma clave de idempotencia se está ejecutando en este momento., http: 409 }
      - { code: IDEMPOTENCY_KEY_REUSED, when: La misma clave de idempotencia llega con un contenido distinto al de la primera petición., http: 409 }
    emits: [ProductCreated]

  updateProduct:
    description: Cambia la ficha comercial de un producto (nombre, descripción, precio, marca o categoría).
    kind: command
    input:
      fields:
        productId:   { type: uuid, required: true }
        name:        { type: string, required: true, constraints: { maxLength: 140 } }
        description: { type: text, constraints: { maxLength: 4000 } }
        price:       { type: Price, required: true }
        brandId:     { type: uuid, required: true }
        categoryId:  { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    preconditions:
      - El producto existe.
      - La marca y la categoría indicadas existen.
    rules:
      - "El sku no se puede cambiar: no forma parte de la entrada."
      - El slug se recalcula a partir del nuevo name solo si slugFrozen es falso.
      - Un producto active no puede quedarse con price igual a cero.
      - "La entrada es la representación completa de la ficha: un campo opcional que no viene se vacía, no se conserva."
      - Un producto discontinued sí se puede editar; su ficha la siguen mostrando los pedidos históricos.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: BRAND_REFERENCE_NOT_FOUND, when: El brandId indicado no corresponde a ninguna marca existente., http: 422 }
      - { code: CATEGORY_REFERENCE_NOT_FOUND, when: El categoryId indicado no corresponde a ninguna categoría existente., http: 422 }
      - { code: PRICE_REQUIRED_FOR_ACTIVE_PRODUCT, when: Se intenta dejar en cero el precio de un producto active., http: 422 }
    emits: [ProductUpdated]

  publishProduct:
    description: Publica un producto en borrador para que la tienda lo muestre.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    transitions:
      - entity: Product
        from: [draft]
        to: active
    preconditions:
      - El producto existe y está en draft.
      - El producto tiene un price mayor que cero.
      - El producto tiene al menos una imagen.
    rules:
      - Al publicarse por primera vez, slugFrozen pasa a verdadero y el slug deja de seguir al nombre.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_NOT_IN_DRAFT, when: El producto no está en draft., http: 409 }
      - { code: PRODUCT_PRICE_NOT_SET, when: El producto tiene price igual a cero., http: 422 }
      - { code: PRODUCT_HAS_NO_IMAGES, when: El producto no tiene ninguna imagen en su galería., http: 422 }
    emits: [ProductStatusChanged]

  unpublishProduct:
    description: Retira un producto de la tienda y lo devuelve a borrador para corregirlo.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    transitions:
      - entity: Product
        from: [active]
        to: draft
    preconditions:
      - El producto existe y está active.
    rules:
      - "El slug no vuelve a seguir al nombre: slugFrozen no se deshace."
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_NOT_ACTIVE, when: El producto no está active., http: 409 }
    emits: [ProductStatusChanged]

  discontinueProduct:
    description: Marca un producto como descontinuado; deja de venderse pero su ficha sigue existiendo.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    transitions:
      - entity: Product
        from: [active]
        to: discontinued
    preconditions:
      - El producto existe y está active.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_NOT_ACTIVE, when: El producto no está active., http: 409 }
    emits: [ProductStatusChanged]

  reactivateProduct:
    description: Vuelve a poner a la venta un producto descontinuado.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    transitions:
      - entity: Product
        from: [discontinued]
        to: active
    preconditions:
      - El producto existe y está discontinued.
      - El producto tiene un price mayor que cero y al menos una imagen.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_NOT_DISCONTINUED, when: El producto no está discontinued., http: 409 }
      - { code: PRODUCT_PRICE_NOT_SET, when: El producto tiene price igual a cero., http: 422 }
      - { code: PRODUCT_HAS_NO_IMAGES, when: El producto no tiene ninguna imagen en su galería., http: 422 }
    emits: [ProductStatusChanged]

  deleteProduct:
    description: Elimina definitivamente un producto que nunca llegó a publicarse.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
    output: "void"
    preconditions:
      - El producto existe y está en draft.
      - El producto no se ha publicado nunca (slugFrozen es falso).
    rules:
      - Las imágenes de la galería se eliminan con el producto, y sus objetos se retiran del bucket.
      - "Un producto que ya estuvo publicado no se borra: se descontinúa, porque otros servidores guardan su id."
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_NOT_DELETABLE, when: El producto no está en draft o ya estuvo publicado alguna vez., http: 409 }
    emits: [ProductDeleted]

  getProduct:
    description: Recupera la ficha completa de un producto para el back-office, con su rastro de autoría.
    kind: query
    input:
      fields:
        productId: { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }

  listProducts:
    description: Lista los productos para el back-office, en cualquier estado, con filtros de gestión.
    kind: query
    input:
      fields:
        status:     { type: ProductStatus }
        brandId:    { type: uuid }
        categoryId: { type: uuid }
        name:       { type: string, match: contains, compare: ignore-case-accents, constraints: { maxLength: 140 } }
        sku:        { type: SKU }
    output: { entity: Product, paginated: true, sort: [updatedAt:desc], embed: [brand, category] }
    rules:
      - "Los filtros se combinan con AND: un producto sale solo si cumple todos los que llegan."
      - Sin filtro de status se devuelven los productos en los tres estados.
      - "Un valor de filtro que no corresponde a ninguna marca o categoría no es un error: la página sale vacía."

  # ── Galería de imágenes (back-office) ────────────────────────────────────────

  addProductImage:
    description: Sube una imagen a la galería de un producto y la coloca al final del orden.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
        image:     { type: file, bucket: productImages, required: true }
        altText:   { type: string, constraints: { maxLength: 200 } }
        primary:   { type: boolean, default: false }
    output: { entity: ProductImage }
    idempotency: { keySource: client-key, ttlSeconds: 86400 }
    preconditions:
      - El producto existe y no está discontinued.
      - El producto no ha alcanzado el máximo de diez imágenes.
    rules:
      - La imagen recibe la position siguiente a la mayor de la galería.
      - Si llega con primary verdadero, la imagen que lo era deja de serlo.
      - "Si otra escritura concurrente sobre la galería marcó otra primary antes, esta pierde con 409 CONCURRENT_MODIFICATION: la galería es parte del agregado Product."
      - Si es la primera imagen del producto, se marca primary aunque no se pida.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_DISCONTINUED, when: El producto está descontinuado y su galería ya no se toca., http: 409 }
      - { code: TOO_MANY_PRODUCT_IMAGES, when: El producto ya tiene diez imágenes., http: 422 }
      - { code: FILE_TOO_LARGE, when: El archivo supera el tamaño máximo del bucket., http: 413 }
      - { code: UNSUPPORTED_CONTENT_TYPE, when: El archivo no es de un tipo de imagen admitido., http: 415 }
      - { code: IDEMPOTENCY_KEY_REQUIRED, when: "La petición llega sin la cabecera Idempotency-Key, que esta operación exige.", http: 400 }
      - { code: IDEMPOTENCY_KEY_IN_PROGRESS, when: Otra petición con la misma clave de idempotencia se está ejecutando en este momento., http: 409 }
      - { code: IDEMPOTENCY_KEY_REUSED, when: La misma clave de idempotencia llega con un contenido distinto al de la primera petición., http: 409 }
    emits: [ProductUpdated]

  removeProductImage:
    description: Quita una imagen de la galería de un producto.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
        imageId:   { type: uuid, required: true }
    output: "void"
    preconditions:
      - El producto no está discontinued.
      - La imagen existe y pertenece a ese producto.
      - Si el producto está active, la imagen no es la última de su galería.
    rules:
      - Si se quita la imagen primary y quedan otras, pasa a ser primary la de menor position.
      - El objeto se retira del bucket junto con la imagen.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_IMAGE_NOT_FOUND, when: No existe esa imagen en la galería del producto., http: 404 }
      - { code: PRODUCT_DISCONTINUED, when: El producto está descontinuado y su galería ya no se toca., http: 409 }
      - { code: LAST_IMAGE_OF_ACTIVE_PRODUCT, when: Se intenta quitar la única imagen de un producto active., http: 409 }
    emits: [ProductUpdated]

  setPrimaryProductImage:
    description: Elige qué imagen representa al producto en los listados.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
        imageId:   { type: uuid, required: true }
    output: "void"
    preconditions:
      - El producto no está discontinued.
      - La imagen existe y pertenece a ese producto.
    rules:
      - La imagen que era primary deja de serlo en la misma transacción.
      - "Si otra escritura concurrente sobre la galería marcó otra primary antes, esta pierde con 409 CONCURRENT_MODIFICATION: la galería es parte del agregado Product."
      - Marcar como primary la que ya lo es no cambia nada y no es un error.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_IMAGE_NOT_FOUND, when: No existe esa imagen en la galería del producto., http: 404 }
      - { code: PRODUCT_DISCONTINUED, when: El producto está descontinuado y su galería ya no se toca., http: 409 }
    emits: [ProductUpdated]

  reorderProductImages:
    description: Reordena la galería de un producto.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
        imageIds:  { type: uuid, list: true, required: true, constraints: { minItems: 1, maxItems: 10 } }
    output: "void"
    preconditions:
      - El producto no está discontinued.
      - La lista trae exactamente las imágenes del producto, sin repetir ninguna y sin omitir ninguna.
    rules:
      - La position de cada imagen es su índice en la lista recibida.
      - Reordenar no cambia qué imagen es primary.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_DISCONTINUED, when: El producto está descontinuado y su galería ya no se toca., http: 409 }
      - { code: IMAGE_SET_MISMATCH, when: La lista no coincide exactamente con las imágenes del producto., http: 422 }
    emits: [ProductUpdated]

  # ── Marcas (back-office) ─────────────────────────────────────────────────────

  createBrand:
    description: Da de alta una marca.
    kind: command
    input:
      fields:
        name:        { type: string, required: true, constraints: { maxLength: 80 } }
        description: { type: text, constraints: { maxLength: 1000 } }
    output: { entity: Brand }
    idempotency: { keySource: client-key, ttlSeconds: 86400 }
    rules:
      - El slug se deriva del name; si ya existe, la escritura se rechaza.
    errors:
      - { code: BRAND_NAME_ALREADY_EXISTS, when: Ya existe una marca con ese nombre., http: 409 }
      - { code: BRAND_SLUG_ALREADY_EXISTS, when: "El slug derivado del nombre ya lo usa otra marca, aunque los nombres no coincidan: «Acme!» y «Acme» dan el mismo.", http: 409 }
      - { code: IDEMPOTENCY_KEY_REQUIRED, when: "La petición llega sin la cabecera Idempotency-Key, que esta operación exige.", http: 400 }
      - { code: IDEMPOTENCY_KEY_IN_PROGRESS, when: Otra petición con la misma clave de idempotencia se está ejecutando en este momento., http: 409 }
      - { code: IDEMPOTENCY_KEY_REUSED, when: La misma clave de idempotencia llega con un contenido distinto al de la primera petición., http: 409 }
    emits: [BrandCreated]

  updateBrand:
    description: Cambia el nombre o la reseña de una marca.
    kind: command
    input:
      fields:
        brandId:     { type: uuid, required: true }
        name:        { type: string, required: true, constraints: { maxLength: 80 } }
        description: { type: text, constraints: { maxLength: 1000 } }
    output: { entity: Brand }
    rules:
      - El slug se recalcula con el nuevo name; las URLs públicas de marca cambian con él.
      - "La entrada es la representación completa: si no viene description, la marca se queda sin reseña."
    errors:
      - { code: BRAND_NOT_FOUND, when: No existe una marca con ese brandId., http: 404 }
      - { code: BRAND_NAME_ALREADY_EXISTS, when: Otra marca ya tiene ese nombre., http: 409 }
      - { code: BRAND_SLUG_ALREADY_EXISTS, when: El slug derivado del nuevo nombre ya lo usa otra marca aunque los nombres no coincidan., http: 409 }
    emits: [BrandUpdated]

  deleteBrand:
    description: Elimina una marca que ningún producto referencia.
    kind: command
    input:
      fields:
        brandId: { type: uuid, required: true }
    output: "void"
    preconditions:
      - Ningún producto referencia la marca.
    errors:
      - { code: BRAND_NOT_FOUND, when: No existe una marca con ese brandId., http: 404 }
      - { code: BRAND_IN_USE, when: Algún producto referencia esa marca., http: 409 }
    emits: [BrandDeleted]

  # ── Categorías (back-office) ─────────────────────────────────────────────────

  createCategory:
    description: Da de alta una categoría.
    kind: command
    input:
      fields:
        name:        { type: string, required: true, constraints: { maxLength: 80 } }
        description: { type: text, constraints: { maxLength: 1000 } }
    output: { entity: Category }
    idempotency: { keySource: client-key, ttlSeconds: 86400 }
    rules:
      - El slug se deriva del name; si ya existe, la escritura se rechaza.
    errors:
      - { code: CATEGORY_NAME_ALREADY_EXISTS, when: Ya existe una categoría con ese nombre., http: 409 }
      - { code: CATEGORY_SLUG_ALREADY_EXISTS, when: El slug derivado del nombre ya lo usa otra categoría aunque los nombres no coincidan., http: 409 }
      - { code: IDEMPOTENCY_KEY_REQUIRED, when: "La petición llega sin la cabecera Idempotency-Key, que esta operación exige.", http: 400 }
      - { code: IDEMPOTENCY_KEY_IN_PROGRESS, when: Otra petición con la misma clave de idempotencia se está ejecutando en este momento., http: 409 }
      - { code: IDEMPOTENCY_KEY_REUSED, when: La misma clave de idempotencia llega con un contenido distinto al de la primera petición., http: 409 }
    emits: [CategoryCreated]

  updateCategory:
    description: Cambia el nombre o el texto de cabecera de una categoría.
    kind: command
    input:
      fields:
        categoryId:  { type: uuid, required: true }
        name:        { type: string, required: true, constraints: { maxLength: 80 } }
        description: { type: text, constraints: { maxLength: 1000 } }
    output: { entity: Category }
    rules:
      - El slug se recalcula con el nuevo name; las URLs públicas de categoría cambian con él.
      - "La entrada es la representación completa: si no viene description, la categoría se queda sin texto de cabecera."
    errors:
      - { code: CATEGORY_NOT_FOUND, when: No existe una categoría con ese categoryId., http: 404 }
      - { code: CATEGORY_NAME_ALREADY_EXISTS, when: Otra categoría ya tiene ese nombre., http: 409 }
      - { code: CATEGORY_SLUG_ALREADY_EXISTS, when: El slug derivado del nuevo nombre ya lo usa otra categoría aunque los nombres no coincidan., http: 409 }
    emits: [CategoryUpdated]

  deleteCategory:
    description: Elimina una categoría que ningún producto referencia.
    kind: command
    input:
      fields:
        categoryId: { type: uuid, required: true }
    output: "void"
    preconditions:
      - Ningún producto referencia la categoría.
    errors:
      - { code: CATEGORY_NOT_FOUND, when: No existe una categoría con ese categoryId., http: 404 }
      - { code: CATEGORY_IN_USE, when: Algún producto referencia esa categoría., http: 409 }
    emits: [CategoryDeleted]

  # ── Tienda pública (consumidores anónimos) ───────────────────────────────────

  listPublicProducts:
    description: Lista los productos a la venta, con filtros de categoría, marca, nombre y rango de precio.
    kind: query
    input:
      fields:
        categorySlug: { type: Slug }
        brandSlug:    { type: Slug }
        name:         { type: string, match: contains, compare: ignore-case-accents, constraints: { maxLength: 140 } }
        minPrice:     { type: Price }
        maxPrice:     { type: Price }
    output:
      entity: Product
      paginated: true
      sort: [name:asc]
      embed: [brand, category]
      exclude: [slugFrozen, lockVersion, createdAt, updatedAt, createdBy, updatedBy]
    preconditions:
      - Si llegan los dos extremos del rango, minPrice no es mayor que maxPrice.
    rules:
      - Solo se devuelven productos active; los borradores y los descontinuados nunca salen aquí.
      - "Los filtros se combinan con AND: un producto sale solo si cumple todos los que llegan."
      - Los extremos del rango de precio son inclusivos.
      - "Un categorySlug o brandSlug que no existe no es un error: la página sale vacía."
    errors:
      - { code: INVALID_PRICE_RANGE, when: minPrice es mayor que maxPrice., http: 422 }

  getPublicProduct:
    description: Devuelve la ficha pública de un producto a partir de su slug.
    kind: query
    input:
      fields:
        slug: { type: Slug, required: true }
    output:
      entity: Product
      embed: [brand, category]
      exclude: [slugFrozen, lockVersion, createdAt, updatedAt, createdBy, updatedBy]
    cache:
      ttlSeconds: 60
      keyFields: [slug]
      invalidatedBy: [ProductUpdated, ProductStatusChanged, BrandUpdated, CategoryUpdated]
    rules:
      - "Un producto que no está active responde como si no existiera: la tienda no revela borradores ni descontinuados."
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No hay ningún producto active con ese slug., http: 404 }

  listBrands:
    description: Lista las marcas para que la tienda construya su navegación.
    kind: query
    input: "void"
    output: { entity: Brand, paginated: true, sort: [name:asc] }

  listCategories:
    description: Lista las categorías para que la tienda construya su navegación.
    kind: query
    input: "void"
    output: { entity: Category, paginated: true, sort: [name:asc] }

  # ── Superficie servidor-a-servidor ───────────────────────────────────────────

  getProductForServices:
    description: Resuelve un producto por su id para otro servidor que necesita su ficha.
    kind: query
    input:
      fields:
        productId: { type: uuid, required: true }
    output:
      entity: Product
      embed: [brand, category]
      exclude: [slugFrozen, lockVersion, createdBy, updatedBy]
    cache:
      ttlSeconds: 60
      keyFields: [productId]
      invalidatedBy: [ProductUpdated, ProductStatusChanged, BrandUpdated, CategoryUpdated]
    rules:
      - "Se resuelven productos active y discontinued: un pedido histórico referencia artículos que ya no se venden."
      - "Un producto en draft responde como si no existiera: un borrador no es todavía un artículo del catálogo."
      - updatedAt viaja en la respuesta para que el consumidor sepa de cuándo es la ficha que recibe.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto active o discontinued con ese productId., http: 404 }

  listProductsBatchForServices:
    description: Resuelve varios productos por sus ids en una sola llamada, para que un servidor consumidor no haga una petición por artículo.
    kind: query
    input:
      fields:
        productIds: { type: uuid, list: true }
    output:
      entity: Product
      list: true
      sort: [sku:asc]
      embed: [brand, category]
      exclude: [slugFrozen, lockVersion, createdBy, updatedBy]
    preconditions:
      - La lista de ids llega presente y con al menos un elemento.
      - La lista no trae más de cien ids.
    rules:
      - Los ids que no existen, los repetidos y los de productos en draft se omiten del resultado sin fallar.
      - "El resultado sale ordenado por sku, no en el orden de la petición: el consumidor lo indexa por id."
      - La respuesta puede traer menos elementos que la petición; eso no es un error.
    errors:
      - { code: EMPTY_ID_LIST, when: La lista de ids llega vacía o ausente., http: 422 }
      - { code: TOO_MANY_IDS, when: La lista trae más de cien ids., http: 422 }
