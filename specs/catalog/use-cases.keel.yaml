# Capa use-cases — los casos de uso del servicio.
# Aquí viven también las políticas propias del caso de uso: idempotencia, caché y schedule.
# Quién los activa se declara en la capa que los expone (api: endpoints, messaging: subscriptions);
# una operación sin trigger debe marcar internal: true o tener schedule.

operations:

  # ─── Marcas ────────────────────────────────────────────────────────────────

  createBrand:
    description: Da de alta una marca comercial.
    kind: command
    input:
      fields:
        name:        { type: string, required: true, constraints: { maxLength: 120 } }
        description: { type: string, constraints: { maxLength: 1000 } }
    output: { entity: Brand }
    rules:
      - El name se compara sin distinguir mayúsculas, minúsculas ni acentos para validar unicidad.
      - El slug se deriva del name normalizado a kebab-case.
    errors:
      - { code: BRAND_NAME_ALREADY_EXISTS, when: Ya existe una marca con ese name., http: 409 }
      - { code: SLUG_ALREADY_EXISTS, when: El name produce un slug que ya usa otra marca., http: 409 }

  updateBrand:
    description: Cambia el name o la descripción de una marca.
    kind: command
    input:
      fields:
        id:          { type: uuid, required: true }
        name:        { type: string, required: true, constraints: { maxLength: 120 } }
        description: { type: string, constraints: { maxLength: 1000 } }
    output: { entity: Brand }
    rules:
      - Al cambiar el name se recalcula el slug.
      - Es un reemplazo total; un campo opcional que no venga en la petición se deja sin valor.
    errors:
      - { code: BRAND_NOT_FOUND, when: No existe una marca con ese id., http: 404 }
      - { code: BRAND_NAME_ALREADY_EXISTS, when: Otra marca ya usa ese name., http: 409 }
      - { code: SLUG_ALREADY_EXISTS, when: El name produce un slug que ya usa otra marca., http: 409 }
      - { code: CONCURRENT_MODIFICATION, when: La marca fue modificada por otra petición desde que se leyó., http: 409 }

  deactivateBrand:
    description: Desactiva una marca, que deja de admitir productos nuevos.
    kind: command
    input:
      fields:
        id: { type: uuid, required: true }
    output: { entity: Brand }
    preconditions:
      - La marca está en estado active.
    rules:
      - Los productos que ya referencian la marca conservan su estado y siguen publicados si lo estaban.
      - Una marca inactive desaparece de la navegación pública, aunque sus productos sigan siendo accesibles.
    errors:
      - { code: BRAND_NOT_FOUND, when: No existe una marca con ese id., http: 404 }
      - { code: ILLEGAL_STATUS_TRANSITION, when: La marca ya está inactive., http: 409 }
      - { code: CONCURRENT_MODIFICATION, when: La marca fue modificada por otra petición desde que se leyó., http: 409 }

  activateBrand:
    description: Reactiva una marca desactivada, que vuelve a admitir productos nuevos.
    kind: command
    input:
      fields:
        id: { type: uuid, required: true }
    output: { entity: Brand }
    preconditions:
      - La marca está en estado inactive.
    errors:
      - { code: BRAND_NOT_FOUND, when: No existe una marca con ese id., http: 404 }
      - { code: ILLEGAL_STATUS_TRANSITION, when: La marca ya está active., http: 409 }
      - { code: CONCURRENT_MODIFICATION, when: La marca fue modificada por otra petición desde que se leyó., http: 409 }

  getBrand:
    description: Recupera una marca por su id.
    kind: query
    input:
      fields:
        id: { type: uuid, required: true }
    output: { entity: Brand }
    errors:
      - { code: BRAND_NOT_FOUND, when: No existe una marca con ese id., http: 404 }

  listBrands:
    description: Lista las marcas del catálogo de forma paginada.
    kind: query
    input:
      fields:
        q:      { type: string, constraints: { maxLength: 120 }, description: Filtro por coincidencia parcial en el name. }
        status: { type: ActivationStatus, description: Filtra por estado; sin él se devuelven todas. }
    output: { entity: Brand, paginated: true }
    rules:
      - El resultado se ordena por name ascendente y, a igualdad, por id ascendente.
      - El filtro q compara sin distinguir mayúsculas, minúsculas ni acentos.

  # ─── Categorías ────────────────────────────────────────────────────────────

  createCategory:
    description: Da de alta una categoría del catálogo.
    kind: command
    input:
      fields:
        name:        { type: string, required: true, constraints: { maxLength: 120 } }
        description: { type: string, constraints: { maxLength: 1000 } }
    output: { entity: Category }
    rules:
      - El name se compara sin distinguir mayúsculas, minúsculas ni acentos para validar unicidad.
      - El slug se deriva del name normalizado a kebab-case.
    errors:
      - { code: CATEGORY_NAME_ALREADY_EXISTS, when: Ya existe una categoría con ese name., http: 409 }
      - { code: SLUG_ALREADY_EXISTS, when: El name produce un slug que ya usa otra categoría., http: 409 }

  updateCategory:
    description: Cambia el name o la descripción de una categoría.
    kind: command
    input:
      fields:
        id:          { type: uuid, required: true }
        name:        { type: string, required: true, constraints: { maxLength: 120 } }
        description: { type: string, constraints: { maxLength: 1000 } }
    output: { entity: Category }
    rules:
      - Al cambiar el name se recalcula el slug.
      - Es un reemplazo total; un campo opcional que no venga en la petición se deja sin valor.
    errors:
      - { code: CATEGORY_NOT_FOUND, when: No existe una categoría con ese id., http: 404 }
      - { code: CATEGORY_NAME_ALREADY_EXISTS, when: Otra categoría ya usa ese name., http: 409 }
      - { code: SLUG_ALREADY_EXISTS, when: El name produce un slug que ya usa otra categoría., http: 409 }
      - { code: CONCURRENT_MODIFICATION, when: La categoría fue modificada por otra petición desde que se leyó., http: 409 }

  deactivateCategory:
    description: Desactiva una categoría, que deja de admitir productos nuevos.
    kind: command
    input:
      fields:
        id: { type: uuid, required: true }
    output: { entity: Category }
    preconditions:
      - La categoría está en estado active.
    rules:
      - Los productos que ya referencian la categoría conservan su estado y siguen publicados si lo estaban.
      - Una categoría inactive desaparece de la navegación pública, aunque sus productos sigan siendo accesibles.
    errors:
      - { code: CATEGORY_NOT_FOUND, when: No existe una categoría con ese id., http: 404 }
      - { code: ILLEGAL_STATUS_TRANSITION, when: La categoría ya está inactive., http: 409 }
      - { code: CONCURRENT_MODIFICATION, when: La categoría fue modificada por otra petición desde que se leyó., http: 409 }

  activateCategory:
    description: Reactiva una categoría desactivada, que vuelve a admitir productos nuevos.
    kind: command
    input:
      fields:
        id: { type: uuid, required: true }
    output: { entity: Category }
    preconditions:
      - La categoría está en estado inactive.
    errors:
      - { code: CATEGORY_NOT_FOUND, when: No existe una categoría con ese id., http: 404 }
      - { code: ILLEGAL_STATUS_TRANSITION, when: La categoría ya está active., http: 409 }
      - { code: CONCURRENT_MODIFICATION, when: La categoría fue modificada por otra petición desde que se leyó., http: 409 }

  getCategory:
    description: Recupera una categoría por su id.
    kind: query
    input:
      fields:
        id: { type: uuid, required: true }
    output: { entity: Category }
    errors:
      - { code: CATEGORY_NOT_FOUND, when: No existe una categoría con ese id., http: 404 }

  listCategories:
    description: Lista las categorías del catálogo de forma paginada.
    kind: query
    input:
      fields:
        q:      { type: string, constraints: { maxLength: 120 }, description: Filtro por coincidencia parcial en el name. }
        status: { type: ActivationStatus, description: Filtra por estado; sin él se devuelven todas. }
    output: { entity: Category, paginated: true }
    rules:
      - El resultado se ordena por name ascendente y, a igualdad, por id ascendente.
      - El filtro q compara sin distinguir mayúsculas, minúsculas ni acentos.

  # ─── Productos: gestión ────────────────────────────────────────────────────

  createProduct:
    description: Da de alta un producto en estado draft, adscrito a una marca y a una categoría.
    kind: command
    input:
      fields:
        sku:         { type: SKU, required: true }
        name:        { type: string, required: true, constraints: { maxLength: 200 } }
        description: { type: string, constraints: { maxLength: 2000 } }
        price:       { type: Money, required: true }
        brandId:     { type: uuid, required: true }
        categoryId:  { type: uuid, required: true }
        tags:        { type: string, list: true, constraints: { maxItems: 10 } }
    output: { entity: Product, embed: [brand, category] }
    idempotency: { keySource: client-key, ttlSeconds: 86400 }
    rules:
      - El sku se normaliza a mayúsculas antes de validar unicidad.
      - La unicidad del sku abarca los productos retirados; un sku retirado queda reservado y no se reutiliza.
      - El producto nace siempre en estado draft y con la galería vacía.
      - La marca y la categoría indicadas deben estar active.
    errors:
      - { code: SKU_ALREADY_EXISTS, when: "Ya existe un producto con ese sku, aunque esté retirado.", http: 409 }
      - { code: IDEMPOTENCY_KEY_REUSED, when: La clave de idempotencia ya se usó con un contenido distinto., http: 409 }
      - { code: BRAND_NOT_FOUND, when: El brandId indicado no existe., http: 422 }
      - { code: CATEGORY_NOT_FOUND, when: El categoryId indicado no existe., http: 422 }
      - { code: BRAND_INACTIVE, when: La marca indicada está desactivada y no admite productos nuevos., http: 422 }
      - { code: CATEGORY_INACTIVE, when: La categoría indicada está desactivada y no admite productos nuevos., http: 422 }
    emits: [ProductCreated]

  updateProduct:
    description: Actualiza la ficha comercial de un producto que no esté retirado.
    kind: command
    input:
      fields:
        productId:        { type: uuid, required: true }
        name:        { type: string, required: true, constraints: { maxLength: 200 } }
        description: { type: string, constraints: { maxLength: 2000 } }
        price:       { type: Money, required: true }
        brandId:     { type: uuid, required: true }
        categoryId:  { type: uuid, required: true }
        tags:        { type: string, list: true, constraints: { maxItems: 10 } }
    output: { entity: Product, embed: [brand, category] }
    preconditions:
      - El producto no está en estado retired.
    rules:
      - El sku no se puede cambiar; identifica al producto para el resto del sistema.
      - Reasignar el producto exige que la marca y la categoría de destino estén active; conservar las que ya tenía es válido aunque se hayan desactivado.
      - Es un reemplazo total; un campo opcional que no venga en la petición se deja sin valor.
      - Un producto active debe conservar un price.amount mayor que cero tras la actualización.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese id., http: 404 }
      - { code: PRODUCT_RETIRED, when: El producto está retirado y su ficha ya no admite cambios., http: 409 }
      - { code: BRAND_NOT_FOUND, when: El brandId indicado no existe., http: 422 }
      - { code: CATEGORY_NOT_FOUND, when: El categoryId indicado no existe., http: 422 }
      - { code: BRAND_INACTIVE, when: La marca indicada está desactivada y no admite productos nuevos., http: 422 }
      - { code: CATEGORY_INACTIVE, when: La categoría indicada está desactivada y no admite productos nuevos., http: 422 }
      - { code: PRICE_MUST_BE_POSITIVE, when: Se intenta dejar un producto active con price.amount igual a cero., http: 422 }
      - { code: CONCURRENT_MODIFICATION, when: El producto fue modificado por otra petición desde que se leyó., http: 409 }
    emits: [ProductUpdated]

  publishProduct:
    description: Publica un producto draft, que pasa a estar disponible en el catálogo.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    preconditions:
      - El producto está en estado draft.
      - El producto tiene un price.amount mayor que cero.
      - El producto tiene al menos una imagen en su galería.
    rules:
      - La transición de draft a active es la única publicación válida; un producto ya active se rechaza.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese id., http: 404 }
      - { code: ILLEGAL_STATUS_TRANSITION, when: El producto no está en estado draft., http: 409 }
      - { code: PRICE_MUST_BE_POSITIVE, when: El producto no tiene un precio publicable., http: 422 }
      - { code: IMAGE_REQUIRED, when: "El producto no tiene ninguna imagen, y el catálogo no publica fichas sin fotografía.", http: 422 }
      - { code: CONCURRENT_MODIFICATION, when: El producto fue modificado por otra petición desde que se leyó., http: 409 }
    emits: [ProductUpdated]

  retireProduct:
    description: Retira un producto del catálogo de forma definitiva.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    preconditions:
      - El producto está en estado draft o active.
    rules:
      - retired es un estado terminal; el producto no vuelve al catálogo ni admite cambios posteriores.
      - La galería del producto se conserva pero deja de ser accesible desde el catálogo público.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese id., http: 404 }
      - { code: ILLEGAL_STATUS_TRANSITION, when: El producto ya está retirado., http: 409 }
      - { code: CONCURRENT_MODIFICATION, when: El producto fue modificado por otra petición desde que se leyó., http: 409 }
    emits: [ProductRetired]

  addProductImage:
    description: Añade una fotografía al final de la galería de un producto.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
        image:     { type: file, bucket: productImages, required: true }
        altText:   { type: string, constraints: { maxLength: 200 } }
    output: { entity: Product, embed: [brand, category] }
    preconditions:
      - El producto no está en estado retired.
      - El producto tiene menos de ocho imágenes.
    rules:
      - La imagen nueva ocupa la última posición libre de la galería.
      - La primera imagen que se añade a un producto sin galería ocupa la posición 1 y es la principal.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_RETIRED, when: El producto está retirado y su ficha ya no admite cambios., http: 409 }
      - { code: MAX_IMAGES_REACHED, when: El producto ya tiene ocho imágenes., http: 409 }
      - { code: FILE_TOO_LARGE, when: El archivo supera el tamaño máximo admitido por el bucket productImages., http: 413 }
      - { code: UNSUPPORTED_CONTENT_TYPE, when: El tipo de archivo no está entre los admitidos por el bucket productImages., http: 415 }
      - { code: CONCURRENT_MODIFICATION, when: El producto fue modificado por otra petición desde que se leyó., http: 409 }
    emits: [ProductUpdated]

  removeProductImage:
    description: Elimina una fotografía de la galería de un producto.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
        imageId:   { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    preconditions:
      - El producto no está en estado retired.
      - La imagen pertenece a ese producto.
    rules:
      - Las posiciones restantes se recompactan para seguir siendo consecutivas desde 1, dentro de la misma transacción del agregado, sin que ningún estado intermedio con posiciones repetidas llegue a ser observable.
      - Al eliminar la imagen de posición 1, la siguiente pasa a ser la principal.
      - El archivo se elimina del bucket; no quedan objetos huérfanos accesibles por su URL.
      - Un producto active no puede quedarse sin imágenes.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_RETIRED, when: El producto está retirado y su ficha ya no admite cambios., http: 409 }
      - { code: IMAGE_NOT_FOUND, when: La imagen no existe o no pertenece a ese producto., http: 404 }
      - { code: LAST_IMAGE_OF_ACTIVE_PRODUCT, when: Es la única imagen de un producto publicado., http: 409 }
      - { code: CONCURRENT_MODIFICATION, when: El producto fue modificado por otra petición desde que se leyó., http: 409 }
    emits: [ProductUpdated]

  reorderProductImages:
    description: Reordena la galería de un producto según la secuencia de imágenes indicada.
    kind: command
    input:
      fields:
        productId: { type: uuid, required: true }
        imageIds:  { type: uuid, list: true, required: true, constraints: { minItems: 1, maxItems: 8 } }
    output: { entity: Product, embed: [brand, category] }
    preconditions:
      - El producto no está en estado retired.
      - La lista contiene exactamente las imágenes del producto, cada una una sola vez.
    rules:
      - La posición de cada imagen es su índice en la lista, empezando en 1; la reasignación ocurre dentro de la misma transacción del agregado, sin estados intermedios observables.
      - La primera de la lista pasa a ser la imagen principal.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }
      - { code: PRODUCT_RETIRED, when: El producto está retirado y su ficha ya no admite cambios., http: 409 }
      - { code: IMAGE_NOT_FOUND, when: Algún id de la lista no es una imagen de ese producto., http: 404 }
      - { code: INCOMPLETE_IMAGE_ORDER, when: "La lista no cubre todas las imágenes del producto, o repite alguna.", http: 422 }
      - { code: CONCURRENT_MODIFICATION, when: El producto fue modificado por otra petición desde que se leyó., http: 409 }
    emits: [ProductUpdated]

  getProduct:
    description: Recupera la ficha completa de un producto en cualquier estado, para su gestión interna.
    kind: query
    input:
      fields:
        productId: { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    rules:
      - Devuelve el producto sea cual sea su estado, incluidos draft y retired.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese id., http: 404 }

  listProducts:
    description: Lista los productos del catálogo en cualquier estado, para su gestión interna.
    kind: query
    input:
      fields:
        status:     { type: ProductStatus, description: Filtra por estado; sin él se devuelven todos. }
        brandId:    { type: uuid }
        categoryId: { type: uuid }
        q:          { type: string, constraints: { maxLength: 200 }, description: Filtro por coincidencia parcial en name o sku. }
    output: { entity: Product, paginated: true }
    rules:
      - El resultado se ordena por updatedAt descendente y, a igualdad, por id ascendente.
      - El filtro q compara sin distinguir mayúsculas, minúsculas ni acentos.
      - Un filtro que referencia una marca o una categoría inexistente devuelve una página vacía, no un error.

  # ─── Catálogo público ──────────────────────────────────────────────────────

  listPublishedBrands:
    description: Lista las marcas que la tienda puede ofrecer, para construir su navegación.
    kind: query
    input: "void"
    output: { entity: Brand, paginated: true, exclude: [createdAt, updatedAt] }
    rules:
      - Solo se listan las marcas active con al menos un producto en estado active; una marca desactivada, o sin catálogo publicado, no aparece.
      - El resultado se ordena por name ascendente y, a igualdad, por id ascendente.
      - Sin caché; el listado refleja siempre el estado actual del catálogo publicado.

  listPublishedCategories:
    description: Lista las categorías que la tienda puede ofrecer, para construir su navegación.
    kind: query
    input: "void"
    output: { entity: Category, paginated: true, exclude: [createdAt, updatedAt] }
    rules:
      - Solo se listan las categorías active con al menos un producto en estado active; una categoría desactivada, o sin catálogo publicado, no aparece.
      - El resultado se ordena por name ascendente y, a igualdad, por id ascendente.
      - Sin caché; el listado refleja siempre el estado actual del catálogo publicado.


  getPublishedProduct:
    description: Recupera la ficha de un producto publicado, tal como la ve el visitante del catálogo.
    kind: query
    input:
      fields:
        productId: { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    cache: { ttlSeconds: 300, keyFields: [productId], invalidatedBy: [ProductUpdated, ProductRetired] }
    rules:
      - Solo se devuelven productos en estado active; uno draft o retired responde como inexistente.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto publicado con ese id., http: 404 }

  listPublishedProducts:
    description: Lista los productos publicados del catálogo, con filtros de marca, categoría y texto.
    kind: query
    input:
      fields:
        brandId:    { type: uuid }
        categoryId: { type: uuid }
        q:          { type: string, constraints: { maxLength: 200 }, description: Filtro por coincidencia parcial en name o tags. }
    output: { entity: Product, paginated: true }
    rules:
      - Solo se listan productos en estado active.
      - El resultado se ordena por name ascendente y, a igualdad, por id ascendente.
      - El filtro q compara sin distinguir mayúsculas, minúsculas ni acentos.
      - Un filtro que referencia una marca o una categoría inexistente devuelve una página vacía, no un error.

  # ─── Superficie servidor-a-servidor ────────────────────────────────────────

  getProductForServices:
    description: Resuelve un producto por su id para otro servidor, con su marca y su categoría incorporadas.
    kind: query
    input:
      fields:
        productId: { type: uuid, required: true }
    output: { entity: Product, embed: [brand, category] }
    cache: { ttlSeconds: 300, keyFields: [productId], invalidatedBy: [ProductUpdated, ProductRetired] }
    rules:
      - Devuelve el producto en cualquier estado, con su status, para que el consumidor decida qué hacer con él.
    errors:
      - { code: PRODUCT_NOT_FOUND, when: No existe un producto con ese productId., http: 404 }

  getProductsByIds:
    description: Resuelve varios productos por sus identificadores en una sola llamada, para otro servidor.
    kind: query
    input:
      fields:
        productIds: { type: uuid, list: true, required: true, constraints: { minItems: 1, maxItems: 100 } }
    output: { entity: Product, list: true, embed: [brand, category] }
    rules:
      - Los identificadores inexistentes se omiten del resultado, en el mismo orden que la petición.
      - Devuelve los productos en cualquier estado, con su status; el consumidor filtra según su caso.
      - Un identificador repetido en la petición se resuelve una sola vez en la respuesta.
