# Capa persistence — cómo se persisten las entidades del dominio.
# Agnóstica del motor: se declara el modelo de almacenamiento, nunca el producto que lo implementa.

default:
  model: relational

entities:

  Brand:
    persisted: true
    naturalKey: [slug]
    # El listado público ordena por name; el filtro público llega por slug.
    indexes: [[name]]

  Category:
    persisted: true
    naturalKey: [slug]
    indexes: [[name]]

  Product:
    persisted: true
    # El sku es la clave con la que el negocio conoce el artículo: único e inmutable.
    naturalKey: [sku]
    indexes:
      # La tienda pública siempre filtra por status = active y ordena por name.
      - [status, name]
      # Filtros públicos y de back-office por taxonomía, siempre acotados por estado.
      - [status, brandId]
      - [status, categoryId]
      # El filtro público por rango de precio, acotado por estado.
      - [status, price]
      # La ficha pública se pide por slug, que es único.
      - fields: [slug]
        unique: true
      # La tabla del back-office ordena por updatedAt descendente.
      - [updatedAt]

  ProductImage:
    persisted: true
    indexes:
      # La galería se lee siempre por su producto y en orden de posición.
      - [productId, position]
      # Unicidad CONDICIONADA al estado: como máximo una imagen primary por producto, sin impedir
      # que el producto tenga varias imágenes. Es lo único que cierra la ventana de dos peticiones
      # concurrentes marcando principales distintas; el caso normal lo resuelve la regla del caso
      # de uso. Los motores sin índice parcial (MySQL, Oracle) no la sostienen: allí la garantía se
      # queda entera en el caso de uso, y el generador lo avisa.
      - fields: [productId]
        unique: true
        when: { field: primary, equals: true }
        description: Como máximo una imagen principal por producto.

# Retención, decidida a sabiendas: nada se archiva ni se purga. Un producto discontinued se guarda
# para siempre porque los pedidos históricos lo referencian, y su sku sigue ocupado para siempre
# porque identifica a ESE artículo — reutilizarlo haría que un pedido viejo apuntara a otro producto.

audit:
  # El rastro es parte del contrato, y por eso 'declared': los cuatro campos están en domain y salen
  # en las respuestas de gestión. Solo Product los declara — así la marca y la categoría embebidas
  # en una ficha pública no arrastran quién gestiona la tienda.
  timestamps: declared
  authorship: declared

consistency:
  # Ninguna operación escribe dos agregados a la vez, así que la transacción por agregado basta y
  # contiende menos. La fila del outbox de messaging entra en esta misma transacción.
  transactionalBoundary: per-aggregate
  # Solo Product declara lockVersion: es la única raíz con edición concurrente real, y una escritura
  # sobre una versión obsoleta es un conflicto en vez de pisar el precio ajeno en silencio.
  # Marca y categoría no lo declaran: ahí gana la última escritura, dicho a sabiendas.
  optimisticLocking: declared
