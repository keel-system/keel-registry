# Capa storage — almacenamiento de archivos en buckets lógicos.
# Agnóstica del proveedor: nada de S3, MinIO, GCS ni Azure Blob.

buckets:
  productImages:
    description: Fotografías principales de producto, servidas directamente al navegador desde el catálogo público.
    # Decisión del diseñador: son fotos de catálogo público, así que la web las sirve por URL sin
    # mediación del servicio. Contrapartida aceptada: la URL es la única protección, y la foto de un
    # producto draft o retirado sigue siendo accesible para quien conozca su URL.
    visibility: public
    allowedContentTypes: [image/png, image/jpeg, image/webp]
    maxSizeMb: 5
