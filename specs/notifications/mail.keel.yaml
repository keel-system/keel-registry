# Capa mail — el correo que este servicio emite. Proveedor y credenciales SMTP son despliegue.

description: Correo transaccional que el servicio envía a petición de los sistemas llamantes, a partir de plantillas que gestiona negocio.

delivery:
  transport: smtp
  parts: [html, text]
  attachments: false

sentBy:
  - sendQueuedMessage

sender:
  source: data
  description: >-
    Sale del remitente congelado en el mensaje al aceptarlo (copia de SenderSettings.senderAddress
    y senderName). Sin fallback: sin remitente configurado no se acepta ninguna petición, y nunca
    se envía desde una dirección que nadie verificó.

replyTo:
  source: data
  description: Sale del replyToAddress congelado en el mensaje; si está vacío, el correo sale sin Reply-To.

templating:
  source: data
  declaredVariables: true
