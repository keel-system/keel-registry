# Capa mail — el correo que el servicio emite.
# Agnóstica del proveedor: el relay SMTP, su puerto y sus credenciales se deciden al desplegar.

description: "Correo transaccional que el servicio envía en nombre de cada aplicación consumidora, a partir de las plantillas que mantiene negocio."

delivery:
  transport: smtp
  parts: [html, text]        # multipart/alternative: el texto es obligatorio en toda versión de plantilla
  attachments: false

sentBy:
  - sendQueuedMessage        # la única operación que produce correo; su guarda es la transición queued → sending

sender:
  source: data               # EmailMessage.sender.address/name, congelados de Application al aceptar
                             # sin fallback: antes que enviar desde una dirección que nadie verificó, no se envía

replyTo:
  source: data               # EmailMessage.sender.replyToAddress, congelado al aceptar; sin él no hay Reply-To

templating:
  source: data               # las plantillas viven en los datos del servicio; editarlas no es un despliegue
  declaredVariables: true    # cada versión declara sus variables y el envío se valida contra ellas al aceptar
