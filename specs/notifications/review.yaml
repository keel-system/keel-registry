reviewedBy: keel-design-review
reviewedAt: 0.1.0
findings:
  - id: REV-DOMAIN-VAGUE-INVARIANT
    scope: domain.entities.Application.invariants
    verdict: fixed
    note: 'Corregido: la invariante de Application pasa a «una aplicación suspended no acepta peticiones de envío nuevas (salvo la repetición de una ya aceptada)», que se decide sobre Application. La cola vive en las reglas: lo que el despacho toma después falla con application-suspended y un mensaje ya en sending sigue su curso (sendQueuedMessage).'
  - id: REV-DOMAIN-INVARIANT-IS-TRANSITION
    scope: domain.entities.SuppressedAddress.invariants
    verdict: ok
    note: >-
      La única invariante que habla de un cambio de estado es la de SuppressedAddress: «Al reactivarse,
      reason, notes y suppressedAt toman los valores de la nueva supresión». La arista released → active
      ya está en su lifecycle y la declaran suppressAddress y reportEmailBounce. Lo que queda en prosa es
      qué campos escribe esa transición, y el lifecycle no puede expresarlo. La de «liberar conserva el
      registro» también tiene sus aristas (active ↔ released). Ninguna otra invariante describe un
      «pasar de X a Y».
  - id: REV-DOMAIN-COMPUTED-NOT-DERIVABLE
    scope: domain.entities.EmailMessage.fields.contentFingerprint
    verdict: fixed
    note: 'Corregido: contentFingerprint es sensitive y se excluye de las cuatro salidas de EmailMessage; su computed fija la función (SHA-256 hex) y la forma canónica (JSON con recipients normalizados y ordenados, variables declaradas ordenadas por name).'
  - id: REV-DOMAIN-PROMISED-STATE
    scope: messaging.publishing.events.EmailDeliveryFailed.payload.failedAt
    verdict: fixed
    note: 'Corregido: añadido EmailMessage.failedAt con la invariante failed ⇒ failureReason y failedAt; lo fijan el rescate y sendQueuedMessage y es el origen de EmailDeliveryFailed.failedAt, consultable por HTTP.'
  - id: REV-DOMAIN-PARTIAL-WRITER
    scope: domain.entities.EmailMessage, domain.entities.SuppressedAddress
    verdict: ok
    note: >-
      Hay tres destinos con más de una vía. (1) EmailMessage failed, por dispatchQueuedMessages (rescate)
      y sendQueuedMessage: las dos escriben failureReason con un valor propio de cada camino
      (sending-timeout, application-suspended, recipient-suppressed, render-error, delivery-*), así que
      las filas se distinguen. failureDetail solo lo rellenan algunas vías, pero su description dice que
      no es contrato. (2) EmailTemplateVersion archived, por publish, activate y retire: la transición no
      escribe ningún campo, así que las filas quedan igual. (3) SuppressedAddress active, por
      suppressAddress y reportEmailBounce: las dos escriben reason (complaint/manual frente a hard-bounce),
      notes y suppressedAt, y la invariante de reactivación lo fija para ambas. reason distingue el
      camino. La única pega es que notes queda nulo en un hard-bounce sin diagnostic, y no afecta a la
      distinción.
  - id: REV-USECASES-INTERNAL-REPEAT
    scope: use-cases.operations
    verdict: ok
    note: >-
      Repasé los commands sin idempotency. registerApplication y createTemplate los frena la clave natural
      (Application.code; EmailTemplate [application, code]) con su 409. updateApplication es una
      sustitución completa. suspend, reactivate, activateTemplateVersion, retireTemplate y suppressAddress
      son no-op declarados si se repiten. reportEmailBounce declara que repetirlo no tiene más efecto.
      sendQueuedMessage se guarda con la transición queued → sending, y los dos programados son de un solo
      vuelo y no acumulan. Nada suma ni cobra por dentro. Queda una observación que no es del id:
      releaseAddress reintentado tras un timeout devuelve 404 SUPPRESSED_ADDRESS_NOT_FOUND aunque haya
      tenido éxito, a diferencia de suppressAddress, que es no-op.
  - id: REV-USECASES-GUARD-ORDER
    scope: use-cases.operations.requestNotification.rules
    verdict: ok
    note: >-
      requestNotification fija el orden (1) resolver la aplicación, (2) buscar (aplicación,
      idempotencyKey), (3) suspensión, plantilla, variables y supresiones. Cada paso solo usa datos ya
      disponibles: la búsqueda de (2) necesita la aplicación de (1), y la comparación de contenido usa la
      versión congelada del mensaje encontrado (templateVersionId), no la activa. getApplication y
      findMessageByIdempotencyKey rechazan con APPLICATION_FORBIDDEN antes de buscar, y el claim y el
      input bastan para eso. getMessage necesita leer el mensaje para saber su aplicación y por eso
      responde MESSAGE_NOT_FOUND, que es coherente. En sendQueuedMessage, suspensión y supresiones se leen
      después de la guarda, y el lifecycle queued → sending → failed lo admite.
  - id: REV-SEC-M2M-AUDIENCE
    scope: security.authentication.serviceAuth
    verdict: ok
    note: >-
      serviceAuth declara validateAudience: true con audience notifications, así que un token
      client_credentials emitido para otro servicio del mismo servidor de autenticación no vale en
      requestNotification, findMessageByIdempotencyKey ni reportEmailBounce.
  - id: REV-SEC-RESOURCE-SCOPE
    scope: security.authentication.scoping
    verdict: ok
    note: >-
      El alcance que la prosa da por hecho («sus aplicaciones» en template-editor y
      application-operator) está declarado en authentication.scoping. Sale del claim applications sobre
      Application.code, con error APPLICATION_FORBIDDEN y exemptRoles [notifications-admin,
      notifications-auditor]. Cada operación con applicationCode lo aplica en sus rules; getMessage y
      listMessages acotan por la aplicación del mensaje. Las de application:manage y la purga solo las
      tiene notifications-admin, que está exento. En M2M, la aplicación sale de la credencial
      (callerIdentity: serviceClient). mail-provider reporta rebotes sobre cualquier mensaje, y es a
      propósito: no representa a ninguna aplicación (decisions.yaml § 3.4 reportEmailBounce).
  - id: REV-MSG-MISSING-CHANNEL
    scope: messaging
    verdict: ok
    note: >-
      Los dos eventos (EmailSent, EmailDeliveryFailed) declaran channel notificationEvents, y la
      suscripción NotificationRequested declara notificationRequests. Los dos canales son lógicos, propios
      y tienen description.
  - id: REV-MSG-IDENTITY-FROM-FIELD
    scope: messaging.subscriptions.NotificationRequested.identity
    verdict: accepted
    note: 'Aceptado por el diseñador manteniendo metadata.source, como fija el encargo. trustedPublishers se reescribió: pesa explícitamente la irreversibilidad (correo real con el remitente de otra aplicación) y declara que la ACL del broker sobre notificationRequests hace de scope equivalente a notification:send. Se pasa a location: header cuando publique un tercero o se pida no-repudio.'
  - id: REV-PERSIST-MISSING-INDEX
    scope: persistence.entities.EmailMessage.indexes
    verdict: fixed
    note: 'Corregido: añadidos [requestedAt] para listMessages sin filtros y [personalDataPurgedAt, requestedAt] para la purga, que ya no recorre lo purgado.'
  - id: REV-MAIL-SENTBY-NO-GUARD
    scope: mail.sentBy.sendQueuedMessage
    verdict: ok
    note: >-
      La única operación de sentBy es sendQueuedMessage, y declara la transición queued → sending como
      guarda, confirmada en su propia transacción antes de contactar con el relay (rules y decisions.yaml
      § 3.7). El bloqueo optimista (§ 3.9) deja ganar a un solo envío. Si el proceso cae entre el envío y
      el registro, el rescate lo pasa a failed con sending-timeout y no lo reenvía nunca: como mucho sale
      una vez. Que la guarda no se pueda observar por la API está aceptado en OBL-GUARD-UNOBSERVABLE.
  - id: REV-MAIL-TEMPLATE-ERRORS
    scope: use-cases.operations.requestNotification.errors
    verdict: ok
    note: >-
      La plantilla y las variables se validan al aceptar, en requestNotification. «No hay plantilla» es
      TEMPLATE_NOT_FOUND (422), «sin versión publicada» es TEMPLATE_NOT_PUBLISHED y «falta una variable
      required» es MISSING_TEMPLATE_VARIABLES, además de DUPLICATE_VARIABLE_VALUE. El envío posterior usa
      la versión congelada, que no se puede borrar, y el fallo de render tiene desenlace (failed con
      render-error).
  - id: REV-MAIL-ASYNC-OUTCOME
    scope: api.endpoints.requestNotification
    verdict: ok
    note: >-
      requestNotification responde 202 y deja el mensaje en queued. El envío que falla después tiene
      desenlace declarado: failed con un FailureReason estable (incluido sending-timeout, sin saber si
      salió), el evento EmailDeliveryFailed (best-effort, aceptado en decisions.yaml § 3.1) y la consulta
      findMessageByIdempotencyKey. Que dispatch-only no pueda consultar es una decisión de mínimo
      privilegio escrita en su description. La falta de marca temporal del fallo se trata en
      REV-DOMAIN-PROMISED-STATE.
  - id: REV-MAIL-BOUNCE-CHANNEL
    scope: use-cases.operations.reportEmailBounce
    verdict: fixed
    note: 'Corregido: todo correo sale con la cabecera X-Notification-Id con el id del mensaje (regla de sendQueuedMessage), que el adaptador del proveedor devuelve con el rebote. Y el rechazo síncrono definitivo del relay ahora también suprime la dirección vía suppressHardBouncedAddress.'
