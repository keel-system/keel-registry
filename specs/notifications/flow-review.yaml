findings:
  - flow: FL-SEC-001
    step: "Given / Then 1"
    kind: unfixed-given
    resolution: scenario
    sealAfter: af71d50be86ad0a70c1417223a787b222e3f8c43621d26a1c73f0299fc49e343
    artifact: security.cors
    evidence: >-
      El Given dice «la SPA de back-office corre en un origen web distinto» y el Then 1 afirma
      «Respuesta de preflight aceptada». security.cors no declara orígenes (docs/dsl/security.md
      § CORS: «Los orígenes permitidos no se declaran aquí», son configuración de despliegue), así
      que el preflight solo se acepta si el origen está en la lista configurada. El Given no lo
      fija: un origen distinto y no configurado recibe el preflight rechazado. FL-SEC-002 sí lo
      fija («la SPA en un origen web permitido»), lo que confirma que la condición importa.
    proposal: >-
      En el escenario: decir en el Given «la SPA corre en un origen web distinto y permitido (en la
      lista de orígenes configurada del despliegue de pruebas)», como FL-SEC-002. Opcionalmente,
      añadir un caso borde con un origen no permitido cuyo preflight se rechaza.
  - flow: FL-NTF-010
    step: "Then 8"
    kind: count
    resolution: scenario
    sealAfter: 32f0e86e72c6e40327fe6d39573a134371563209c9f4cc93c2afa9063e6df719
    artifact: validation-scenarios.md FL-NTF-010
    evidence: >-
      El Then 8 dice «Para cada una de las siete, findMessageByIdempotencyKey responde 404 y [...]
      el buzón no recibe ningún correo». Los Then 1–7 lanzan ocho peticiones rechazadas: el Then 7
      tiene dos variantes («topic-only sin variables → 422 EMPTY_RENDERED_SUBJECT; con variables:
      [ { name: topic, value: "   " } ] → 422 EMPTY_RENDERED_SUBJECT»), cada una con su propia
      idempotencyKey según el When. Quien traduzca el escenario puede comprobar siete claves y
      dejar sin verificar la variante de solo espacios.
    proposal: >-
      En el escenario: «Para cada una de las ocho peticiones rechazadas» (o «para cada petición de
      los pasos 1 a 7»).
