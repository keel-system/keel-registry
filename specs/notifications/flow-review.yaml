findings:
  - flow: FL-OBX-002
    step: "Given"
    kind: unreachable-given
    artifact: validation-scenarios.Preparaciones
    evidence: >-
      El Given pide «m1 ya sent con su EmailSent pendiente de salir» y no nombra ninguna
      preparación. Las convenciones dicen: «Cada flujo arranca desde el estado vacío y ejecuta por
      la API las preparaciones que su Given nombra». Desde el estado vacío no existe m1. Para que
      exista hace falta remitente (si no, requestNotification responde SENDER_SETTINGS_NOT_CONFIGURED),
      una plantilla con versión active y una petición aceptada que el despacho haya enviado. Los
      demás flujos que parten de un mensaje enviado (FL-BNC-001, FL-PRG-001) nombran P-TPL y R1. Este
      no nombra nada, así que su estado de partida no se puede construir tal como está escrito.
    proposal: >-
      Escribir el Given como en FL-OBX-001: «P-TPL; el canal de eventos indisponible; billing pide
      R1 → m1 y, tras un ciclo del despacho, m1 está sent con su EmailSent pendiente de salir».
    resolution: scenario
