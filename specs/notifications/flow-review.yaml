findings:
  - flow: FL-NTF-040
    step: "Then 2"
    kind: unobservable
    artifact: use-cases.requestNotification.rules
    evidence: >-
      El diseño ya declara la comprobación en lote (requestNotification.rules: «La comprobación de
      supresiones se hace para todos los destinatarios a la vez, no una consulta por
      destinatario»), así que la mitad de deducibilidad del hallazgo anterior está cerrada. Pero el
      Then 2 no ha cambiado: sigue afirmando que «el trabajo con 20 destinatarios no crece respecto
      al de 1» y que «cómo se mide es del generador». Una prueba de caja negra no ve cuántas
      consultas lanza el servidor, así que esa aserción sigue sin poder ejecutarse.
    proposal: >-
      Dejar en el flujo solo el Then 1 (las dos peticiones responden 202) y llevar la comprobación
      en lote a «Lo que no tiene escenario», como verificación estática de la rule. Otra opción es
      quitar el flujo y cubrir requestNotification con los demás.
    resolution: accepted
    reason: >-
      La afirmación de coste la exige docs/validation-scenarios.md para todo command con entrada por
      lotes (recipients, maxItems 20), escrita por forma y nunca por número; la medición es del
      generador, igual que en el resto del registry. La rule de requestNotification declara la
      comprobación en lote. Decidido por el diseñador.
  - flow: FL-EVT-003
    step: "Then 1"
    kind: unobservable
    artifact: messaging.subscriptions.NotificationRequested.onFailure.retry
    evidence: >-
      El Then afirma que el mensaje llega a la deadLetter «tras agotar los 3 intentos con espera
      creciente». Que acabe en la deadLetter se ve, y es lo que fija onFailure (deadLetter: true).
      Que hubo 3 intentos y que la espera entre ellos creció (backoff exponential, initialDelayMs
      1000) no se ve desde fuera: el almacén está caído y ningún efecto de los intentos llega a
      una superficie pública. Es la misma clase que el «sin reintentos» de FL-EVT-002, que se
      resolvió en el escenario en la pasada 1.
    proposal: >-
      Afirmar solo que, con el almacén caído, el mensaje acaba en la deadLetter. Si se quiere
      cubrir el número de intentos y el backoff, nombrar una señal observable del arnés o dejarlo
      como verificación estática de onFailure.retry.
    resolution: scenario

  - flow: FL-EVT-003
    step: "Then 1"
    kind: carried-state
    artifact: messaging.subscriptions.NotificationRequested.onFailure
    evidence: >-
      El Then 1 comprueba con findMessageByIdempotencyKey (404 MESSAGE_NOT_FOUND) que no existe
      ningún mensaje «agotados los reintentos». Según el When, el almacén sigue indisponible hasta
      después de agotarlos («se agotan los 3 intentos; se restablece el almacén y el mensaje se
      reinyecta»). findMessageByIdempotencyKey lee ese mismo almacén, así que en el instante que
      el Then nombra no puede responder 404: responde un error de infraestructura. El 404 solo se
      deduce entre el restablecimiento y la primera reinyección, y el escenario no sitúa ahí la
      consulta. El resto del flujo sí se deduce. Los intentos con el almacén caído no confirman nada
      ni marcan el eventId como procesado. La primera reinyección crea el mensaje, y la segunda se
      corta por metadata.eventId o, si no, por la clave natural (requestedBy, idempotencyKey):
      queda un solo mensaje y sale un solo correo.
    proposal: >-
      Decir que el 404 se comprueba «una vez restablecido el almacén y antes de reinyectar», o
      partir el When en dos y poner el Then 1 entre el restablecimiento y la reinyección.
    resolution: scenario
    sealAfter: ad83eb9eae9652ce6d763945a33d2ea25ffbeceeeeffec79c52e220ddd6f2ef8
