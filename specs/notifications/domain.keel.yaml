# Capa domain del servicio de notificaciones por correo.
types:
  EmailAddress:
    base: string
    description: Dirección de correo electrónico.
    constraints:
      pattern: "^[^@\\s]+@[^@\\s]+\\.[A-Za-z]{2,}$"
      maxLength: 254

  ApplicationCode:
    base: string
    description: Identificador estable y legible de una aplicación consumidora, usado en eventos y peticiones M2M.
    constraints:
      pattern: "^[a-z][a-z0-9-]{2,47}$"

  TemplateCode:
    base: string
    description: Identificador estable de una plantilla dentro de su aplicación; es lo que el consumidor nombra al pedir un envío.
    constraints:
      pattern: "^[a-z][a-z0-9-]{2,63}$"

  IdempotencyKey:
    base: string
    description: Clave con la que quien pide el envío distingue una petición nueva de un reintento de la misma.
    constraints:
      minLength: 8
      maxLength: 128

  ApplicationStatus:
    values: [active, suspended]

  TemplateVersionStatus:
    values: [active, archived]

  MessageStatus:
    values: [queued, sending, sent, failed]

  SuppressionReason:
    values: [hard-bounce, complaint, manual]

  SuppressionStatus:
    values: [active, released]

  TemplateVariable:
    description: Declaración de una variable que la plantilla espera recibir para poder renderizarse.
    fields:
      name:        { type: string, required: true, constraints: { pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,39}$" } }
      description: { type: string, constraints: { maxLength: 200 } }
      required:    { type: boolean, default: true }

  TemplateVariableValue:
    description: Valor concreto que el solicitante aporta para una variable declarada por la plantilla.
    fields:
      name:  { type: string, required: true, constraints: { pattern: "^[a-zA-Z][a-zA-Z0-9_]{0,39}$" } }
      value: { type: string, required: true, constraints: { maxLength: 2000 } }

entities:

  Application:
    description: >-
      Aplicación o servidor autorizado a pedir envíos. Posee sus propias plantillas y aporta el
      remitente verificado desde el que salen sus correos.
    fields:
      id:            { type: uuid, id: true, generated: true }
      code:          { type: ApplicationCode, required: true, unique: true }
      name:          { type: string, required: true, constraints: { maxLength: 120 } }
      senderAddress:
        type: EmailAddress
        required: true
        description: Dirección remitente verificada ante el proveedor de correo desde la que salen los mensajes de esta aplicación.
      senderName:
        type: string
        description: Nombre visible que acompaña al remitente en el cliente de correo del destinatario.
        constraints: { maxLength: 80 }
      replyToAddress:
        type: EmailAddress
        description: Dirección a la que responde el destinatario, si es distinta del remitente.
      status:        { type: ApplicationStatus, default: active }
    lifecycle:
      field: status
      transitions:
        active:    [suspended]
        suspended: [active]
    invariants:
      - Una aplicación suspended no puede originar nuevos envíos.
      - El código de una aplicación no cambia una vez registrada.

  EmailTemplate:
    description: >-
      Plantilla de correo de una aplicación, identificada por su código. Es el contenedor estable:
      el contenido concreto vive en sus versiones.
    fields:
      id:            { type: uuid, id: true, generated: true }
      code:          { type: TemplateCode, required: true }
      name:          { type: string, required: true, constraints: { maxLength: 120 } }
      description:   { type: string, constraints: { maxLength: 500 } }
      hasActiveVersion:
        type: boolean
        computed: >-
          Es cierto si alguna de las versiones de la plantilla está en estado active; una plantilla
          retirada lo tiene falso. Se guarda, y se recalcula dentro de la MISMA transacción que
          publishTemplateVersion, activateTemplateVersion y retireTemplate — las tres únicas vías que
          cambian el estado de una versión, y las tres dentro del agregado Application, así que nunca
          puede quedar rancio. No se calcula al leer: listTemplates filtra por él y ese filtro se
          apoya en un índice.
        description: Distingue una plantilla en circulación de una retirada, sin duplicar el estado que ya viven las versiones.
    relations:
      application:  { entity: Application, cardinality: many-to-one }
      versions:     { entity: EmailTemplateVersion, cardinality: one-to-many }
    invariants:
      - El código de una plantilla es único dentro de su aplicación.
      - Una plantilla tiene como mucho una versión en estado active.
      - Una plantilla sin ninguna versión active no puede usarse para enviar.

  EmailTemplateVersion:
    description: >-
      Contenido concreto e inmutable de una plantilla en un momento dado. Publicar contenido nuevo
      crea una versión nueva; la anterior queda archivada y sigue siendo consultable.
    fields:
      id:            { type: uuid, id: true, generated: true }
      versionNumber:
        type: int
        required: true
        computed: Es el mayor versionNumber existente en la plantilla más uno, empezando en 1; nunca lo envía el cliente ni se reutiliza.
        description: Número correlativo dentro de la plantilla, empezando en 1.
        constraints: { min: 1 }
      subject:
        type: string
        required: true
        description: Asunto del correo, con las mismas variables que el cuerpo.
        constraints: { maxLength: 300 }
      htmlBody:
        type: text
        required: true
        description: >-
          Cuerpo HTML de la plantilla. La cota deja sitio de sobra a una plantilla transaccional con
          estilos en línea y se queda muy por debajo del tamaño a partir del cual los clientes de
          correo recortan el HTML al mostrarlo.
        constraints: { maxLength: 262144 }
      textBody:
        type: text
        required: true
        description: Alternativa en texto plano del mismo mensaje; sin ella los filtros antispam desconfían del HTML.
        constraints: { maxLength: 65536 }
      variables:
        type: TemplateVariable
        list: true
        description: Variables que esta versión declara y contra las que se valida toda petición de envío antes de renderizar.
        constraints: { maxItems: 50 }
      status:        { type: TemplateVersionStatus, default: active }
    relations:
      template:     { entity: EmailTemplate, cardinality: many-to-one }
    lifecycle:
      field: status
      transitions:
        active:   [archived]
        archived: [active]
    invariants:
      - El contenido de una versión (asunto, cuerpos y variables declaradas) no se modifica una vez creada.
      - El número de versión es único dentro de su plantilla y nunca se reutiliza.
      - Toda variable referenciada en el asunto o en los cuerpos está declarada en variables.

  EmailMessage:
    description: >-
      Registro de un correo que el servicio ha aceptado emitir, con el resultado de su envío.
      Es la unidad de trazabilidad y la guarda contra repeticiones.
    fields:
      id:              { type: uuid, id: true, generated: true }
      idempotencyKey:
        type: IdempotencyKey
        required: true
        description: Clave aportada por el solicitante; una repetición con la misma clave devuelve este mismo registro sin volver a enviar.
      recipients:
        type: EmailAddress
        list: true
        description: Destinatarios directos del mensaje, deduplicados al aceptar la petición. Queda vacío tras la purga de datos personales.
        constraints: { maxItems: 20 }
      renderedSubject:
        type: string
        computed: Se obtiene renderizando el asunto de la versión de plantilla con las variables de la petición, en el momento de aceptarla.
        description: Asunto ya resuelto, tal como lo recibió el destinatario. Queda vacío tras la purga de datos personales.
        constraints: { maxLength: 300 }
      variableValues:
        type: TemplateVariableValue
        list: true
        sensitive: true
        description: Valores aportados para renderizar; pueden contener datos personales, así que no salen en ninguna respuesta y se borran en la purga.
        constraints: { maxItems: 50 }
      senderAddress:
        type: EmailAddress
        required: true
        computed: Se copia de Application.senderAddress al aceptar la petición, para que un cambio posterior no reescriba el histórico.
      senderName:
        type: string
        computed: >-
          Se copia de Application.senderName al aceptar la petición, por el mismo motivo que
          senderAddress. Las dos mitades del remitente se congelan JUNTAS: componer el From con
          la dirección de entonces y el nombre de ahora produce una cabecera que nunca existió,
          y el registro dejaría de decir qué leyó el destinatario. Si la aplicación no declara
          nombre visible, queda vacío y el correo sale solo con la dirección.
        description: Nombre visible que acompañó al remitente, tal como salió en el correo.
        constraints: { maxLength: 80 }
      templateCode:
        type: TemplateCode
        required: true
        computed: Se copia del código de la plantilla resuelta al aceptar la petición.
      templateVersionNumber:
        type: int
        required: true
        computed: Se copia del versionNumber de la versión activa resuelta al aceptar la petición.
        constraints: { min: 1 }
      templateVersionId:
        type: uuid
        required: true
        computed: Se copia del id de la versión activa resuelta al aceptar la petición; apunta al agregado Application y se referencia por id.
      status:          { type: MessageStatus, default: queued }
      failureReason:
        type: string
        generated: true
        description: Motivo por el que el envío no pudo completarse, tal como lo reportó el relay, o el motivo del rescate si el envío se quedó atascado.
        constraints: { maxLength: 500 }
      requestedAt:
        type: timestamp
        generated: true
        description: Momento en que el servicio aceptó la petición de envío.
      sendingSince:
        type: timestamp
        generated: true
        description: >-
          Momento en que el mensaje pasó a sending, es decir en que un ciclo de despacho lo tomó.
          Es la marca que el rescate mira para decidir si lleva demasiado tiempo atascado; sin ella
          no hay ningún dato observable que distinga «lo acaban de tomar» de «el proceso que lo tomó
          murió hace media hora», y el rescate no tendría criterio. Queda vacío mientras el mensaje
          está en queued y se conserva después, como huella de cuándo se intentó.
      sentAt:
        type: timestamp
        generated: true
        description: Momento en que el relay aceptó el mensaje para su entrega.
      personalDataPurgedAt:
        type: timestamp
        generated: true
        description: Momento en que se borraron los datos personales del mensaje conservando la fila y su clave de idempotencia.
    relations:
      application:     { entity: Application, cardinality: many-to-one }
    lifecycle:
      field: status
      transitions:
        queued:  [sending]
        sending: [sent, failed]
        sent:    []
        failed:  []
    invariants:
      - La pareja de aplicación y clave de idempotencia es única en todo el servicio, y se conserva aunque se purguen los datos personales del mensaje.
      - Un mensaje sin personalDataPurgedAt tiene siempre recipients y renderedSubject informados; tras la purga los dos quedan vacíos y la fila se conserva.
      - Un mensaje sent tiene siempre sentAt informado.
      - Un mensaje failed tiene siempre failureReason informado.
      - Un mensaje que ha salido alguna vez de queued tiene siempre sendingSince informado, y un mensaje en queued nunca lo tiene.
      - La versión de plantilla de un mensaje no cambia aunque después se publique una versión nueva.

  SuppressedAddress:
    description: >-
      Dirección a la que esta aplicación no debe volver a escribir. La reputación del remitente es
      compartida por todos los consumidores del servicio, así que insistir sobre una dirección que
      rebotó duro perjudica a los envíos de todos los demás. Liberarla no borra el registro: lo
      conserva para auditoría y para poder reactivarlo si la dirección vuelve a rebotar.
    fields:
      id:      { type: uuid, id: true, generated: true }
      address: { type: EmailAddress, required: true }
      reason:  { type: SuppressionReason, required: true }
      notes:
        type: string
        description: Detalle del rebote o de la queja, tal como lo reportó el relay, o el motivo de la supresión manual.
        constraints: { maxLength: 500 }
      status:       { type: SuppressionStatus, default: active }
      suppressedAt: { type: timestamp, generated: true }
      releasedAt:
        type: timestamp
        generated: true
        description: Momento en que se liberó la dirección; vacío mientras la supresión sigue vigente.
    relations:
      application: { entity: Application, cardinality: many-to-one }
    lifecycle:
      field: status
      transitions:
        active:   [released]
        released: [active]
    invariants:
      - La pareja de aplicación y dirección es única en todo el servicio para siempre; liberar no abre hueco para un segundo registro, y una dirección liberada que vuelve a rebotar reactiva el mismo registro en vez de crear otro.
      - Un registro released tiene releasedAt informado; uno active no.
      - La supresión vale solo dentro de su aplicación y no es global, así que una dirección que rebotó para una aplicación puede seguir siendo válida para otra.

aggregates:
  Application:
    description: La aplicación posee sus plantillas y el contenido de cada versión; publicar una versión nueva archiva la anterior en la misma transacción.
    root: Application
    entities: [EmailTemplate, EmailTemplateVersion]

  EmailMessage:
    description: Cada mensaje es su propia frontera; referencia a la aplicación y a la versión de plantilla por id.
    root: EmailMessage
    entities: []

  SuppressedAddress:
    description: >-
      Frontera propia: se escribe desde el desenlace de un envío, que es otra transacción que la del
      agregado Application, y se consulta al aceptar cada petición.
    root: SuppressedAddress
    entities: []
