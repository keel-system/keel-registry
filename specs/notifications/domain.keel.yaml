# Capa domain — modelado del dominio: value types, entidades, relaciones, ciclo de vida e invariantes.
# Cero tecnología: nada de tablas, ORMs ni frameworks.

types:
  ApplicationCode:
    base: string
    description: "Código estable de una aplicación consumidora. Es su identidad ante el servicio: coincide con su cliente máquina y con el source de sus eventos."
    constraints: { pattern: "^[a-z][a-z0-9-]{2,47}$" }

  TemplateCode:
    base: string
    description: "Código estable de una plantilla, único dentro de su aplicación. Es el que usan las aplicaciones al pedir un envío."
    constraints: { pattern: "^[a-z][a-z0-9-]{2,47}$" }

  EmailAddress:
    base: string
    description: "Dirección de correo. Se normaliza a minúsculas antes de guardarla, compararla o deduplicarla."
    constraints: { maxLength: 254, pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$" }

  IdempotencyKey:
    base: string
    description: "Clave con la que la aplicación identifica un envío. Viaja en la ruta de consulta M2M, así que solo admite caracteres seguros en una URL."
    constraints: { pattern: "^[A-Za-z0-9._:-]{8,128}$" }

  VariableName:
    base: string
    description: "Nombre de una variable de plantilla, tal como se escribe en el asunto y los cuerpos."
    constraints: { pattern: "^[A-Za-z][A-Za-z0-9_]{0,63}$" }

  ApplicationStatus:
    description: "Situación operativa de una aplicación consumidora."
    values: [active, suspended]

  TemplateVersionStatus:
    description: "Situación de una versión de plantilla: como mucho una active por plantilla."
    values: [active, archived]

  MessageStatus:
    description: "Situación de un correo pedido. sent y failed son terminales."
    values: [queued, sending, sent, failed]

  FailureReason:
    description: "Motivo estable por el que un correo terminó en failed. Es contrato: viaja en EmailDeliveryFailed."
    values:
      - delivery-rejected       # el relay rechazó el mensaje de forma definitiva
      - delivery-error          # el envío al relay falló (conexión, timeout, error transitorio): el servicio no reintenta
      - render-error            # el cuerpo no se pudo renderizar con la versión congelada
      - application-suspended   # la aplicación se suspendió entre la aceptación y el envío
      - recipient-suppressed    # algún destinatario quedó suprimido entre la aceptación y el envío
      - sending-timeout         # rescate: llevaba demasiado tiempo en sending y nunca se reenvía

  SuppressionStatus:
    description: "Situación de una supresión."
    values: [active, released]

  SuppressionReason:
    description: "Por qué se suprimió la dirección."
    values: [hard-bounce, complaint, manual]

  TemplateVariable:
    description: "Variable declarada por una versión de plantilla."
    fields:
      name:        { type: VariableName, required: true, description: "Nombre con el que se usa en el asunto y los cuerpos." }
      description: { type: string, required: true, description: "Qué dato espera la plantilla en esta variable.", constraints: { minLength: 1, maxLength: 500 } }
      required:    { type: boolean, required: true, description: "Si la petición de envío tiene que traer esta variable." }

  VariableValue:
    description: "Valor de una variable en una petición de envío."
    fields:
      name:  { type: VariableName, required: true, description: "Variable a la que da valor." }
      value: { type: string, required: true, description: "Valor en texto plano; el motor lo escapa al renderizar, nunca lo evalúa.", constraints: { maxLength: 2000 } }

  SenderSnapshot:
    description: "Remitente y respuesta de la aplicación, congelados al aceptar la petición: el correo sale con esto aunque la aplicación cambie después."
    fields:
      address:        { type: EmailAddress, required: true, description: "Dirección From, copia de Application.senderAddress." }
      name:           { type: string, description: "Nombre visible del From, copia de Application.senderName.", constraints: { maxLength: 100 } }
      replyToAddress: { type: EmailAddress, description: "Dirección Reply-To, copia de Application.replyToAddress." }

entities:
  Application:
    description: "Aplicación consumidora (billing, shipping, …) en cuyo nombre se envían correos. Es dueña de sus plantillas."
    fields:
      id:             { type: uuid, id: true, generated: true }
      code:           { type: ApplicationCode, required: true, unique: true, description: "Código estable; no cambia nunca tras el alta." }
      name:           { type: string, required: true, description: "Nombre legible de la aplicación.", constraints: { minLength: 1, maxLength: 120 } }
      senderAddress:  { type: EmailAddress, required: true, description: "Remitente verificado ante el proveedor de correo. El servicio no lo verifica: lo declara quien registra la aplicación." }
      senderName:     { type: string, description: "Nombre visible del remitente.", constraints: { maxLength: 100 } }
      replyToAddress: { type: EmailAddress, description: "Dirección a la que responden los destinatarios; sin ella el correo no lleva Reply-To." }
      status:         { type: ApplicationStatus, required: true, default: active, description: "Una aplicación suspended no origina envíos." }
      createdAt:      { type: timestamp, generated: true }
      updatedAt:      { type: timestamp, generated: true }
      createdBy:      { type: string, generated: true }
      updatedBy:      { type: string, generated: true }
    relations:
      templates: { entity: EmailTemplate, cardinality: one-to-many, description: "Plantillas de la aplicación." }
    lifecycle:
      field: status
      transitions:
        active:    [suspended]
        suspended: [active]
    invariants:
      - El code de una aplicación no cambia nunca después del alta.
      - Una aplicación suspended no acepta peticiones de envío nuevas (salvo la repetición de una ya aceptada).

  EmailTemplate:
    description: "Plantilla de correo de una aplicación, identificada por su code. Su contenido vive en versiones inmutables."
    fields:
      id:               { type: uuid, id: true, generated: true }
      code:             { type: TemplateCode, required: true, description: "Único dentro de la aplicación; no cambia nunca." }
      name:             { type: string, required: true, description: "Nombre legible de la plantilla.", constraints: { minLength: 1, maxLength: 120 } }
      description:      { type: string, description: "Para qué sirve la plantilla.", constraints: { maxLength: 1000 } }
      hasActiveVersion: { type: boolean, computed: "true si y solo si la plantilla tiene una versión en estado active. Se persiste y se recalcula en la misma transacción que publishTemplateVersion, activateTemplateVersion y retireTemplate." }
      createdAt:      { type: timestamp, generated: true }
      updatedAt:      { type: timestamp, generated: true }
      createdBy:      { type: string, generated: true }
      updatedBy:      { type: string, generated: true }
    relations:
      application: { entity: Application, cardinality: many-to-one, required: true, description: "Aplicación dueña de la plantilla." }
      versions:    { entity: EmailTemplateVersion, cardinality: one-to-many, description: "Historial de versiones; nunca se borra." }
    invariants:
      - El code de una plantilla es único dentro de su aplicación y no cambia nunca.
      - Una plantilla tiene como mucho una versión en estado active.
      - hasActiveVersion es true si y solo si existe una versión active.

  EmailTemplateVersion:
    description: "Contenido publicado de una plantilla. Inmutable: publicar es crear una versión nueva."
    fields:
      id:            { type: uuid, id: true, generated: true }
      versionNumber: { type: int, required: true, description: "Correlativo desde 1 dentro de la plantilla; nunca se reutiliza.", constraints: { min: 1 } }
      subject:       { type: string, required: true, description: "Plantilla del asunto.", constraints: { minLength: 1, maxLength: 300 } }
      htmlBody:      { type: text, required: true, description: "Plantilla del cuerpo HTML.", constraints: { minLength: 1, maxLength: 262144 } }
      textBody:      { type: text, required: true, description: "Plantilla del cuerpo de texto plano, alternativa obligatoria al HTML.", constraints: { minLength: 1, maxLength: 65536 } }
      variables:     { type: TemplateVariable, list: true, description: "Variables que la versión declara.", constraints: { maxItems: 50 } }
      status:        { type: TemplateVersionStatus, required: true, default: active, description: "Solo la versión active se usa en envíos nuevos." }
      publishedAt:   { type: timestamp, generated: true, description: "Cuándo se publicó la versión." }
      createdAt:      { type: timestamp, generated: true }
      updatedAt:      { type: timestamp, generated: true }
      createdBy:      { type: string, generated: true }
      updatedBy:      { type: string, generated: true }
    relations:
      template: { entity: EmailTemplate, cardinality: many-to-one, required: true, description: "Plantilla a la que pertenece." }
    lifecycle:
      field: status
      transitions:
        active:   [archived]
        archived: [active]
    invariants:
      - Una versión no cambia de contenido (subject, htmlBody, textBody, variables) después de creada.
      - El versionNumber de una versión nueva es el mayor de su plantilla más uno, empezando en 1.
      - Los nombres de variables declaradas son únicos dentro de la versión.
      - Toda variable usada en subject, htmlBody o textBody está declarada en variables.

  EmailMessage:
    description: "Un correo pedido por una aplicación: lo que se aceptó, con qué se va a enviar y cómo terminó."
    fields:
      id:                    { type: uuid, id: true, generated: true }
      idempotencyKey:        { type: IdempotencyKey, required: true, description: "Clave de la aplicación; única para siempre dentro de ella." }
      recipients:            { type: EmailAddress, list: true, description: "Destinatarios en minúsculas y sin duplicados. Vacío solo tras la purga de datos personales.", constraints: { maxItems: 20 } }
      renderedSubject:       { type: string, description: "Asunto ya renderizado al aceptar. Nulo solo tras la purga.", constraints: { maxLength: 998 } }
      variableValues:        { type: VariableValue, list: true, sensitive: true, description: "Valores de las variables declaradas por la versión congelada; las no declaradas se descartaron al aceptar. Vacío tras la purga.", constraints: { maxItems: 50 } }
      contentFingerprint:    { type: string, sensitive: true, computed: "SHA-256 en hexadecimal minúsculo del JSON canónico {\"templateCode\": …, \"recipients\": […], \"variables\": [{\"name\": …, \"value\": …}, …]}: recipients normalizados a minúsculas, deduplicados y ordenados ascendentemente; variables solo las declaradas por la versión congelada, ordenadas por name; claves en ese orden, sin espacios, UTF-8. La purga no la toca: permite comparar una repetición de la clave para siempre sin guardar datos personales en claro. Es interna: no sale en ninguna respuesta ni evento." }
      sender:                { type: SenderSnapshot, required: true, description: "Remitente y Reply-To congelados al aceptar." }
      templateCode:          { type: TemplateCode, required: true, description: "Code de la plantilla pedida, congelado." }
      templateVersionNumber: { type: int, required: true, description: "Versión con la que se renderiza, congelada al aceptar.", constraints: { min: 1 } }
      templateVersionId:     { type: uuid, required: true, description: "Id de esa versión, congelado al aceptar. No es una relación: la versión vive dentro del agregado Application." }
      status:                { type: MessageStatus, required: true, default: queued, description: "Situación del envío." }
      failureReason:         { type: FailureReason, description: "Por qué terminó en failed." }
      failedAt:              { type: timestamp, description: "Cuándo el mensaje pasó a failed." }
      failureDetail:         { type: string, description: "Diagnóstico legible del fallo (respuesta del relay, error de render). No es contrato estable.", constraints: { maxLength: 1000 } }
      requestedAt:           { type: timestamp, generated: true, description: "Cuándo se aceptó la petición." }
      sendingSince:          { type: timestamp, description: "Cuándo salió de queued. Lo usa el rescate de dispatchQueuedMessages." }
      sentAt:                { type: timestamp, description: "Cuándo el relay aceptó el mensaje." }
      personalDataPurgedAt:  { type: timestamp, description: "Cuándo se vaciaron recipients, renderedSubject y variableValues." }
    relations:
      application: { entity: Application, cardinality: many-to-one, required: true, description: "Aplicación que pidió el envío." }
    lifecycle:
      field: status
      transitions:
        queued:  [sending]
        sending: [sent, failed]
        sent:    []
        failed:  []
    invariants:
      - El par (application, idempotencyKey) es único para siempre, también después de la purga.
      - Un mensaje en estado sent tiene sentAt.
      - Un mensaje en estado failed tiene failureReason y failedAt.
      - Un mensaje que salió de queued tiene sendingSince.
      - Mientras personalDataPurgedAt es nulo, recipients tiene entre 1 y 20 direcciones y renderedSubject tiene valor.
      - Con personalDataPurgedAt, recipients y variableValues están vacíos y renderedSubject es nulo; contentFingerprint se conserva.
      - sender, templateCode, templateVersionNumber, templateVersionId, contentFingerprint e idempotencyKey no cambian después de aceptar la petición.

  SuppressedAddress:
    description: "Dirección a la que una aplicación no puede enviar. La supresión es por aplicación, no global."
    fields:
      id:           { type: uuid, id: true, generated: true }
      address:      { type: EmailAddress, required: true, description: "Dirección suprimida, en minúsculas." }
      reason:       { type: SuppressionReason, required: true, description: "Motivo de la última supresión." }
      notes:        { type: string, description: "Nota libre de quien suprime o del rebote.", constraints: { maxLength: 1000 } }
      status:       { type: SuppressionStatus, required: true, default: active, description: "Solo una supresión active bloquea envíos." }
      suppressedAt: { type: timestamp, required: true, description: "Cuándo se suprimió (o reactivó) por última vez." }
      releasedAt:   { type: timestamp, description: "Cuándo se liberó por última vez; nulo mientras está active." }
      createdAt:      { type: timestamp, generated: true }
      updatedAt:      { type: timestamp, generated: true }
      createdBy:      { type: string, generated: true }
      updatedBy:      { type: string, generated: true }
    relations:
      application: { entity: Application, cardinality: many-to-one, required: true, description: "Aplicación a la que aplica la supresión." }
    lifecycle:
      field: status
      transitions:
        active:   [released, active]    # active → active: volver a suprimir es un no-op idempotente
        released: [active]
    invariants:
      - El par (application, address) es único para siempre; liberar conserva el registro y suprimir de nuevo lo reactiva.
      - Una supresión active tiene releasedAt nulo; una released tiene releasedAt.
      - Al reactivarse, reason, notes y suppressedAt toman los valores de la nueva supresión.

aggregates:
  Application:
    description: "La aplicación es dueña de sus plantillas y sus versiones: publicar, activar y retirar cambian a la vez la versión y el hasActiveVersion de la plantilla."
    root: Application
    entities: [EmailTemplate, EmailTemplateVersion]
  EmailMessage:
    description: "Cada correo pedido es su propia frontera; referencia a la aplicación por id y congela lo que necesita de la plantilla."
    root: EmailMessage
  SuppressedAddress:
    description: "Cada supresión es su propia frontera; referencia a la aplicación por id."
    root: SuppressedAddress
