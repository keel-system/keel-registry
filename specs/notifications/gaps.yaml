  - class: 9
    units: [configureSenderSettings, getSenderSettings, createTemplate, publishTemplateVersion, activateTemplateVersion, retireTemplate, getTemplate, listTemplates, getTemplateVersion, listTemplateVersions, requestNotification, dispatchQueuedMessages, sendQueuedMessage, getMessage, listMessages, findMessageByIdempotencyKey, suppressAddress, releaseAddress, listSuppressedAddresses, getSuppressedAddress, reportEmailBounce, purgeMessagePersonalData]
    result: findings
  - class: 11
