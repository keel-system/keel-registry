    result: findings
  - class: 3
    units: [SenderSettings, EmailTemplate, EmailTemplateVersion, EmailMessage, SuppressedAddress]
    result: findings
  - class: 4
    units: [configureSenderSettings, createTemplate, publishTemplateVersion, activateTemplateVersion, retireTemplate, requestNotification, dispatchQueuedMessages, sendQueuedMessage, suppressAddress, releaseAddress, reportEmailBounce, purgeMessagePersonalData]
    result: findings
  - class: 5
    units: [getSenderSettings, getTemplate, listTemplates, getTemplateVersion, listTemplateVersions, getMessage, listMessages, findMessageByIdempotencyKey, listSuppressedAddresses, getSuppressedAddress]
