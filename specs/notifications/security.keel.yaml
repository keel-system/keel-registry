# Capa security — autenticación y autorización.
# Agnóstica del proveedor: se declara el protocolo, nunca el producto.
# Dos públicos: personas del back-office (token de usuario, acotado por el claim applications)
# y servidores (client_credentials, uno por aplicación consumidora más el proveedor de correo).

authentication:
  protocol: oidc
  tokenLocation: header
  callerIdentity:
    field: callerApplicationCode
    from: { source: serviceClient }
    description: "La aplicación que pide o consulta un envío es la que representa su cliente máquina: el nombre del cliente es el code de la aplicación (1:1)."
  scoping:
    claim: applications
    over: Application.code
    error: APPLICATION_FORBIDDEN
    exemptRoles: [notifications-admin, notifications-auditor]
    description: "Las personas del back-office solo alcanzan las aplicaciones de su claim applications; administración y auditoría son transversales."
  serviceAuth:
    protocol: client-credentials
    validateAudience: true
    audience: notifications
    description: "Los servidores se autentican con client_credentials y el token tiene que estar emitido para esta audiencia."

roles:
  notifications-admin:   { description: "Gobierna todo el servicio: aplicaciones, plantillas, supresiones, correos y purga." }
  template-editor:       { description: "Mantiene las plantillas de sus aplicaciones. No lee correos." }
  application-operator:  { description: "Opera sus aplicaciones: lee sus correos y gestiona sus supresiones. Acotado por el claim applications." }
  notifications-auditor: { description: "Solo lectura de todo el servicio, sin acotar." }

permissions:
  application:manage:  { description: "Dar de alta, modificar, suspender y reactivar aplicaciones." }
  application:read:    { description: "Leer aplicaciones." }
  template:write:      { description: "Crear plantillas, publicar, activar y retirar versiones." }
  template:read:       { description: "Leer plantillas y versiones." }
  message:read:        { description: "Leer correos desde el back-office." }
  suppression:write:   { description: "Suprimir y liberar direcciones." }
  suppression:read:    { description: "Leer las direcciones suprimidas." }
  personal-data:purge: { description: "Lanzar a mano la purga de datos personales." }
  notification:send:   { description: "Pedir envíos de correo (M2M)." }
  notification:read:   { description: "Consultar los envíos propios por su clave (M2M)." }
  bounce:report:       { description: "Reportar rebotes de correo (M2M)." }

roleGrants:
  notifications-admin:
    - application:manage
    - application:read
    - template:write
    - template:read
    - message:read
    - suppression:write
    - suppression:read
    - personal-data:purge
  template-editor:       [application:read, template:write, template:read]
  application-operator:  [application:read, template:read, message:read, suppression:write, suppression:read]
  notifications-auditor: [application:read, template:read, message:read, suppression:read]

serviceClients:
  billing:       { description: "Aplicación de facturación: pide envíos y consulta los suyos.", scopes: [notification:send, notification:read] }
  shipping:      { description: "Aplicación de envíos logísticos: pide envíos y consulta los suyos.", scopes: [notification:send, notification:read] }
  dispatch-only: { description: "Aplicación que solo pide envíos; no consulta su estado (mínimo privilegio).", scopes: [notification:send] }
  mail-provider: { description: "Proveedor de correo: reporta rebotes. No representa a ninguna aplicación.", scopes: [bounce:report] }

access:
  default: { level: admin, roles: [notifications-admin] }
  rules:
    registerApplication:      { level: required, permissions: [application:manage] }
    updateApplication:        { level: required, permissions: [application:manage] }
    suspendApplication:       { level: required, permissions: [application:manage] }
    reactivateApplication:    { level: required, permissions: [application:manage] }
    getApplication:           { level: required, permissions: [application:read] }
    listApplications:         { level: required, permissions: [application:read] }

    createTemplate:           { level: required, permissions: [template:write] }
    publishTemplateVersion:   { level: required, permissions: [template:write] }
    activateTemplateVersion:  { level: required, permissions: [template:write] }
    updateTemplate:           { level: required, permissions: [template:write] }
    retireTemplate:           { level: required, permissions: [template:write] }
    getTemplate:              { level: required, permissions: [template:read] }
    listTemplates:            { level: required, permissions: [template:read] }
    getTemplateVersion:       { level: required, permissions: [template:read] }
    listTemplateVersions:     { level: required, permissions: [template:read] }

    getMessage:               { level: required, permissions: [message:read] }
    listMessages:             { level: required, permissions: [message:read] }
    purgeMessagePersonalData: { level: required, permissions: [personal-data:purge] }

    suppressAddress:          { level: required, permissions: [suppression:write] }
    releaseAddress:           { level: required, permissions: [suppression:write] }
    listSuppressedAddresses:  { level: required, permissions: [suppression:read] }

    requestNotification:         { level: service, scopes: [notification:send] }
    findMessageByIdempotencyKey: { level: service, scopes: [notification:read] }
    reportEmailBounce:           { level: service, scopes: [bounce:report] }

cors:
  description: "La SPA de back-office llama a la API directamente desde el navegador, con el token de usuario en la cabecera Authorization."
  allowCredentials: false
  allowedHeaders: [Authorization, Content-Type, Idempotency-Key, X-Correlation-Id]
  exposedHeaders: [X-Correlation-Id]
  maxAgeSeconds: 3600
