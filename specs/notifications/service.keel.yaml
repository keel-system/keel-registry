# Manifiesto del servicio — punto de entrada del diseño.
# Declara la identidad del servicio y qué capas de diseño existen.
# Regla: una capa opcional existe si y solo si está declarada aquí (y su archivo existe).
keel: "2.18"

service:
  name: notifications
  version: 0.1.2
  # keel validate trata cualquier description que empiece por "TODO" como placeholder pendiente.
  description: "Envía correo transaccional en nombre de varias aplicaciones consumidoras a partir de plantillas que mantiene negocio sin desplegar: acepta peticiones por HTTP servidor-a-servidor y por eventos con el mismo contrato, garantiza que la misma petición nunca produce dos correos, respeta las supresiones por aplicación y publica el desenlace terminal de cada envío."
  domain: communications
  # basedOn: billing@1.2.0         # linaje: diseño@versión del que se derivó (lo escribe `keel new --from`)

parameters:
  sendingTimeoutMinutes:
    type: int
    description: "Minutos que un mensaje puede llevar en sending (desde sendingSince) antes de que el rescate de dispatchQueuedMessages lo dé por failed con sending-timeout, sin reenviarlo jamás."
    constraints: { min: 1 }
    default: 15
    testValue: 15
    requiredInProduction: false
  personalDataRetentionMonths:
    type: int
    description: "Meses de calendario (en UTC) que se conservan los datos personales de un mensaje terminado antes de que purgeMessagePersonalData los vacíe. Con 0, todo mensaje terminado es purgable: es el valor de prueba que hace verificable la purga."
    constraints: { min: 0 }
    default: 18
    testValue: 0
    requiredInProduction: false

conventions:
  nulls: include     # un campo sin valor viaja como null, en respuestas y en eventos

layers:
  domain: domain.keel.yaml         # obligatoria
  use-cases: use-cases.keel.yaml   # obligatoria
  # Descomenta las capas que apliquen y crea el archivo desde templates/service/:
  api: api.keel.yaml
  security: security.keel.yaml
  messaging: messaging.keel.yaml
  # http-clients: http-clients.keel.yaml
  # dependencies: dependencies.keel.yaml
  persistence: persistence.keel.yaml
  # storage: storage.keel.yaml
  mail: mail.keel.yaml
