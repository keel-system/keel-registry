asyncapi: 3.0.0
info:
  title: notifications
  version: 1.5.0
  description: 'Emite el correo transaccional de notificación de las aplicaciones consumidoras, a partir
    de plantillas versionadas que gestiona negocio, aceptando peticiones por evento y por contrato servidor-a-servidor.


    Contrato asincrono derivado del diseno Keel (capa messaging). El broker concreto y los nombres fisicos
    de topic/cola se deciden al generar, no aqui.


    Publicacion `best-effort`: los eventos de salida son informativos y pueden perderse aunque el correo
    si haya salido. La fuente de verdad del desenlace es la API (`findMessageByIdempotencyKey`, `listMessages`),
    nunca estos eventos.'
defaultContentType: application/json
channels:
  notificationRequests:
    address: notificationRequests
    title: notificationRequests
    description: 'Canal propio por el que cualquier servidor registrado encarga un envío de correo. El
      contrato del mensaje lo posee este servicio, no los emisores. Nombre logico: el topic/cola fisico
      que lo respalda es parametro de despliegue.'
    messages:
      NotificationRequested:
        $ref: '#/components/messages/NotificationRequested'
  notificationEvents:
    address: notificationEvents
    title: notificationEvents
    description: 'Desenlace de los correos que este servicio emite, para quien quiera reaccionar sin sondear.
      Nombre logico: el topic/cola fisico que lo respalda es parametro de despliegue.'
    messages:
      EmailSent:
        $ref: '#/components/messages/EmailSent'
      EmailDeliveryFailed:
        $ref: '#/components/messages/EmailDeliveryFailed'
operations:
  publishEmailSent:
    action: send
    channel:
      $ref: '#/channels/notificationEvents'
    summary: 'El relay aceptó el mensaje para su entrega. Es informativo y NO es fuente de verdad: con
      reliability best-effort este evento puede perderse aunque el correo sí haya salido, así que quien
      necesite cert'
    messages:
    - $ref: '#/channels/notificationEvents/messages/EmailSent'
    x-keel-reliability: best-effort
    x-keel-emitted-by:
    - sendQueuedMessage
  publishEmailDeliveryFailed:
    action: send
    channel:
      $ref: '#/channels/notificationEvents'
    summary: 'El relay rechazó el mensaje o no respondió. El fallo es TERMINAL por diseño: este servicio
      no reintenta, así que quien quiera recuperar el aviso debe volver a pedirlo con otra clave de idempotencia.
      C'
    messages:
    - $ref: '#/channels/notificationEvents/messages/EmailDeliveryFailed'
    x-keel-reliability: best-effort
    x-keel-emitted-by:
    - sendQueuedMessage
  consumeNotificationRequested:
    action: receive
    channel:
      $ref: '#/channels/notificationRequests'
    summary: 'Un servidor registrado nos encarga enviar un correo. El payload es nuestra firma de entrada,
      no el hecho de nadie: es el mismo contrato que sirve POST /notifications.'
    messages:
    - $ref: '#/channels/notificationRequests/messages/NotificationRequested'
    x-keel-source: any-registered-system
    x-keel-triggers: requestNotification
    x-keel-nature: request
    x-keel-input:
      templateCode: templateCode
      idempotencyKey: idempotencyKey
      recipients: recipients
      variables: variables
    x-keel-identity:
      field: applicationCode
      from:
        location: field
        name: metadata.source
      onUnresolved: deadLetter
      trustedPublishers: 'Nadie publica anónimamente en este canal: el broker autentica a los emisores
        en el momento de publicar, lo que acota el riesgo a sistemas que ya están dentro del perímetro.
        Sobre esa base se acepta que cada emisor estampe su propio nombre en metadata.source, que es política
        de desarrollo y no un control técnico: un emisor registrado podría pedir un envío en nombre de
        otra aplicación y usar su remitente verificado. Se asume a sabiendas mientras todos los emisores
        sean sistemas propios. El día que se integre un tercero, o que haga falta no-repudio del origen,
        se pasa a location: header y lo garantiza el broker. Un mensaje cuyo emisor no corresponda a ninguna
        Application registrada no se descarta en silencio: va a la cola de descartes, porque el caso frecuente
        es un equipo que integra su servicio y olvida registrar su aplicación, y en silencio eso son correos
        que no salen sin que nada dé error en ningún sitio.'
    x-keel-on-failure:
      retry:
        maxAttempts: 3
        backoff: exponential
        initialDelayMs: 1000
        maxDelayMs: 10000
      deadLetter: true
    x-keel-contract:
      envelope: keel
      format: json
      unknownFields: ignore
components:
  messages:
    EmailSent:
      name: EmailSent
      title: EmailSent
      contentType: application/json
      summary: 'El relay aceptó el mensaje para su entrega. Es informativo y NO es fuente de verdad: con
        reliability best-effort este evento puede perderse aunque el correo sí haya salido, así que quien
        necesite certeza debe consultar findMessageByIdempotencyKey o listMessages. Hoy no tiene ningún
        consumidor conocido y se publica igualmente: el payload es CONTRATO ESTABLE desde ya, para que
        un consumidor futuro pueda reaccionar al desenlace sin sondear.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/EmailSentPayload'
    EmailDeliveryFailed:
      name: EmailDeliveryFailed
      title: EmailDeliveryFailed
      contentType: application/json
      summary: 'El relay rechazó el mensaje o no respondió. El fallo es TERMINAL por diseño: este servicio
        no reintenta, así que quien quiera recuperar el aviso debe volver a pedirlo con otra clave de
        idempotencia. Con reliability best-effort tampoco este evento está garantizado. Hoy no tiene ningún
        consumidor conocido y se publica igualmente: el payload es CONTRATO ESTABLE desde ya, porque el
        fallo es el único desenlace que exige acción de alguien.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/EmailDeliveryFailedPayload'
    NotificationRequested:
      name: NotificationRequested
      title: NotificationRequested
      contentType: application/json
      summary: 'Un servidor registrado nos encarga enviar un correo. El payload es nuestra firma de entrada,
        no el hecho de nadie: es el mismo contrato que sirve POST /notifications.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/NotificationRequestedPayload'
      x-keel-message-id:
        location: field
        name: metadata.eventId
        description: 'Con envelope keel la identidad del mensaje es metadata.eventId: el emisor lo estampa
          al publicar y viaja intacto, asi que una reentrega repite el mismo valor.'
  schemas:
    EmailSentPayload:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
        applicationCode:
          $ref: '#/components/schemas/ApplicationCode'
        templateCode:
          $ref: '#/components/schemas/TemplateCode'
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
        recipientCount:
          type: integer
          minimum: 1
        sentAt:
          type: string
          format: date-time
      required:
      - messageId
      - applicationCode
      - templateCode
      - idempotencyKey
      - recipientCount
      - sentAt
    EmailDeliveryFailedPayload:
      type: object
      properties:
        messageId:
          type: string
          format: uuid
        applicationCode:
          $ref: '#/components/schemas/ApplicationCode'
        templateCode:
          $ref: '#/components/schemas/TemplateCode'
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
        failureReason:
          type: string
          maxLength: 500
        failedAt:
          type: string
          format: date-time
      required:
      - messageId
      - applicationCode
      - templateCode
      - idempotencyKey
      - failureReason
      - failedAt
    NotificationRequestedPayload:
      type: object
      properties:
        templateCode:
          $ref: '#/components/schemas/TemplateCode'
        idempotencyKey:
          $ref: '#/components/schemas/IdempotencyKey'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
          minItems: 1
          maxItems: 20
        variables:
          type: array
          items:
            $ref: '#/components/schemas/TemplateVariableValue'
          maxItems: 50
      required:
      - templateCode
      - idempotencyKey
      - recipients
      additionalProperties: true
    KeelEventMetadata:
      type: object
      description: Metadata transversal de la envoltura Keel; la estampa el emisor al publicar.
      required:
      - eventId
      - eventType
      - eventVersion
      - occurredAt
      - source
      properties:
        eventId:
          type: string
          format: uuid
          description: Id unico de esta ocurrencia; clave de deduplicacion del consumidor. Una reentrega
            repite el mismo valor.
        eventType:
          type: string
          description: Nombre del evento en el diseno; discriminador cuando el canal lleva varios tipos.
        eventVersion:
          type: integer
          minimum: 1
          description: Version del contrato del payload.
        occurredAt:
          type: string
          format: date-time
          description: Instante UTC en que ocurrio el hecho en el dominio, no el del envio.
        source:
          type: string
          description: 'Nombre del servicio emisor. En la suscripcion de este servicio NO es solo traza:
            es de donde se resuelve la Application en cuyo nombre se pide el envio.'
        correlationId:
          type:
          - string
          - 'null'
          description: Correlacion de la peticion que origino el hecho; null si no hubo contexto de peticion.
    ApplicationCode:
      type: string
      pattern: ^[a-z][a-z0-9-]{2,47}$
      description: Identificador estable y legible de una aplicación consumidora, usado en eventos y peticiones
        M2M.
    EmailAddress:
      type: string
      pattern: ^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$
      maxLength: 254
      description: Dirección de correo electrónico.
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      description: Clave con la que quien pide el envío distingue una petición nueva de un reintento de
        la misma.
    TemplateCode:
      type: string
      pattern: ^[a-z][a-z0-9-]{2,63}$
      description: Identificador estable de una plantilla dentro de su aplicación; es lo que el consumidor
        nombra al pedir un envío.
    TemplateVariableValue:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-zA-Z][a-zA-Z0-9_]{0,39}$
        value:
          type: string
          maxLength: 2000
      required:
      - name
      - value
      additionalProperties: false
      description: Valor concreto que el solicitante aporta para una variable declarada por la plantilla.
  correlationIds:
    keelCorrelationId:
      description: Correlacion end-to-end estampada en la envoltura Keel.
      location: $message.payload#/metadata/correlationId
