  /api/v1/applications/{applicationCode}/templates/{templateCode}/versions:
    post:
      operationId: publishTemplateVersion
      summary: "Publica una versión nueva de una plantilla: la crea, la activa y archiva la anterior en la misma transacción."
      tags:
        - Plantillas
      description: >-
        - Orden de evaluación: (1) alcance → APPLICATION_FORBIDDEN; (2) Idempotency-Key, si viene: repetición con el
        mismo contenido → la versión ya creada, contenido distinto → IDEMPOTENCY_KEY_REUSED, en curso →
        IDEMPOTENCY_KEY_IN_PROGRESS; (3) plantilla → TEMPLATE_NOT_FOUND; (4) DUPLICATE_TEMPLATE_VARIABLE; (5)
        INVALID_TEMPLATE_SYNTAX; (6) UNDECLARED_TEMPLATE_VARIABLES.

        - Sintaxis: un marcador es {{name}} o {{ name }} (espacios opcionales junto a las llaves) y name cumple
        VariableName. Cualquier otra aparición de {{ —sin cerrar, vacía o con un contenido que no es un nombre— es
        INVALID_TEMPLATE_SYNTAX. No hay forma de escribir {{ literal. El motor no admite condicionales, bucles, llamadas
        ni expresiones de ningún tipo.

        - Toda variable usada en subject, htmlBody o textBody tiene que estar declarada en variables; una variable
        declarada y no usada se admite.

        - Los nombres de variables declaradas no se repiten.

        - La versión nueva recibe como versionNumber el mayor de la plantilla más uno (1 si es la primera) y nace
        active.

        - La versión active anterior, si la había, pasa a archived; hasActiveVersion queda a true. Todo en la misma
        transacción.

        - Se pueden publicar versiones en una aplicación suspended.

        - Los mensajes ya aceptados siguen usando la versión que congelaron.
      parameters:
        - name: applicationCode
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationCode"
        - name: templateCode
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TemplateCode"
        - name: Idempotency-Key
          in: header
          required: false
          description: "Clave opcional del intento, acotada a la plantilla. Se recuerda 24 h: un reintento con la misma clave
            devuelve la versión ya creada sin crear otra. Sin cabecera se publica sin deduplicar."
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishTemplateVersionRequest"
      responses:
        "200":
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplateVersion"
        "400":
          description: "`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        "401":
          description: "`UNAUTHENTICATED` — Sin credencial válida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        "403":
          description: >-
            `ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia
            notifications.


            `APPLICATION_FORBIDDEN` — applicationCode no está en el claim applications del llamante y su rol no está
            exento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                APPLICATION_FORBIDDEN:
                  summary: applicationCode no está en el claim applications del llamante y su rol no está exento.
                  value:
                    status: 403
                    code: APPLICATION_FORBIDDEN
                    message: applicationCode no está en el claim applications del llamante y su rol no está exento.
        "404":
          description: "`TEMPLATE_NOT_FOUND` — No existe la aplicación o esa aplicación no tiene una plantilla con templateCode."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                TEMPLATE_NOT_FOUND:
                  summary: No existe la aplicación o esa aplicación no tiene una plantilla con templateCode.
                  value:
                    status: 404
                    code: TEMPLATE_NOT_FOUND
                    message: No existe la aplicación o esa aplicación no tiene una plantilla con templateCode.
        "409":
          description: >-
            `IDEMPOTENCY_KEY_REUSED` — La Idempotency-Key ya se usó para esta plantilla con un contenido distinto.


            `IDEMPOTENCY_KEY_IN_PROGRESS` — Otra petición con la misma Idempotency-Key para esta plantilla se está
            procesando todavía.


            `CONCURRENT_MODIFICATION` — Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                IDEMPOTENCY_KEY_REUSED:
                  summary: La Idempotency-Key ya se usó para esta plantilla con un contenido distinto.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
                    message: La Idempotency-Key ya se usó para esta plantilla con un contenido distinto.
                IDEMPOTENCY_KEY_IN_PROGRESS:
                  summary: Otra petición con la misma Idempotency-Key para esta plantilla se está procesando todavía.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_IN_PROGRESS
                    message: Otra petición con la misma Idempotency-Key para esta plantilla se está procesando todavía.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
