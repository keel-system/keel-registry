                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
        "422":
          description: >-
            `DUPLICATE_TEMPLATE_VARIABLE` — Dos variables declaradas tienen el mismo name.


            `INVALID_TEMPLATE_SYNTAX` — El asunto o algún cuerpo tiene un marcador mal formado o usa una construcción
            que el motor no admite.


