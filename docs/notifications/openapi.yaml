        - recipient casa con un mensaje si es uno de sus destinatarios; los mensajes purgados no casan nunca con un
        filtro por recipient.

        - templateCode filtra por el templateCode congelado en el mensaje.

        - El orden es requestedAt descendente y, a igualdad, id ascendente.
      parameters:
        - name: applicationCode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApplicationCode"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/MessageStatus"
        - name: templateCode
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TemplateCode"
        - name: recipient
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EmailAddress"
        - name: requestedFrom
          in: query
          required: false
          description: Inicio de la ventana sobre requestedAt, inclusive.
          schema:
            type: string
            format: date-time
        - name: requestedTo
          in: query
          required: false
          description: Fin de la ventana sobre requestedAt, exclusivo.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          required: false
          description: Página, base 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Tamaño de página; un valor mayor que 100 se recorta a 100.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMessagePage"
        "400":
          description: |-
            `VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.

            `INVALID_TIME_WINDOW` — requestedFrom no es anterior a requestedTo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
                INVALID_TIME_WINDOW:
                  summary: requestedFrom no es anterior a requestedTo.
                  value:
                    status: 400
                    code: INVALID_TIME_WINDOW
                    message: requestedFrom no es anterior a requestedTo.
        "401":
          description: "`UNAUTHENTICATED` — Sin credencial válida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        "403":
          description: >-
            `ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia
            notifications.


            `APPLICATION_FORBIDDEN` — applicationCode no está en el claim applications del llamante y su rol no está
            exento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                APPLICATION_FORBIDDEN:
                  summary: applicationCode no está en el claim applications del llamante y su rol no está exento.
                  value:
                    status: 403
                    code: APPLICATION_FORBIDDEN
                    message: applicationCode no está en el claim applications del llamante y su rol no está exento.
      security:
        - userAuth: []
      x-keel-permissions:
        - message:read
      x-keel-roles:
        - notifications-admin
        - application-operator
        - notifications-auditor
  /api/v1/messages/personal-data-purges:
    post:
      operationId: purgeMessagePersonalData
      summary: Vacía los datos personales de los correos terminados que superan el plazo de retención (18 meses por defecto),
        conservando la fila y su clave para siempre.
      tags:
        - Correos
      description: >-
        - Solo corre una purga a la vez en todo el servicio; si ya hay una en curso (programada o manual), la nueva
        termina sin purgar nada y responde purgedCount 0.

        - Son purgables los mensajes en sent o failed con personalDataPurgedAt nulo y requestedAt anterior a hace
        personalDataRetentionMonths meses de calendario (parámetro, 18 por defecto, contados en UTC).

        - Procesa lotes de hasta 5000 mensajes purgables por requestedAt ascendente (id ascendente como desempate), cada
        lote en su propia transacción, hasta que no quede ninguno.

        - A cada uno le vacía recipients y variableValues, pone renderedSubject a nulo y fija personalDataPurgedAt =
        ahora. Conserva la fila, su estado, su idempotencyKey y su contentFingerprint.

        - Repetirla no tiene efecto sobre lo ya purgado; si se interrumpe, la siguiente ejecución continúa donde quedó.

        - Además del disparo diario, un administrador puede lanzarla a mano.
      responses:
        "200":
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResult"
        "400":
          description: "`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        "401":
          description: "`UNAUTHENTICATED` — Sin credencial válida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        "403":
          description: "`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia
            notifications."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
      security:
        - userAuth: []
      x-keel-permissions:
        - personal-data:purge
      x-keel-roles:
        - notifications-admin
  /api/v1/notifications:
    post:
      operationId: requestNotification
      summary: Acepta la petición de una aplicación de enviar un correo a partir de una de sus plantillas y lo deja en cola.
        No promete la entrega.
      tags:
        - Servidor a servidor
      description: >-
        - Orden de evaluación: (1) resolver la aplicación de callerApplicationCode → APPLICATION_NOT_FOUND; (2) un name
        repetido en variables → DUPLICATE_VARIABLE_VALUE, antes de comparar nada; (3) si ya existe un mensaje con
        (aplicación, idempotencyKey), mismo contenido → ese mensaje, contenido distinto → IDEMPOTENCY_KEY_REUSED; (4)
        APPLICATION_SUSPENDED; (5) TEMPLATE_NOT_FOUND; (6) TEMPLATE_NOT_PUBLISHED; (7) MISSING_TEMPLATE_VARIABLES; (8)
        RECIPIENT_SUPPRESSED; (9) RENDERED_SUBJECT_TOO_LONG.

        - Los destinatarios se normalizan a minúsculas y se deduplican conservando el orden de su primera aparición.

        - Si ya existe un mensaje con la misma (aplicación, idempotencyKey) y el mismo contenido, se responde con ese
        mensaje en su estado actual, aunque la aplicación se haya suspendido o la plantilla se haya retirado desde
        entonces. No se crea nada ni se envía nada.

        - Mismo contenido significa misma contentFingerprint: mismo templateCode, mismo conjunto de destinatarios
        normalizados y mismo conjunto de pares (name, value) de las variables que declara la versión que el mensaje
        original congeló, sin importar el orden. Vale también para un mensaje ya purgado.

        - La clave es permanente: no caduca nunca, tampoco después de la purga de datos personales.

        - Las variables que la versión activa no declara se descartan en silencio y no se guardan; todas las declaradas
        como required tienen que venir.

        - Se rechaza la petición entera si algún destinatario tiene una supresión active en la aplicación; no se envía a
        los demás.

        - El asunto se renderiza al aceptar con la versión activa; una variable opcional ausente se sustituye por la
        cadena vacía, y los saltos de línea de los valores se sustituyen por un espacio. En el asunto no se escapa nada.

        - Se congelan en el mensaje el remitente, el nombre y el Reply-To de la aplicación, el templateCode, el
        versionNumber y el id de la versión activa.

        - El mensaje queda en queued; lo envía más tarde dispatchQueuedMessages.

        - La respuesta es la misma venga la petición por HTTP o por el canal de eventos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestNotificationRequest"
      responses:
        "202":
          description: "Aceptado: el mensaje queda en cola; no promete la entrega."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMessage"
        "400":
          description: "`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        "401":
          description: "`UNAUTHENTICATED` — Sin credencial válida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        "403":
          description: "`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia
            notifications."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
        "409":
          description: >-
            `IDEMPOTENCY_KEY_REUSED` — La aplicación ya usó esa idempotencyKey con un contenido distinto.


            `IDEMPOTENCY_KEY_IN_PROGRESS` — Otra petición de la misma aplicación con la misma idempotencyKey se está
            aceptando en este mismo momento.


            `APPLICATION_SUSPENDED` — La aplicación está suspended y la clave no corresponde a un mensaje ya aceptado.


            `CONCURRENT_MODIFICATION` — Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                IDEMPOTENCY_KEY_REUSED:
                  summary: La aplicación ya usó esa idempotencyKey con un contenido distinto.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
                    message: La aplicación ya usó esa idempotencyKey con un contenido distinto.
                IDEMPOTENCY_KEY_IN_PROGRESS:
                  summary: Otra petición de la misma aplicación con la misma idempotencyKey se está aceptando en este mismo momento.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_IN_PROGRESS
                    message: Otra petición de la misma aplicación con la misma idempotencyKey se está aceptando en este mismo momento.
                APPLICATION_SUSPENDED:
                  summary: La aplicación está suspended y la clave no corresponde a un mensaje ya aceptado.
                  value:
                    status: 409
                    code: APPLICATION_SUSPENDED
                    message: La aplicación está suspended y la clave no corresponde a un mensaje ya aceptado.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
        "422":
          description: |-
            `APPLICATION_NOT_FOUND` — La identidad del llamante no corresponde a ninguna aplicación registrada.

            `TEMPLATE_NOT_FOUND` — La aplicación no tiene una plantilla con templateCode.

            `TEMPLATE_NOT_PUBLISHED` — La plantilla existe pero no tiene una versión active.

            `DUPLICATE_VARIABLE_VALUE` — variables trae dos valores con el mismo name.

            `MISSING_TEMPLATE_VARIABLES` — Falta alguna variable que la versión activa declara como required.

            `RECIPIENT_SUPPRESSED` — Algún destinatario tiene una supresión active en la aplicación.

            `RENDERED_SUBJECT_TOO_LONG` — El asunto renderizado supera los 998 caracteres.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                APPLICATION_NOT_FOUND:
                  summary: La identidad del llamante no corresponde a ninguna aplicación registrada.
                  value:
                    status: 422
                    code: APPLICATION_NOT_FOUND
                    message: La identidad del llamante no corresponde a ninguna aplicación registrada.
                TEMPLATE_NOT_FOUND:
                  summary: La aplicación no tiene una plantilla con templateCode.
                  value:
                    status: 422
                    code: TEMPLATE_NOT_FOUND
                    message: La aplicación no tiene una plantilla con templateCode.
                TEMPLATE_NOT_PUBLISHED:
                  summary: La plantilla existe pero no tiene una versión active.
                  value:
                    status: 422
                    code: TEMPLATE_NOT_PUBLISHED
                    message: La plantilla existe pero no tiene una versión active.
                DUPLICATE_VARIABLE_VALUE:
                  summary: variables trae dos valores con el mismo name.
                  value:
                    status: 422
                    code: DUPLICATE_VARIABLE_VALUE
                    message: variables trae dos valores con el mismo name.
                MISSING_TEMPLATE_VARIABLES:
                  summary: Falta alguna variable que la versión activa declara como required.
                  value:
                    status: 422
                    code: MISSING_TEMPLATE_VARIABLES
                    message: Falta alguna variable que la versión activa declara como required.
                RECIPIENT_SUPPRESSED:
                  summary: Algún destinatario tiene una supresión active en la aplicación.
                  value:
                    status: 422
                    code: RECIPIENT_SUPPRESSED
                    message: Algún destinatario tiene una supresión active en la aplicación.
                RENDERED_SUBJECT_TOO_LONG:
                  summary: El asunto renderizado supera los 998 caracteres.
                  value:
                    status: 422
                    code: RENDERED_SUBJECT_TOO_LONG
                    message: El asunto renderizado supera los 998 caracteres.
      security:
        - serviceAuth:
            - notification:send
      x-keel-service-clients:
        - billing
        - shipping
        - dispatch-only
      x-keel-idempotency:
        keySource: payload-field
        keyField: idempotencyKey
