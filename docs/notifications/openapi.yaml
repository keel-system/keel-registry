openapi: 3.1.0
info:
  title: notifications
  version: 0.1.2
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: >-
    Envía correo transaccional en nombre de varias aplicaciones consumidoras a partir de plantillas que mantiene negocio
    sin desplegar: acepta peticiones por HTTP servidor-a-servidor y por eventos con el mismo contrato, garantiza que la
    misma petición nunca produce dos correos, respeta las supresiones por aplicación y publica el desenlace terminal de
    cada envío.


    Contrato HTTP derivado del diseño Keel. Dos superficies:


    - **Back-office** — token de usuario (OIDC) con el permiso de la operación (`x-keel-permissions`). Las personas
    quedan acotadas por el claim `applications`: fuera de él responden `403 APPLICATION_FORBIDDEN` (salvo `getMessage`,
    que responde `404`). `notifications-admin` y `notifications-auditor` están exentos.

    - **Servidor a servidor** — credencial de máquina (OAuth2 client credentials) con audiencia `notifications` y el
    scope de la operación. La aplicación que pide o consulta un envío es la de la credencial: nunca viaja en el cuerpo.


    **Idempotencia**: `POST /notifications` se deduplica por el campo `idempotencyKey` del cuerpo, para siempre y por
    aplicación (el mismo contrato entra por el canal de eventos). `publishTemplateVersion` admite la cabecera opcional
    `Idempotency-Key`.


    **Nulos**: un campo sin valor viaja como `null`; una colección vacía, como `[]`. Los instantes son ISO-8601 en UTC.


    **Concurrencia**: toda raíz de agregado lleva bloqueo optimista; una escritura concurrente responde `409
    CONCURRENT_MODIFICATION`.


    **Recursos por clave natural**: ninguna creación devuelve `201`.
servers:
  - url: "{baseUrl}"
    description: El host y el puerto son parámetro de despliegue, nunca dato de diseño.
    variables:
      baseUrl:
        default: http://localhost:8080
        description: Raíz del servicio desplegado.
tags:
  - name: Aplicaciones
    description: "Back-office: alta, edición, suspensión y consulta de las aplicaciones consumidoras."
  - name: Plantillas
    description: "Back-office: plantillas y sus versiones inmutables; publicar, revertir y retirar."
  - name: Supresiones
    description: "Back-office: direcciones a las que una aplicación no puede enviar."
  - name: Correos
    description: "Back-office: consulta de correos y purga manual de datos personales."
  - name: Servidor a servidor
    description: Pedir envíos, consultarlos por clave y reportar rebotes, con credencial de máquina.
paths:
  /api/v1/applications:
    post:
      operationId: registerApplication
      summary: Da de alta una aplicación consumidora, activa desde el primer momento.
      tags:
        - Aplicaciones
      description: >-
        - senderAddress y replyToAddress se normalizan a minúsculas antes de guardarse.

        - La aplicación nace en estado active.

        - El code tiene que coincidir con el nombre de su cliente máquina y con el source de sus eventos; darlo de alta
        aquí no crea el cliente máquina.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterApplicationRequest"
      responses:
        "200":
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: "`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        "401":
          description: "`UNAUTHENTICATED` — Sin credencial válida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        "403":
          description: "`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia
            notifications."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
        "409":
          description: |-
            `APPLICATION_ALREADY_EXISTS` — Ya existe una aplicación con ese code.

            `CONCURRENT_MODIFICATION` — Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                APPLICATION_ALREADY_EXISTS:
                  summary: Ya existe una aplicación con ese code.
                  value:
                    status: 409
                    code: APPLICATION_ALREADY_EXISTS
                    message: Ya existe una aplicación con ese code.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
      security:
        - userAuth: []
      x-keel-permissions:
        - application:manage
      x-keel-roles:
        - notifications-admin
    get:
      operationId: listApplications
      summary: Lista las aplicaciones, filtrables por estado.
      tags:
        - Aplicaciones
      description: >-
        - Si el llamante no tiene un rol exento del alcance, solo ve las aplicaciones de su claim applications; nunca
        recibe un 403 por ello.

        - Sin status se listan todas.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
        - name: page
          in: query
          required: false
          description: Página, base 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Tamaño de página; un valor mayor que 100 se recorta a 100.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "400":
          description: "`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        "401":
          description: "`UNAUTHENTICATED` — Sin credencial válida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        "403":
          description: "`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia
            notifications."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
      security:
        - userAuth: []
      x-keel-permissions:
        - application:read
      x-keel-roles:
        - notifications-admin
        - template-editor
        - application-operator
        - notifications-auditor
  /api/v1/applications/{code}:
    put:
      operationId: updateApplication
      summary: "Sustituye los datos editables de una aplicación: nombre, remitente y Reply-To."
      tags:
        - Aplicaciones
      description: |-
        - Es una sustitución completa de los campos editables; senderName o replyToAddress ausentes quedan vacíos.
        - El code no se modifica nunca; es el que identifica el recurso.
        - Los mensajes ya aceptados no cambian; conservan el remitente y el Reply-To congelados al aceptarse.
        - Se puede modificar una aplicación suspended.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationRequest"
      responses:
        "200":
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: "`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        "401":
          description: "`UNAUTHENTICATED` — Sin credencial válida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        "403":
          description: "`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia
            notifications."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
        "404":
          description: "`APPLICATION_NOT_FOUND` — No existe una aplicación con ese code."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                APPLICATION_NOT_FOUND:
                  summary: No existe una aplicación con ese code.
                  value:
                    status: 404
                    code: APPLICATION_NOT_FOUND
                    message: No existe una aplicación con ese code.
        "409":
          description: "`CONCURRENT_MODIFICATION` — Otra escritura concurrente cambió la misma raíz de agregado; reintentar."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
      security:
        - userAuth: []
      x-keel-permissions:
        - application:manage
      x-keel-roles:
        - notifications-admin
    get:
      operationId: getApplication
      summary: Recupera una aplicación por su code.
      tags:
        - Aplicaciones
      description: "- Si el llamante no tiene un rol exento del alcance y el code no está en su claim applications, se rechaza
        con APPLICATION_FORBIDDEN antes de buscar la aplicación."
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationCode"
      responses:
        "200":
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: "`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        "401":
          description: "`UNAUTHENTICATED` — Sin credencial válida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        "403":
          description: >-
            `ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia
            notifications.


            `APPLICATION_FORBIDDEN` — El code no está entre las aplicaciones del claim applications del llamante y su
            rol no está exento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                APPLICATION_FORBIDDEN:
                  summary: El code no está entre las aplicaciones del claim applications del llamante y su rol no está exento.
                  value:
                    status: 403
                    code: APPLICATION_FORBIDDEN
                    message: El code no está entre las aplicaciones del claim applications del llamante y su rol no está exento.
        "404":
          description: "`APPLICATION_NOT_FOUND` — No existe una aplicación con ese code."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                APPLICATION_NOT_FOUND:
                  summary: No existe una aplicación con ese code.
                  value:
                    status: 404
                    code: APPLICATION_NOT_FOUND
                    message: No existe una aplicación con ese code.
      security:
        - userAuth: []
      x-keel-permissions:
        - application:read
      x-keel-roles:
        - notifications-admin
        - template-editor
        - application-operator
        - notifications-auditor
  /api/v1/applications/{code}/suspend:
    post:
      operationId: suspendApplication
      summary: "Suspende una aplicación: deja de aceptar envíos y su cola pendiente ya no sale."
      tags:
        - Aplicaciones
      description: >-
        - Suspender una aplicación ya suspended no se aplica: responde 409 INVALID_STATE_TRANSITION.

        - Los mensajes en queued de la aplicación terminarán en failed con application-suspended cuando el despacho los
        tome.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationCode"
      responses:
        "200":
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: "`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        "401":
          description: "`UNAUTHENTICATED` — Sin credencial válida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        "403":
          description: "`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia
            notifications."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
        "404":
          description: "`APPLICATION_NOT_FOUND` — No existe una aplicación con ese code."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                APPLICATION_NOT_FOUND:
                  summary: No existe una aplicación con ese code.
                  value:
                    status: 404
                    code: APPLICATION_NOT_FOUND
                    message: No existe una aplicación con ese code.
        "409":
          description: |-
            `INVALID_STATE_TRANSITION` — La aplicación ya está suspended.

            `CONCURRENT_MODIFICATION` — Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_STATE_TRANSITION:
                  summary: La aplicación ya está suspended.
                  value:
                    status: 409
                    code: INVALID_STATE_TRANSITION
                    message: La aplicación ya está suspended.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
      security:
        - userAuth: []
      x-keel-permissions:
        - application:manage
      x-keel-roles:
        - notifications-admin
  /api/v1/applications/{code}/reactivate:
    post:
      operationId: reactivateApplication
      summary: Reactiva una aplicación suspendida.
      tags:
        - Aplicaciones
      description: |-
        - Reactivar una aplicación ya active no se aplica: responde 409 INVALID_STATE_TRANSITION.
        - Los mensajes que fallaron con application-suspended mientras estuvo suspendida no se reenvían.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationCode"
      responses:
        "200":
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: "`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        "401":
          description: "`UNAUTHENTICATED` — Sin credencial válida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        "403":
          description: "`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia
            notifications."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
        "404":
          description: "`APPLICATION_NOT_FOUND` — No existe una aplicación con ese code."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                APPLICATION_NOT_FOUND:
                  summary: No existe una aplicación con ese code.
                  value:
                    status: 404
                    code: APPLICATION_NOT_FOUND
                    message: No existe una aplicación con ese code.
        "409":
          description: |-
            `INVALID_STATE_TRANSITION` — La aplicación ya está active.

            `CONCURRENT_MODIFICATION` — Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INVALID_STATE_TRANSITION:
                  summary: La aplicación ya está active.
                  value:
                    status: 409
                    code: INVALID_STATE_TRANSITION
                    message: La aplicación ya está active.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
      security:
        - userAuth: []
      x-keel-permissions:
        - application:manage
      x-keel-roles:
        - notifications-admin
  /api/v1/applications/{applicationCode}/templates:
    post:
      operationId: createTemplate
      summary: Da de alta una plantilla vacía en una aplicación; todavía no tiene versiones.
      tags:
        - Plantillas
      description: >-
        - Si el llamante no tiene un rol exento del alcance y applicationCode no está en su claim applications, se
        rechaza con APPLICATION_FORBIDDEN.

        - La plantilla nace sin versiones y con hasActiveVersion a false.

        - Se pueden crear plantillas en una aplicación suspended.

        - Dos altas simultáneas en la misma aplicación compiten por el agregado Application; la que pierde recibe 409
        CONCURRENT_MODIFICATION y, si reintenta con el mismo code, TEMPLATE_ALREADY_EXISTS.
      parameters:
        - name: applicationCode
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTemplateRequest"
      responses:
        "200":
          description: Correcto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailTemplate"
        "400":
          description: "`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        "401":
          description: "`UNAUTHENTICATED` — Sin credencial válida."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        "403":
          description: >-
            `ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia
            notifications.


            `APPLICATION_FORBIDDEN` — applicationCode no está en el claim applications del llamante y su rol no está
            exento.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token no es de la audiencia notifications.
                APPLICATION_FORBIDDEN:
                  summary: applicationCode no está en el claim applications del llamante y su rol no está exento.
                  value:
                    status: 403
                    code: APPLICATION_FORBIDDEN
                    message: applicationCode no está en el claim applications del llamante y su rol no está exento.
        "404":
          description: "`APPLICATION_NOT_FOUND` — No existe una aplicación con ese code."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                APPLICATION_NOT_FOUND:
                  summary: No existe una aplicación con ese code.
                  value:
                    status: 404
                    code: APPLICATION_NOT_FOUND
                    message: No existe una aplicación con ese code.
        "409":
          description: |-
            `TEMPLATE_ALREADY_EXISTS` — La aplicación ya tiene una plantilla con ese code.

            `CONCURRENT_MODIFICATION` — Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                TEMPLATE_ALREADY_EXISTS:
                  summary: La aplicación ya tiene una plantilla con ese code.
                  value:
                    status: 409
                    code: TEMPLATE_ALREADY_EXISTS
                    message: La aplicación ya tiene una plantilla con ese code.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura concurrente cambió la misma raíz de agregado; reintentar.
                  value:
