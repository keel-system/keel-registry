components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de usuario (OIDC) del proveedor de identidad del despliegue. El permiso exigido por cada operación
        está en `x-keel-permissions`; los roles que lo conceden, en `x-keel-roles`.
    serviceAuth:
      type: oauth2
      description: Credencial de máquina (OAuth2 client credentials). El `tokenUrl` real es parámetro de despliegue; se valida
        la audiencia `notifications`, así que un token emitido para otro servicio responde 403.
      flows:
        clientCredentials:
          tokenUrl: https://identity.invalid/oauth2/token
          scopes:
            notification:send: Pedir envíos de correo (M2M).
            notification:read: Consultar los envíos propios por su clave (M2M).
            bounce:report: Reportar rebotes de correo (M2M).
  schemas:
    ApplicationCode:
      type: string
      description: "Código estable de una aplicación consumidora. Es su identidad ante el servicio: coincide con su cliente
        máquina y con el source de sus eventos."
      pattern: ^[a-z][a-z0-9-]{2,47}$
    TemplateCode:
      type: string
      description: Código estable de una plantilla, único dentro de su aplicación. Es el que usan las aplicaciones al pedir un
        envío.
      pattern: ^[a-z][a-z0-9-]{2,47}$
    EmailAddress:
      type: string
      description: Dirección de correo. Se normaliza a minúsculas antes de guardarla, compararla o deduplicarla.
      pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
      maxLength: 254
    IdempotencyKey:
      type: string
      description: Clave con la que la aplicación identifica un envío. Viaja en la ruta de consulta M2M, así que solo admite
        caracteres seguros en una URL.
      pattern: ^[A-Za-z0-9._:-]{8,128}$
    VariableName:
      type: string
      description: Nombre de una variable de plantilla, tal como se escribe en el asunto y los cuerpos.
      pattern: ^[A-Za-z][A-Za-z0-9_]{0,63}$
    ApplicationStatus:
      type: string
      enum:
        - active
        - suspended
      description: Situación operativa de una aplicación consumidora.
    TemplateVersionStatus:
      type: string
      enum:
        - active
        - archived
      description: "Situación de una versión de plantilla: como mucho una active por plantilla."
    MessageStatus:
      type: string
      enum:
        - queued
        - sending
        - sent
        - failed
      description: Situación de un correo pedido. sent y failed son terminales.
    FailureReason:
      type: string
      enum:
        - delivery-rejected
        - delivery-error
        - render-error
        - application-suspended
        - recipient-suppressed
        - sending-timeout
      description: "Motivo estable por el que un correo terminó en failed. Es contrato: viaja en EmailDeliveryFailed."
    SuppressionStatus:
      type: string
      enum:
        - active
        - released
      description: Situación de una supresión.
    SuppressionReason:
      type: string
      enum:
        - hard-bounce
        - complaint
        - manual
      description: Por qué se suprimió la dirección.
    TemplateVariable:
      type: object
      description: Variable declarada por una versión de plantilla.
      required:
        - name
        - description
        - required
      properties:
        name:
          allOf:
            - $ref: "#/components/schemas/VariableName"
          description: Nombre con el que se usa en el asunto y los cuerpos.
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: Qué dato espera la plantilla en esta variable.
        required:
          type: boolean
          description: Si la petición de envío tiene que traer esta variable.
    VariableValue:
      type: object
      description: Valor de una variable en una petición de envío.
      required:
        - name
        - value
      properties:
        name:
          allOf:
            - $ref: "#/components/schemas/VariableName"
          description: Variable a la que da valor.
        value:
          type: string
          maxLength: 2000
          description: Valor en texto plano; el motor lo escapa al renderizar, nunca lo evalúa.
    SenderSnapshot:
      type: object
      description: "Remitente y respuesta de la aplicación, congelados al aceptar la petición: el correo sale con esto aunque
        la aplicación cambie después."
      required:
        - address
      properties:
        address:
          allOf:
            - $ref: "#/components/schemas/EmailAddress"
          description: Dirección From, copia de Application.senderAddress.
        name:
          type:
            - string
            - "null"
          maxLength: 100
          description: Nombre visible del From, copia de Application.senderName.
        replyToAddress:
          anyOf:
            - allOf:
                - $ref: "#/components/schemas/EmailAddress"
              description: Dirección Reply-To, copia de Application.replyToAddress.
            - type: "null"
          description: Dirección Reply-To, copia de Application.replyToAddress.
    Application:
      type: object
      description: Aplicación consumidora (billing, shipping, …) en cuyo nombre se envían correos. Es dueña de sus plantillas.
      required:
        - id
        - code
        - name
        - senderAddress
        - senderName
        - replyToAddress
        - status
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
      properties:
        id:
          type: string
          format: uuid
        code:
          allOf:
            - $ref: "#/components/schemas/ApplicationCode"
          description: Código estable; no cambia nunca tras el alta.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Nombre legible de la aplicación.
        senderAddress:
          allOf:
            - $ref: "#/components/schemas/EmailAddress"
          description: "Remitente verificado ante el proveedor de correo. El servicio no lo verifica: lo declara quien registra la
            aplicación."
        senderName:
          type:
            - string
            - "null"
          maxLength: 100
          description: Nombre visible del remitente.
        replyToAddress:
          anyOf:
            - allOf:
                - $ref: "#/components/schemas/EmailAddress"
              description: Dirección a la que responden los destinatarios; sin ella el correo no lleva Reply-To.
            - type: "null"
          description: Dirección a la que responden los destinatarios; sin ella el correo no lleva Reply-To.
        status:
          allOf:
            - $ref: "#/components/schemas/ApplicationStatus"
          description: Una aplicación suspended no origina envíos.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
    EmailTemplate:
      type: object
      description: Plantilla de correo de una aplicación, identificada por su code. Su contenido vive en versiones inmutables.
      required:
        - id
        - code
        - name
        - description
        - hasActiveVersion
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
        - applicationId
      properties:
        id:
          type: string
          format: uuid
        code:
          allOf:
            - $ref: "#/components/schemas/TemplateCode"
          description: Único dentro de la aplicación; no cambia nunca.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Nombre legible de la plantilla.
        description:
          type:
            - string
            - "null"
          maxLength: 1000
          description: Para qué sirve la plantilla.
        hasActiveVersion:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        applicationId:
          type: string
          format: uuid
          description: Aplicación dueña de la plantilla.
    EmailTemplateVersion:
      type: object
      description: "Contenido publicado de una plantilla. Inmutable: publicar es crear una versión nueva."
      required:
        - id
        - versionNumber
        - subject
        - htmlBody
        - textBody
        - variables
        - status
        - publishedAt
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
        - templateId
        - applicationId
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
          description: Correlativo desde 1 dentro de la plantilla; nunca se reutiliza.
        subject:
          type: string
          minLength: 1
          maxLength: 300
          description: Plantilla del asunto.
        htmlBody:
          type: string
          minLength: 1
          maxLength: 262144
          description: Plantilla del cuerpo HTML.
        textBody:
          type: string
          minLength: 1
          maxLength: 65536
          description: Plantilla del cuerpo de texto plano, alternativa obligatoria al HTML.
        variables:
          type: array
          items:
            $ref: "#/components/schemas/TemplateVariable"
          maxItems: 50
          description: Variables que la versión declara.
        status:
          allOf:
            - $ref: "#/components/schemas/TemplateVersionStatus"
          description: Solo la versión active se usa en envíos nuevos.
        publishedAt:
          type: string
          format: date-time
          description: Cuándo se publicó la versión.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        templateId:
          type: string
          format: uuid
          description: Plantilla a la que pertenece.
        applicationId:
          type: string
          format: uuid
          description: Id de la raíz del agregado (Application).
    EmailTemplateVersionSummary:
      type: object
      description: Versión de plantilla sin sus cuerpos (listado).
      required:
        - id
        - versionNumber
        - subject
        - variables
        - status
        - publishedAt
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
        - templateId
        - applicationId
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
          description: Correlativo desde 1 dentro de la plantilla; nunca se reutiliza.
        subject:
          type: string
          minLength: 1
          maxLength: 300
          description: Plantilla del asunto.
        variables:
          type: array
          items:
            $ref: "#/components/schemas/TemplateVariable"
          maxItems: 50
          description: Variables que la versión declara.
        status:
          allOf:
            - $ref: "#/components/schemas/TemplateVersionStatus"
          description: Solo la versión active se usa en envíos nuevos.
        publishedAt:
          type: string
          format: date-time
          description: Cuándo se publicó la versión.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        templateId:
          type: string
          format: uuid
          description: Plantilla a la que pertenece.
        applicationId:
          type: string
          format: uuid
          description: Id de la raíz del agregado (Application).
    EmailMessage:
      type: object
      description: "Un correo pedido por una aplicación: lo que se aceptó, con qué se va a enviar y cómo terminó."
      required:
        - id
        - idempotencyKey
        - recipients
        - renderedSubject
        - sender
        - templateCode
        - templateVersionNumber
        - templateVersionId
        - status
        - failureReason
        - failedAt
        - failureDetail
        - requestedAt
        - sendingSince
        - sentAt
        - personalDataPurgedAt
        - applicationId
      properties:
        id:
          type: string
          format: uuid
        idempotencyKey:
          allOf:
            - $ref: "#/components/schemas/IdempotencyKey"
          description: Clave de la aplicación; única para siempre dentro de ella.
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
          maxItems: 20
          description: Destinatarios en minúsculas y sin duplicados. Vacío solo tras la purga de datos personales.
        renderedSubject:
          type:
            - string
            - "null"
          maxLength: 998
          description: Asunto ya renderizado al aceptar. Nulo solo tras la purga.
        sender:
          allOf:
            - $ref: "#/components/schemas/SenderSnapshot"
          description: Remitente y Reply-To congelados al aceptar.
        templateCode:
          allOf:
            - $ref: "#/components/schemas/TemplateCode"
          description: Code de la plantilla pedida, congelado.
        templateVersionNumber:
          type: integer
          minimum: 1
          description: Versión con la que se renderiza, congelada al aceptar.
        templateVersionId:
          type: string
          format: uuid
          description: "Id de esa versión, congelado al aceptar. No es una relación: la versión vive dentro del agregado
            Application."
        status:
          allOf:
            - $ref: "#/components/schemas/MessageStatus"
          description: Situación del envío.
        failureReason:
          anyOf:
            - allOf:
                - $ref: "#/components/schemas/FailureReason"
              description: Por qué terminó en failed.
            - type: "null"
          description: Por qué terminó en failed.
        failedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Cuándo el mensaje pasó a failed.
        failureDetail:
          type:
            - string
            - "null"
          maxLength: 1000
          description: Diagnóstico legible del fallo (respuesta del relay, error de render). No es contrato estable.
        requestedAt:
          type: string
          format: date-time
          description: Cuándo se aceptó la petición.
        sendingSince:
          type:
            - string
            - "null"
          format: date-time
          description: Cuándo salió de queued. Lo usa el rescate de dispatchQueuedMessages.
        sentAt:
          type:
            - string
            - "null"
          format: date-time
          description: Cuándo el relay aceptó el mensaje.
        personalDataPurgedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Cuándo se vaciaron recipients, renderedSubject y variableValues.
        applicationId:
          type: string
          format: uuid
          description: Aplicación que pidió el envío.
    SuppressedAddress:
      type: object
      description: Dirección a la que una aplicación no puede enviar. La supresión es por aplicación, no global.
      required:
        - id
        - address
        - reason
        - notes
        - status
        - suppressedAt
        - releasedAt
        - createdAt
        - updatedAt
        - createdBy
        - updatedBy
        - applicationId
      properties:
        id:
          type: string
          format: uuid
        address:
          allOf:
            - $ref: "#/components/schemas/EmailAddress"
          description: Dirección suprimida, en minúsculas.
        reason:
          allOf:
            - $ref: "#/components/schemas/SuppressionReason"
          description: Motivo de la última supresión.
        notes:
          type:
            - string
            - "null"
          maxLength: 1000
          description: Nota libre de quien suprime o del rebote.
        status:
          allOf:
            - $ref: "#/components/schemas/SuppressionStatus"
          description: Solo una supresión active bloquea envíos.
        suppressedAt:
          type: string
          format: date-time
          description: Cuándo se suprimió (o reactivó) por última vez.
        releasedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Cuándo se liberó por última vez; nulo mientras está active.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        applicationId:
          type: string
          format: uuid
          description: Aplicación a la que aplica la supresión.
    PurgeResult:
      type: object
      required:
        - purgedCount
      properties:
        purgedCount:
          type: integer
          description: Cuántos mensajes se purgaron en esta ejecución.
    Error:
      type: object
      description: Forma única del cuerpo de error del servicio.
      required:
        - status
        - code
        - message
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
          description: Nombre del status HTTP.
        code:
          type: string
          description: Código de negocio estable; es el contrato.
        message:
          type: string
          description: Texto humano; no es contrato.
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: string
    RegisterApplicationRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/ApplicationCode"
        name:
          type: string
          minLength: 1
          maxLength: 120
        senderAddress:
          $ref: "#/components/schemas/EmailAddress"
        senderName:
          type: string
          maxLength: 100
        replyToAddress:
          $ref: "#/components/schemas/EmailAddress"
      required:
        - code
        - name
        - senderAddress
    UpdateApplicationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        senderAddress:
          $ref: "#/components/schemas/EmailAddress"
        senderName:
          type: string
          maxLength: 100
        replyToAddress:
          $ref: "#/components/schemas/EmailAddress"
      required:
        - name
        - senderAddress
    ApplicationPage:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      description: Página del sobre canónico de paginación offset.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    CreateTemplateRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/TemplateCode"
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
      required:
        - code
        - name
    EmailTemplatePage:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      description: Página del sobre canónico de paginación offset.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmailTemplate"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    UpdateTemplateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
      required:
        - name
    PublishTemplateVersionRequest:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 300
        htmlBody:
          type: string
          minLength: 1
          maxLength: 262144
        textBody:
          type: string
          minLength: 1
          maxLength: 65536
        variables:
          type: array
          items:
            $ref: "#/components/schemas/TemplateVariable"
          maxItems: 50
      required:
        - subject
        - htmlBody
        - textBody
    EmailTemplateVersionSummaryPage:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      description: Página del sobre canónico de paginación offset.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmailTemplateVersionSummary"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    SuppressAddressRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
            - complaint
            - manual
        notes:
          type: string
          maxLength: 1000
      required:
        - reason
    SuppressedAddressPage:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      description: Página del sobre canónico de paginación offset.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SuppressedAddress"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    EmailMessagePage:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      description: Página del sobre canónico de paginación offset.
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EmailMessage"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    RequestNotificationRequest:
      type: object
      additionalProperties: false
      properties:
        idempotencyKey:
          $ref: "#/components/schemas/IdempotencyKey"
        templateCode:
          $ref: "#/components/schemas/TemplateCode"
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/EmailAddress"
          minItems: 1
          maxItems: 20
        variables:
          type: array
          items:
            $ref: "#/components/schemas/VariableValue"
          maxItems: 100
      required:
        - idempotencyKey
        - templateCode
        - recipients
    ReportEmailBounceRequest:
      type: object
      additionalProperties: false
      properties:
        recipient:
          $ref: "#/components/schemas/EmailAddress"
        bounceType:
          type: string
          enum:
            - permanent
            - transient
        diagnostic:
          type: string
          maxLength: 1000
      required:
        - recipient
        - bounceType
