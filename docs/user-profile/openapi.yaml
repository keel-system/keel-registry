      description: '- Precondición: subjects tiene como mucho 100 elementos, contados tal como llegan (antes de deduplicar).

        - Un subject con forma inválida (vacío o de más de 255 caracteres) es un error de contrato del llamante y rechaza
        el lote entero con 400, igual que un lote vacío.

        - Los subjects repetidos se deduplican; cada subject sale una sola vez, en profiles o en unresolved.

