  /api/v1/me/profile/addresses/{addressId}/default:
    put:
      operationId: setMyDefaultAddress
      summary: Marca una dirección como la de por defecto de su type.
      tags:
      - Usuario sobre sí mismo
      description: 'Desmarca la que lo estuviera para ese mismo type. Fijar un valor es naturalmente idempotente: repetir
        la petición deja el perfil igual.


        **Eventos emitidos**: `DefaultAddressChanged`.'
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador de la dirección dentro del perfil.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
