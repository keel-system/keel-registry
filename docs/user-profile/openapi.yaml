        consecutivas no repiten ni omiten filas.


        `search` coincide por **prefijo** sobre `contactEmail` y sobre `displayName`, con OR entre los dos, ignorando mayúsculas
        y acentos. Por prefijo y no por subcadena para que un índice lo sostenga cuando el padrón crezca: es cota, no rendimiento.


