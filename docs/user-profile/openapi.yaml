openapi: 3.1.0
info:
  title: user-profile
  version: 0.1.1
  description: 'Posee el perfil de negocio de cada persona — contacto y direcciones — adoptando por aprovisionamiento just-in-time
    la identidad que crea el servidor de identidad, sin ser nunca dueño de sus credenciales.


    Contrato HTTP derivado del diseño Keel. Tres superficies separadas por prefijo de ruta:


    - `/me/...` — el usuario sobre sí mismo. **Ninguna ruta lleva el subject**: lo estampa el servidor desde el claim `sub`
    del token, porque quien hace la petición es justamente quien no debería poder elegir en nombre de quién actúa.

    - `/management/...` — back-office y soporte, token de usuario con el permiso de la operación.

    - `/services/...` — otros servidores, credencial de máquina con el scope de su familia.


    **Este servicio nunca llama al servidor de identidad**, ni siquiera para validar el token: comprueba la firma en local
    contra las claves públicas del emisor. Y el servidor de identidad nunca llama aquí en el camino caliente.


    **El perfil incompleto es un estado válido**, no un error: nace en `draft` con lo que el token traiga y se completa
    por perfilado progresivo.


    **Este servicio no valida la división territorial contra ningún catálogo.** Valida la forma —que el código de primer
    nivel, cuando venga, sea un ISO 3166-2 del país declarado; que no llegue un código sin su nombre— y nada más. Que el
    territorio exista y que el nombre sea el oficial es responsabilidad del llamante. Ver `INTEGRATION.md`.


    El host, el proveedor de identidad y el motor de persistencia se deciden al generar, no aquí.'
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: '{baseUrl}'
  description: El host y el puerto son parámetro de despliegue, nunca dato de diseño.
  variables:
    baseUrl:
      default: http://localhost:8080
      description: Raíz del servicio desplegado.
tags:
- name: Usuario sobre sí mismo
  description: El usuario sobre su propio perfil; el subject sale del token.
- name: Back-office
  description: Back-office y soporte; claveado por subject, no por el id técnico.
- name: Servidores (M2M)
  description: Superficie servidor-a-servidor; ver INTEGRATION.md.
paths:
  /api/v1/me/profile:
    get:
      operationId: getMyProfile
      summary: Devuelve el perfil de quien presenta el token, con todas sus direcciones.
      tags:
      - Usuario sobre sí mismo
      description: 'El subject sale del claim `sub` del token y nunca viaja en la ruta ni en el cuerpo.


        Si es la primera petición autenticada de esa persona, el aprovisionamiento just-in-time crea su perfil en `draft`
        antes de responder: **este GET escribe**.'
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: '`PROFILE_DELETED` — Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto
            administrativo explícito.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DELETED:
                  summary: Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto administrativo
                    explícito.
                  value:
                    status: 410
                    code: PROFILE_DELETED
                    message: Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto administrativo
                      explícito.
      security:
      - userAuth: []
      x-keel-audience: users
    delete:
      operationId: deleteMyProfile
      summary: Borra el perfil de quien presenta el token y deja su lápida.
      tags:
      - Usuario sobre sí mismo
      description: '**No borra la identidad**: eso es del servidor de identidad y es un acto aparte, fuera de este contrato.
        El procedimiento correcto es borrar aquí primero.


        Funciona en cualquier estado del perfil, incluido `deactivated`: el derecho de supresión no depende de que alguien
        haya desactivado antes la cuenta.


        **La lápida es la guarda de repetición**: si ya existe una para ese subject, la operación responde el mismo éxito,
        no publica un segundo `ProfileDeleted` y no reescribe `deletedAt` ni `deletedBy`.


        **Eventos emitidos**: `ProfileDeleted` — la señal con la que el resto del sistema purga sus copias.'
      responses:
        '204':
          description: Operación completada; sin cuerpo.
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`PROFILE_NOT_FOUND` — No existe perfil con ese subject y tampoco hay lápida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_NOT_FOUND:
                  summary: No existe perfil con ese subject y tampoco hay lápida.
                  value:
                    status: 404
                    code: PROFILE_NOT_FOUND
                    message: No existe perfil con ese subject y tampoco hay lápida.
      security:
      - userAuth: []
      x-keel-audience: users
  /api/v1/me/profile/contact-details:
    put:
      operationId: updateMyContactDetails
      summary: Reemplaza el bloque de contacto editable del perfil.
      tags:
      - Usuario sobre sí mismo
      description: '**Reemplazo completo, no parche**: un campo que no venga se borra. No incluye `contactEmail` — el correo
        de login es del servidor de identidad y aquí solo se refresca al aprovisionar.


        **Eventos emitidos**: `ProfileContactDetailsChanged` (ver `asyncapi.yaml`).


        **Idempotencia**: ninguna declarada, y por eso mismo — fijar el bloque entero a un valor es naturalmente idempotente.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyContactDetailsRequest'
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`PROFILE_DEACTIVATED` — El perfil está deactivated y no admite mutaciones hasta que se reactive.

            `CONCURRENT_MODIFICATION` — Otra escritura sobre el mismo perfil confirmó mientras esta estaba en curso; el
            cliente relee y reintenta con la versión nueva.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DEACTIVATED:
                  summary: El perfil está deactivated y no admite mutaciones hasta que se reactive.
                  value:
                    status: 409
                    code: PROFILE_DEACTIVATED
                    message: El perfil está deactivated y no admite mutaciones hasta que se reactive.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura sobre el mismo perfil confirmó mientras esta estaba en curso; el cliente relee
                    y reintenta con la versión nueva.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura sobre el mismo perfil confirmó mientras esta estaba en curso; el cliente relee
                      y reintenta con la versión nueva.
        '410':
          description: '`PROFILE_DELETED` — Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto
            administrativo explícito.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DELETED:
                  summary: Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto administrativo
                    explícito.
                  value:
                    status: 410
                    code: PROFILE_DELETED
                    message: Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto administrativo
                      explícito.
      security:
      - userAuth: []
      x-keel-audience: users
  /api/v1/me/profile/addresses:
    post:
      operationId: addMyAddress
      summary: Añade una dirección al perfil de quien presenta el token.
      tags:
      - Usuario sobre sí mismo
      description: 'Devuelve `200` con el perfil entero y no `201` con la dirección: añadir recalcula el `status` del perfil,
        un cambio que el cliente no puede predecir, y el recurso que le importa al onboarding es el perfil.


        Este servicio **no valida la división territorial contra ningún catálogo**: comprueba la forma y nada más. Que el
        territorio exista y que el nombre sea el oficial es responsabilidad del llamante.


        **Eventos emitidos**: `AddressAdded` (ver `asyncapi.yaml`). Añadir marcando por defecto **no** publica además `DefaultAddressChanged`:
        serían dos eventos con la misma versión.


        **Idempotencia**: clave del cliente en la cabecera `Idempotency-Key`; ventana de 86400 s. Se declara pero no se
        exige: sin cabecera la operación se ejecuta sin deduplicar.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: Clave de intento generada por el cliente; repetirla con el mismo contenido devuelve el resultado original.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMyAddressRequest'
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`IDEMPOTENCY_KEY_IN_PROGRESS` — Llegaron dos peticiones con la misma Idempotency-Key a la vez.

            `IDEMPOTENCY_KEY_REUSED` — Se reutilizó una Idempotency-Key con un contenido distinto al de la primera petición.

            `PROFILE_DEACTIVATED` — El perfil está deactivated y no admite mutaciones hasta que se reactive.

            `ADDRESS_LIMIT_REACHED` — El perfil ya tiene veinte direcciones.

            `CONCURRENT_MODIFICATION` — Otra escritura sobre el mismo perfil confirmó mientras esta estaba en curso; el
            cliente relee y reintenta con la versión nueva.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IDEMPOTENCY_KEY_IN_PROGRESS:
                  summary: Llegaron dos peticiones con la misma Idempotency-Key a la vez.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_IN_PROGRESS
                    message: Llegaron dos peticiones con la misma Idempotency-Key a la vez.
                IDEMPOTENCY_KEY_REUSED:
                  summary: Se reutilizó una Idempotency-Key con un contenido distinto al de la primera petición.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
                    message: Se reutilizó una Idempotency-Key con un contenido distinto al de la primera petición.
                PROFILE_DEACTIVATED:
                  summary: El perfil está deactivated y no admite mutaciones hasta que se reactive.
                  value:
                    status: 409
                    code: PROFILE_DEACTIVATED
                    message: El perfil está deactivated y no admite mutaciones hasta que se reactive.
                ADDRESS_LIMIT_REACHED:
                  summary: El perfil ya tiene veinte direcciones.
                  value:
                    status: 409
                    code: ADDRESS_LIMIT_REACHED
                    message: El perfil ya tiene veinte direcciones.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura sobre el mismo perfil confirmó mientras esta estaba en curso; el cliente relee
                    y reintenta con la versión nueva.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura sobre el mismo perfil confirmó mientras esta estaba en curso; el cliente relee
                      y reintenta con la versión nueva.
        '410':
          description: '`PROFILE_DELETED` — Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto
            administrativo explícito.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DELETED:
                  summary: Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto administrativo
                    explícito.
                  value:
                    status: 410
                    code: PROFILE_DELETED
                    message: Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto administrativo
                      explícito.
        '422':
          description: '`SUBDIVISION_CODE_COUNTRY_MISMATCH` — El adminAreaCode no es un ISO 3166-2 del país declarado en
            countryCode.

            `TERRITORY_NAME_MISSING` — Viene un código territorial sin el nombre que le corresponde.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SUBDIVISION_CODE_COUNTRY_MISMATCH:
                  summary: El adminAreaCode no es un ISO 3166-2 del país declarado en countryCode.
                  value:
                    status: 422
                    code: SUBDIVISION_CODE_COUNTRY_MISMATCH
                    message: El adminAreaCode no es un ISO 3166-2 del país declarado en countryCode.
                TERRITORY_NAME_MISSING:
                  summary: Viene un código territorial sin el nombre que le corresponde.
                  value:
                    status: 422
                    code: TERRITORY_NAME_MISSING
                    message: Viene un código territorial sin el nombre que le corresponde.
      security:
      - userAuth: []
      x-keel-audience: users
  /api/v1/me/profile/addresses/{addressId}:
    put:
      operationId: updateMyAddress
      summary: Reemplaza el contenido de una dirección del perfil.
      tags:
      - Usuario sobre sí mismo
      description: 'Reemplazo completo; `isDefault` no se toca aquí, se cambia con `setMyDefaultAddress`. Se valida la forma
        de los datos territoriales y nada más.


        **Eventos emitidos**: `AddressChanged`.'
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador de la dirección dentro del perfil.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyAddressRequest'
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`ADDRESS_NOT_FOUND` — No existe una dirección con ese addressId en el perfil de quien llama.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ADDRESS_NOT_FOUND:
                  summary: No existe una dirección con ese addressId en el perfil de quien llama.
                  value:
                    status: 404
                    code: ADDRESS_NOT_FOUND
                    message: No existe una dirección con ese addressId en el perfil de quien llama.
        '409':
          description: '`PROFILE_DEACTIVATED` — El perfil está deactivated y no admite mutaciones hasta que se reactive.

            `CONCURRENT_MODIFICATION` — Otra escritura sobre el mismo perfil confirmó mientras esta estaba en curso; el
            cliente relee y reintenta con la versión nueva.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DEACTIVATED:
                  summary: El perfil está deactivated y no admite mutaciones hasta que se reactive.
                  value:
                    status: 409
                    code: PROFILE_DEACTIVATED
                    message: El perfil está deactivated y no admite mutaciones hasta que se reactive.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura sobre el mismo perfil confirmó mientras esta estaba en curso; el cliente relee
                    y reintenta con la versión nueva.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura sobre el mismo perfil confirmó mientras esta estaba en curso; el cliente relee
                      y reintenta con la versión nueva.
        '410':
          description: '`PROFILE_DELETED` — Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto
            administrativo explícito.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DELETED:
                  summary: Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto administrativo
                    explícito.
                  value:
                    status: 410
                    code: PROFILE_DELETED
                    message: Ese subject tuvo perfil y fue borrado; no se vuelve a aprovisionar sin un acto administrativo
                      explícito.
        '422':
          description: '`SUBDIVISION_CODE_COUNTRY_MISMATCH` — El adminAreaCode no es un ISO 3166-2 del país declarado en
            countryCode.

            `TERRITORY_NAME_MISSING` — Viene un código territorial sin el nombre que le corresponde.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SUBDIVISION_CODE_COUNTRY_MISMATCH:
                  summary: El adminAreaCode no es un ISO 3166-2 del país declarado en countryCode.
                  value:
                    status: 422
                    code: SUBDIVISION_CODE_COUNTRY_MISMATCH
                    message: El adminAreaCode no es un ISO 3166-2 del país declarado en countryCode.
                TERRITORY_NAME_MISSING:
                  summary: Viene un código territorial sin el nombre que le corresponde.
                  value:
                    status: 422
                    code: TERRITORY_NAME_MISSING
                    message: Viene un código territorial sin el nombre que le corresponde.
      security:
      - userAuth: []
      x-keel-audience: users
    delete:
      operationId: removeMyAddress
      summary: Elimina una dirección del perfil.
      tags:
      - Usuario sobre sí mismo
      description: 'Devuelve `200` con el perfil y no `204`: eliminar recalcula el `status`, y con un 204 el cliente tendría
        que hacer un GET detrás de cada borrado.


        Si la eliminada era la de por defecto de su type, el perfil queda **sin ninguna** para ese type: no se promociona
        otra automáticamente, porque elegir cuál es decisión del usuario.


        **Eventos emitidos**: `AddressRemoved`.'
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador de la dirección dentro del perfil.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`ADDRESS_NOT_FOUND` — No existe una dirección con ese addressId en el perfil de quien llama.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ADDRESS_NOT_FOUND:
