                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token es de otra audiencia.
        '422':
          description: '`TOO_MANY_SUBJECTS` — La petición trae más de 100 subjects.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TOO_MANY_SUBJECTS:
                  summary: La petición trae más de 100 subjects.
                  value:
                    status: 422
                    code: TOO_MANY_SUBJECTS
                    message: La petición trae más de 100 subjects.
      security:
      - serviceAuth:
        - profile-contact:read
      x-keel-scopes:
      - profile-contact:read
      x-keel-audience: services
      x-keel-access-level: service
  /api/v1/services/profiles/delivery/batch:
