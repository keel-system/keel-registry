      x-keel-access-level: admin
      x-keel-emits:
      - ProfileReactivated
  /api/v1/management/deleted-subjects/{subject}/reinstate:
    post:
      operationId: reinstateSubject
      summary: Levanta la lápida de un subject para que pueda volver a aprovisionarse. No restaura nada ni publica evento.
      tags:
      - Back-office
      description: '- Borra la lápida. La siguiente petición del titular a /me aprovisiona un perfil nuevo en draft, sin ningún
        dato del anterior.'
      parameters:
      - name: subject
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/SubjectIdentifier'
        description: Subject codificado como segmento de URL.
      responses:
        '204':
          description: Sin contenido.
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido, o el token es de otra audiencia.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido, o el token es de otra audiencia.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido, o el token es de otra audiencia.
        '404':
          description: '`SUBJECT_NOT_DELETED` — No existe lápida para ese subject.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SUBJECT_NOT_DELETED:
                  summary: No existe lápida para ese subject.
                  value:
                    status: 404
                    code: SUBJECT_NOT_DELETED
                    message: No existe lápida para ese subject.
      security:
      - userAuth: []
      x-keel-permissions:
