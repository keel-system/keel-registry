  /api/v1/services/profiles/contact/batch:
    post:
      operationId: resolveContactsBatchForServices
      summary: Resuelve la proyección de contacto de hasta 100 subjects en una llamada. Sirve también para arrancar o reconciliar
        una réplica.
      tags:
      - Servidor a servidor
      description: '- Precondición: subjects tiene como mucho 100 elementos, contados tal como llegan (antes de deduplicar).

        - Un subject con forma inválida (vacío o de más de 255 caracteres) es un error de contrato del llamante y rechaza
        el lote entero con 400, igual que un lote vacío.

        - Los subjects repetidos se deduplican; cada subject sale una sola vez, en profiles o en unresolved.

        - profiles y unresolved conservan el orden de la primera aparición de cada subject en la petición.

        - Nunca falla entero por un subject: los que no tienen perfil ni lápida van a unresolved con reason not-found, y los
        que tienen lápida con reason deleted.

        - No usa caché y no aprovisiona.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectsBatchRequest'
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactBatchResult'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
