          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryBatchResponse'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`TOO_MANY_SUBJECTS` — La petición trae más de cien subjects.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TOO_MANY_SUBJECTS:
                  summary: La petición trae más de cien subjects.
                  value:
                    status: 422
                    code: TOO_MANY_SUBJECTS
                    message: La petición trae más de cien subjects.
      security:
      - serviceAuth:
        - profile-delivery:read
      x-keel-scopes:
      - profile-delivery:read
      x-keel-audience: services
components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de usuario emitido por el servidor de identidad del despliegue y validado en local contra sus claves
        públicas. Los permisos exigidos por cada operación están en `x-keel-permissions`; las de `/me` no exigen ninguno
        — el alcance lo da el claim `sub`.
    serviceAuth:
      type: oauth2
      description: Credencial de máquina (OAuth2 client credentials). El `tokenUrl` real es parámetro de despliegue; la
        audiencia `user-profile` se valida, así que un token emitido para otro servicio responde 403.
      flows:
        clientCredentials:
          tokenUrl: https://identity.invalid/oauth2/token
          scopes:
            profile-contact:read: Resolver el contacto de una persona por su subject, sin ninguna dirección postal.
            profile-delivery:read: Resolver el contacto de una persona junto con su dirección de envío por defecto.
  schemas:
    SubjectIdentifier:
      type: string
      minLength: 1
      maxLength: 255
      description: 'Identificador opaco e inmutable del sujeto tal como lo emite el servidor de identidad. Es la clave de
        negocio del perfil: no se interpreta, no se parsea y no se deriva de él ningún otro dato.'
    EmailAddress:
      type: string
      pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
      maxLength: 254
      description: Dirección de correo electrónico de contacto.
    PhoneNumber:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      description: Teléfono de contacto en formato E.164, con prefijo internacional.
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: País de la dirección, en ISO 3166-1 alpha-2.
    PostalCode:
      type: string
      minLength: 1
      maxLength: 16
      description: 'Código postal tal como lo escribe quien envía la dirección. Sin pattern a propósito: cada país tiene
        el suyo y hay países que no tienen ninguno.'
    SubdivisionCode:
      type: string
      pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
      description: Código de la división territorial de primer nivel en ISO 3166-2 (CO-ANT, ES-M, US-CA). Es la única codificación
        territorial con cobertura mundial publicada, y por eso la única cuya forma valida este servicio.
    TerritoryCode:
      type: string
      minLength: 1
      maxLength: 32
      description: Código de la división territorial de segundo nivel en la codificación nacional del país declarado en
        countryCode. Opaco y sin patrón universal.
    ProfileStatus:
      type: string
      enum:
      - draft
      - complete
      - deactivated
      description: 'Situación del perfil respecto de su completitud y su vigencia operativa. draft NO es un error: el perfil
        nace incompleto con lo que el token traiga y se completa por perfilado progresivo.'
    AddressType:
      type: string
      enum:
      - shipping
      - billing
      description: Para qué sirve la dirección. Solo una dirección shipping marcada por defecto cuenta para que el perfil
        esté completo, y el «como mucho una por defecto» se cuenta por tipo.
    DeletionReason:
      type: string
      enum:
      - self-service
      - back-office
      description: Por qué vía se pidió el borrado.
    UnresolvedReason:
      type: string
      enum:
      - not-found
      - deleted
      - incomplete
      description: Por qué un subject pedido en un lote no se pudo resolver.
    PostalAddress:
      type: object
      description: 'Dirección postal tal como la escribió quien la dio, con el nombre de cada territorio al lado de su código.
        El nombre se copia al guardar y no se vuelve a resolver nunca: una dirección es un hecho histórico. Este servicio
        valida la FORMA y nunca la EXISTENCIA — no comprueba contra ningún catálogo que el territorio exista, que el código
        y el nombre se correspondan, ni que la localidad pertenezca a la división de primer nivel declarada.'
      required:
      - line1
      - countryCode
      - localityName
      properties:
        line1:
          type: string
          maxLength: 140
          description: Vía y número.
        line2:
          type:
          - string
          - 'null'
          maxLength: 140
          description: Complemento (piso, puerta, torre).
        line3:
          type:
          - string
          - 'null'
          maxLength: 140
          description: Referencias adicionales de entrega.
        postalCode:
          anyOf:
          - $ref: '#/components/schemas/PostalCode'
          - type: 'null'
          description: 'Opcional: hay países donde no existe y países donde existe pero nadie lo escribe.'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        adminAreaCode:
          anyOf:
          - $ref: '#/components/schemas/SubdivisionCode'
          - type: 'null'
          description: 'División de primer nivel: departamento, provincia o state. Opcional.'
        adminAreaName:
          type:
          - string
          - 'null'
          maxLength: 120
          description: Nombre de la división de primer nivel. Obligatorio si viene adminAreaCode; opcional si no, porque
            hay países que no tienen ese nivel.
        localityCode:
          anyOf:
          - $ref: '#/components/schemas/TerritoryCode'
          - type: 'null'
          description: 'División de segundo nivel: municipio, ayuntamiento o city. Opcional.'
        localityName:
          type: string
          maxLength: 120
          description: 'Nombre de la localidad. Obligatorio siempre: no hay país donde una dirección postal no nombre una.'
    Address:
      type: object
      description: Una ranura con etiqueta, tipo y marca de defecto que contiene una dirección postal. Solo aparece anidada
        bajo el perfil que la posee.
      required:
      - id
      - label
      - type
      - postal
      - isDefault
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          maxLength: 60
          description: Nombre con el que la persona reconoce la dirección (casa, oficina).
        type:
          $ref: '#/components/schemas/AddressType'
        postal:
          $ref: '#/components/schemas/PostalAddress'
        isDefault:
          type: boolean
          default: false
          description: Marca la dirección elegida por defecto para su type; como mucho una por type.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    UserProfile:
      type: object
      description: Lo que este servicio sabe de una persona para poder operar con ella. Nada de lo que sirve para entrar
        (credenciales, MFA, sesiones, roles) vive aquí.
      required:
      - id
      - subject
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        contactEmail:
          anyOf:
          - $ref: '#/components/schemas/EmailAddress'
          - type: 'null'
          description: 'Réplica de solo lectura del claim de email del token. Ninguna operación de la API lo cambia: solo
            se refresca al aprovisionar.'
        givenName:
          type:
          - string
          - 'null'
          maxLength: 100
        familyName:
          type:
          - string
          - 'null'
          maxLength: 100
        displayName:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Nombre con el que dirigirse a la persona; se siembra del token al aprovisionar y el usuario puede
            cambiarlo.
        contactPhone:
          anyOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
          description: 'Teléfono de contacto del negocio, nunca una credencial: el que actúa como segundo factor vive en
            el servidor de identidad.'
        status:
          $ref: '#/components/schemas/ProfileStatus'
        lockVersion:
          type: integer
          readOnly: true
          description: Versión del agregado. Viaja también en los diez eventos, para que un consumidor descarte lo que llegue
            tarde.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          maxItems: 20
          description: Direcciones de la persona, dentro del mismo agregado.
    UserProfileSummary:
      type: object
      description: 'El perfil sin sus direcciones, tal como lo devuelve el listado de back-office: buscar a una persona
        no necesita su domicilio.'
      required:
      - id
      - subject
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        contactEmail:
          anyOf:
          - $ref: '#/components/schemas/EmailAddress'
          - type: 'null'
          description: 'Réplica de solo lectura del claim de email del token. Ninguna operación de la API lo cambia: solo
            se refresca al aprovisionar.'
        givenName:
          type:
          - string
          - 'null'
          maxLength: 100
        familyName:
          type:
          - string
          - 'null'
          maxLength: 100
        displayName:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Nombre con el que dirigirse a la persona; se siembra del token al aprovisionar y el usuario puede
            cambiarlo.
        contactPhone:
          anyOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
          description: 'Teléfono de contacto del negocio, nunca una credencial: el que actúa como segundo factor vive en
            el servidor de identidad.'
        status:
          $ref: '#/components/schemas/ProfileStatus'
        lockVersion:
          type: integer
          readOnly: true
          description: Versión del agregado. Viaja también en los diez eventos, para que un consumidor descarte lo que llegue
            tarde.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    DeletedSubject:
      type: object
      description: 'Lápida de un subject cuyo perfil fue borrado. No guarda ningún dato de contacto ni ninguna dirección:
        toda la información personal se purga en el borrado. Es permanente y solo la levanta reinstateSubject.'
      required:
      - subject
      - deletedAt
      - deletedBy
      - reason
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        deletedAt:
          type: string
          format: date-time
        deletedBy:
          type: string
          maxLength: 255
          description: 'Quién pidió el borrado: el propio subject si fue autoservicio, el operador si fue back-office.'
        reason:
          $ref: '#/components/schemas/DeletionReason'
    ContactDetails:
      type: object
      description: Bloque de contacto de una persona, sin ninguna dirección postal.
      required:
      - subject
      - status
      - version
      - updatedAt
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        displayName:
          type:
          - string
          - 'null'
          maxLength: 200
        givenName:
          type:
          - string
          - 'null'
          maxLength: 100
        familyName:
          type:
          - string
          - 'null'
          maxLength: 100
        contactEmail:
          anyOf:
          - $ref: '#/components/schemas/EmailAddress'
          - type: 'null'
        contactPhone:
          anyOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version:
          type: integer
          description: Versión del agregado al responder; permite descartar una actualización más vieja que la ya aplicada.
        updatedAt:
          type: string
          format: date-time
    DeliveryProfile:
      type: object
      description: 'Contacto de una persona más su dirección de envío por defecto. Es lo que necesita quien tiene que entregarle
        algo, y lo que congela como snapshot inmutable del pedido: la dirección viaja entera, códigos incluidos, porque
        no se puede volver a pedir.'
      required:
      - subject
      - status
      - version
      - updatedAt
      - shippingAddress
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        displayName:
          type:
          - string
          - 'null'
          maxLength: 200
        givenName:
          type:
          - string
          - 'null'
          maxLength: 100
        familyName:
          type:
          - string
          - 'null'
          maxLength: 100
        contactEmail:
          anyOf:
          - $ref: '#/components/schemas/EmailAddress'
          - type: 'null'
        contactPhone:
          anyOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version:
          type: integer
          description: Versión del agregado al responder; permite descartar una actualización más vieja que la ya aplicada.
        updatedAt:
          type: string
          format: date-time
        shippingAddress:
          allOf:
          - $ref: '#/components/schemas/PostalAddress'
          description: 'La dirección de tipo shipping marcada por defecto, sin id, sin label y sin isDefault: son de la
            UX del usuario, no del consumidor.'
    UnresolvedSubject:
      type: object
      description: 'Un subject que el lote no pudo resolver, con el porqué. Distinguir not-found de deleted es contrato:
        es lo que permite purgar las copias de quien se borró sin purgar las de quien todavía no ha entrado.'
      required:
      - subject
      - reason
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        reason:
          $ref: '#/components/schemas/UnresolvedReason'
    UpdateMyContactDetailsRequest:
      type: object
      description: 'Reemplazo COMPLETO del bloque de contacto editable: un campo que no venga se borra. No incluye contactEmail,
        que es del servidor de identidad.'
      properties:
        givenName:
          type:
          - string
          - 'null'
          maxLength: 100
        familyName:
          type:
          - string
          - 'null'
          maxLength: 100
        displayName:
          type:
          - string
          - 'null'
          maxLength: 200
        contactPhone:
          anyOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
    AddMyAddressRequest:
      type: object
      required:
      - label
      - type
      - postal
      properties:
        label:
          type: string
          maxLength: 60
        type:
          $ref: '#/components/schemas/AddressType'
        postal:
          $ref: '#/components/schemas/PostalAddress'
        isDefault:
          type: boolean
          default: false
    UpdateMyAddressRequest:
      type: object
      required:
      - label
      - type
      - postal
      description: Reemplazo completo del contenido de la dirección; isDefault no se toca aquí.
      properties:
        label:
          type: string
          maxLength: 60
        type:
          $ref: '#/components/schemas/AddressType'
        postal:
          $ref: '#/components/schemas/PostalAddress'
    ResolveSubjectsBatchRequest:
      type: object
      required:
      - subjects
      description: De uno a cien subjects. La cota superior falla con TOO_MANY_SUBJECTS (422), un code propio y estable.
      properties:
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectIdentifier'
          minItems: 1
    ContactEnvelope:
      type: object
      required:
      - profile
      properties:
        profile:
          $ref: '#/components/schemas/ContactDetails'
    DeliveryEnvelope:
      type: object
      required:
      - profile
      properties:
        profile:
          $ref: '#/components/schemas/DeliveryProfile'
    ContactBatchResponse:
      type: object
      required:
      - profiles
      - unresolved
      description: Los dos arrays salen en el orden de la petición. El lote nunca falla entero por un subject que no resuelve.
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ContactDetails'
        unresolved:
          type: array
          items:
            $ref: '#/components/schemas/UnresolvedSubject'
    DeliveryBatchResponse:
      type: object
      required:
      - profiles
      - unresolved
      description: Los dos arrays salen en el orden de la petición. Un perfil sin dirección de envío por defecto sale en
        unresolved con reason incomplete, no se omite en silencio.
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryProfile'
        unresolved:
          type: array
          items:
            $ref: '#/components/schemas/UnresolvedSubject'
    PagedUserProfileSummary:
      type: object
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      description: Sobre canónico de paginación del DSL Keel.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    Error:
      type: object
      description: Forma única del cuerpo de error del servicio.
      required:
      - status
      - code
      - message
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
          description: Nombre del status HTTP.
        code:
          type: string
          description: Código de negocio estable; es el contrato.
        message:
          type: string
          description: Texto humano; no es contrato y puede cambiar o localizarse.
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: string
