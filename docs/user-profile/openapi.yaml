openapi: 3.1.0
info:
  title: user-profile
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: 'Guarda el perfil de negocio de cada persona autenticada (datos de contacto y direcciones postales) indexado
    por el sub del token, sin duplicar nada de lo que es del servidor de identidad: lo aprovisiona just-in-time en la primera
    petición, lo deja editar a su titular, lo gestiona desde back-office con borrado definitivo por lápida y lo sirve a otros
    servidores en proyecciones separadas de contacto y de entrega.


    Contrato HTTP derivado del diseño Keel. Tres superficies separadas por prefijo de ruta, sin endpoints compartidos:


    - `/me/...` — el titular del token (OIDC): el subject sale siempre del claim `sub`, nunca del cuerpo ni de la ruta. La
    primera petición aprovisiona el perfil en `draft`; un token de máquina recibe `403 SUBJECT_NOT_PROVISIONABLE` y un subject
    con lápida `410 PROFILE_DELETED`.

    - `/management/...` — back-office, indexado por subject: roles `profile-support` (leer, desactivar) y `profile-admin`
    (además, borrar y levantar lápidas).

    - `/services/...` — otros servidores (OAuth2 client credentials, audiencia `user-profile`): scope `profile-contact:read`
    (contacto, sin dirección) o `profile-delivery:read` (entrega, con la dirección shipping predeterminada).


    **Nulos**: todo campo declarado viaja; sin valor, como `null`. Una colección vacía viaja como `[]`. Los instantes son
    ISO-8601 en UTC con milisegundos y `Z`.


    **Versión**: `lockVersion` empieza en 0 y sube 1 por mutación confirmada del agregado; una mutación sin cambios no la
    sube. Dos escrituras concurrentes sobre el mismo perfil: `409 CONCURRENT_MODIFICATION`.


    **Orden**: `addresses` viaja en orden de alta (la última añadida, al final). La validación de forma (`400`) precede a
    cualquier otra guarda.'
servers:
- url: '{baseUrl}'
  description: El host y el puerto son parámetro de despliegue, nunca dato de diseño.
  variables:
    baseUrl:
      default: http://localhost:8080
      description: Raíz del servicio desplegado.
tags:
- name: Titular (/me)
  description: 'El perfil del titular del token: lectura, contacto y direcciones, y borrado propio.'
- name: Back-office
  description: Listado, ficha, (des)activación, borrado por lápida y levantamiento de lápidas.
- name: Servidor a servidor
  description: Proyecciones de contacto y de entrega, individuales (con caché) y por lote.
paths:
  /api/v1/me/profile:
    get:
      operationId: getMyProfile
      summary: Devuelve el perfil del titular del token con sus direcciones. Un usuario nuevo recibe su perfil recién aprovisionado
        en draft, nunca un 404.
      tags:
      - Titular (/me)
      description: '- Antes de leer ejecuta provisionProfileFromIdentity con los claims del token (por eso esta query puede
        escribir); sus errores se propagan tal cual: 403 SUBJECT_NOT_PROVISIONABLE con un token de máquina y 410 PROFILE_DELETED
        con lápida.

        - Un perfil deactivated se devuelve igual, con su status.

        - addresses viaja en orden de alta, de la más antigua a la más reciente.'
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`SUBJECT_NOT_PROVISIONABLE` — El token es de un cliente máquina: no hay una persona a la que crearle
            perfil. (propagado de provisionProfileFromIdentity)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SUBJECT_NOT_PROVISIONABLE:
                  summary: 'El token es de un cliente máquina: no hay una persona a la que crearle perfil. (propagado de provisionProfileFromIdentit'
                  value:
                    status: 403
                    code: SUBJECT_NOT_PROVISIONABLE
                    message: 'El token es de un cliente máquina: no hay una persona a la que crearle perfil. (propagado de
                      provisionProfileFromIdentity)'
        '410':
          description: '`PROFILE_DELETED` — El titular tiene lápida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DELETED:
                  summary: El titular tiene lápida.
                  value:
                    status: 410
                    code: PROFILE_DELETED
                    message: El titular tiene lápida.
      security:
      - userAuth: []
      x-keel-audience: users
      x-keel-access-level: required
    delete:
      operationId: deleteMyProfile
      summary: Borra el perfil del titular con sus direcciones y deja una lápida self-service. Repetirlo devuelve el mismo
        éxito.
      tags:
      - Titular (/me)
      description: '- No ejecuta provisionProfileFromIdentity. Un token de máquina no tiene nunca perfil ni lápida, así que
        recibe PROFILE_NOT_FOUND.

        - Si existe perfil (en cualquier estado, también deactivated): en una sola transacción borra el perfil con sus direcciones,
        escribe la lápida con reason self-service, deletedBy = callerSubject y deletedAt = ahora, y publica ProfileDeleted.

        - Si no hay perfil pero existe lápida, responde el mismo éxito sin reescribir la lápida y sin publicar evento.

        - Si dos borrados del mismo perfil chocan, el que pierde relee y responde como una repetición.'
      responses:
        '204':
          description: Sin contenido.
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '404':
          description: '`PROFILE_NOT_FOUND` — No existe perfil ni lápida para el titular.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_NOT_FOUND:
                  summary: No existe perfil ni lápida para el titular.
                  value:
                    status: 404
                    code: PROFILE_NOT_FOUND
                    message: No existe perfil ni lápida para el titular.
        '409':
          description: '`CONCURRENT_MODIFICATION` — Otra escritura que no es un borrado confirmó antes sobre el mismo perfil.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura que no es un borrado confirmó antes sobre el mismo perfil.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura que no es un borrado confirmó antes sobre el mismo perfil.
      security:
      - userAuth: []
      x-keel-audience: users
      x-keel-access-level: required
      x-keel-emits:
      - ProfileDeleted
  /api/v1/me/profile/contact-details:
    put:
      operationId: updateMyContactDetails
      summary: 'Reemplaza el bloque de contacto del titular: givenName, familyName, displayName y contactPhone. El email queda
        fuera: es del servidor de identidad.'
      tags:
      - Titular (/me)
      description: '- Antes de nada ejecuta provisionProfileFromIdentity; sus errores se propagan tal cual: 403 SUBJECT_NOT_PROVISIONABLE
        con un token de máquina y 410 PROFILE_DELETED con lápida.

        - Es un reemplazo completo del bloque: un campo ausente o null se borra. Una petición sin cuerpo los borra todos.

        - No recibe la versión leída por el cliente: entre dos dispositivos del mismo titular gana la última escritura confirmada
        (aceptado por el diseñador); solo dos escrituras estrictamente simultáneas chocan con CONCURRENT_MODIFICATION.

        - contactEmail no se puede cambiar por aquí; si el cuerpo lo trae, se ignora.

        - Si el perfil está deactivated, falla con PROFILE_DEACTIVATED.

        - Si el bloque resultante es igual al guardado, no hay mutación ni evento.

        - Si hay mutación, recalcula el status y publica ProfileContactDetailsChanged.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyContactDetailsRequest'
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`SUBJECT_NOT_PROVISIONABLE` — El token es de un cliente máquina: no hay una persona a la que crearle
            perfil. (propagado de provisionProfileFromIdentity)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SUBJECT_NOT_PROVISIONABLE:
                  summary: 'El token es de un cliente máquina: no hay una persona a la que crearle perfil. (propagado de provisionProfileFromIdentit'
                  value:
                    status: 403
                    code: SUBJECT_NOT_PROVISIONABLE
                    message: 'El token es de un cliente máquina: no hay una persona a la que crearle perfil. (propagado de
                      provisionProfileFromIdentity)'
        '409':
          description: '`PROFILE_DEACTIVATED` — El perfil está deactivated: no admite mutaciones por la API.


            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo perfil.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DEACTIVATED:
                  summary: 'El perfil está deactivated: no admite mutaciones por la API.'
                  value:
                    status: 409
                    code: PROFILE_DEACTIVATED
                    message: 'El perfil está deactivated: no admite mutaciones por la API.'
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura confirmó antes sobre el mismo perfil.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura confirmó antes sobre el mismo perfil.
        '410':
          description: '`PROFILE_DELETED` — El titular tiene lápida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DELETED:
                  summary: El titular tiene lápida.
                  value:
                    status: 410
                    code: PROFILE_DELETED
                    message: El titular tiene lápida.
      security:
      - userAuth: []
      x-keel-audience: users
      x-keel-access-level: required
      x-keel-emits:
      - ProfileContactDetailsChanged
  /api/v1/me/profile/addresses:
    post:
      operationId: addMyAddress
      summary: Añade una dirección al perfil del titular; si se pide isDefault, pasa a ser la predeterminada de su tipo.
      tags:
      - Titular (/me)
      description: '- Precondición: Si postal.adminAreaCode tiene valor, postal.adminAreaName también.

        - Precondición: Si postal.adminAreaCode tiene valor, su prefijo es igual a postal.countryCode.

        - Los errores se evalúan en el orden en que están declarados: el primero que aplique es el que se responde.

        - La Idempotency-Key es opcional; sin ella la operación se ejecuta sin deduplicar.

        - Después de las comprobaciones de idempotencia ejecuta provisionProfileFromIdentity; sus errores se propagan tal
        cual y en ese punto de la precedencia: 403 SUBJECT_NOT_PROVISIONABLE con un token de máquina antes que PROFILE_DELETED.

        - El límite de 20 direcciones cuenta las de ambos tipos.

        - Solo se valida la forma de los códigos territoriales, nunca su existencia.

        - isDefault vale false si se omite; la primera dirección de un tipo no se marca predeterminada sola.

        - Si isDefault es true, desmarca la predeterminada anterior de ese tipo en la misma transacción y publica solo AddressAdded
        (nunca también DefaultAddressChanged: serían dos eventos con la misma versión).

        - Recalcula el status y publica AddressAdded.

        - La dirección añadida es siempre la última de addresses en la respuesta (orden de alta); así identifica el cliente
        su addressId.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 'Clave del intento, opcional, acotada al titular y recordada 24 h: un reintento con la misma clave devuelve
          la respuesta original sin repetir el efecto. Sin ella la operación se ejecuta sin deduplicar.'
        schema:
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMyAddressRequest'
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`SUBJECT_NOT_PROVISIONABLE` — El token es de un cliente máquina: no hay una persona a la que crearle
            perfil. (propagado de provisionProfileFromIdentity)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SUBJECT_NOT_PROVISIONABLE:
                  summary: 'El token es de un cliente máquina: no hay una persona a la que crearle perfil. (propagado de provisionProfileFromIdentit'
                  value:
                    status: 403
                    code: SUBJECT_NOT_PROVISIONABLE
                    message: 'El token es de un cliente máquina: no hay una persona a la que crearle perfil. (propagado de
                      provisionProfileFromIdentity)'
        '409':
          description: '`IDEMPOTENCY_KEY_IN_PROGRESS` — Otra petición con la misma Idempotency-Key del mismo titular se está
            ejecutando.


            `IDEMPOTENCY_KEY_REUSED` — La Idempotency-Key ya se usó con un cuerpo distinto.


            `PROFILE_DEACTIVATED` — El perfil está deactivated.


            `ADDRESS_LIMIT_REACHED` — El perfil ya tiene 20 direcciones.


            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo perfil.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                IDEMPOTENCY_KEY_IN_PROGRESS:
                  summary: Otra petición con la misma Idempotency-Key del mismo titular se está ejecutando.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_IN_PROGRESS
                    message: Otra petición con la misma Idempotency-Key del mismo titular se está ejecutando.
                IDEMPOTENCY_KEY_REUSED:
                  summary: La Idempotency-Key ya se usó con un cuerpo distinto.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
                    message: La Idempotency-Key ya se usó con un cuerpo distinto.
                PROFILE_DEACTIVATED:
                  summary: El perfil está deactivated.
                  value:
                    status: 409
                    code: PROFILE_DEACTIVATED
                    message: El perfil está deactivated.
                ADDRESS_LIMIT_REACHED:
                  summary: El perfil ya tiene 20 direcciones.
                  value:
                    status: 409
                    code: ADDRESS_LIMIT_REACHED
                    message: El perfil ya tiene 20 direcciones.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura confirmó antes sobre el mismo perfil.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura confirmó antes sobre el mismo perfil.
        '410':
          description: '`PROFILE_DELETED` — El titular tiene lápida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DELETED:
                  summary: El titular tiene lápida.
                  value:
                    status: 410
                    code: PROFILE_DELETED
                    message: El titular tiene lápida.
        '422':
          description: '`SUBDIVISION_CODE_COUNTRY_MISMATCH` — El prefijo de postal.adminAreaCode no coincide con postal.countryCode.


            `TERRITORY_NAME_MISSING` — postal.adminAreaCode viene sin postal.adminAreaName.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SUBDIVISION_CODE_COUNTRY_MISMATCH:
                  summary: El prefijo de postal.adminAreaCode no coincide con postal.countryCode.
                  value:
                    status: 422
                    code: SUBDIVISION_CODE_COUNTRY_MISMATCH
                    message: El prefijo de postal.adminAreaCode no coincide con postal.countryCode.
                TERRITORY_NAME_MISSING:
                  summary: postal.adminAreaCode viene sin postal.adminAreaName.
                  value:
                    status: 422
                    code: TERRITORY_NAME_MISSING
                    message: postal.adminAreaCode viene sin postal.adminAreaName.
      security:
      - userAuth: []
      x-keel-audience: users
      x-keel-access-level: required
      x-keel-idempotency:
        keySource: client-key
        ttlSeconds: 86400
        partitionBy:
        - callerSubject
      x-keel-emits:
      - AddressAdded
  /api/v1/me/profile/addresses/{addressId}:
    put:
      operationId: updateMyAddress
      summary: Reemplaza label, tipo y dirección postal de una dirección del titular. No toca isDefault, salvo al cambiar
        de tipo.
      tags:
      - Titular (/me)
      description: '- Precondición: Si postal.adminAreaCode tiene valor, postal.adminAreaName también.

        - Precondición: Si postal.adminAreaCode tiene valor, su prefijo es igual a postal.countryCode.

        - Antes de nada ejecuta provisionProfileFromIdentity; sus errores se propagan tal cual: 403 SUBJECT_NOT_PROVISIONABLE
        con un token de máquina y 410 PROFILE_DELETED con lápida.

        - Los errores se evalúan en el orden en que están declarados: el primero que aplique es el que se responde.

        - Es un reemplazo completo: label ausente queda a null.

        - Si type cambia, la dirección pierde isDefault: era la predeterminada del tipo anterior y no pasa a serlo del nuevo
        sin pedirlo. Por eso cambiar una shipping predeterminada a billing puede devolver el perfil a draft.

        - Si type no cambia, isDefault se conserva.

        - Si el resultado es igual a lo guardado, no hay mutación ni evento.

        - Si hay mutación, recalcula el status y publica AddressChanged.'
      parameters:
      - name: addressId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Id de la dirección.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyAddressRequest'
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`SUBJECT_NOT_PROVISIONABLE` — El token es de un cliente máquina: no hay una persona a la que crearle
            perfil. (propagado de provisionProfileFromIdentity)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SUBJECT_NOT_PROVISIONABLE:
                  summary: 'El token es de un cliente máquina: no hay una persona a la que crearle perfil. (propagado de provisionProfileFromIdentit'
                  value:
                    status: 403
                    code: SUBJECT_NOT_PROVISIONABLE
                    message: 'El token es de un cliente máquina: no hay una persona a la que crearle perfil. (propagado de
                      provisionProfileFromIdentity)'
        '404':
          description: '`ADDRESS_NOT_FOUND` — El perfil del titular no tiene una dirección con ese addressId.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ADDRESS_NOT_FOUND:
                  summary: El perfil del titular no tiene una dirección con ese addressId.
                  value:
                    status: 404
                    code: ADDRESS_NOT_FOUND
                    message: El perfil del titular no tiene una dirección con ese addressId.
        '409':
          description: '`PROFILE_DEACTIVATED` — El perfil está deactivated.


            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo perfil.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DEACTIVATED:
                  summary: El perfil está deactivated.
                  value:
                    status: 409
                    code: PROFILE_DEACTIVATED
                    message: El perfil está deactivated.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura confirmó antes sobre el mismo perfil.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura confirmó antes sobre el mismo perfil.
        '410':
          description: '`PROFILE_DELETED` — El titular tiene lápida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DELETED:
                  summary: El titular tiene lápida.
                  value:
                    status: 410
                    code: PROFILE_DELETED
                    message: El titular tiene lápida.
        '422':
          description: '`SUBDIVISION_CODE_COUNTRY_MISMATCH` — El prefijo de postal.adminAreaCode no coincide con postal.countryCode.


            `TERRITORY_NAME_MISSING` — postal.adminAreaCode viene sin postal.adminAreaName.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SUBDIVISION_CODE_COUNTRY_MISMATCH:
                  summary: El prefijo de postal.adminAreaCode no coincide con postal.countryCode.
                  value:
                    status: 422
                    code: SUBDIVISION_CODE_COUNTRY_MISMATCH
                    message: El prefijo de postal.adminAreaCode no coincide con postal.countryCode.
                TERRITORY_NAME_MISSING:
                  summary: postal.adminAreaCode viene sin postal.adminAreaName.
                  value:
                    status: 422
                    code: TERRITORY_NAME_MISSING
                    message: postal.adminAreaCode viene sin postal.adminAreaName.
      security:
      - userAuth: []
      x-keel-audience: users
      x-keel-access-level: required
      x-keel-emits:
      - AddressChanged
