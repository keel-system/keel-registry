components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de persona (OIDC) del proveedor de identidad del despliegue. El permiso exigido por cada operación
        de back-office está en `x-keel-permissions`; los roles que lo conceden, en `x-keel-roles`.
    serviceAuth:
      type: oauth2
      description: Credencial de máquina (OAuth2 client credentials). El `tokenUrl` real es parámetro de despliegue; se valida
        la audiencia `user-profile`, así que un token emitido para otro servicio responde 403.
      flows:
        clientCredentials:
          tokenUrl: https://identity.invalid/oauth2/token
          scopes:
            profile-contact:read: Resolver la proyección de contacto, sin dirección (M2M).
            profile-delivery:read: Resolver la proyección de entrega, con la dirección shipping (M2M).
  schemas:
    SubjectIdentifier:
      type: string
      minLength: 1
      maxLength: 255
      description: 'Identificador opaco del sujeto (claim sub del token). Inmutable y clave de negocio del perfil. No se interpreta
        ni se normaliza: se compara byte a byte.'
    EmailAddress:
      type: string
      maxLength: 254
      pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
      description: 'Dirección de correo con forma simple (algo@algo.algo). Nunca es clave: puede cambiar de dueño.'
    PhoneNumber:
      type: string
      pattern: ^\+[1-9][0-9]{1,14}$
      description: 'Teléfono en formato E.164: + seguido de entre 2 y 15 dígitos, sin espacios ni separadores.'
    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      description: Nombre de persona (nombre de pila, apellidos o nombre visible) en texto libre.
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: País en ISO 3166-1 alpha-2, en mayúsculas.
    PostalCode:
      type: string
      minLength: 1
      maxLength: 16
      description: 'Código postal tal como lo escribe el país. Sin patrón a propósito: cada país tiene su formato y algunos
        no tienen código postal.'
    SubdivisionCode:
      type: string
      pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
      description: Subdivisión de primer nivel en ISO 3166-2 (CO-ANT, ES-M, US-CA). El prefijo es el país.
    TerritoryCode:
      type: string
      minLength: 1
      maxLength: 32
      description: 'Código opaco de segundo nivel territorial (municipio, ciudad, comuna). No existe una codificación universal:
        se interpreta según el país.'
    TerritoryName:
      type: string
      minLength: 1
      maxLength: 120
      description: Nombre de una unidad territorial, copiado al guardar y nunca resuelto de nuevo.
    AddressLine:
      type: string
      minLength: 1
      maxLength: 140
      description: Una línea de dirección postal.
    ProfileStatus:
      type: string
      enum:
      - draft
      - complete
      - deactivated
      description: Situación del perfil. draft es un estado normal (faltan datos para operar), no un error.
    AddressType:
      type: string
      enum:
      - shipping
      - billing
      description: Uso de una dirección.
    DeletionReason:
      type: string
      enum:
      - self-service
      - back-office
      description: 'Por qué vía se borró el perfil. Cerrado a propósito: la lápida no puede acumular PII en texto libre.'
    UnresolvedReason:
      type: string
      enum:
      - not-found
      - deleted
      - incomplete
      description: Por qué un subject pedido en lote no se resolvió.
    PostalAddress:
      type: object
      required:
      - line1
      - line2
      - line3
      - postalCode
      - countryCode
      - adminAreaCode
      - adminAreaName
      - localityCode
      - localityName
      properties:
        line1:
          $ref: '#/components/schemas/AddressLine'
          description: 'Primera línea: vía y número.'
        line2:
          anyOf:
          - $ref: '#/components/schemas/AddressLine'
          - type: 'null'
          description: 'Segunda línea: piso, apartamento, referencia.'
        line3:
          anyOf:
          - $ref: '#/components/schemas/AddressLine'
          - type: 'null'
          description: Tercera línea, para los países que la usan.
        postalCode:
          anyOf:
          - $ref: '#/components/schemas/PostalCode'
          - type: 'null'
          description: Código postal; opcional porque hay países sin él.
        countryCode:
          $ref: '#/components/schemas/CountryCode'
          description: País de la dirección.
        adminAreaCode:
          anyOf:
          - $ref: '#/components/schemas/SubdivisionCode'
          - type: 'null'
          description: Nivel territorial 1 (departamento, estado, provincia) en ISO 3166-2.
        adminAreaName:
          anyOf:
          - $ref: '#/components/schemas/TerritoryName'
          - type: 'null'
          description: Nombre del nivel 1 tal como lo mandó el llamante. Obligatorio si viene adminAreaCode.
        localityCode:
          anyOf:
          - $ref: '#/components/schemas/TerritoryCode'
          - type: 'null'
          description: Nivel territorial 2 (municipio, ciudad), opaco e interpretado según el país.
        localityName:
          $ref: '#/components/schemas/TerritoryName'
          description: Nombre del nivel 2 (ciudad o municipio). Es el único nivel territorial obligatorio.
      description: 'Dirección postal internacional. Es la unidad que viaja (respuestas, eventos, M2M). Los dos niveles territoriales
        tienen nombres genéricos; el nombre se denormaliza al guardar y no se vuelve a resolver: que código y nombre diverjan
        con los años es historia, no inconsistencia. localityCode se interpreta según countryCode. De los códigos territoriales
        solo se valida la forma, nunca su existencia: el servicio no consulta ningún catálogo territorial; eso es responsabilidad
        del llamante.'
    ContactDetails:
      type: object
      required:
      - subject
      - displayName
      - givenName
      - familyName
      - contactEmail
      - contactPhone
      - status
      - version
      - updatedAt
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        displayName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
        givenName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
        familyName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
        contactEmail:
          anyOf:
          - $ref: '#/components/schemas/EmailAddress'
          - type: 'null'
        contactPhone:
          anyOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version:
          type: integer
          format: int32
          description: lockVersion del perfil en el momento de la lectura; el mismo número que llevan los eventos.
        updatedAt:
          type: string
          format: date-time
      description: Proyección M2M de contacto de un perfil, sin ninguna dirección.
    DeliveryProfile:
      type: object
      required:
      - subject
      - displayName
      - givenName
      - familyName
      - contactEmail
      - contactPhone
      - status
      - version
      - updatedAt
      - shippingAddress
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        displayName:
          $ref: '#/components/schemas/PersonName'
        givenName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
        familyName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
        contactEmail:
          $ref: '#/components/schemas/EmailAddress'
        contactPhone:
          $ref: '#/components/schemas/PhoneNumber'
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version:
          type: integer
          format: int32
          description: lockVersion del perfil en el momento de la lectura.
        updatedAt:
          type: string
          format: date-time
        shippingAddress:
          $ref: '#/components/schemas/PostalAddress'
          description: La dirección shipping marcada como predeterminada.
      description: 'Proyección M2M de entrega: el contacto más la dirección shipping por defecto, sin id, label ni isDefault.'
    UnresolvedSubject:
      type: object
      required:
      - subject
      - reason
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        reason:
          $ref: '#/components/schemas/UnresolvedReason'
      description: Un subject de un lote que no se resolvió, con su motivo.
    UserProfile:
      type: object
      description: Perfil de negocio de una persona autenticada. Se crea solo por aprovisionamiento just-in-time; no guarda
        credenciales, MFA, sesiones ni roles.
      required:
      - id
      - subject
      - contactEmail
      - givenName
      - familyName
      - displayName
      - contactPhone
      - status
      - deactivatedBy
      - deactivatedAt
      - lockVersion
      - createdAt
      - updatedAt
      - addresses
      properties:
        id:
          type: string
          format: uuid
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
          description: sub del token. Inmutable; es la clave de negocio y la única pieza compartida con el servidor de identidad.
        contactEmail:
          anyOf:
          - $ref: '#/components/schemas/EmailAddress'
          - type: 'null'
          description: 'Réplica de solo lectura del claim email del token. Ninguna operación de la API lo cambia: solo lo
            escribe el aprovisionamiento.'
        givenName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
          description: Nombre de pila.
        familyName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
          description: Apellidos.
        displayName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
          description: Nombre con el que se muestra a la persona.
        contactPhone:
          anyOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
          description: Teléfono de contacto de negocio. No es el teléfono de MFA, aunque coincida.
        status:
          $ref: '#/components/schemas/ProfileStatus'
          description: Se recalcula en cada mutación; ver invariantes.
        deactivatedBy:
          anyOf:
          - $ref: '#/components/schemas/SubjectIdentifier'
          - type: 'null'
          description: Subject del operador que desactivó el perfil; null si no está deactivated.
        deactivatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: Cuándo se desactivó; null si no está deactivated.
        lockVersion:
          type:
          - integer
          - 'null'
          format: int32
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          description: Direcciones del perfil, como máximo 20, siempre en orden de alta (de la más antigua a la más reciente).
    Address:
      type: object
      description: Dirección postal guardada en un perfil, con su uso y si es la predeterminada de ese uso.
      required:
      - id
      - label
      - type
      - postal
      - isDefault
      - createdAt
      - updatedAt
      - userProfileId
      properties:
        id:
          type: string
          format: uuid
        label:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 60
          description: Etiqueta libre que pone la persona (Casa, Oficina).
        type:
          $ref: '#/components/schemas/AddressType'
          description: Uso de la dirección.
        postal:
          $ref: '#/components/schemas/PostalAddress'
          description: La dirección en sí.
        isDefault:
          type: boolean
          description: Predeterminada de su tipo.
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        userProfileId:
          type: string
          format: uuid
          description: Id del perfil al que pertenece.
    DeletedSubject:
