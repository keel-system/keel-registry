                  value:
                    status: 404
                    code: ADDRESS_NOT_FOUND
                    message: No existe una dirección con ese addressId en el perfil de quien llama.
        '409':
          description: '`PROFILE_DEACTIVATED` — El perfil está deactivated y no admite mutaciones hasta que se reactive.

            `CONCURRENT_MODIFICATION` — Otra escritura sobre el mismo perfil confirmó mientras esta estaba en curso; el
            cliente relee y reintenta con la versión nueva.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PROFILE_DEACTIVATED:
                  summary: El perfil está deactivated y no admite mutaciones hasta que se reactive.
                  value:
                    status: 409
                    code: PROFILE_DEACTIVATED
                    message: El perfil está deactivated y no admite mutaciones hasta que se reactive.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura sobre el mismo perfil confirmó mientras esta estaba en curso; el cliente relee
