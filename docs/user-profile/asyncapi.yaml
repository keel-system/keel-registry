asyncapi: 3.0.0
info:
  title: user-profile
  version: 0.1.0
  description: 'Posee el perfil de negocio de cada persona — contacto y direcciones — adoptando por aprovisionamiento just-in-time
    la identidad que crea el servidor de identidad, sin ser nunca dueño de sus credenciales.


    Contrato asíncrono derivado del diseño Keel (capa messaging). El broker concreto y los nombres físicos de topic/cola
    se deciden al generar, no aquí.


    **Este servicio solo publica.** No se suscribe a nada, y en particular **no consume los eventos del servidor de identidad**:
    el aprovisionamiento just-in-time ya cubre todas las vías de alta sin enumerarlas, y un usuario deshabilitado allí deja
    de recibir tokens, así que no llega hasta aquí.


    **La lista es completa sobre la superficie de mutación**: toda vía por la que el dato cambia emite. De esa completitud
    depende que un consumidor pueda mantener una réplica de solo lectura sin que se le pudra, así que no se recorta sin
    versionar.


    **Los eventos llevan estado y llevan `version`.** El estado permite replicar sin llamar de vuelta; la versión permite
    descartar lo que llegue desordenado. El coste, aceptado y escrito: el broker contiene datos personales, y su retención
    es un sitio más que inventariar y justificar.


    **Ninguna operación publica dos eventos a la vez**, para que `version` siga siendo única por agregado y el orden entre
    eventos del mismo perfil sea total.


    **Las tres copias, y solo dos son legítimas.** Un *snapshot inmutable* (la dirección congelada en un pedido) no es una
    copia del perfil sino un dato del pedido. Una *réplica de solo lectura* alimentada por estos eventos es legítima, y
    lo es precisamente porque la lista es completa. Una *réplica mutable* está prohibida: con dos escritores no hay fuente
    de verdad.


    **Ausencia**: todo campo declarado en un payload está presente; el que no tiene valor viaja como nulo, nunca omitido.
    En un evento con estado, omitir un campo que el usuario borró y omitir uno que no cambió se escribirían igual, y el
    consumidor no podría saber si vaciar su copia.'
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/json
channels:
  profileEvents:
    address: profileEvents
    title: profileEvents
    description: 'Hechos del perfil de usuario que publica este servicio; es el único canal del diseño. Nombre lógico: el
      topic/cola físico que lo respalda es parámetro de despliegue.'
    messages:
      ProfileProvisioned:
        $ref: '#/components/messages/ProfileProvisioned'
      ProfileContactEmailRefreshed:
        $ref: '#/components/messages/ProfileContactEmailRefreshed'
      ProfileContactDetailsChanged:
        $ref: '#/components/messages/ProfileContactDetailsChanged'
      AddressAdded:
        $ref: '#/components/messages/AddressAdded'
      AddressChanged:
        $ref: '#/components/messages/AddressChanged'
      AddressRemoved:
        $ref: '#/components/messages/AddressRemoved'
      DefaultAddressChanged:
        $ref: '#/components/messages/DefaultAddressChanged'
      ProfileDeactivated:
        $ref: '#/components/messages/ProfileDeactivated'
      ProfileReactivated:
        $ref: '#/components/messages/ProfileReactivated'
      ProfileDeleted:
        $ref: '#/components/messages/ProfileDeleted'
operations:
  publishProfileProvisioned:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: Nació un perfil al adoptar una identidad en la primera petición autenticada de esa persona.
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileProvisioned'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - provisionProfileFromIdentity
  publishProfileContactEmailRefreshed:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: El correo de contacto se refrescó desde el claim del token durante un aprovisionamiento.
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileContactEmailRefreshed'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - provisionProfileFromIdentity
  publishProfileContactDetailsChanged:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: La persona reemplazó su bloque de contacto editable.
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileContactDetailsChanged'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - updateMyContactDetails
  publishAddressAdded:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: La persona añadió una dirección a su perfil.
    messages:
    - $ref: '#/channels/profileEvents/messages/AddressAdded'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - addMyAddress
  publishAddressChanged:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: La persona reemplazó el contenido de una de sus direcciones.
    messages:
    - $ref: '#/channels/profileEvents/messages/AddressChanged'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - updateMyAddress
  publishAddressRemoved:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: La persona eliminó una de sus direcciones.
    messages:
    - $ref: '#/channels/profileEvents/messages/AddressRemoved'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - removeMyAddress
  publishDefaultAddressChanged:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: La persona eligió otra dirección por defecto para un type.
    messages:
    - $ref: '#/channels/profileEvents/messages/DefaultAddressChanged'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - setMyDefaultAddress
  publishProfileDeactivated:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: Un administrador desactivó el perfil.
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileDeactivated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - deactivateProfile
  publishProfileReactivated:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: Un administrador reactivó el perfil, que vuelve a draft o a complete según los datos que tenga.
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileReactivated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - reactivateProfile
  publishProfileDeleted:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: Se borró el perfil y su información personal quedó purgada.
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileDeleted'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - deleteMyProfile
    - deleteProfile
components:
  messages:
    ProfileProvisioned:
      name: ProfileProvisioned
      title: ProfileProvisioned
      contentType: application/json
      summary: Nació un perfil al adoptar una identidad en la primera petición autenticada de esa persona.
      description: 'Es el primer hecho de todo perfil y el que arranca cualquier réplica. El perfil nace con lo que el token
        traiga: solo el subject es obligatorio, así que contactEmail puede llegar nulo si el cliente no pidió ese scope
        o el proveedor no lo emite.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileProvisionedPayload'
    ProfileContactEmailRefreshed:
      name: ProfileContactEmailRefreshed
      title: ProfileContactEmailRefreshed
      contentType: application/json
      summary: El correo de contacto se refrescó desde el claim del token durante un aprovisionamiento.
      description: 'El aprovisionamiento corre en TODA petición autenticada y refresca el contactEmail cuando el claim difiere
        del almacenado, así que el dato cambia **sin pasar por ningún command**. Sin este evento no hay error, no hay traza,
        y solo se descubre el día que un correo no llega a quien debía. Ocurre en cualquier estado del perfil, incluido
        deactivated: no es una edición del usuario sino el mantenimiento de una réplica cuyo dueño es el servidor de identidad.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileContactEmailRefreshedPayload'
    ProfileContactDetailsChanged:
      name: ProfileContactDetailsChanged
      title: ProfileContactDetailsChanged
      contentType: application/json
      summary: La persona reemplazó su bloque de contacto editable.
      description: No incluye el correo, que no se edita por la API. El status viaja aquí porque los cambios de completitud
        (draft ⇄ complete) no tienen evento propio.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileContactDetailsChangedPayload'
    AddressAdded:
      name: AddressAdded
      title: AddressAdded
      contentType: application/json
      summary: La persona añadió una dirección a su perfil.
      description: 'Si nace marcada por defecto, `isDefault` viene en verdadero y **no** se publica además `DefaultAddressChanged`:
        serían dos eventos con la misma versión y la regla «descarta el más viejo» dejaría de desempatarlos. Que la anterior
        por defecto de ese type deja de serlo lo deriva el consumidor de la invariante publicada: como mucho una por defecto
        por tipo.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/AddressAddedPayload'
    AddressChanged:
      name: AddressChanged
      title: AddressChanged
      contentType: application/json
      summary: La persona reemplazó el contenido de una de sus direcciones.
      description: 'Reemplazo completo: el payload lleva la dirección entera tal como quedó, no el delta.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/AddressChangedPayload'
    AddressRemoved:
      name: AddressRemoved
      title: AddressRemoved
      contentType: application/json
      summary: La persona eliminó una de sus direcciones.
      description: '`wasDefault` dice si la eliminada era la de por defecto de su type. En ese caso el perfil queda **sin
        ninguna** para ese type: no se promociona otra automáticamente, porque elegir cuál es decisión del usuario y no
        del servidor.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/AddressRemovedPayload'
    DefaultAddressChanged:
      name: DefaultAddressChanged
      title: DefaultAddressChanged
      contentType: application/json
      summary: La persona eligió otra dirección por defecto para un type.
      description: Solo lo publica `setMyDefaultAddress`. `previousAddressId` viene nulo si no había ninguna marcada antes
        para ese type.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/DefaultAddressChangedPayload'
    ProfileDeactivated:
      name: ProfileDeactivated
      title: ProfileDeactivated
      contentType: application/json
      summary: Un administrador desactivó el perfil.
      description: 'Conserva todos sus datos y todas sus direcciones: desactivar no es borrar, y no toca la identidad en
        el servidor de identidad.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileDeactivatedPayload'
    ProfileReactivated:
      name: ProfileReactivated
      title: ProfileReactivated
      contentType: application/json
      summary: Un administrador reactivó el perfil, que vuelve a draft o a complete según los datos que tenga.
      description: 'Sin este evento un consumidor deja al usuario desactivado **para siempre** en su réplica. El status
        del payload es el recalculado, no un estado anterior restaurado: no se guarda ninguno.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileReactivatedPayload'
    ProfileDeleted:
      name: ProfileDeleted
      title: ProfileDeleted
      contentType: application/json
      summary: Se borró el perfil y su información personal quedó purgada.
      description: 'Es la señal con la que cada consumidor purga sus propias copias, así que su fiabilidad fija la de la
        capa entera. **No lleva ningún dato personal a propósito**: mandar el contacto de quien acaba de ejercer su derecho
        de supresión sería lo contrario de lo que el evento pide hacer.


        Sí lleva `version`, y no por simetría: sin ella, un evento de contacto que llegue tarde se aplicaría después del
        borrado y resucitaría el perfil en la réplica.


        Qué hacer al recibirlo: una réplica de solo lectura borra su copia; un **snapshot inmutable** ya congelado en un
        pedido no es una copia del perfil y no se toca.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileDeletedPayload'
  schemas:
    KeelEventMetadata:
      type: object
      description: Metadata transversal de la envoltura Keel; la estampa el servicio al emitir.
      required:
      - eventId
      - eventType
      - eventVersion
      - occurredAt
      - source
      properties:
        eventId:
          type: string
          format: uuid
          description: Id único de esta ocurrencia; clave de deduplicación del consumidor.
        eventType:
          type: string
          description: Nombre del evento en el diseño; discriminador cuando el canal lleva varios tipos.
        eventVersion:
          type: integer
          minimum: 1
          description: Versión del contrato del payload.
        occurredAt:
          type: string
          format: date-time
          description: Instante UTC en que ocurrió el hecho en el dominio, no el del envío.
        source:
          type: string
          description: Nombre del servicio emisor.
        correlationId:
          type:
          - string
          - 'null'
          description: Correlación de la petición que originó el hecho; null si no hubo contexto.
    SubjectIdentifier:
      type: string
      minLength: 1
      maxLength: 255
      description: Identificador opaco e inmutable del sujeto tal como lo emite el servidor de identidad. Es la clave de
        negocio del perfil y la única costura entre el servidor de identidad y este servicio.
    EmailAddress:
      type: string
      pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
      maxLength: 254
      description: Dirección de correo electrónico de contacto.
    PhoneNumber:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      description: Teléfono de contacto en formato E.164, con prefijo internacional.
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: País en ISO 3166-1 alpha-2.
    PostalCode:
      type: string
      minLength: 1
      maxLength: 16
      description: 'Código postal tal como lo escribe quien envía la dirección. Sin pattern: hay países que no lo tienen.'
    SubdivisionCode:
      type: string
      pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
      description: Código de la división territorial de primer nivel en ISO 3166-2.
    TerritoryCode:
      type: string
      minLength: 1
      maxLength: 32
      description: Código de la división territorial de segundo nivel en la codificación nacional del país declarado en
        countryCode. Opaco y sin patrón universal.
    ProfileStatus:
      type: string
      enum:
      - draft
      - complete
      - deactivated
      description: Situación del perfil respecto de su completitud y su vigencia operativa.
    AddressType:
      type: string
      enum:
      - shipping
      - billing
      description: Para qué sirve la dirección en el negocio.
    DeletionReason:
      type: string
      enum:
      - self-service
      - back-office
      description: Por qué vía se pidió el borrado.
    PostalAddress:
      type: object
      description: 'Dirección postal tal como la escribió quien la dio, con el nombre de cada territorio al lado de su código.
        El nombre se copió al guardar y no se vuelve a resolver nunca: el emisor no valida contra ningún catálogo que el
        territorio exista.'
      required:
      - line1
      - countryCode
      - localityName
      properties:
        line1:
          type: string
          maxLength: 140
        line2:
          type:
          - string
          - 'null'
          maxLength: 140
        line3:
          type:
          - string
          - 'null'
          maxLength: 140
        postalCode:
          anyOf:
          - $ref: '#/components/schemas/PostalCode'
          - type: 'null'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        adminAreaCode:
          anyOf:
          - $ref: '#/components/schemas/SubdivisionCode'
          - type: 'null'
        adminAreaName:
          type:
          - string
          - 'null'
          maxLength: 120
        localityCode:
          anyOf:
          - $ref: '#/components/schemas/TerritoryCode'
          - type: 'null'
        localityName:
          type: string
          maxLength: 120
    ProfileProvisionedPayload:
      type: object
      required:
      - subject
      - status
      - version
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        contactEmail:
          anyOf:
          - $ref: '#/components/schemas/EmailAddress'
          - type: 'null'
        givenName:
          type:
          - string
          - 'null'
          maxLength: 100
        familyName:
          type:
          - string
          - 'null'
          maxLength: 100
        displayName:
          type:
          - string
          - 'null'
          maxLength: 200
        contactPhone:
          anyOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
          description: Nunca viene en el alta; el teléfono lo pone la persona después.
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version: &id001
          type: integer
          description: 'Versión del agregado tras el cambio. Es el mismo lockVersion que devuelve la superficie HTTP: permite
            a un consumidor descartar un evento más viejo que el estado que ya aplicó. Sin ella, dos eventos del mismo perfil
            que lleguen desordenados dejan la réplica mal para siempre.'
    ProfileContactEmailRefreshedPayload:
      type: object
      required:
      - subject
      - contactEmail
      - version
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        contactEmail:
          $ref: '#/components/schemas/EmailAddress'
        version: *id001
    ProfileContactDetailsChangedPayload:
      type: object
      required:
      - subject
      - status
      - version
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        givenName:
          type:
          - string
          - 'null'
          maxLength: 100
        familyName:
          type:
          - string
          - 'null'
          maxLength: 100
        displayName:
          type:
          - string
          - 'null'
          maxLength: 200
        contactPhone:
          anyOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version: *id001
    AddressAddedPayload:
      type: object
      required:
      - subject
      - addressId
      - label
      - type
      - postal
      - isDefault
      - status
      - version
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        addressId:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 60
        type:
          $ref: '#/components/schemas/AddressType'
        postal:
          $ref: '#/components/schemas/PostalAddress'
        isDefault:
          type: boolean
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version: *id001
    AddressChangedPayload:
      type: object
      required:
      - subject
      - addressId
      - label
      - type
      - postal
      - isDefault
      - status
      - version
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        addressId:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 60
        type:
          $ref: '#/components/schemas/AddressType'
        postal:
          $ref: '#/components/schemas/PostalAddress'
        isDefault:
          type: boolean
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version: *id001
    AddressRemovedPayload:
      type: object
      required:
      - subject
      - addressId
      - type
      - wasDefault
      - status
      - version
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        addressId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AddressType'
        wasDefault:
          type: boolean
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version: *id001
    DefaultAddressChangedPayload:
      type: object
      required:
      - subject
      - type
      - addressId
      - status
      - version
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        type:
          $ref: '#/components/schemas/AddressType'
        addressId:
          type: string
          format: uuid
          description: La que pasa a ser la de por defecto.
        previousAddressId:
          type:
          - string
          - 'null'
          format: uuid
          description: La que deja de serlo; nula si no había ninguna.
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version: *id001
    ProfileDeactivatedPayload:
      type: object
      required:
      - subject
      - status
      - version
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version: *id001
    ProfileReactivatedPayload:
      type: object
      required:
      - subject
      - status
      - version
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        status:
          $ref: '#/components/schemas/ProfileStatus'
        version: *id001
    ProfileDeletedPayload:
      type: object
      required:
      - subject
      - version
      - deletedAt
      - reason
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        version: *id001
        deletedAt:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/DeletionReason'
  correlationIds:
    keelCorrelationId:
      description: Correlación end-to-end estampada en la envoltura Keel.
      location: $message.payload#/metadata/correlationId
