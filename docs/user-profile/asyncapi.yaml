asyncapi: 3.0.0
info:
  title: user-profile
  version: 0.1.1
  description: 'Guarda el perfil de negocio de cada persona autenticada (datos de contacto y direcciones postales) indexado
    por el sub del token, sin duplicar nada de lo que es del servidor de identidad: lo aprovisiona just-in-time en la primera
    petición, lo deja editar a su titular, lo gestiona desde back-office con borrado definitivo por lápida y lo sirve a otros
    servidores en proyecciones separadas de contacto y de entrega.


    Contrato asíncrono derivado del diseño Keel (capa messaging). El broker concreto y los nombres físicos de topic/cola se
    deciden al generar, no aquí. Solo publica: no tiene suscripciones. Cada transacción publica como mucho un evento; los
    diez llevan estado y `version`. Coste aceptado: el canal contiene PII, salvo ProfileDeleted.'
defaultContentType: application/json
channels:
  profileEvents:
    address: profileEvents
    title: profileEvents
    description: 'Ciclo de vida del perfil de negocio y de sus direcciones, en orden de version por subject. Nombre lógico:
      el topic/cola físico que lo respalda es parámetro de despliegue. Orden por subject; el `version` de cada evento es el
      lockVersion del perfil tras el cambio, y ProfileDeleted cierra la encarnación del subject.'
    messages:
      ProfileProvisioned:
        $ref: '#/components/messages/ProfileProvisioned'
      ProfileContactEmailRefreshed:
        $ref: '#/components/messages/ProfileContactEmailRefreshed'
      ProfileContactDetailsChanged:
        $ref: '#/components/messages/ProfileContactDetailsChanged'
      AddressAdded:
        $ref: '#/components/messages/AddressAdded'
      AddressChanged:
        $ref: '#/components/messages/AddressChanged'
      AddressRemoved:
        $ref: '#/components/messages/AddressRemoved'
      DefaultAddressChanged:
        $ref: '#/components/messages/DefaultAddressChanged'
      ProfileDeactivated:
        $ref: '#/components/messages/ProfileDeactivated'
      ProfileReactivated:
        $ref: '#/components/messages/ProfileReactivated'
      ProfileDeleted:
        $ref: '#/components/messages/ProfileDeleted'
operations:
  publishProfileProvisioned:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: Se creó el perfil de un subject en su primera petición autenticada (siempre en draft).
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileProvisioned'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - provisionProfileFromIdentity
  publishProfileContactEmailRefreshed:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: El aprovisionamiento refrescó contactEmail porque el claim email del token cambió.
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileContactEmailRefreshed'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - provisionProfileFromIdentity
  publishProfileContactDetailsChanged:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: El titular reemplazó su bloque de contacto. Lleva el status porque los cambios de completitud no tienen evento
      propio.
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileContactDetailsChanged'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - updateMyContactDetails
  publishAddressAdded:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: 'El titular añadió una dirección. Si llegó como predeterminada, previousDefaultAddressId dice cuál dejó de serlo:
      no se publica además DefaultAddressChanged.'
    messages:
    - $ref: '#/channels/profileEvents/messages/AddressAdded'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - addMyAddress
  publishAddressChanged:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: El titular reemplazó una dirección. Si cambió de tipo, isDefault llega a false.
    messages:
    - $ref: '#/channels/profileEvents/messages/AddressChanged'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - updateMyAddress
  publishAddressRemoved:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: El titular quitó una dirección; si era la predeterminada, su tipo se queda sin predeterminada.
    messages:
    - $ref: '#/channels/profileEvents/messages/AddressRemoved'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - removeMyAddress
  publishDefaultAddressChanged:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: El titular marcó otra dirección como predeterminada de su tipo.
    messages:
    - $ref: '#/channels/profileEvents/messages/DefaultAddressChanged'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - setMyDefaultAddress
  publishProfileDeactivated:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: Back-office desactivó el perfil.
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileDeactivated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - deactivateProfile
  publishProfileReactivated:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: Back-office reactivó el perfil; status es el recalculado (draft o complete).
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileReactivated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - reactivateProfile
  publishProfileDeleted:
    action: send
    channel:
      $ref: '#/channels/profileEvents'
    summary: 'El perfil se borró y quedó su lápida. Sin PII: un consumidor debe borrar lo que tenga de ese subject, incluida
      la última version vista (cierra la encarnación). version es el lockVersion final más uno (el borrado es la última mutación).'
    messages:
    - $ref: '#/channels/profileEvents/messages/ProfileDeleted'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - deleteMyProfile
    - deleteProfile
components:
  messages:
    ProfileProvisioned:
      name: ProfileProvisioned
      title: ProfileProvisioned
      contentType: application/json
      summary: Se creó el perfil de un subject en su primera petición autenticada (siempre en draft).
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileProvisionedPayload'
    ProfileContactEmailRefreshed:
      name: ProfileContactEmailRefreshed
      title: ProfileContactEmailRefreshed
      contentType: application/json
      summary: El aprovisionamiento refrescó contactEmail porque el claim email del token cambió.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileContactEmailRefreshedPayload'
    ProfileContactDetailsChanged:
      name: ProfileContactDetailsChanged
      title: ProfileContactDetailsChanged
      contentType: application/json
      summary: El titular reemplazó su bloque de contacto. Lleva el status porque los cambios de completitud no tienen evento
        propio.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileContactDetailsChangedPayload'
    AddressAdded:
      name: AddressAdded
      title: AddressAdded
      contentType: application/json
      summary: 'El titular añadió una dirección. Si llegó como predeterminada, previousDefaultAddressId dice cuál dejó de
        serlo: no se publica además DefaultAddressChanged.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/AddressAddedPayload'
    AddressChanged:
      name: AddressChanged
      title: AddressChanged
      contentType: application/json
      summary: El titular reemplazó una dirección. Si cambió de tipo, isDefault llega a false.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/AddressChangedPayload'
    AddressRemoved:
      name: AddressRemoved
      title: AddressRemoved
      contentType: application/json
      summary: El titular quitó una dirección; si era la predeterminada, su tipo se queda sin predeterminada.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/AddressRemovedPayload'
    DefaultAddressChanged:
      name: DefaultAddressChanged
      title: DefaultAddressChanged
      contentType: application/json
      summary: El titular marcó otra dirección como predeterminada de su tipo.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/DefaultAddressChangedPayload'
    ProfileDeactivated:
      name: ProfileDeactivated
      title: ProfileDeactivated
      contentType: application/json
      summary: Back-office desactivó el perfil.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileDeactivatedPayload'
    ProfileReactivated:
      name: ProfileReactivated
      title: ProfileReactivated
      contentType: application/json
      summary: Back-office reactivó el perfil; status es el recalculado (draft o complete).
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileReactivatedPayload'
    ProfileDeleted:
      name: ProfileDeleted
      title: ProfileDeleted
      contentType: application/json
      summary: 'El perfil se borró y quedó su lápida. Sin PII: un consumidor debe borrar lo que tenga de ese subject, incluida
        la última version vista (cierra la encarnación). version es el lockVersion final más uno (el borrado es la última
        mutación).'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProfileDeletedPayload'
  schemas:
    ProfileProvisionedPayload:
      type: object
      required:
      - subject
      - version
      - status
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        version:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ProfileStatus'
        contactEmail:
          anyOf:
          - $ref: '#/components/schemas/EmailAddress'
          - type: 'null'
        givenName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
        familyName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
        displayName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
    ProfileContactEmailRefreshedPayload:
      type: object
      required:
      - subject
      - version
      - status
      - contactEmail
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        version:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ProfileStatus'
        contactEmail:
          $ref: '#/components/schemas/EmailAddress'
    ProfileContactDetailsChangedPayload:
      type: object
      required:
      - subject
      - version
      - status
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        version:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ProfileStatus'
        givenName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
        familyName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
        displayName:
          anyOf:
          - $ref: '#/components/schemas/PersonName'
          - type: 'null'
        contactPhone:
          anyOf:
          - $ref: '#/components/schemas/PhoneNumber'
          - type: 'null'
    AddressAddedPayload:
      type: object
      required:
      - subject
      - version
      - status
      - addressId
      - type
      - isDefault
      - postal
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        version:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ProfileStatus'
        addressId:
          type: string
          format: uuid
        label:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/AddressType'
        isDefault:
          type: boolean
        postal:
          $ref: '#/components/schemas/PostalAddress'
        previousDefaultAddressId:
          type:
          - string
          - 'null'
          format: uuid
          description: La predeterminada de ese tipo que quedó desmarcada; null si no había o si la nueva no es predeterminada.
    AddressChangedPayload:
      type: object
      required:
      - subject
      - version
      - status
      - addressId
      - type
      - isDefault
      - postal
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        version:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ProfileStatus'
        addressId:
          type: string
          format: uuid
        label:
          type:
          - string
          - 'null'
        type:
          $ref: '#/components/schemas/AddressType'
        isDefault:
          type: boolean
        postal:
          $ref: '#/components/schemas/PostalAddress'
    AddressRemovedPayload:
      type: object
      required:
      - subject
      - version
      - status
      - addressId
      - type
      - wasDefault
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        version:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ProfileStatus'
        addressId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AddressType'
        wasDefault:
          type: boolean
    DefaultAddressChangedPayload:
      type: object
      required:
      - subject
      - version
      - status
      - addressId
      - type
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        version:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ProfileStatus'
        addressId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AddressType'
        previousAddressId:
          type:
          - string
          - 'null'
          format: uuid
          description: La que dejó de ser predeterminada; null si no había.
    ProfileDeactivatedPayload:
      type: object
      required:
      - subject
      - version
      - status
      - deactivatedBy
      - deactivatedAt
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        version:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ProfileStatus'
        deactivatedBy:
          $ref: '#/components/schemas/SubjectIdentifier'
          description: Subject del operador que lo desactivó.
        deactivatedAt:
          type: string
          format: date-time
          description: El mismo instante que UserProfile.deactivatedAt.
    ProfileReactivatedPayload:
      type: object
      required:
      - subject
      - version
      - status
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        version:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/ProfileStatus'
    ProfileDeletedPayload:
      type: object
      required:
      - subject
      - version
      - deletedAt
      - reason
      properties:
        subject:
          $ref: '#/components/schemas/SubjectIdentifier'
        version:
          type: integer
          format: int32
        deletedAt:
          type: string
          format: date-time
          description: El mismo instante que DeletedSubject.deletedAt de la lápida escrita en la misma transacción.
        reason:
          $ref: '#/components/schemas/DeletionReason'
          description: El mismo valor que DeletedSubject.reason.
    AddressLine:
      type: string
      minLength: 1
      maxLength: 140
      description: Una línea de dirección postal.
    AddressType:
      type: string
      enum:
      - shipping
      - billing
      description: Uso de una dirección.
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      description: País en ISO 3166-1 alpha-2, en mayúsculas.
    DeletionReason:
      type: string
      enum:
      - self-service
      - back-office
      description: 'Por qué vía se borró el perfil. Cerrado a propósito: la lápida no puede acumular PII en texto libre.'
    EmailAddress:
      type: string
      maxLength: 254
      pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
      description: 'Dirección de correo con forma simple (algo@algo.algo). Nunca es clave: puede cambiar de dueño.'
    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      description: Nombre de persona (nombre de pila, apellidos o nombre visible) en texto libre.
    PhoneNumber:
      type: string
      pattern: ^\+[1-9][0-9]{1,14}$
      description: 'Teléfono en formato E.164: + seguido de entre 2 y 15 dígitos, sin espacios ni separadores.'
    PostalAddress:
      type: object
      required:
      - line1
      - line2
      - line3
      - postalCode
      - countryCode
      - adminAreaCode
      - adminAreaName
      - localityCode
      - localityName
      properties:
        line1:
          $ref: '#/components/schemas/AddressLine'
          description: 'Primera línea: vía y número.'
        line2:
          anyOf:
          - $ref: '#/components/schemas/AddressLine'
          - type: 'null'
          description: 'Segunda línea: piso, apartamento, referencia.'
        line3:
          anyOf:
          - $ref: '#/components/schemas/AddressLine'
          - type: 'null'
          description: Tercera línea, para los países que la usan.
        postalCode:
          anyOf:
          - $ref: '#/components/schemas/PostalCode'
          - type: 'null'
          description: Código postal; opcional porque hay países sin él.
        countryCode:
          $ref: '#/components/schemas/CountryCode'
          description: País de la dirección.
        adminAreaCode:
          anyOf:
          - $ref: '#/components/schemas/SubdivisionCode'
          - type: 'null'
          description: Nivel territorial 1 (departamento, estado, provincia) en ISO 3166-2.
        adminAreaName:
          anyOf:
          - $ref: '#/components/schemas/TerritoryName'
          - type: 'null'
          description: Nombre del nivel 1 tal como lo mandó el llamante. Obligatorio si viene adminAreaCode.
        localityCode:
          anyOf:
          - $ref: '#/components/schemas/TerritoryCode'
          - type: 'null'
          description: Nivel territorial 2 (municipio, ciudad), opaco e interpretado según el país.
        localityName:
          $ref: '#/components/schemas/TerritoryName'
          description: Nombre del nivel 2 (ciudad o municipio). Es el único nivel territorial obligatorio.
      description: 'Dirección postal internacional. Es la unidad que viaja (respuestas, eventos, M2M). Los dos niveles territoriales
        tienen nombres genéricos; el nombre se denormaliza al guardar y no se vuelve a resolver: que código y nombre diverjan
        con los años es historia, no inconsistencia. localityCode se interpreta según countryCode. De los códigos territoriales
        solo se valida la forma, nunca su existencia: el servicio no consulta ningún catálogo territorial; eso es responsabilidad
        del llamante.'
    PostalCode:
      type: string
      minLength: 1
      maxLength: 16
      description: 'Código postal tal como lo escribe el país. Sin patrón a propósito: cada país tiene su formato y algunos
        no tienen código postal.'
    ProfileStatus:
      type: string
      enum:
      - draft
      - complete
      - deactivated
      description: Situación del perfil. draft es un estado normal (faltan datos para operar), no un error.
    SubdivisionCode:
      type: string
      pattern: ^[A-Z]{2}-[A-Z0-9]{1,3}$
      description: Subdivisión de primer nivel en ISO 3166-2 (CO-ANT, ES-M, US-CA). El prefijo es el país.
    SubjectIdentifier:
      type: string
      minLength: 1
      maxLength: 255
      description: 'Identificador opaco del sujeto (claim sub del token). Inmutable y clave de negocio del perfil. No se interpreta
        ni se normaliza: se compara byte a byte.'
    TerritoryCode:
      type: string
      minLength: 1
      maxLength: 32
      description: 'Código opaco de segundo nivel territorial (municipio, ciudad, comuna). No existe una codificación universal:
        se interpreta según el país.'
    TerritoryName:
      type: string
      minLength: 1
      maxLength: 120
      description: Nombre de una unidad territorial, copiado al guardar y nunca resuelto de nuevo.
    KeelEventMetadata:
      type: object
      description: Metadata transversal de la envoltura Keel; la estampa el servicio al emitir.
      required:
      - eventId
      - eventType
      - eventVersion
      - occurredAt
      - source
      properties:
        eventId:
          type: string
          format: uuid
          description: Id único de esta ocurrencia; clave de deduplicación del consumidor.
        eventType:
          type: string
          description: Nombre del evento en el diseño; discriminador cuando el canal lleva varios tipos.
        eventVersion:
          type: integer
          minimum: 1
          description: Versión del contrato del payload.
        occurredAt:
          type: string
          format: date-time
          description: Instante UTC en que ocurrió el hecho en el dominio, no el del envío.
        source:
          type: string
          description: Nombre del servicio emisor.
        correlationId:
          type:
          - string
          - 'null'
          description: Correlación de la petición que originó el hecho; null si no hubo contexto.
        traceparent:
          type:
          - string
          - 'null'
          description: Contexto de traza W3C (traceparent) del hecho; null si el emisor no tiene telemetría.
  correlationIds:
    keelCorrelationId:
      description: Correlación end-to-end estampada en la envoltura Keel.
      location: $message.payload#/metadata/correlationId
