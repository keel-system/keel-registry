                  summary: La pasarela no contestó; aquí no se guardó nada y se puede reintentar con un token nuevo.
                  value:
                    status: 503
                    code: GATEWAY_UNAVAILABLE
                    message: La pasarela no contestó; aquí no se guardó nada y se puede reintentar con un token
                      nuevo.
