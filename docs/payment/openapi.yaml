openapi: 3.1.0
info:
  title: payment
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |-
    Cobra con tarjeta, a través de una pasarela intercambiable, los importes que le piden otros servidores — autorizar, capturar, anular y devolver —, y guarda medios de pago para cobrar sin el cliente presente.

    Contrato HTTP derivado del diseño Keel. Toda la superficie es **servidor-a-servidor**: credencial de máquina (OAuth2 client credentials) emitida para la audiencia `payment`, con el scope de cada operación. El navegador del comprador nunca llama a este servicio.

    **La pasarela no aparece aquí**: se elige al generar. Los avisos que la pasarela manda al servicio son contrato del generador, no de este documento.

    **Importes**: número en unidades mayores de la moneda (ISO 4217), comparados por valor. Un importe con más decimales de los que admite su moneda se rechaza (`400 AMOUNT_SCALE_INVALID`), nunca se redondea.

    **Nulos**: un campo sin valor viaja como `null`; una colección vacía, como `[]`. Los instantes son ISO-8601 en UTC.

    **Repetición**: `requestCharge` y `refundPayment` son idempotentes por su clave de negocio (`chargeRequestId`, `refundRequestId`); `capturePayment` y `cancelPayment`, por estado; `savePaymentMethod` exige `Idempotency-Key`.
servers:
- url: '{baseUrl}'
  description: El host y el puerto son parámetro de despliegue, nunca dato de diseño.
  variables:
    baseUrl:
      default: http://localhost:8080
      description: Raíz del servicio desplegado.
tags:
- name: Cobros
  description: Pedir, capturar, anular y devolver cobros.
- name: Consultas de cobros
  description: Leer un cobro por id o por su clave, y los cobros de un titular.
- name: Medios de pago
  description: Medios guardados de un titular para cobrarle sin que esté presente.
paths:
  /api/v1/payments:
    post:
      operationId: requestCharge
      summary: 'Pide un cobro (autorización) con un token de un solo uso o con un medio guardado del titular. Registra
        el cobro en pending antes de llamar a la pasarela y responde con el cobro en el estado que haya alcanzado:
        authorized, actionRequired, failed, o pending si la pasarela no contestó.'
      tags:
      - Cobros
      description: |-
        - Precondición: Se indica exactamente una fuente de pago: paymentToken o paymentMethodId.
        - Precondición: Si se indica paymentMethodId, el medio existe, está active y pertenece al Wallet de customerRef.
        - La clave se comprueba antes que cualquier otra guarda: si ya existe un cobro con ese chargeRequestId y los mismos customerRef, amount, currency y fuente de pago, se devuelve ese cobro en su estado actual sin volver a llamar a la pasarela, aunque el medio se haya retirado después; si existe con otro contenido, CHARGE_REQUEST_CONFLICT. La fuente se compara por su clase cuando es un token (el token no se guarda) y por paymentMethodId cuando es un medio guardado.
        - Dos peticiones con el mismo chargeRequestId a la vez: la que choca con la clave natural al registrar el cobro relee el ganador y aplica la regla anterior — con el mismo contenido responde ese cobro (201); con otro, CHARGE_REQUEST_CONFLICT. Nunca hay un segundo cobro ni una segunda llamada a la pasarela.
        - Responde 201 tanto al crear el cobro como al repetirlo, sea cual sea el estado en que esté.
        - currency debe ser un código vigente de ISO 4217 (la tabla vigente del estándar), y amount no puede tener más decimales que los de esa moneda.
        - El importe lo fija el servidor consumidor, que es de confianza; el servicio no le pone tope ni lo contrasta con nada.
        - El cobro se registra en pending, con awaitingSince estampado, antes de llamar a la pasarela.
        - La respuesta de la pasarela se aplica con su operación de desenlace (markAuthorized, markActionRequired o markFailed); si no llega, el cobro se queda en pending y lo resuelve el barrido.
        - Un rechazo de la pasarela no es un error de la petición — el cobro se devuelve en failed con su failureReason (una moneda que la pasarela no admite falla con processingError).
        - Si al aplicar el desenlace el cobro ya salió de pending por otra vía (el aviso de la pasarela), se relee y se responde el cobro tal como esté, sin error.
        - El cobro en pending se confirma en su propia transacción antes de llamar a la pasarela, y el desenlace en otra: la frontera por operación vale para cada una de las dos escrituras.
        - Si se cobra con un medio guardado, el cobro anota su paymentMethodId. Un medio retirado mientras se cobra no se detecta; vale tal como estaba al validar la petición.
        - El paymentToken no se guarda; solo viaja a la pasarela.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestChargeRequest'
      responses:
        '201':
          description: 'Cobro registrado (también al repetir la misma petición): el cuerpo trae su estado — authorized,
            actionRequired, failed o pending.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          headers:
            Location:
              description: Ruta de lectura del cobro (`getPayment`).
              schema:
                type: string
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.


            `PAYMENT_SOURCE_INVALID` — No se indica ninguna fuente de pago o se indican las dos.


            `CURRENCY_UNKNOWN` — currency no es un código vigente de ISO 4217.


            `AMOUNT_SCALE_INVALID` — amount tiene más decimales que los de la moneda.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
                PAYMENT_SOURCE_INVALID:
                  summary: No se indica ninguna fuente de pago o se indican las dos.
                  value:
                    status: 400
                    code: PAYMENT_SOURCE_INVALID
                    message: No se indica ninguna fuente de pago o se indican las dos.
                CURRENCY_UNKNOWN:
                  summary: currency no es un código vigente de ISO 4217.
                  value:
                    status: 400
                    code: CURRENCY_UNKNOWN
                    message: currency no es un código vigente de ISO 4217.
                AMOUNT_SCALE_INVALID:
                  summary: amount tiene más decimales que los de la moneda.
                  value:
                    status: 400
                    code: AMOUNT_SCALE_INVALID
                    message: amount tiene más decimales que los de la moneda.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el scope exigido, o su token no está emitido para
            la audiencia `payment`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                    `payment`.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                      `payment`.
        '409':
          description: '`CHARGE_REQUEST_CONFLICT` — Ya existe un cobro con ese chargeRequestId y con otro contenido.


            `CONCURRENT_MODIFICATION` — El recurso cambió mientras se procesaba la petición (bloqueo optimista).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CHARGE_REQUEST_CONFLICT:
                  summary: Ya existe un cobro con ese chargeRequestId y con otro contenido.
                  value:
                    status: 409
                    code: CHARGE_REQUEST_CONFLICT
                    message: Ya existe un cobro con ese chargeRequestId y con otro contenido.
                CONCURRENT_MODIFICATION:
                  summary: El recurso cambió mientras se procesaba la petición (bloqueo optimista).
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: El recurso cambió mientras se procesaba la petición (bloqueo optimista).
        '422':
          description: '`PAYMENT_METHOD_UNAVAILABLE` — El medio indicado no existe, está retirado o no es del titular
            (no se distingue cuál).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PAYMENT_METHOD_UNAVAILABLE:
                  summary: El medio indicado no existe, está retirado o no es del titular (no se distingue cuál).
                  value:
                    status: 422
                    code: PAYMENT_METHOD_UNAVAILABLE
                    message: El medio indicado no existe, está retirado o no es del titular (no se distingue cuál).
      security:
      - serviceAuth:
        - payment:charge
    get:
      operationId: listPaymentsByCustomer
      summary: Lista los cobros de un titular, del más reciente al más antiguo.
      tags:
      - Consultas de cobros
      description: |-
        - Un titular sin cobros devuelve una página vacía, no un error.
      parameters:
      - name: customerRef
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/CustomerRef'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Página, base 0.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Tamaño de página; por encima de 100 se recorta a 100.
      responses:
        '200':
          description: Respuesta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPayment'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el scope exigido, o su token no está emitido para
            la audiencia `payment`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                    `payment`.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                      `payment`.
      security:
      - serviceAuth:
        - payment:read
  /api/v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Recupera un cobro por su id, con sus devoluciones.
      tags:
