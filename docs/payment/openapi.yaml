components:
  securitySchemes:
    serviceAuth:
      type: oauth2
      description: Credencial de máquina (OAuth2 client credentials). El `tokenUrl` real es parámetro de despliegue;
        se valida la audiencia `payment`, así que un token emitido para otro servicio responde 403.
      flows:
        clientCredentials:
          tokenUrl: https://identity.invalid/oauth2/token
          scopes:
            payment:charge: Pedir cobros, capturarlos y anularlos.
            payment:refund: Devolver, total o parcialmente, lo cobrado.
            payment:read: Consultar cobros y sus devoluciones.
            payment-method:write: Guardar medios de pago, marcar el preferente y retirarlos.
            payment-method:read: Listar los medios guardados de un titular.
  schemas:
    RequestReference:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[A-Za-z0-9._:-]+$
      description: Clave de negocio con la que el servidor consumidor identifica una petición (de cobro o de devolución).
        La elige el consumidor y es la guarda contra la doble ejecución.
    CustomerRef:
      type: string
      minLength: 1
      maxLength: 200
      description: 'Referencia opaca del titular, asignada por el servidor consumidor (p. ej. el sub del usuario).
        Este servicio no conoce usuarios: solo compara referencias.'
    Amount:
      type: number
      minimum: 0.001
      multipleOf: 0.001
      description: Importe en unidades mayores de la moneda (12.50), siempre positivo. La escala admite hasta 3
        decimales; cuántos admite de verdad lo fija la moneda (ISO 4217), y se valida en cada operación.
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      description: Código de moneda ISO 4217 en mayúsculas.
    PaymentStatus:
      type: string
      enum:
      - pending
      - actionRequired
      - authorized
      - capturing
      - canceling
      - captured
      - refunding
      - refunded
      - canceled
      - failed
    FailureReason:
      type: string
      enum:
      - declined
      - insufficientFunds
      - expiredCard
      - authenticationFailed
      - fraudSuspected
      - invalidPaymentMethod
      - notReceived
      - processingError
      description: Vocabulario neutro de Keel para el motivo de fallo de un cobro; cada pasarela se traduce a él.
    RefundStatus:
      type: string
      enum:
      - pending
      - succeeded
      - failed
    PaymentMethodStatus:
      type: string
      enum:
      - active
      - removed
    CardDetails:
      type: object
      required:
      - brand
      - last4
      - expMonth
      - expYear
      properties:
        brand:
          type: string
          maxLength: 30
          description: Red de la tarjeta tal como la informa la pasarela (visa, mastercard…).
        last4:
          type: string
          pattern: ^[0-9]{4}$
        expMonth:
          type: integer
          format: int32
          minimum: 1
          maximum: 12
        expYear:
          type: integer
          format: int32
          minimum: 2000
          maximum: 2100
      description: Resumen visible de una tarjeta guardada; nunca incluye el número completo.
    Refund:
      type: object
      description: Una devolución, total o parcial, de un cobro capturado.
      required:
      - id
      - refundRequestId
      - amount
      - reason
      - status
      - createdAt
      - updatedAt
      - paymentId
      properties:
        id:
          type: string
          format: uuid
        refundRequestId:
          allOf:
          - $ref: '#/components/schemas/RequestReference'
          description: Clave de negocio de la devolución; dos peticiones con la misma son la misma devolución.
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: Importe pedido; si la pasarela informa al completarla un importe devuelto distinto, se guarda
            el informado.
        reason:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Motivo libre que informa el consumidor, para su propio rastro.
        status:
          $ref: '#/components/schemas/RefundStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        paymentId:
          type: string
          format: uuid
          description: Id de su raíz (el DTO de una entidad hija lleva siempre el id de su raíz).
    Payment:
      type: object
      description: 'Un cobro con tarjeta pedido por un servidor consumidor: se autoriza, se captura o se anula,
        y admite devoluciones parciales. Es la memoria del servicio frente a la pasarela.'
      required:
      - id
      - chargeRequestId
      - customerRef
      - amount
      - currency
      - status
      - gatewayPaymentId
      - awaitingSince
      - failureReason
      - customerAction
      - actionRequiredSince
      - cancelOrigin
      - paymentMethodId
      - refundedAmount
      - createdAt
      - updatedAt
      - refunds
      properties:
        id:
          type: string
          format: uuid
        chargeRequestId:
          allOf:
          - $ref: '#/components/schemas/RequestReference'
          description: Clave de negocio del cobro; dos peticiones con la misma son el mismo cobro.
        customerRef:
          allOf:
          - $ref: '#/components/schemas/CustomerRef'
          description: Titular del cobro.
        amount:
          allOf:
          - $ref: '#/components/schemas/Amount'
          description: 'Importe autorizado; al capturar se cobra entero. Lo fija el servidor consumidor, que es
            de confianza: el servicio no lo contrasta con nada.'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        gatewayPaymentId:
          type:
          - string
          - 'null'
          maxLength: 255
          description: Id que asigna la pasarela; vacío mientras no ha contestado.
        awaitingSince:
          type:
          - string
          - 'null'
          format: date-time
          description: Desde cuándo espera sin respuesta un desenlace de la pasarela; solo tiene valor en estados
            de espera.
        failureReason:
          anyOf:
          - $ref: '#/components/schemas/FailureReason'
          - type: 'null'
          description: Por qué falló el cobro; solo en failed.
        customerAction:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Acción opaca que el cliente debe completar (3DS); en actionRequired, y se conserva mientras
            se anula un cobro que venía de actionRequired.
        actionRequiredSince:
          type:
          - string
          - 'null'
          format: date-time
          description: Desde cuándo espera el cobro la autenticación del cliente; lo estampa la entrada en actionRequired
            y no lo renuevan las consultas del barrido. Es el reloj del plazo del 3DS.
        cancelOrigin:
          type:
          - string
          - 'null'
          enum:
          - authorized
          - actionRequired
          - null
          description: Estado del que salió el cobro al entrar en canceling; solo en canceling. Es a donde vuelve
            si la pasarela rechaza la anulación.
        paymentMethodId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Medio guardado con el que se cobró; vacío si se cobró con un token de un solo uso. Es un
            valor y no una relación: el medio vive dentro del agregado Wallet.'
        refundedAmount:
          type: number
          description: 'Calculado: Suma de los importes de las devoluciones del cobro en estado succeeded; cero
            si no hay ninguna.'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        refunds:
          type: array
          items:
            $ref: '#/components/schemas/Refund'
          description: Devoluciones pedidas sobre el cobro.
    PaymentMethod:
      type: object
      description: Un medio de pago guardado de un titular, para cobrarle sin que esté presente. La referencia de
        la pasarela (gatewayMethodRef) nunca viaja.
      required:
      - id
      - card
      - isDefault
      - status
      - expired
      - walletId
      properties:
        id:
          type: string
          format: uuid
        card:
          $ref: '#/components/schemas/CardDetails'
        isDefault:
          type: boolean
          description: Medio preferente del titular.
        status:
          $ref: '#/components/schemas/PaymentMethodStatus'
        expired:
          type: boolean
          description: 'Calculado: true si card.expYear y card.expMonth son anteriores al mes en curso en UTC; la
            tarjeta vale hasta el último día de su mes de caducidad.'
        walletId:
          type: string
          format: uuid
          description: Id de su raíz (el DTO de una entidad hija lleva siempre el id de su raíz).
    Error:
      type: object
      description: Forma única del cuerpo de error del servicio.
      required:
      - status
      - code
      - message
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
          description: Nombre del status HTTP.
        code:
          type: string
          description: Código de negocio estable; es el contrato.
        message:
          type: string
          description: Texto humano; no es contrato.
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: string
    PagedPayment:
      type: object
      description: Página de cobros (sobre canónico de paginación offset).
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    PaymentMethodList:
      type: array
      items:
        $ref: '#/components/schemas/PaymentMethod'
      description: Medios active del titular, el preferente primero y después por id.
    RequestChargeRequest:
      type: object
      required:
      - chargeRequestId
      - customerRef
      - amount
      - currency
      properties:
        chargeRequestId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9._:-]+$
          description: Clave de negocio del cobro (mismas cotas que RequestReference).
        customerRef:
          $ref: '#/components/schemas/CustomerRef'
        amount:
          type: number
          minimum: 0.001
          multipleOf: 0.001
          description: Importe en unidades mayores (mismas cotas que Amount).
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        paymentToken:
          type: string
          maxLength: 255
          description: Token de un solo uso que produce el componente de la pasarela en el navegador (cliente presente).
        paymentMethodId:
          type: string
          format: uuid
          description: Id de un medio guardado del titular (cliente ausente).
    RefundPaymentRequest:
      type: object
      required:
      - refundRequestId
      properties:
        refundRequestId:
          $ref: '#/components/schemas/RequestReference'
        amount:
          type: number
          minimum: 0.001
          multipleOf: 0.001
          description: Importe a devolver (mismas cotas que Amount); si se omite, todo lo que queda por devolver.
        reason:
          type: string
          maxLength: 200
    SavePaymentMethodRequest:
      type: object
      required:
      - customerRef
      - paymentToken
      properties:
        customerRef:
          $ref: '#/components/schemas/CustomerRef'
        paymentToken:
          type: string
          maxLength: 255
        makeDefault:
          type: boolean
          default: false
    SetDefaultPaymentMethodRequest:
      type: object
      required:
      - customerRef
      properties:
        customerRef:
          $ref: '#/components/schemas/CustomerRef'
