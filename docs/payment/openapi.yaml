  /api/v1/payments/{id}/capture:
    post:
      operationId: capturePayment
      summary: Captura entero el importe de un cobro autorizado.
      tags:
      - Cobros
      description: |-
        - La repetición se comprueba antes que cualquier otra guarda: si el cobro ya está en capturing, captured, refunding o refunded, se devuelve tal cual (200) sin volver a llamar a la pasarela.
        - El cobro pasa a capturing, con awaitingSince estampado, antes de llamar a la pasarela.
        - Si la pasarela captura, se aplica markCaptured; si no contesta, el cobro se queda en capturing y lo resuelve el barrido.
        - Si la pasarela rechaza porque la autorización ya caducó, se aplica markCanceled y responde AUTHORIZATION_EXPIRED.
        - Si la pasarela rechaza por otro motivo, el cobro vuelve a authorized, se vacía awaitingSince, se publica PaymentActionRejected y responde CAPTURE_REJECTED.
        - Si al aplicar el desenlace el cobro ya salió de su estado en vuelo por otra vía (el aviso de la pasarela o el barrido), se relee y se responde el cobro tal como esté, sin error; CONCURRENT_MODIFICATION queda para dos peticiones del consumidor que se cruzan.
        - Un rechazo de la pasarela confirma el cambio de estado y el evento aunque la operación responda con error.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Respuesta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el scope exigido, o su token no está emitido para
            la audiencia `payment`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                    `payment`.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                      `payment`.
        '404':
          description: '`PAYMENT_NOT_FOUND` — No existe un cobro con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PAYMENT_NOT_FOUND:
                  summary: No existe un cobro con ese id.
                  value:
                    status: 404
                    code: PAYMENT_NOT_FOUND
                    message: No existe un cobro con ese id.
        '409':
          description: '`PAYMENT_NOT_CAPTURABLE` — El cobro no está en authorized, capturing ni captured.


            `AUTHORIZATION_EXPIRED` — La pasarela ya había cancelado la autorización.


            `CONCURRENT_MODIFICATION` — El cobro cambió mientras se procesaba la petición.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PAYMENT_NOT_CAPTURABLE:
                  summary: El cobro no está en authorized, capturing ni captured.
                  value:
                    status: 409
                    code: PAYMENT_NOT_CAPTURABLE
                    message: El cobro no está en authorized, capturing ni captured.
                AUTHORIZATION_EXPIRED:
                  summary: La pasarela ya había cancelado la autorización.
                  value:
                    status: 409
                    code: AUTHORIZATION_EXPIRED
                    message: La pasarela ya había cancelado la autorización.
                CONCURRENT_MODIFICATION:
                  summary: El cobro cambió mientras se procesaba la petición.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: El cobro cambió mientras se procesaba la petición.
        '422':
          description: '`CAPTURE_REJECTED` — La pasarela rechazó la captura por otro motivo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CAPTURE_REJECTED:
                  summary: La pasarela rechazó la captura por otro motivo.
                  value:
                    status: 422
                    code: CAPTURE_REJECTED
                    message: La pasarela rechazó la captura por otro motivo.
      security:
      - serviceAuth:
        - payment:charge
  /api/v1/payments/{id}/cancel:
    post:
      operationId: cancelPayment
      summary: Anula un cobro autorizado o que espera la autenticación del cliente, sin capturarlo.
      tags:
      - Cobros
      description: |-
        - La repetición se comprueba antes que cualquier otra guarda: si el cobro ya está en canceling o canceled, se devuelve tal cual (200) sin volver a llamar a la pasarela.
        - El cobro pasa a canceling antes de llamar a la pasarela: estampa awaitingSince, anota en cancelOrigin el estado del que sale y conserva customerAction y actionRequiredSince si venía de actionRequired.
        - Si la pasarela anula, se aplica markCanceled; si no contesta, el cobro se queda en canceling y lo resuelve el barrido.
        - Si la pasarela responde que el cobro ya terminó fallido (p. ej. el cliente falló la autenticación), se aplica markFailed con su motivo y la operación responde 200 con el cobro en failed.
        - Si la pasarela rechaza la anulación, el cobro vuelve al estado que dice cancelOrigin (con awaitingSince renovado si vuelve a actionRequired, vacío si vuelve a authorized), se vacía cancelOrigin, se publica PaymentActionRejected y responde CANCEL_REJECTED.
        - Si al aplicar el desenlace el cobro ya salió de su estado en vuelo por otra vía (el aviso de la pasarela o el barrido), se relee y se responde el cobro tal como esté, sin error; CONCURRENT_MODIFICATION queda para dos peticiones del consumidor que se cruzan.
        - Un rechazo de la pasarela confirma el cambio de estado y el evento aunque la operación responda con error.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Respuesta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el scope exigido, o su token no está emitido para
            la audiencia `payment`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                    `payment`.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                      `payment`.
        '404':
          description: '`PAYMENT_NOT_FOUND` — No existe un cobro con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PAYMENT_NOT_FOUND:
                  summary: No existe un cobro con ese id.
                  value:
                    status: 404
                    code: PAYMENT_NOT_FOUND
                    message: No existe un cobro con ese id.
        '409':
          description: '`PAYMENT_NOT_CANCELABLE` — El cobro no está en authorized, actionRequired, canceling ni
            canceled.


            `CONCURRENT_MODIFICATION` — El cobro cambió mientras se procesaba la petición.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PAYMENT_NOT_CANCELABLE:
                  summary: El cobro no está en authorized, actionRequired, canceling ni canceled.
                  value:
                    status: 409
                    code: PAYMENT_NOT_CANCELABLE
                    message: El cobro no está en authorized, actionRequired, canceling ni canceled.
                CONCURRENT_MODIFICATION:
                  summary: El cobro cambió mientras se procesaba la petición.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: El cobro cambió mientras se procesaba la petición.
        '422':
          description: '`CANCEL_REJECTED` — La pasarela rechazó la anulación.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CANCEL_REJECTED:
                  summary: La pasarela rechazó la anulación.
                  value:
                    status: 422
                    code: CANCEL_REJECTED
                    message: La pasarela rechazó la anulación.
      security:
      - serviceAuth:
        - payment:charge
  /api/v1/payments/{id}/refunds:
    post:
      operationId: refundPayment
      summary: Devuelve todo o parte de lo que queda por devolver de un cobro capturado.
      tags:
      - Cobros
      description: |-
        - La clave se comprueba justo después de que el cobro exista y antes que cualquier otra guarda: si ya existe una devolución con ese refundRequestId sobre este cobro y la petición trae el mismo amount o lo omite, se devuelve el cobro en su estado actual (200) sin volver a llamar a la pasarela, esté la devolución pending, succeeded o failed; si existe con otro amount o sobre otro cobro, REFUND_REQUEST_CONFLICT. Una devolución failed no se reintenta con la misma clave: hace falta otro refundRequestId.
        - Dos devoluciones con el mismo refundRequestId a la vez: la que choca con la clave natural relee y aplica la regla anterior. Nunca hay una segunda devolución ni una segunda llamada a la pasarela.
        - amount no puede tener más decimales que los de la moneda del cobro.
        - Se crea la devolución en pending y el cobro pasa a refunding, con awaitingSince estampado, antes de llamar a la pasarela.
        - Si la pasarela devuelve, se aplica markRefunded; si no contesta, el cobro se queda en refunding y lo resuelve el barrido.
        - Si la pasarela rechaza, la devolución pasa a failed, el cobro vuelve a captured con awaitingSince vacío, se publica PaymentActionRejected y responde REFUND_REJECTED.
        - Si al aplicar el desenlace el cobro ya salió de su estado en vuelo por otra vía (el aviso de la pasarela o el barrido), se relee y se responde el cobro tal como esté, sin error; CONCURRENT_MODIFICATION queda para dos peticiones del consumidor que se cruzan.
        - Un rechazo de la pasarela confirma el cambio de estado y el evento aunque la operación responda con error.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
      responses:
        '200':
          description: Respuesta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.


            `AMOUNT_SCALE_INVALID` — amount tiene más decimales que los de la moneda del cobro.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
                AMOUNT_SCALE_INVALID:
                  summary: amount tiene más decimales que los de la moneda del cobro.
                  value:
                    status: 400
                    code: AMOUNT_SCALE_INVALID
                    message: amount tiene más decimales que los de la moneda del cobro.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el scope exigido, o su token no está emitido para
            la audiencia `payment`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                    `payment`.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                      `payment`.
        '404':
          description: '`PAYMENT_NOT_FOUND` — No existe un cobro con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PAYMENT_NOT_FOUND:
                  summary: No existe un cobro con ese id.
                  value:
                    status: 404
                    code: PAYMENT_NOT_FOUND
                    message: No existe un cobro con ese id.
        '409':
          description: '`PAYMENT_NOT_REFUNDABLE` — El cobro no está en captured (incluido el que ya tiene una devolución
            en curso).


            `REFUND_REQUEST_CONFLICT` — Ya existe una devolución con ese refundRequestId con otro importe o sobre
            otro cobro.


            `CONCURRENT_MODIFICATION` — El cobro cambió mientras se procesaba la petición.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PAYMENT_NOT_REFUNDABLE:
                  summary: El cobro no está en captured (incluido el que ya tiene una devolución en curso).
                  value:
                    status: 409
                    code: PAYMENT_NOT_REFUNDABLE
                    message: El cobro no está en captured (incluido el que ya tiene una devolución en curso).
                REFUND_REQUEST_CONFLICT:
                  summary: Ya existe una devolución con ese refundRequestId con otro importe o sobre otro cobro.
                  value:
                    status: 409
                    code: REFUND_REQUEST_CONFLICT
                    message: Ya existe una devolución con ese refundRequestId con otro importe o sobre otro cobro.
                CONCURRENT_MODIFICATION:
                  summary: El cobro cambió mientras se procesaba la petición.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: El cobro cambió mientras se procesaba la petición.
        '422':
          description: '`REFUND_AMOUNT_EXCEEDED` — amount supera lo que queda por devolver.


            `REFUND_REJECTED` — La pasarela rechazó la devolución.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                REFUND_AMOUNT_EXCEEDED:
                  summary: amount supera lo que queda por devolver.
                  value:
                    status: 422
                    code: REFUND_AMOUNT_EXCEEDED
                    message: amount supera lo que queda por devolver.
                REFUND_REJECTED:
                  summary: La pasarela rechazó la devolución.
                  value:
                    status: 422
                    code: REFUND_REJECTED
                    message: La pasarela rechazó la devolución.
      security:
      - serviceAuth:
        - payment:refund
  /api/v1/payment-methods:
    post:
      operationId: savePaymentMethod
      summary: Guarda en el Wallet del titular el medio de pago que representa un token de la pasarela, para cobrarle
        después sin que esté presente.
      tags:
      - Medios de pago
      description: |-
        - El tope de 10 medios active se comprueba antes de llamar a la pasarela.
        - Si el titular no tiene Wallet, se crea con este primer medio.
        - El medio se guarda solo si la pasarela lo acepta; guarda su referencia opaca y el resumen de la tarjeta.
        - El medio queda por defecto si makeDefault es true o si el titular no tenía ningún medio active; el anterior por defecto deja de serlo.
        - El paymentToken no se guarda; solo viaja a la pasarela.
        - Guardar dos veces la misma tarjeta crea dos medios: el servicio no reconoce tarjetas iguales. Un timeout de la pasarela puede dejar el medio guardado allí sin registro aquí; nunca se cobra.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Clave del intento, generada por el cliente. Se recuerda 24 h: un reintento con la misma clave
          devuelve la respuesta original sin repetir el efecto. Sin ella: `400 IDEMPOTENCY_KEY_REQUIRED`.'
        schema:
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavePaymentMethodRequest'
      responses:
        '201':
          description: 'Medio guardado. Sin cabecera Location: no hay lectura de un medio por id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.


            `IDEMPOTENCY_KEY_REQUIRED` — La petición no trae la cabecera Idempotency-Key.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
                IDEMPOTENCY_KEY_REQUIRED:
                  summary: La petición no trae la cabecera Idempotency-Key.
                  value:
                    status: 400
                    code: IDEMPOTENCY_KEY_REQUIRED
                    message: La petición no trae la cabecera Idempotency-Key.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el scope exigido, o su token no está emitido para
            la audiencia `payment`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                    `payment`.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el scope exigido, o su token no está emitido para la audiencia
                      `payment`.
        '409':
          description: '`CONCURRENT_MODIFICATION` — El Wallet cambió mientras se procesaba la petición.


            `IDEMPOTENCY_KEY_IN_PROGRESS` — Otra petición con la misma Idempotency-Key está en curso.


            `IDEMPOTENCY_KEY_REUSED` — La misma Idempotency-Key con un cuerpo distinto.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CONCURRENT_MODIFICATION:
                  summary: El Wallet cambió mientras se procesaba la petición.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: El Wallet cambió mientras se procesaba la petición.
                IDEMPOTENCY_KEY_IN_PROGRESS:
                  summary: Otra petición con la misma Idempotency-Key está en curso.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_IN_PROGRESS
                    message: Otra petición con la misma Idempotency-Key está en curso.
                IDEMPOTENCY_KEY_REUSED:
                  summary: La misma Idempotency-Key con un cuerpo distinto.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
                    message: La misma Idempotency-Key con un cuerpo distinto.
        '422':
          description: '`PAYMENT_METHOD_LIMIT_REACHED` — El titular ya tiene 10 medios active.


            `PAYMENT_METHOD_AUTHENTICATION_REQUIRED` — La pasarela exige autenticar al cliente (3DS) para guardar
            el medio; el frontend debe completarla al tokenizar y volver a pedir el guardado.


            `PAYMENT_METHOD_REJECTED` — La pasarela no acepta el token (inválido, caducado o ya usado) o rechaza
            el medio.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PAYMENT_METHOD_LIMIT_REACHED:
                  summary: El titular ya tiene 10 medios active.
                  value:
                    status: 422
                    code: PAYMENT_METHOD_LIMIT_REACHED
                    message: El titular ya tiene 10 medios active.
                PAYMENT_METHOD_AUTHENTICATION_REQUIRED:
                  summary: 'La pasarela exige autenticar al cliente (3DS) para guardar el medio; el frontend debe
                    completarla al tokenizar y volver '
                  value:
                    status: 422
                    code: PAYMENT_METHOD_AUTHENTICATION_REQUIRED
                    message: La pasarela exige autenticar al cliente (3DS) para guardar el medio; el frontend debe
                      completarla al tokenizar y volver a pedir el guardado.
                PAYMENT_METHOD_REJECTED:
                  summary: La pasarela no acepta el token (inválido, caducado o ya usado) o rechaza el medio.
                  value:
                    status: 422
                    code: PAYMENT_METHOD_REJECTED
                    message: La pasarela no acepta el token (inválido, caducado o ya usado) o rechaza el medio.
        '503':
          description: '`GATEWAY_UNAVAILABLE` — La pasarela no contestó; aquí no se guardó nada y se puede reintentar
