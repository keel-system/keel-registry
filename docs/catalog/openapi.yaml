      security:
      - serviceAuth:
        - product:read
components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de usuario emitido por el proveedor OIDC del despliegue. Los permisos exigidos por cada
        operación están en `x-keel-permissions`.
    serviceAuth:
      type: oauth2
      description: Credencial de máquina (OAuth2 client credentials). El `tokenUrl` real es parámetro de despliegue;
        la audiencia `catalog` se valida.
      flows:
        clientCredentials:
          tokenUrl: https://identity.invalid/oauth2/token
          scopes:
            product:read: Consultar productos en cualquier estado.
  schemas:
    SKU:
      type: string
      pattern: ^[A-Z0-9][A-Z0-9-]{2,31}$
      description: Identificador comercial único e inmutable del producto, tal como lo conoce el back-office.
    Slug:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      maxLength: 140
      description: Identificador legible para URLs públicas, derivado del nombre.
    Price:
      type: number
      minimum: 0
      multipleOf: 0.01
      description: Importe de venta al público en la divisa única de la tienda.
    ProductStatus:
      type: string
      enum:
      - draft
      - active
      - discontinued
      description: Situación comercial del producto.
    Brand:
      type: object
      description: Fabricante o marca comercial bajo la que se vende un producto.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
          maxLength: 1000
          description: Reseña de la marca para la ficha pública.
      required:
      - id
      - name
      - slug
    Category:
      type: object
      description: Agrupación comercial por la que el consumidor navega el catálogo.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
          maxLength: 1000
          description: Texto de cabecera de la categoría en la tienda.
      required:
      - id
      - name
      - slug
    ProductImage:
      type: object
      description: Imagen de la ficha de un producto, con su orden de presentación.
      properties:
        id:
          type: string
          format: uuid
        file:
          type: string
          description: Referencia al objeto en el bucket lógico `productImages`; viaja la referencia, no el binario.
        altText:
          type: string
          maxLength: 160
          description: Texto alternativo para accesibilidad y SEO.
        position:
          type: integer
          minimum: 0
          description: Orden de presentación dentro de la galería del producto.
        isPrimary:
          type: boolean
          description: Marca la imagen que representa al producto en listados y resultados de búsqueda.
          default: false
        productId:
          type: string
          format: uuid
          description: Producto al que pertenece la imagen.
      required:
      - id
      - file
      - altText
      - position
      - isPrimary
      - productId
    Product:
      type: object
      description: Ficha completa del producto tal como la ve el back-office, con su rastro de auditoría.
      properties:
        id:
          type: string
          format: uuid
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
          maxLength: 140
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
          maxLength: 4000
          description: Descripción comercial larga que la tienda muestra en la ficha.
        price:
          $ref: '#/components/schemas/Price'
        status:
          $ref: '#/components/schemas/ProductStatus'
          default: draft
        lockVersion:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
        brand:
          allOf:
          - $ref: '#/components/schemas/Brand'
          description: Marca resuelta como objeto anidado, no como identificador.
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          description: Categoría resuelta como objeto anidado, no como identificador.
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
          description: Galería del producto, ordenada por position ascendente.
      required:
      - id
      - sku
      - name
      - slug
      - price
      - status
      - lockVersion
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      - brand
      - category
      - images
    ProductPublic:
      type: object
      description: 'Ficha del producto para la tienda: sin auditoría ni versión de bloqueo.'
      properties:
        id:
          type: string
          format: uuid
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
          maxLength: 140
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
