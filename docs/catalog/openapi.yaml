  /api/v1/products:
    get:
      operationId: searchPublishedProducts
      summary: Busca productos publicados en la tienda, filtrando por categoría, marca, nombre y rango de precio.
      tags:
      - Tienda (público)
      description: |-
        - Solo devuelve productos en estado active.
        - Los filtros son acumulativos; los ausentes no restringen.
        - Un categoryId o brandId que no existe, o que está inactivo, no es un error; se aplica igual.
        - El rango de precio se aplica sobre price.amount, con ambos extremos incluidos; los importes están en la moneda del catálogo.
      parameters:
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: brandId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: name
        in: query
        required: false
        schema:
          type: string
          maxLength: 160
        description: Casa por `contains`, comparación `ignore-case-accents`.
      - name: minPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          multipleOf: 0.01
      - name: maxPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          multipleOf: 0.01
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Página, base 0.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Tamaño de página; un valor mayor que 100 se recorta a 100.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductPublic'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.

            `INVALID_PRICE_RANGE` — minPrice es mayor que maxPrice.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
                INVALID_PRICE_RANGE:
                  summary: minPrice es mayor que maxPrice.
                  value:
                    status: 400
                    code: INVALID_PRICE_RANGE
                    message: minPrice es mayor que maxPrice.
      security: []
