    post:
      operationId: activateBrand
      summary: Devuelve una marca al menú de filtros y vuelve a admitirla en productos nuevos.
      description: |-
        Devuelve una marca al menú de filtros y vuelve a admitirla en productos nuevos.

        **Reglas**:

        - Activar una marca ya activa deja el estado como está y se responde con éxito.
        - Si la marca ya estaba activa, no se publica BrandUpdated; sin cambio no hay evento.

        **Publica**: `BrandUpdated` (outbox).
      tags:
      - gestión — marcas
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Clave de intento generada por el cliente, obligatoria. Repetirla con el mismo contenido en
          las siguientes 86400 s devuelve la respuesta original sin segundo efecto.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          description: |-
            Petición mal formada: incumple la forma o las restricciones del contrato (sin `code` de negocio).

            `IDEMPOTENCY_KEY_REQUIRED` — La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar que un reintento no repita el efecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial o credencial inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso, rol o scope que exige la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`BRAND_NOT_FOUND` — No existe una marca con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            `IDEMPOTENCY_KEY_IN_PROGRESS` — Llegaron dos peticiones con la misma Idempotency-Key a la vez (código canónico).

            `IDEMPOTENCY_KEY_REUSED` — Se reutilizó una Idempotency-Key con un contenido distinto al de la primera petición (código canónico).

            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo recurso; recarga y reintenta (código canónico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userAuth: []
      x-keel-access:
        level: required
        roles:
        - catalog-manager
        - catalog-admin
        permissions:
        - taxonomy:write
