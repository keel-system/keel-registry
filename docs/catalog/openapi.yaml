  /api/v1/public/products:
    get:
      operationId: listPublicProducts
      summary: Lista los productos a la venta para el consumidor de la tienda, con los filtros del escaparate.
      description: |-
        Lista los productos a la venta para el consumidor de la tienda, con los filtros del escaparate.

