  /api/v1/management/products/{productId}/images:
    post:
      operationId: addProductImage
      summary: Añade una imagen a la galería de un producto.
      tags:
      - Back-office
      description: '**Precondiciones**


        - El producto existe y no está descatalogado.

        - El producto tiene menos de 10 imágenes.


        **Reglas**


        - La imagen se añade al final de la galería, con la position siguiente a la mayor existente.

        - Si es la primera imagen del producto, queda marcada como isPrimary.

        - Devuelve la imagen creada con su id, para que el cliente pueda referenciarla después.


        **Eventos emitidos**: `ProductUpdated` (ver `asyncapi.yaml`).


        **Idempotencia**: clave del cliente en la cabecera `Idempotency-Key`; ventana de 86400 s.'
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
        description: Clave de intento generada por el cliente; repetirla con el mismo contenido devuelve el resultado
          original.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - altText
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagen a subir al bucket `productImages` (JPEG, PNG o WebP; máximo 5 MB).
                altText:
                  type: string
                  maxLength: 160
      responses:
