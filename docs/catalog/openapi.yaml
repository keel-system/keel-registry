            - `BRAND_NAME_ALREADY_EXISTS` — Ya existe una marca con ese nombre.
            - `BRAND_SLUG_ALREADY_EXISTS` — El slug derivado del nombre ya lo usa otra marca, aunque los nombres no coincidan: «Acme!» y «Acme» dan el mismo.
            - `IDEMPOTENCY_KEY_IN_PROGRESS` — Otra petición con la misma clave de idempotencia se está ejecutando en este momento.
