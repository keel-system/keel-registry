                  value:
                    status: 404
                    code: BRAND_NOT_FOUND
                    message: No existe una marca con ese id.
      security:
      - userAuth: []
      x-keel-permissions:
      - catalog:read
      x-keel-roles:
      - catalog-admin
      - catalog-editor
  /api/v1/admin/brands/{id}/deactivate:
    post:
      operationId: deactivateBrand
      summary: 'Desactiva una marca: deja de admitir productos nuevos y de ofrecerse como filtro al público.'
      tags:
      - Marcas — gestión
      description: |-
        - Desactivar una marca ya inactiva no es un error; se responde con la marca sin cambios.
        - Los productos que ya pertenecen a la marca no cambian; siguen visibles si están publicados.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
