  /api/v1/services/products/{productId}:
    get:
      operationId: getProductForServices
      summary: Resuelve un producto por su id para otro servidor que necesita su ficha.
      description: |-
        Resuelve un producto por su id para otro servidor que necesita su ficha.

        Exige credencial de máquina con scopes `product:read`.

        Respuesta cacheada 60s (clave: productId), invalidada por ProductUpdated, ProductStatusChanged, BrandUpdated, CategoryUpdated.

        **Reglas**
        - Se resuelven productos active y discontinued: un pedido histórico referencia artículos que ya no se venden.
        - Un producto en draft responde como si no existiera: un borrador no es todavía un artículo del catálogo.
        - updatedAt viaja en la respuesta para que el consumidor sepa de cuándo es la ficha que recibe.

        Superficie **servidor-a-servidor**: la consumen otros servidores con credencial de máquina.
      tags:
      - Servidor-a-servidor
      parameters:
      - name: productId
        in: path
        required: true
        description: Identificador en la ruta.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductForServices'
        '400':
          description: |-
            Códigos posibles con este status:

            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Códigos posibles con este status:

            - `UNAUTHORIZED` — La petición llega sin credencial o con una no válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Códigos posibles con este status:

            - `FORBIDDEN` — La credencial es válida pero no alcanza lo que esta operación exige.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |-
            Códigos posibles con este status:

            - `PRODUCT_NOT_FOUND` — No existe un producto active o discontinued con ese productId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - serviceToken:
        - product:read
  /api/v1/services/products:
    get:
      operationId: listProductsBatchForServices
      summary: Resuelve varios productos por sus ids en una sola llamada, para que un servidor consumidor
        no haga una petición por artículo.
      description: |-
        Resuelve varios productos por sus ids en una sola llamada, para que un servidor consumidor no haga una petición por artículo.

        Exige credencial de máquina con scopes `product:read`.

        **Precondiciones**
        - La lista de ids llega presente y con al menos un elemento.
        - La lista no trae más de cien ids.

        **Reglas**
        - Los ids que no existen, los repetidos y los de productos en draft se omiten del resultado sin fallar.
        - El resultado sale ordenado por sku, no en el orden de la petición: el consumidor lo indexa por id.
        - La respuesta puede traer menos elementos que la petición; eso no es un error.

        Superficie **servidor-a-servidor**: la consumen otros servidores con credencial de máquina.
      tags:
      - Servidor-a-servidor
      parameters:
      - name: productIds
        in: query
        required: false
        description: ''
        schema:
          type: array
          items:
            type: string
            format: uuid
        style: form
        explode: true
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductForServices'
        '400':
          description: |-
            Códigos posibles con este status:

            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Códigos posibles con este status:

            - `UNAUTHORIZED` — La petición llega sin credencial o con una no válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Códigos posibles con este status:

            - `FORBIDDEN` — La credencial es válida pero no alcanza lo que esta operación exige.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            Códigos posibles con este status:

            - `EMPTY_ID_LIST` — La lista de ids llega vacía o ausente.
            - `TOO_MANY_IDS` — La lista trae más de cien ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - serviceToken:
        - product:read
components:
  schemas:
    SKU:
      type: string
      pattern: ^[A-Z0-9][A-Z0-9-]{2,31}$
      description: 'Código comercial con el que el negocio conoce el artículo (almacén, proveedor, facturas).
        Único e inmutable: identifica al mismo artículo físico durante toda su vida.'
    Slug:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      maxLength: 160
      description: Identificador legible usado en las URLs públicas, derivado del nombre.
    Price:
      type: number
      minimum: 0
      multipleOf: 0.01
      description: 'Importe de venta al público en la divisa única de la tienda, que es una constante
        del despliegue y no un dato del producto. La escala de dos decimales se valida, no se ajusta:
        un importe con más decimales se rechaza en vez de redondearse, porque el servicio no hace aritmética
        sobre el precio — lo guarda y lo devuelve tal cual llegó.'
    ProductStatus:
      type: string
      enum:
      - draft
      - active
      - discontinued
      description: Situación comercial del producto, que decide si la tienda pública lo muestra.
    Brand:
      type: object
      description: Marca o fabricante bajo el que se vende un producto.
      required:
      - id
      - name
      - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
          description: Único sin distinguir mayúsculas ni acentos.
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
          maxLength: 1000
          description: Reseña de la marca para la ficha pública.
    Category:
      type: object
      description: Agrupación comercial por la que el consumidor navega el catálogo. Las categorías son
        planas, sin jerarquía.
      required:
      - id
      - name
      - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
          description: Único sin distinguir mayúsculas ni acentos.
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
          maxLength: 1000
          description: Texto de cabecera de la categoría en la tienda.
    ProductImage:
      type: object
      description: Una imagen de la galería de un producto, con su posición en el orden de la ficha.
      required:
      - id
      - image
      - position
      - primary
      properties:
        id:
          type: string
          format: uuid
        image:
          type: string
          format: uri
          description: URL absoluta del objeto en el bucket lógico `productImages` (lectura anónima).
        altText:
          type: string
          maxLength: 200
          description: Texto alternativo para lectores de pantalla y buscadores.
        position:
          type: integer
          minimum: 0
          description: Orden de la imagen dentro de la galería; el menor se muestra primero.
        primary:
          type: boolean
          description: Marca la imagen que representa al producto en los listados.
    Error:
      type: object
      description: Forma única del cuerpo de error del servicio. `code` y el status HTTP son contrato
        estable; `message` es texto para humanos y puede cambiar sin romper a nadie.
      required:
      - status
      - code
      - message
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
          description: Nombre del status HTTP.
        code:
          type: string
          description: Código de negocio estable.
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: string
          description: Correlación de la petición.
    ProductPublic:
      type: object
      description: Proyección de Product tal como la devuelve la superficie correspondiente.
      required:
      - id
      - sku
      - name
      - slug
      - price
      - status
      - brand
      - category
      properties:
        id:
          type: string
          format: uuid
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
          maxLength: 140
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
          maxLength: 4000
          description: Descripción comercial larga que la tienda muestra en la ficha.
        price:
          $ref: '#/components/schemas/Price'
        status:
          $ref: '#/components/schemas/ProductStatus'
        brand:
          $ref: '#/components/schemas/Brand'
        category:
          $ref: '#/components/schemas/Category'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
    PageProductPublic:
      type: object
      description: Página de resultados. Sobre canónico de paginación del método Keel.
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductPublic'
        page:
          type: integer
          minimum: 0
          description: Índice de la página, base 0.
        size:
          type: integer
          minimum: 1
          description: Tamaño de página efectivo.
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    PageBrand:
      type: object
      description: Página de resultados. Sobre canónico de paginación del método Keel.
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
        page:
          type: integer
          minimum: 0
          description: Índice de la página, base 0.
        size:
          type: integer
          minimum: 1
          description: Tamaño de página efectivo.
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    PageCategory:
      type: object
      description: Página de resultados. Sobre canónico de paginación del método Keel.
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
      properties:
