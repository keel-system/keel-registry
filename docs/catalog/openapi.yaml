        altText:
          type:
          - string
          - 'null'
          maxLength: 160
          description: Texto alternativo para accesibilidad y SEO.
        position:
          type: integer
          format: int32
          minimum: 0
          maximum: 9
          description: Orden de visualización dentro de la ficha, empezando en 0.
        main:
          type: boolean
          description: Imagen principal (portada) del producto.
        productId:
          type: string
          format: uuid
          description: Id del producto al que pertenece la imagen (el DTO de una entidad hija lleva siempre el id
            de su raíz).
      description: Imagen de la ficha de un producto; dentro del producto viajan ordenadas por position ascendente.
    Product:
      type: object
      required:
      - id
