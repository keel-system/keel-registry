openapi: 3.1.0
info:
  title: catalog
  version: 0.3.1
  description: 'Catálogo comercial de una tienda: es la fuente de verdad de los productos, sus marcas y sus categorías,
    los publica a los consumidores con búsqueda y filtros, y difunde sus altas y cambios al resto de servidores
    por consulta directa y por eventos.


    Contrato HTTP derivado del diseño Keel. Tres superficies separadas por prefijo de ruta:


    - `/products`, `/brands`, `/categories` — tienda, sin credencial, solo productos a la venta.

    - `/management/...` — back-office, token de usuario con el permiso de la operación.

    - `/services/...` — otros servidores, credencial de máquina con el scope `product:read`.


    El host, el proveedor de identidad y el motor de persistencia se deciden al generar, no aquí.'
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: '{baseUrl}'
  description: El host y el puerto son parámetro de despliegue, nunca dato de diseño.
  variables:
    baseUrl:
      default: http://localhost:8080
      description: Raíz del servicio desplegado.
tags:
- name: Tienda
  description: Lectura pública del catálogo para los consumidores.
- name: Back-office
  description: Gestión autenticada del catálogo.
- name: Servidores (M2M)
  description: Superficie servidor-a-servidor; ver INTEGRATION.md.
paths:
  /api/v1/brands:
    get:
      operationId: listBrands
      summary: Lista las marcas del catálogo para poblar el filtro de la tienda.
      tags:
      - Tienda
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Página, base 0.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
        description: Tamaño de página; un valor mayor que 100 se recorta a 100, no da error.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedBrand'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: Lista las categorías del catálogo para poblar el filtro y el menú de la tienda.
      tags:
      - Tienda
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Página, base 0.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
        description: Tamaño de página; un valor mayor que 100 se recorta a 100, no da error.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCategory'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/management/brands:
    post:
      operationId: createBrand
      summary: Da de alta una marca comercial.
      tags:
      - Back-office
      description: '**Reglas**


        - El slug se deriva del name normalizado a kebab-case.

        - La unicidad del name no distingue mayúsculas ni acentos.


        **Eventos emitidos**: `BrandCreated` (ver `asyncapi.yaml`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrandRequest'
      responses:
        '201':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          headers:
            Location:
              description: URI del recurso creado.
              schema:
                type: string
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`BRAND_NAME_ALREADY_EXISTS` — Ya existe una marca con ese nombre ignorando mayúsculas y
            acentos.

            `BRAND_SLUG_CONFLICT` — El slug derivado del nombre coincide con el de otra marca; hay que elegir otro
            nombre.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BRAND_NAME_ALREADY_EXISTS:
                  summary: Ya existe una marca con ese nombre ignorando mayúsculas y acentos.
                  value:
                    status: 409
                    code: BRAND_NAME_ALREADY_EXISTS
                    message: Ya existe una marca con ese nombre ignorando mayúsculas y acentos.
                BRAND_SLUG_CONFLICT:
                  summary: El slug derivado del nombre coincide con el de otra marca; hay que elegir otro nombre.
                  value:
                    status: 409
                    code: BRAND_SLUG_CONFLICT
                    message: El slug derivado del nombre coincide con el de otra marca; hay que elegir otro nombre.
      security:
      - userAuth: []
      x-keel-permissions:
      - taxonomy:write
  /api/v1/management/brands/{brandId}:
    put:
      operationId: updateBrand
      summary: Modifica el nombre o la reseña de una marca.
      tags:
      - Back-office
      description: '**Precondiciones**


        - La marca existe.


        **Reglas**


        - El slug se recalcula cuando cambia el name.

        - La unicidad del name no distingue mayúsculas ni acentos.

        - La marca no está sujeta a bloqueo optimista: dos ediciones concurrentes no dan conflicto y gana la última
        en confirmar.


        **Eventos emitidos**: `BrandUpdated` (ver `asyncapi.yaml`).'
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBrandRequest'
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`BRAND_NOT_FOUND` — No existe una marca con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BRAND_NOT_FOUND:
                  summary: No existe una marca con ese id.
                  value:
                    status: 404
                    code: BRAND_NOT_FOUND
                    message: No existe una marca con ese id.
        '409':
          description: '`BRAND_NAME_ALREADY_EXISTS` — Ya existe otra marca con ese nombre ignorando mayúsculas y
            acentos.

            `BRAND_SLUG_CONFLICT` — El slug derivado del nombre coincide con el de otra marca; hay que elegir otro
            nombre.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BRAND_NAME_ALREADY_EXISTS:
                  summary: Ya existe otra marca con ese nombre ignorando mayúsculas y acentos.
                  value:
                    status: 409
                    code: BRAND_NAME_ALREADY_EXISTS
                    message: Ya existe otra marca con ese nombre ignorando mayúsculas y acentos.
                BRAND_SLUG_CONFLICT:
                  summary: El slug derivado del nombre coincide con el de otra marca; hay que elegir otro nombre.
                  value:
                    status: 409
                    code: BRAND_SLUG_CONFLICT
                    message: El slug derivado del nombre coincide con el de otra marca; hay que elegir otro nombre.
      security:
      - userAuth: []
      x-keel-permissions:
      - taxonomy:write
    delete:
      operationId: deleteBrand
      summary: Elimina una marca que ningún producto referencia.
      tags:
      - Back-office
      description: '**Precondiciones**


        - Ningún producto referencia la marca.


        **Reglas**


        - El borrado es idempotente: si no existe una marca con ese id la operación no hace nada y responde igual
        que si la hubiera borrado.

        - La referencia producto-marca es una restricción de integridad: si un producto se crea con esa marca mientras
        se borra, una de las dos escrituras falla y el borrado se traduce igualmente a BRAND_IN_USE. Comprobar y
        borrar sin esa garantía deja una ventana de carrera.

        - BrandDeleted se publica solo si se eliminó una marca; una repetición que no cambia nada no emite evento.


        **Eventos emitidos**: `BrandDeleted` (ver `asyncapi.yaml`).'
      parameters:
      - name: brandId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Operación completada; sin cuerpo.
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`BRAND_IN_USE` — Existen productos que referencian esa marca.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BRAND_IN_USE:
                  summary: Existen productos que referencian esa marca.
                  value:
                    status: 409
                    code: BRAND_IN_USE
                    message: Existen productos que referencian esa marca.
      security:
      - userAuth: []
      x-keel-permissions:
      - taxonomy:write
  /api/v1/management/categories:
    post:
      operationId: createCategory
      summary: Da de alta una categoría comercial.
      tags:
      - Back-office
      description: '**Reglas**


        - El slug se deriva del name normalizado a kebab-case.

        - La unicidad del name no distingue mayúsculas ni acentos.


        **Eventos emitidos**: `CategoryCreated` (ver `asyncapi.yaml`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          headers:
            Location:
              description: URI del recurso creado.
              schema:
                type: string
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`CATEGORY_NAME_ALREADY_EXISTS` — Ya existe una categoría con ese nombre ignorando mayúsculas
            y acentos.

            `CATEGORY_SLUG_CONFLICT` — El slug derivado del nombre coincide con el de otra categoría; hay que elegir
            otro nombre.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CATEGORY_NAME_ALREADY_EXISTS:
                  summary: Ya existe una categoría con ese nombre ignorando mayúsculas y acentos.
                  value:
                    status: 409
                    code: CATEGORY_NAME_ALREADY_EXISTS
                    message: Ya existe una categoría con ese nombre ignorando mayúsculas y acentos.
                CATEGORY_SLUG_CONFLICT:
                  summary: El slug derivado del nombre coincide con el de otra categoría; hay que elegir otro nombre.
                  value:
                    status: 409
                    code: CATEGORY_SLUG_CONFLICT
                    message: El slug derivado del nombre coincide con el de otra categoría; hay que elegir otro
                      nombre.
      security:
      - userAuth: []
      x-keel-permissions:
      - taxonomy:write
  /api/v1/management/categories/{categoryId}:
    put:
      operationId: updateCategory
      summary: Modifica el nombre o el texto de cabecera de una categoría.
      tags:
      - Back-office
      description: '**Precondiciones**


        - La categoría existe.


        **Reglas**


        - El slug se recalcula cuando cambia el name.

        - La unicidad del name no distingue mayúsculas ni acentos.

        - La categoría no está sujeta a bloqueo optimista: dos ediciones concurrentes no dan conflicto y gana la
        última en confirmar.


        **Eventos emitidos**: `CategoryUpdated` (ver `asyncapi.yaml`).'
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`CATEGORY_NOT_FOUND` — No existe una categoría con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CATEGORY_NOT_FOUND:
                  summary: No existe una categoría con ese id.
                  value:
                    status: 404
                    code: CATEGORY_NOT_FOUND
                    message: No existe una categoría con ese id.
        '409':
          description: '`CATEGORY_NAME_ALREADY_EXISTS` — Ya existe otra categoría con ese nombre ignorando mayúsculas
            y acentos.

            `CATEGORY_SLUG_CONFLICT` — El slug derivado del nombre coincide con el de otra categoría; hay que elegir
            otro nombre.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CATEGORY_NAME_ALREADY_EXISTS:
                  summary: Ya existe otra categoría con ese nombre ignorando mayúsculas y acentos.
                  value:
                    status: 409
                    code: CATEGORY_NAME_ALREADY_EXISTS
                    message: Ya existe otra categoría con ese nombre ignorando mayúsculas y acentos.
                CATEGORY_SLUG_CONFLICT:
                  summary: El slug derivado del nombre coincide con el de otra categoría; hay que elegir otro nombre.
                  value:
                    status: 409
                    code: CATEGORY_SLUG_CONFLICT
                    message: El slug derivado del nombre coincide con el de otra categoría; hay que elegir otro
                      nombre.
      security:
      - userAuth: []
      x-keel-permissions:
      - taxonomy:write
    delete:
      operationId: deleteCategory
      summary: Elimina una categoría que ningún producto referencia.
      tags:
      - Back-office
      description: '**Precondiciones**


        - Ningún producto referencia la categoría.


        **Reglas**


        - El borrado es idempotente: si no existe una categoría con ese id la operación no hace nada y responde
        igual que si la hubiera borrado.

        - La referencia producto-categoría es una restricción de integridad: si un producto se crea con esa categoría
        mientras se borra, una de las dos escrituras falla y el borrado se traduce igualmente a CATEGORY_IN_USE.
        Comprobar y borrar sin esa garantía deja una ventana de carrera.

        - CategoryDeleted se publica solo si se eliminó una categoría; una repetición que no cambia nada no emite
        evento.


        **Eventos emitidos**: `CategoryDeleted` (ver `asyncapi.yaml`).'
      parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Operación completada; sin cuerpo.
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`CATEGORY_IN_USE` — Existen productos que referencian esa categoría.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CATEGORY_IN_USE:
                  summary: Existen productos que referencian esa categoría.
                  value:
                    status: 409
                    code: CATEGORY_IN_USE
                    message: Existen productos que referencian esa categoría.
      security:
      - userAuth: []
      x-keel-permissions:
      - taxonomy:write
  /api/v1/management/products:
    get:
      operationId: listProducts
      summary: Lista los productos del catálogo para el back-office, en cualquier estado, con filtros de gestión.
      tags:
      - Back-office
      description: '**Reglas**


        - Los filtros presentes se combinan con conjunción; los ausentes no restringen.

        - Los filtros de texto (name, sku) buscan coincidencia parcial sin distinguir mayúsculas ni acentos.'
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
          description: Filtra por coincidencia parcial del nombre, sin distinguir mayúsculas.
        description: Filtra por coincidencia parcial del nombre, sin distinguir mayúsculas.
      - name: sku
        in: query
        required: false
        schema:
          type: string
          description: Filtra por coincidencia parcial del sku.
        description: Filtra por coincidencia parcial del sku.
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ProductStatus'
          description: Filtra por estado; sin él se devuelven todos.
        description: Filtra por estado; sin él se devuelven todos.
      - name: brandId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Página, base 0.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
        description: Tamaño de página; un valor mayor que 100 se recorta a 100, no da error.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProduct'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userAuth: []
      x-keel-permissions:
      - product:read
    post:
      operationId: createProduct
      summary: Da de alta un producto en estado draft, sin imágenes y todavía invisible para la tienda.
      tags:
      - Back-office
      description: '**Reglas**


        - El sku se normaliza a mayúsculas antes de validar su unicidad.

        - El slug se deriva del name y se le añade un sufijo numérico si ya existe otro producto con ese slug.

        - La derivación del sufijo es una lectura seguida de una escritura: dos altas simultáneas del mismo name pueden calcular el mismo sufijo y solo una llega a escribir. Esa carrera se resuelve con PRODUCT_SLUG_CONFLICT, no reintentando en silencio.

        - El producto nace siempre en estado draft, sea cual sea el resto de la petición.

        - El producto nace con slugFrozen en falso, así que su slug sigue el name hasta la primera publicación.


        **Eventos emitidos**: `ProductCreated` (ver `asyncapi.yaml`).


        **Idempotencia**: clave del cliente en la cabecera `Idempotency-Key`; ventana de 86400 s.'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
        description: Clave de intento generada por el cliente; repetirla con el mismo contenido devuelve el resultado
          original.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          headers:
            Location:
              description: URI del recurso creado.
              schema:
                type: string
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: '`SKU_ALREADY_EXISTS` — Ya existe un producto con ese sku.

            `PRODUCT_SLUG_CONFLICT` — Otra alta simultánea se quedó con el slug que esta petición había calculado; reintentar la llamada deriva un sufijo libre.

            `IDEMPOTENCY_KEY_REUSED` — La clave de idempotencia ya se usó para una petición con otro contenido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                SKU_ALREADY_EXISTS:
                  summary: Ya existe un producto con ese sku.
                  value:
                    status: 409
                    code: SKU_ALREADY_EXISTS
                    message: Ya existe un producto con ese sku.
                PRODUCT_SLUG_CONFLICT:
                  summary: Otra alta simultánea se quedó con el slug que esta petición había calculado; reintentar la llamada deriva un sufijo libre.
                  value:
                    status: 409
                    code: PRODUCT_SLUG_CONFLICT
                    message: Otra alta simultánea se quedó con el slug que esta petición había calculado; reintentar la llamada deriva un sufijo libre.
                IDEMPOTENCY_KEY_REUSED:
                  summary: La clave de idempotencia ya se usó para una petición con otro contenido.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
                    message: La clave de idempotencia ya se usó para una petición con otro contenido.
        '422':
          description: '`BRAND_NOT_FOUND` — El brandId indicado no corresponde a ninguna marca.

            `CATEGORY_NOT_FOUND` — El categoryId indicado no corresponde a ninguna categoría.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BRAND_NOT_FOUND:
                  summary: El brandId indicado no corresponde a ninguna marca.
                  value:
                    status: 422
                    code: BRAND_NOT_FOUND
                    message: El brandId indicado no corresponde a ninguna marca.
                CATEGORY_NOT_FOUND:
                  summary: El categoryId indicado no corresponde a ninguna categoría.
                  value:
                    status: 422
                    code: CATEGORY_NOT_FOUND
                    message: El categoryId indicado no corresponde a ninguna categoría.
      security:
      - userAuth: []
      x-keel-permissions:
      - product:write
