      summary: Da de alta una categoría.
      description: |-
        Da de alta una categoría.

        Exige token de usuario con permisos `taxonomy:write` y rol `catalog-admin`.

        **Idempotente**: exige la cabecera `Idempotency-Key`. El reintento con la misma clave reproduce la respuesta original; TTL 86400s.

        **Reglas**
        - El slug se deriva del name; si ya existe, la escritura se rechaza.

        **Publica** `CategoryCreated`.
      tags:
      - Gestión de categorías
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Clave con la que el cliente identifica su petición; el reintento con la misma clave
          no produce un segundo efecto.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 80
                description:
                  type: string
                  maxLength: 1000
              additionalProperties: false
              required:
              - name
      responses:
        '201':
          description: Respuesta correcta.
          headers:
            Location:
              description: URI del recurso creado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: |-
            Códigos posibles con este status:

            - `IDEMPOTENCY_KEY_REQUIRED` — La petición llega sin la cabecera Idempotency-Key, que esta operación exige.
            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Códigos posibles con este status:

            - `UNAUTHORIZED` — La petición llega sin credencial o con una no válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
