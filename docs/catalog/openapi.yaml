        - El rango de precio se aplica sobre price.amount, con ambos extremos incluidos.
        - Se filtra por la marca o la categoría indicadas aunque estén inactivas; la inactividad retira el filtro del menú, no los productos del escaparate.
      tags:
      - escaparate público
      parameters:
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: brandId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: name
        in: query
        required: false
        schema:
          type: string
          maxLength: 160
          description: Coincidencia por contenido, ignorando mayúsculas y acentos.
      - name: minPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          multipleOf: 0.01
      - name: maxPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          multipleOf: 0.01
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 24
        description: Tamaño de página; un valor mayor que 100 se recorta a 100.
