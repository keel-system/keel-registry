  /api/v1/services/products/batch:
    post:
      operationId: listProductsBatchForServices
      summary: Resuelve varios productos por sus identificadores en una sola llamada, para otro servidor.
      tags:
      - Servidores (M2M)
      description: '**Precondiciones**


        - La lista contiene como máximo 100 identificadores.


        **Reglas**


        - Devuelve los productos sea cual sea su estado.

        - Los identificadores que no corresponden a ningún producto se omiten del resultado, sin error.

        - Los identificadores repetidos se resuelven una sola vez.

        - Conserva updatedAt para que el consumidor pueda ordenar lo recibido contra su propia copia al reconciliar.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListProductsBatchForServicesRequest'
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductForServicesList'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`TOO_MANY_IDS` — La petición trae más de 100 identificadores.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                TOO_MANY_IDS:
                  summary: La petición trae más de 100 identificadores.
                  value:
                    status: 422
                    code: TOO_MANY_IDS
                    message: La petición trae más de 100 identificadores.
      security:
      - serviceAuth:
        - product:read
