          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`PRODUCT_NOT_FOUND` — No existe un producto con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PRODUCT_NOT_FOUND:
                  summary: No existe un producto con ese id.
                  value:
                    status: 404
                    code: PRODUCT_NOT_FOUND
                    message: No existe un producto con ese id.
      security:
      - userAuth: []
      x-keel-permissions:
      - product:read
    put:
      operationId: updateProduct
      summary: Modifica la ficha comercial de un producto sin cambiar su estado ni su sku.
      tags:
      - Back-office
      description: '**Precondiciones**


        - El producto existe.


        **Reglas**


        - El sku no se puede modificar: no forma parte de la entrada.

        - Es un reemplazo completo de la ficha: todo campo opcional que no venga en la petición queda a nulo.

        - El slug se recalcula cuando cambia el name solo si slugFrozen es falso; en cuanto es verdadero, queda
        congelado.

        - El recálculo deriva el sufijo igual que el alta, así que hereda su misma ventana de carrera: se resuelve
        con PRODUCT_SLUG_CONFLICT.

        - Si el producto está en estado active y el nuevo price no es mayor que cero, la operación se rechaza.


        **Eventos emitidos**: `ProductUpdated` (ver `asyncapi.yaml`).'
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso o scope exigido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`PRODUCT_NOT_FOUND` — No existe un producto con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PRODUCT_NOT_FOUND:
                  summary: No existe un producto con ese id.
                  value:
                    status: 404
                    code: PRODUCT_NOT_FOUND
                    message: No existe un producto con ese id.
        '409':
          description: '`PRODUCT_DISCONTINUED` — El producto está descatalogado y su ficha no admite cambios; hay
            que reactivarlo antes.

            `PRODUCT_SLUG_CONFLICT` — Otra escritura simultánea se quedó con el slug que esta petición había
            calculado; reintentar la llamada deriva un sufijo libre.

            `PRODUCT_VERSION_CONFLICT` — Otro operador modificó el producto después de que este lo leyera.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PRODUCT_DISCONTINUED:
                  summary: El producto está descatalogado y su ficha no admite cambios; hay que reactivarlo antes.
                  value:
                    status: 409
                    code: PRODUCT_DISCONTINUED
                    message: El producto está descatalogado y su ficha no admite cambios; hay que reactivarlo antes.
                PRODUCT_SLUG_CONFLICT:
                  summary: Otra escritura simultánea se quedó con el slug que esta petición había calculado; reintentar
                    la llamada deriva un sufijo libre.
                  value:
                    status: 409
                    code: PRODUCT_SLUG_CONFLICT
                    message: Otra escritura simultánea se quedó con el slug que esta petición había calculado; reintentar
                      la llamada deriva un sufijo libre.
                PRODUCT_VERSION_CONFLICT:
                  summary: Otro operador modificó el producto después de que este lo leyera.
                  value:
                    status: 409
                    code: PRODUCT_VERSION_CONFLICT
                    message: Otro operador modificó el producto después de que este lo leyera.
        '422':
          description: '`BRAND_NOT_FOUND` — El brandId indicado no corresponde a ninguna marca.

            `CATEGORY_NOT_FOUND` — El categoryId indicado no corresponde a ninguna categoría.

            `PRODUCT_NOT_PUBLISHABLE` — El producto está active y el cambio lo dejaría sin precio válido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BRAND_NOT_FOUND:
                  summary: El brandId indicado no corresponde a ninguna marca.
                  value:
                    status: 422
                    code: BRAND_NOT_FOUND
                    message: El brandId indicado no corresponde a ninguna marca.
                CATEGORY_NOT_FOUND:
                  summary: El categoryId indicado no corresponde a ninguna categoría.
                  value:
                    status: 422
                    code: CATEGORY_NOT_FOUND
                    message: El categoryId indicado no corresponde a ninguna categoría.
                PRODUCT_NOT_PUBLISHABLE:
                  summary: El producto está active y el cambio lo dejaría sin precio válido.
                  value:
                    status: 422
                    code: PRODUCT_NOT_PUBLISHABLE
                    message: El producto está active y el cambio lo dejaría sin precio válido.
      security:
      - userAuth: []
      x-keel-permissions:
      - product:write
