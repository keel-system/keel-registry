      operationId: createProduct
      summary: Da de alta un producto en estado draft, sin imágenes todavía.
      tags:
      - Productos — gestión
      description: |-
        - El sku se admite en mayúsculas o minúsculas y se normaliza a mayúsculas antes de comprobar su unicidad; se guarda y se devuelve siempre en mayúsculas.
        - El name se recorta de espacios al principio y al final antes de validar.
        - El producto nace siempre en estado draft, sin imágenes y con firstPublishedAt a null.
        - Un price.amount igual a cero se admite en draft; solo impide publicar.

        **Eventos emitidos**: `ProductCreated` (ver `asyncapi.yaml`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Clave del intento, generada por el cliente. Se recuerda 24 h: un reintento con la misma clave
          devuelve la respuesta original sin repetir el efecto. Sin ella: `400 IDEMPOTENCY_KEY_REQUIRED`.'
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          headers:
            Location:
              description: Ruta de lectura del recurso creado (para una imagen, la ficha del producto).
              schema:
                type: string
