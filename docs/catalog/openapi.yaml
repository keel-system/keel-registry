    serviceToken:
      type: oauth2
      description: 'Credencial de máquina (OAuth2 client credentials). La URL de token es parámetro de
        despliegue: el marcador usa el TLD reservado `.invalid` a propósito. El token debe declarar la
        audiencia `catalog`.'
      flows:
        clientCredentials:
          tokenUrl: https://authorization-server.invalid/oauth2/token
          scopes:
            product:read: Leer fichas de producto desde el back-office, en cualquier estado.
