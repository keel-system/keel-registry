              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: |-
            Petición mal formada: incumple la forma o las restricciones del contrato (sin `code` de negocio).

            `IDEMPOTENCY_KEY_REQUIRED` — La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar que un reintento no repita el efecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial o credencial inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso, rol o scope que exige la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`CATEGORY_NOT_FOUND` — No existe una categoría con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            `IDEMPOTENCY_KEY_IN_PROGRESS` — Llegaron dos peticiones con la misma Idempotency-Key a la vez (código canónico).

            `IDEMPOTENCY_KEY_REUSED` — Se reutilizó una Idempotency-Key con un contenido distinto al de la primera petición (código canónico).

            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo recurso; recarga y reintenta (código canónico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userAuth: []
      x-keel-access:
        level: required
        roles:
        - catalog-manager
        - catalog-admin
        permissions:
        - taxonomy:write
components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de usuario OIDC. Los roles y permisos que exige cada operación están en `x-keel-access`.
    serviceAuth:
      type: oauth2
      description: Credencial de máquina (OAuth2 client credentials). El `tokenUrl` real es parámetro de despliegue;
        se valida la audiencia `catalog`, así que un token emitido para otro servicio se rechaza.
      flows:
        clientCredentials:
          tokenUrl: https://identity.invalid/oauth2/token
          scopes:
            product:read: Consultar productos en la gestión, en cualquier estado.
  schemas:
    SKU:
      type: string
      pattern: ^[A-Z0-9][A-Z0-9_-]{1,31}$
      description: Identificador comercial único del producto, el que comparten el catálogo y los servidores que
        lo consumen.
    Money:
      type: object
      description: Importe con su moneda. El servicio no convierte divisas.
      required:
      - amount
      - currency
      properties:
        amount:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: Importe.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Moneda del importe en ISO 4217.
    ProductStatus:
      type: string
      enum:
      - draft
      - active
      - retired
      description: Situación comercial del producto.
    BrandEmbedded:
      type: object
      description: 'Marca embebida en la ficha de producto: sus campos propios, sin relaciones.'
      required:
      - id
      - name
      - description
      - active
      properties:
        id:
          type: string
          format: uuid
          description: Identificador asignado por el servicio.
        name:
          type: string
          maxLength: 80
          description: Nombre comercial de la marca.
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Texto libre sobre la marca, visible en la tienda.
        active:
          type: boolean
          description: Una marca inactiva no se ofrece como filtro al público ni admite productos nuevos.
    CategoryEmbedded:
      type: object
      description: 'Categoría embebida en la ficha de producto: sus campos propios, sin relaciones.'
      required:
      - id
      - name
      - description
      - active
      properties:
        id:
          type: string
          format: uuid
          description: Identificador asignado por el servicio.
        name:
          type: string
          maxLength: 80
          description: Nombre de la categoría.
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Texto libre sobre la categoría, visible en la tienda.
        active:
          type: boolean
          description: Una categoría inactiva no se ofrece como filtro al público ni admite productos nuevos.
    ProductImage:
      type: object
      description: Imagen de la ficha. Viaja anidada bajo su producto, ordenada por position ascendente.
      required:
      - id
      - file
      - altText
      - position
      - main
      properties:
        id:
          type: string
          format: uuid
          description: Identificador asignado por el servicio.
        file:
          type: string
          format: uri
          description: El binario de la imagen.
        altText:
          type:
          - string
          - 'null'
          maxLength: 160
          description: Texto alternativo para accesibilidad y SEO.
        position:
          type: integer
          minimum: 0
          maximum: 9
          description: Orden de visualización dentro de la ficha, empezando en 0.
        main:
          type: boolean
          description: Imagen principal (portada) del producto.
    Product:
      type: object
      description: 'Producto en la superficie de gestión: incluye el rastro de auditoría.'
      required:
      - id
      - sku
      - name
      - description
      - price
      - status
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      - brand
      - category
      - images
      properties:
        id:
          type: string
          format: uuid
          description: Identificador asignado por el servicio.
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
          maxLength: 160
          description: Nombre comercial del producto.
        description:
          type:
          - string
          - 'null'
          maxLength: 4000
          description: Descripción larga del producto, visible en la ficha de la tienda.
        price:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/ProductStatus'
        createdAt:
          type: string
          format: date-time
          description: Instante de creación (UTC).
        updatedAt:
          type: string
          format: date-time
          description: Instante de la última modificación (UTC).
        createdBy:
          type: string
          description: Principal autenticado que creó el recurso.
        updatedBy:
          type: string
          description: Principal autenticado de la última modificación.
        brand:
          $ref: '#/components/schemas/BrandEmbedded'
        category:
          $ref: '#/components/schemas/CategoryEmbedded'
        images:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProductImage'
          description: Imágenes del producto, ordenadas por position ascendente.
    ProductPublic:
      type: object
      description: 'Producto en el escaparate público y en la superficie M2M: sin campos de auditoría.'
      required:
      - id
      - sku
      - name
      - description
      - price
      - status
      - brand
      - category
      - images
      properties:
        id:
          type: string
          format: uuid
          description: Identificador asignado por el servicio.
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
          maxLength: 160
          description: Nombre comercial del producto.
        description:
          type:
          - string
          - 'null'
          maxLength: 4000
          description: Descripción larga del producto, visible en la ficha de la tienda.
        price:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/ProductStatus'
        brand:
          $ref: '#/components/schemas/BrandEmbedded'
        category:
          $ref: '#/components/schemas/CategoryEmbedded'
        images:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProductImage'
          description: Imágenes del producto, ordenadas por position ascendente.
    Brand:
      type: object
