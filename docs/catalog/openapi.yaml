        - El tamaño y el formato del archivo se comprueban antes que el producto; un archivo rechazado nunca llega a mirar el estado del producto.
        - La imagen se añade al final, en la position siguiente a la última ocupada; es la imagen nueva la que queda en la última position de la ficha devuelta.
        - Añadir una imagen sube la lockVersion del producto; dos altas simultáneas sobre el mismo producto no pueden repetir position ni superar el tope de 10, y la que pierde responde CONCURRENT_MODIFICATION.
        - La primera imagen de un producto queda siempre marcada como principal, se pida o no.
        - Si se pide main, la imagen que fuera principal hasta entonces deja de serlo.
        - El formato se comprueba por el contenido del binario (su firma), no solo por el tipo declarado en la petición.
        - El binario se guarda antes de confirmar la imagen; si la confirmación falla, el binario queda sin referencia y nunca hay una imagen que apunte a un archivo inexistente.

        **Eventos emitidos**: `ProductUpdated` (ver `asyncapi.yaml`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddProductImageRequest'
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Clave del intento, generada por el cliente. Se recuerda 24 h: un reintento con la misma clave
          devuelve la respuesta original sin repetir el efecto. Sin ella: `400 IDEMPOTENCY_KEY_REQUIRED`.'
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          headers:
            Location:
              description: Ruta de lectura del recurso creado (para una imagen, la ficha del producto).
              schema:
                type: string
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.

            `IDEMPOTENCY_KEY_REQUIRED` — La petición no trae la cabecera Idempotency-Key; sin ella el servicio no
            puede garantizar que un reintento no repita el efecto.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
                IDEMPOTENCY_KEY_REQUIRED:
                  summary: 'La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar
                    que un reintento no repita el '
                  value:
                    status: 400
                    code: IDEMPOTENCY_KEY_REQUIRED
                    message: La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar
                      que un reintento no repita el efecto.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido.
        '404':
          description: '`PRODUCT_NOT_FOUND` — No existe un producto con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PRODUCT_NOT_FOUND:
                  summary: No existe un producto con ese id.
                  value:
                    status: 404
                    code: PRODUCT_NOT_FOUND
                    message: No existe un producto con ese id.
        '409':
          description: '`PRODUCT_RETIRED` — El producto está retirado y ya no admite cambios.

            `IMAGE_LIMIT_REACHED` — El producto ya tiene 10 imágenes.

            `CONCURRENT_MODIFICATION` — Otra escritura sobre el mismo producto se confirmó durante el alta (p. ej.
            otra imagen subida a la vez).

            `IDEMPOTENCY_KEY_IN_PROGRESS` — Otra petición con la misma Idempotency-Key está en curso; reintentar
            más tarde.

            `IDEMPOTENCY_KEY_REUSED` — La Idempotency-Key ya se usó con un cuerpo distinto.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                PRODUCT_RETIRED:
                  summary: El producto está retirado y ya no admite cambios.
                  value:
                    status: 409
                    code: PRODUCT_RETIRED
                    message: El producto está retirado y ya no admite cambios.
                IMAGE_LIMIT_REACHED:
                  summary: El producto ya tiene 10 imágenes.
                  value:
                    status: 409
                    code: IMAGE_LIMIT_REACHED
                    message: El producto ya tiene 10 imágenes.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura sobre el mismo producto se confirmó durante el alta (p. ej. otra imagen
                    subida a la vez).
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura sobre el mismo producto se confirmó durante el alta (p. ej. otra imagen
                      subida a la vez).
                IDEMPOTENCY_KEY_IN_PROGRESS:
                  summary: Otra petición con la misma Idempotency-Key está en curso; reintentar más tarde.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_IN_PROGRESS
                    message: Otra petición con la misma Idempotency-Key está en curso; reintentar más tarde.
                IDEMPOTENCY_KEY_REUSED:
                  summary: La Idempotency-Key ya se usó con un cuerpo distinto.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
                    message: La Idempotency-Key ya se usó con un cuerpo distinto.
        '413':
          description: '`FILE_TOO_LARGE` — La imagen supera el tamaño máximo admitido por el bucket.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                FILE_TOO_LARGE:
                  summary: La imagen supera el tamaño máximo admitido por el bucket.
                  value:
                    status: 413
                    code: FILE_TOO_LARGE
                    message: La imagen supera el tamaño máximo admitido por el bucket.
        '415':
          description: '`UNSUPPORTED_CONTENT_TYPE` — El formato de la imagen no está entre los admitidos, o el contenido
            del archivo no coincide con el tipo declarado.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNSUPPORTED_CONTENT_TYPE:
                  summary: El formato de la imagen no está entre los admitidos, o el contenido del archivo no coincide
                    con el tipo declarado.
                  value:
                    status: 415
                    code: UNSUPPORTED_CONTENT_TYPE
                    message: El formato de la imagen no está entre los admitidos, o el contenido del archivo no
                      coincide con el tipo declarado.
      security:
      - userAuth: []
      x-keel-permissions:
      - product:write
      x-keel-roles:
      - catalog-admin
      - catalog-editor
      x-keel-idempotency:
        keySource: client-key
        ttlSeconds: 86400
  /api/v1/admin/products/{productId}/images/{imageId}:
