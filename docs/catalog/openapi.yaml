  /api/v1/management/products/{productId}/images:
    post:
      operationId: addProductImage
      summary: Sube una imagen a la galería de un producto y la coloca al final del orden.
      description: |-
        Sube una imagen a la galería de un producto y la coloca al final del orden.

        Exige token de usuario con permisos `product:write`.

        **Idempotente**: exige la cabecera `Idempotency-Key`. El reintento con la misma clave reproduce la respuesta original; TTL 86400s.

        **Precondiciones**
        - El producto existe y no está discontinued.
        - El producto no ha alcanzado el máximo de diez imágenes.

        **Reglas**
        - La imagen recibe la position siguiente a la mayor de la galería; la primera imagen de una galería vacía recibe position 0.
        - Si llega con primary verdadero, la imagen que lo era deja de serlo.
        - Si otra escritura concurrente sobre la galería marcó otra primary antes, esta pierde con 409 CONCURRENT_MODIFICATION: la galería es parte del agregado Product.
        - Si es la primera imagen del producto, se marca primary aunque no se pida.

        **Publica** `ProductUpdated`.
      tags:
      - Gestión de productos
      parameters:
      - name: productId
        in: path
        required: true
        description: Identificador en la ruta.
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        description: Clave con la que el cliente identifica su petición; el reintento con la misma clave
          no produce un segundo efecto.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: Contenido binario del archivo (bucket lógico `productImages`).
                altText:
                  type: string
                  maxLength: 200
                primary:
                  type: boolean
              required:
              - image
      responses:
        '201':
          description: Respuesta correcta.
          headers:
            Location:
              description: URI del recurso creado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductImage'
        '400':
          description: |-
            Códigos posibles con este status:

            - `IDEMPOTENCY_KEY_REQUIRED` — La petición llega sin la cabecera Idempotency-Key, que esta operación exige.
            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Códigos posibles con este status:

            - `UNAUTHORIZED` — La petición llega sin credencial o con una no válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Códigos posibles con este status:

            - `FORBIDDEN` — La credencial es válida pero no alcanza lo que esta operación exige.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |-
            Códigos posibles con este status:

            - `PRODUCT_NOT_FOUND` — No existe un producto con ese productId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Códigos posibles con este status:

            - `PRODUCT_DISCONTINUED` — El producto está descontinuado y su galería ya no se toca.
            - `IDEMPOTENCY_KEY_IN_PROGRESS` — Otra petición con la misma clave de idempotencia se está ejecutando en este momento.
            - `IDEMPOTENCY_KEY_REUSED` — La misma clave de idempotencia llega con un contenido distinto al de la primera petición.
            - `CONCURRENT_MODIFICATION` — Otra escritura modificó el producto mientras se ejecutaba esta. Lo emite el framework por el control de versión de la raíz del agregado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: |-
            Códigos posibles con este status:

            - `FILE_TOO_LARGE` — El archivo supera el tamaño máximo del bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: |-
            Códigos posibles con este status:

            - `UNSUPPORTED_CONTENT_TYPE` — El archivo no es de un tipo de imagen admitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            Códigos posibles con este status:

            - `TOO_MANY_PRODUCT_IMAGES` — El producto ya tiene diez imágenes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userToken: []
