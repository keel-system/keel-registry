openapi: 3.1.0
info:
  title: catalog
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |-
    Gestiona el catálogo comercial —productos con sus imágenes, marcas y categorías—, lo expone filtrable al público de la tienda, lo sirve a otros servidores por contrato y publica las altas y cambios de producto como eventos.

    Contrato HTTP derivado del diseño Keel. Tres superficies separadas por prefijo de ruta:

    - `/admin/...` — gestión de la tienda: token de usuario con el permiso de la operación (roles `catalog-editor` y `catalog-admin`).
    - `/products`, `/brands`, `/categories` — la tienda, pública y sin credencial: solo lo publicado, sin versión ni auditoría.
    - `/internal/...` — otros servidores: credencial de máquina con el scope `product:read-internal`.

    **Moneda única**: todo `price` va en la moneda del catálogo (parámetro de despliegue `currency`, ISO 4217 de 2 decimales); otra moneda responde `422 CURRENCY_NOT_SUPPORTED`. Un importe con más de 2 decimales se rechaza (`400`), no se redondea.

    **Nulos**: un campo sin valor viaja como `null`; una colección vacía, como `[]`. Los instantes son ISO-8601 en UTC.

    **Concurrencia**: los `PATCH` exigen `version` (la `lockVersion` leída); si no es la vigente responden `409 CONCURRENT_MODIFICATION`.

    **Imágenes**: en las respuestas, `file` es la URL absoluta del objeto en el bucket público `productImages`.
servers:
- url: '{baseUrl}'
  description: El host y el puerto son parámetro de despliegue, nunca dato de diseño.
  variables:
    baseUrl:
      default: http://localhost:8080
      description: Raíz del servicio desplegado.
tags:
- name: Marcas — gestión
  description: Alta, edición y (des)activación de marcas; rol catalog-admin para escribir.
- name: Categorías — gestión
  description: Alta, edición y (des)activación de categorías planas; rol catalog-admin para escribir.
- name: Productos — gestión
  description: Ciclo de vida del producto en cualquier estado; catalog-editor edita y publica, catalog-admin retira.
- name: Imágenes — gestión
  description: Subida, orden, portada y baja de las imágenes de un producto (hasta 10).
- name: Tienda (público)
  description: 'Lo publicado, sin credencial: búsqueda filtrable, ficha y filtros de marcas y categorías.'
- name: Servidor a servidor
  description: Resolución de productos por id o por lote, en cualquier estado, con credencial de máquina.
paths:
  /api/v1/admin/brands:
    post:
      operationId: createBrand
      summary: Da de alta una marca, activa desde el primer momento.
      tags:
      - Marcas — gestión
      description: |-
        - El name se recorta de espacios al principio y al final antes de validar y de comprobar su unicidad.
        - La marca nace siempre activa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrandRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Clave del intento, generada por el cliente. Se recuerda 24 h: un reintento con la misma clave
          devuelve la respuesta original sin repetir el efecto. Sin ella: `400 IDEMPOTENCY_KEY_REQUIRED`.'
        schema:
          type: string
          minLength: 1
          maxLength: 255
      responses:
        '201':
          description: Recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          headers:
            Location:
              description: Ruta de lectura del recurso creado (para una imagen, la ficha del producto).
              schema:
                type: string
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.

            `IDEMPOTENCY_KEY_REQUIRED` — La petición no trae la cabecera Idempotency-Key; sin ella el servicio no
            puede garantizar que un reintento no repita el efecto.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
                IDEMPOTENCY_KEY_REQUIRED:
                  summary: 'La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar
                    que un reintento no repita el '
                  value:
                    status: 400
                    code: IDEMPOTENCY_KEY_REQUIRED
                    message: La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar
                      que un reintento no repita el efecto.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido.
        '409':
          description: '`BRAND_NAME_ALREADY_EXISTS` — Ya existe una marca con ese nombre, sin distinguir mayúsculas
            ni acentos.

            `IDEMPOTENCY_KEY_IN_PROGRESS` — Otra petición con la misma Idempotency-Key está en curso; reintentar
            más tarde.

            `IDEMPOTENCY_KEY_REUSED` — La Idempotency-Key ya se usó con un cuerpo distinto.

            `CONCURRENT_MODIFICATION` — Otra escritura sobre la misma raíz se confirmó antes; el cliente relee y
            reintenta con la versión nueva.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BRAND_NAME_ALREADY_EXISTS:
                  summary: Ya existe una marca con ese nombre, sin distinguir mayúsculas ni acentos.
                  value:
                    status: 409
                    code: BRAND_NAME_ALREADY_EXISTS
                    message: Ya existe una marca con ese nombre, sin distinguir mayúsculas ni acentos.
                IDEMPOTENCY_KEY_IN_PROGRESS:
                  summary: Otra petición con la misma Idempotency-Key está en curso; reintentar más tarde.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_IN_PROGRESS
                    message: Otra petición con la misma Idempotency-Key está en curso; reintentar más tarde.
                IDEMPOTENCY_KEY_REUSED:
                  summary: La Idempotency-Key ya se usó con un cuerpo distinto.
                  value:
                    status: 409
                    code: IDEMPOTENCY_KEY_REUSED
                    message: La Idempotency-Key ya se usó con un cuerpo distinto.
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura sobre la misma raíz se confirmó antes; el cliente relee y reintenta con
                    la versión nueva.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura sobre la misma raíz se confirmó antes; el cliente relee y reintenta
                      con la versión nueva.
      security:
      - userAuth: []
      x-keel-permissions:
      - taxonomy:write
      x-keel-roles:
      - catalog-admin
      x-keel-idempotency:
        keySource: client-key
        ttlSeconds: 86400
    get:
      operationId: listBrands
      summary: Lista las marcas para la gestión, activas e inactivas.
      tags:
      - Marcas — gestión
      description: |-
        - Los filtros son acumulativos; los ausentes no restringen.
      parameters:
