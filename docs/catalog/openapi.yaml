          type: string
          format: uuid
          description: Identificador asignado por el servicio.
        name:
          type: string
          maxLength: 80
          description: Nombre de la categoría.
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Texto libre sobre la categoría, visible en la tienda.
        active:
          type: boolean
          description: Una categoría inactiva no se ofrece como filtro al público ni admite productos nuevos.
    CategoryPublic:
      type: object
      description: Categoría en el menú público de filtros.
      required:
      - id
      - name
      - description
      properties:
        id:
          type: string
          format: uuid
          description: Identificador asignado por el servicio.
        name:
          type: string
          maxLength: 80
