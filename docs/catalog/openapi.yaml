        schema:
          $ref: '#/components/schemas/Slug'
          description: Filtra por la categoría indicada.
        description: Filtra por la categoría indicada.
      - name: brandSlug
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Slug'
          description: Filtra por la marca indicada.
        description: Filtra por la marca indicada.
      - name: name
        in: query
        required: false
        schema:
          type: string
          maxLength: 140
          description: Filtra por coincidencia parcial del nombre, sin distinguir mayúsculas ni acentos.
        description: Filtra por coincidencia parcial del nombre, sin distinguir mayúsculas ni acentos.
      - name: minPrice
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Price'
          description: Precio mínimo, incluido.
        description: Precio mínimo, incluido.
      - name: maxPrice
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Price'
          description: Precio máximo, incluido.
        description: Precio máximo, incluido.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Página, base 0.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
        description: Tamaño de página; un valor mayor que 100 se recorta a 100, no da error.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductPublic'
        '400':
          description: 'Petición mal formada: falta un campo requerido o incumple sus restricciones.'
          content:
