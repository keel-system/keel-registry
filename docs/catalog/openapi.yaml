          type: integer
          minimum: 0
    Error:
      type: object
      description: Forma única del cuerpo de error del servicio. El `code` es contrato; el texto de `message` no.
      required:
      - status
      - code
      - message
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        code:
          type: string
        message:
          type: string
        details:
          type:
          - array
          - 'null'
