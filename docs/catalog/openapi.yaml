                    code: IDEMPOTENCY_KEY_REQUIRED
                    message: La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar
                      que un reintento no repita el efecto.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
