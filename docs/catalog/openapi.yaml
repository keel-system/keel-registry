        required: false
        schema:
          type: boolean
      - name: name
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
        description: Casa por `contains`, comparación `ignore-case-accents`.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Página, base 0.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Tamaño de página; un valor mayor que 100 se recorta a 100.
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedBrand'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido.
      security:
      - userAuth: []
      x-keel-permissions:
      - catalog:read
      x-keel-roles:
      - catalog-admin
      - catalog-editor
  /api/v1/admin/brands/{id}:
    patch:
      operationId: updateBrand
      summary: Modifica el nombre o la descripción de una marca.
      tags:
      - Marcas — gestión
      description: |-
        - Solo se modifican los campos presentes en la petición; un campo ausente conserva su valor.
        - description enviada a null se vacía; name enviado a null es una petición mal formada.
        - El name se recorta de espacios al principio y al final antes de validar y de comprobar su unicidad.
        - La version enviada tiene que ser la lockVersion actual; si no lo es, no se aplica nada.
        - Se puede modificar una marca inactiva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBrandRequest'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Operación completada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          description: '`VALIDATION_ERROR` — La petición no cumple las cotas declaradas del input.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: La petición no cumple las cotas declaradas del input.
                  value:
                    status: 400
                    code: VALIDATION_ERROR
                    message: La petición no cumple las cotas declaradas del input.
        '401':
          description: '`UNAUTHENTICATED` — Sin credencial válida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                UNAUTHENTICATED:
                  summary: Sin credencial válida.
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Sin credencial válida.
        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido.
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido.
        '404':
          description: '`BRAND_NOT_FOUND` — No existe una marca con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                BRAND_NOT_FOUND:
                  summary: No existe una marca con ese id.
                  value:
                    status: 404
                    code: BRAND_NOT_FOUND
                    message: No existe una marca con ese id.
        '409':
          description: '`CONCURRENT_MODIFICATION` — La version enviada no es la lockVersion actual: otro cambio
            se confirmó después de que el gestor leyera el recurso.

            `BRAND_NAME_ALREADY_EXISTS` — Otra marca ya tiene ese nombre, sin distinguir mayúsculas ni acentos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CONCURRENT_MODIFICATION:
                  summary: 'La version enviada no es la lockVersion actual: otro cambio se confirmó después de que
                    el gestor leyera el recurso.'
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: 'La version enviada no es la lockVersion actual: otro cambio se confirmó después de
                      que el gestor leyera el recurso.'
                BRAND_NAME_ALREADY_EXISTS:
                  summary: Otra marca ya tiene ese nombre, sin distinguir mayúsculas ni acentos.
                  value:
                    status: 409
                    code: BRAND_NAME_ALREADY_EXISTS
                    message: Otra marca ya tiene ese nombre, sin distinguir mayúsculas ni acentos.
      security:
      - userAuth: []
      x-keel-permissions:
      - taxonomy:write
      x-keel-roles:
      - catalog-admin
    get:
      operationId: getBrand
      summary: Recupera una marca por su id para la gestión, activa o no.
      tags:
      - Marcas — gestión
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
