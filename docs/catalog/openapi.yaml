openapi: 3.1.0
info:
  title: catalog
  version: 0.1.0
  description: |-
    Gestiona el catálogo comercial —productos con sus imágenes, marcas y categorías—, lo expone filtrable al público de la tienda, lo sirve a otros servidores por contrato y publica sus altas y cambios como eventos.

    Contrato HTTP derivado del diseño Keel. Tres superficies separadas por prefijo de ruta:

    - `/public/...` — escaparate: sin autenticación, solo productos `active`.
    - `/internal/...` — otros servidores: credencial de máquina (client credentials) con el scope `product:read`; devuelve productos en cualquier estado.
    - el resto — gestión de la tienda: token de usuario con el permiso de la operación (`x-keel-access`).

    Toda mutación con efecto hacia fuera exige la cabecera `Idempotency-Key`. Un campo sin valor viaja como `null`, nunca omitido. Los importes viajan como número con escala 2 y un importe con más decimales se rechaza. El host, el proveedor de identidad y el motor de persistencia se deciden al generar, no aquí.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: '{baseUrl}'
  description: El host y el puerto son parámetro de despliegue, nunca dato de diseño.
  variables:
    baseUrl:
      default: http://localhost:8080
tags:
- name: gestión — productos
  description: Alta, edición, imágenes y ciclo de vida de los productos. Token de usuario.
- name: gestión — marcas
  description: Mantenimiento de marcas. Token de usuario.
- name: gestión — categorías
  description: Mantenimiento de categorías. Token de usuario.
- name: escaparate público
  description: Lo que ve el consumidor de la tienda. Sin autenticación; solo productos active.
- name: servidores (M2M)
  description: Contrato para otros servidores. Credencial de máquina con scope product:read.
paths:
  /api/v1/products:
    post:
      operationId: createProduct
      summary: Da de alta un producto en estado draft, sin imágenes todavía.
      description: |-
        Da de alta un producto en estado draft, sin imágenes todavía.

        **Reglas**:

        - El sku se admite en mayúsculas o minúsculas y se normaliza a mayúsculas antes de comprobar su unicidad; se guarda y se devuelve siempre en mayúsculas.
        - El producto nace siempre en estado draft, con independencia de lo que pida el cliente.
        - Si la marca o la categoría se borran a la vez que se da el alta, gana una de las dos operaciones y la otra falla con su error declarado; nunca queda un producto apuntando a una marca o categoría inexistente.

        **Publica**: `ProductCreated` (outbox).
      tags:
      - gestión — productos
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Clave de intento generada por el cliente, obligatoria. Repetirla con el mismo contenido en
          las siguientes 86400 s devuelve la respuesta original sin segundo efecto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                  pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{1,31}$
                name:
                  type: string
                  maxLength: 160
                description:
                  type: string
                  maxLength: 4000
                price:
                  $ref: '#/components/schemas/Money'
                brandId:
                  type: string
                  format: uuid
                categoryId:
                  type: string
                  format: uuid
              required:
              - sku
              - name
              - price
              - brandId
              - categoryId
      responses:
        '201':
          description: Éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          headers:
            Location:
              description: URI del recurso creado.
              schema:
                type: string
                format: uri-reference
        '400':
          description: |-
            Petición mal formada: incumple la forma o las restricciones del contrato (sin `code` de negocio).

            `IDEMPOTENCY_KEY_REQUIRED` — La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar que un reintento no repita el efecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial o credencial inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso, rol o scope que exige la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            `PRODUCT_SKU_ALREADY_EXISTS` — Ya existe un producto con ese sku.

            `IDEMPOTENCY_KEY_IN_PROGRESS` — Llegaron dos peticiones con la misma Idempotency-Key a la vez (código canónico).

            `IDEMPOTENCY_KEY_REUSED` — Se reutilizó una Idempotency-Key con un contenido distinto al de la primera petición (código canónico).

            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo recurso; recarga y reintenta (código canónico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            `CURRENCY_NOT_SUPPORTED` — La currency del price no es la moneda del catálogo; el servicio opera en una sola moneda y no convierte.

            `BRAND_REFERENCE_NOT_FOUND` — El brandId indicado no existe. Es distinto de BRAND_NOT_FOUND: aquí la marca es un dato de la petición, no el recurso pedido.

            `CATEGORY_REFERENCE_NOT_FOUND` — El categoryId indicado no existe. Es distinto de CATEGORY_NOT_FOUND: aquí la categoría es un dato de la petición, no el recurso pedido.

            `BRAND_INACTIVE` — La marca indicada está inactiva y no admite productos nuevos.

            `CATEGORY_INACTIVE` — La categoría indicada está inactiva y no admite productos nuevos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userAuth: []
      x-keel-access:
        level: required
        roles:
        - catalog-manager
        - catalog-admin
        permissions:
        - product:write
    get:
      operationId: listProducts
      summary: Lista los productos para la gestión, en cualquier estado, con los filtros del escaparate más el filtro
        por estado.
      description: |-
        Lista los productos para la gestión, en cualquier estado, con los filtros del escaparate más el filtro por estado.

        **Reglas**:

        - Los filtros son acumulativos; los ausentes no restringen.
        - Un categoryId o brandId que no existe no es un error; la página vuelve vacía.
        - El rango de precio se aplica sobre price.amount, con ambos extremos incluidos.
        - El orden por defecto pone arriba lo último modificado, que es lo que busca quien administra.
      tags:
      - gestión — productos
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ProductStatus'
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: brandId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: name
        in: query
        required: false
        schema:
          type: string
          maxLength: 160
          description: Coincidencia por contenido, ignorando mayúsculas y acentos.
      - name: minPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          multipleOf: 0.01
      - name: maxPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          multipleOf: 0.01
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 24
        description: Tamaño de página; un valor mayor que 100 se recorta a 100.
      responses:
        '200':
          description: Éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: |-
            Petición mal formada: incumple la forma o las restricciones del contrato (sin `code` de negocio).

            `INVALID_PRICE_RANGE` — minPrice es mayor que maxPrice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial o credencial inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso, rol o scope que exige la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userAuth: []
      x-keel-access:
        level: required
        roles:
        - catalog-manager
        - catalog-admin
        permissions:
        - product:read
  /api/v1/products/{id}:
    patch:
      operationId: updateProduct
      summary: 'Modifica los datos comerciales de un producto: nombre, descripción, precio, marca o categoría.'
      description: |-
        Modifica los datos comerciales de un producto: nombre, descripción, precio, marca o categoría.

        **Reglas**:

        - Solo se modifican los campos presentes en la petición; un campo ausente conserva su valor.
        - Un campo opcional enviado a null se vacía (description); uno obligatorio enviado a null (name, price, brandId, categoryId) es una petición mal formada (400).
        - BRAND_INACTIVE y CATEGORY_INACTIVE solo se comprueban cuando la petición asigna una marca o una categoría distinta de la actual; reenviar la que ya tiene no falla aunque esté inactiva.
        - Si ningún valor cambia, se responde con la ficha sin publicar ProductUpdated ni tocar updatedAt ni updatedBy.
        - El sku no se modifica nunca; es la referencia estable con la que otros servidores conocen al producto.

        **Publica**: `ProductUpdated` (outbox).
      tags:
      - gestión — productos
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Clave de intento generada por el cliente, obligatoria. Repetirla con el mismo contenido en
          las siguientes 86400 s devuelve la respuesta original sin segundo efecto.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 160
                description:
                  type:
                  - string
                  - 'null'
                  maxLength: 4000
                price:
                  $ref: '#/components/schemas/Money'
                brandId:
                  type: string
                  format: uuid
                categoryId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: |-
            Petición mal formada: incumple la forma o las restricciones del contrato (sin `code` de negocio).

            `IDEMPOTENCY_KEY_REQUIRED` — La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar que un reintento no repita el efecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial o credencial inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso, rol o scope que exige la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`PRODUCT_NOT_FOUND` — No existe un producto con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            `PRODUCT_RETIRED` — El producto está retirado y ya no admite cambios.

            `IDEMPOTENCY_KEY_IN_PROGRESS` — Llegaron dos peticiones con la misma Idempotency-Key a la vez (código canónico).

            `IDEMPOTENCY_KEY_REUSED` — Se reutilizó una Idempotency-Key con un contenido distinto al de la primera petición (código canónico).

            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo recurso; recarga y reintenta (código canónico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            `BRAND_REFERENCE_NOT_FOUND` — El brandId indicado no existe. Es distinto de BRAND_NOT_FOUND: aquí la marca es un dato de la petición, no el recurso pedido.

            `CATEGORY_REFERENCE_NOT_FOUND` — El categoryId indicado no existe. Es distinto de CATEGORY_NOT_FOUND: aquí la categoría es un dato de la petición, no el recurso pedido.

            `BRAND_INACTIVE` — La marca indicada está inactiva y no admite productos nuevos.

            `CATEGORY_INACTIVE` — La categoría indicada está inactiva y no admite productos nuevos.

            `PRICE_NOT_POSITIVE` — Un producto publicado no puede quedar con precio cero o negativo.

            `CURRENCY_NOT_SUPPORTED` — La currency del price no es la moneda del catálogo; el servicio opera en una sola moneda y no convierte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userAuth: []
      x-keel-access:
        level: required
        roles:
        - catalog-manager
        - catalog-admin
        permissions:
        - product:write
    get:
      operationId: getProduct
      summary: Recupera un producto por su id para la gestión, en cualquier estado y con su rastro de auditoría.
      description: Recupera un producto por su id para la gestión, en cualquier estado y con su rastro de auditoría.
      tags:
      - gestión — productos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: 'Petición mal formada: incumple la forma o las restricciones del contrato (sin `code` de
            negocio).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial o credencial inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso, rol o scope que exige la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`PRODUCT_NOT_FOUND` — No existe un producto con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userAuth: []
      x-keel-access:
        level: required
        roles:
        - catalog-manager
        - catalog-admin
        permissions:
        - product:read
  /api/v1/products/{id}/publish:
    post:
      operationId: publishProduct
      summary: 'Publica un producto en borrador: pasa a active y aparece en el escaparate.'
      description: |-
        Publica un producto en borrador: pasa a active y aparece en el escaparate.

        **Precondiciones**:

        - El producto tiene al menos una imagen y exactamente una marcada como principal.
        - El precio del producto es mayor que cero.

        **Publica**: `ProductStatusChanged` (outbox).
      tags:
      - gestión — productos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: 'Petición mal formada: incumple la forma o las restricciones del contrato (sin `code` de
            negocio).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial o credencial inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso, rol o scope que exige la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`PRODUCT_NOT_FOUND` — No existe un producto con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            `PRODUCT_HAS_NO_IMAGES` — El producto no tiene ninguna imagen y no puede publicarse.

            `PRODUCT_PRICE_NOT_POSITIVE` — El precio que ya tiene el producto no es mayor que cero, así que no puede publicarse.

            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo recurso; recarga y reintenta (código canónico).

            `INVALID_STATE_TRANSITION` — El producto no está en un estado desde el que se permita esta transición (código canónico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userAuth: []
      x-keel-access:
        level: required
        roles:
        - catalog-manager
        - catalog-admin
        permissions:
        - product:publish
  /api/v1/products/{id}/unpublish:
    post:
      operationId: unpublishProduct
      summary: Retira un producto del escaparate devolviéndolo a borrador para corregirlo.
      description: |-
        Retira un producto del escaparate devolviéndolo a borrador para corregirlo.

        **Publica**: `ProductStatusChanged` (outbox).
      tags:
      - gestión — productos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: 'Petición mal formada: incumple la forma o las restricciones del contrato (sin `code` de
            negocio).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial o credencial inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso, rol o scope que exige la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`PRODUCT_NOT_FOUND` — No existe un producto con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo recurso; recarga y reintenta (código canónico).

            `INVALID_STATE_TRANSITION` — El producto no está en un estado desde el que se permita esta transición (código canónico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userAuth: []
      x-keel-access:
        level: required
        roles:
        - catalog-manager
        - catalog-admin
        permissions:
        - product:publish
  /api/v1/products/{id}/retire:
    post:
      operationId: retireProduct
      summary: 'Retira definitivamente un producto del catálogo. Es un estado terminal: no vuelve.'
      description: |-
        Retira definitivamente un producto del catálogo. Es un estado terminal: no vuelve.

        **Reglas**:

        - El producto retirado conserva todos sus datos e imágenes; sigue siendo resoluble por los servidores que lo consumen.
        - El motivo, si se indica, viaja en el evento para que el consumidor pueda explicar la baja.

        **Publica**: `ProductStatusChanged` (outbox).
      tags:
      - gestión — productos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: 'Petición mal formada: incumple la forma o las restricciones del contrato (sin `code` de
            negocio).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial o credencial inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso, rol o scope que exige la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`PRODUCT_NOT_FOUND` — No existe un producto con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo recurso; recarga y reintenta (código canónico).

            `INVALID_STATE_TRANSITION` — El producto no está en un estado desde el que se permita esta transición (código canónico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userAuth: []
      x-keel-access:
        level: admin
        roles:
        - catalog-admin
        permissions:
        - product:retire
  /api/v1/products/{productId}/images:
    post:
      operationId: addProductImage
      summary: Añade una imagen a la ficha de un producto.
      description: |-
        Añade una imagen a la ficha de un producto.

        **Reglas**:

        - La imagen se añade al final, en la primera position libre.
        - La primera imagen de un producto queda siempre marcada como principal, se pida o no.
        - Si se pide main, la imagen que fuera principal hasta entonces deja de serlo.
        - El binario se guarda antes de confirmar la imagen; si la confirmación falla, el binario queda sin referencia y nunca hay una imagen que apunte a un archivo inexistente.

        **Publica**: `ProductUpdated` (outbox).
      tags:
      - gestión — productos
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Clave de intento generada por el cliente, obligatoria. Repetirla con el mismo contenido en
          las siguientes 86400 s devuelve la respuesta original sin segundo efecto.
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Binario de la imagen (bucket `productImages`).
                altText:
                  type: string
                  maxLength: 160
                main:
                  type: boolean
              required:
              - file
      responses:
        '200':
          description: Éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: |-
            Petición mal formada: incumple la forma o las restricciones del contrato (sin `code` de negocio).

            `IDEMPOTENCY_KEY_REQUIRED` — La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar que un reintento no repita el efecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial o credencial inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso, rol o scope que exige la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`PRODUCT_NOT_FOUND` — No existe un producto con ese id.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            `PRODUCT_RETIRED` — El producto está retirado y ya no admite cambios.

            `IMAGE_LIMIT_REACHED` — El producto ya tiene 10 imágenes.

            `IDEMPOTENCY_KEY_IN_PROGRESS` — Llegaron dos peticiones con la misma Idempotency-Key a la vez (código canónico).

            `IDEMPOTENCY_KEY_REUSED` — Se reutilizó una Idempotency-Key con un contenido distinto al de la primera petición (código canónico).

            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo recurso; recarga y reintenta (código canónico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`FILE_TOO_LARGE` — La imagen supera el tamaño máximo admitido por el bucket.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: '`UNSUPPORTED_CONTENT_TYPE` — El formato de la imagen no está entre los admitidos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
