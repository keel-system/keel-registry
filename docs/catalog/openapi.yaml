        - catalog-admin
        permissions:
        - product:write
  /api/v1/products/{productId}/images/{imageId}:
    patch:
      operationId: updateProductImage
      summary: Cambia el texto alternativo, la posición o la condición de principal de una imagen.
      description: |-
        Cambia el texto alternativo, la posición o la condición de principal de una imagen.

        **Reglas**:

        - Solo se modifican los campos presentes en la petición; altText enviado a null se vacía.
        - Si ningún valor cambia, se responde con la ficha sin publicar ProductUpdated.
        - Al fijar una position, las demás imágenes del producto se desplazan para que las posiciones queden consecutivas y sin huecos desde 0.
        - Una position mayor que la última ocupada coloca la imagen al final.
        - Al marcar main, la imagen que fuera principal hasta entonces deja de serlo.

        **Publica**: `ProductUpdated` (outbox).
      tags:
      - gestión — productos
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: Clave de intento generada por el cliente, obligatoria. Repetirla con el mismo contenido en
          las siguientes 86400 s devuelve la respuesta original sin segundo efecto.
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                altText:
                  type:
                  - string
                  - 'null'
                  maxLength: 160
                position:
                  type: integer
                  minimum: 0
                  maximum: 9
                main:
                  type: boolean
      responses:
        '200':
          description: Éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: |-
            Petición mal formada: incumple la forma o las restricciones del contrato (sin `code` de negocio).

            `IDEMPOTENCY_KEY_REQUIRED` — La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar que un reintento no repita el efecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin credencial o credencial inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La credencial no tiene el permiso, rol o scope que exige la operación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |-
            `PRODUCT_NOT_FOUND` — No existe un producto con ese id.

            `IMAGE_NOT_FOUND` — El producto no tiene ninguna imagen con ese id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            `PRODUCT_RETIRED` — El producto está retirado y ya no admite cambios.

            `MAIN_IMAGE_REQUIRED` — Se pide dejar de ser principal a la única imagen principal de un producto que tiene imágenes.

            `IDEMPOTENCY_KEY_IN_PROGRESS` — Llegaron dos peticiones con la misma Idempotency-Key a la vez (código canónico).

            `IDEMPOTENCY_KEY_REUSED` — Se reutilizó una Idempotency-Key con un contenido distinto al de la primera petición (código canónico).

            `CONCURRENT_MODIFICATION` — Otra escritura confirmó antes sobre el mismo recurso; recarga y reintenta (código canónico).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userAuth: []
      x-keel-access:
        level: required
        roles:
        - catalog-manager
        - catalog-admin
        permissions:
        - product:write
    delete:
