openapi: 3.1.0
info:
  title: catalog
  version: 0.1.2
  description: |-
    Catálogo comercial de una tienda: es la fuente de verdad de los productos, sus marcas y sus categorías. Los publica a los consumidores con búsqueda y filtros, los gestiona el personal de la tienda con rastro de autoría, y difunde sus altas y sus cambios al resto de servidores por consulta directa y por eventos.

    Contrato HTTP derivado del diseño Keel (`specs/catalog`). Tres superficies con contratos distintos: la tienda pública (anónima), la gestión del back-office (autenticada, con rastro de autoría) y la superficie servidor-a-servidor (credencial de máquina).

    Convenciones del servicio: un campo sin valor **no viaja** en la respuesta; los instantes son UTC ISO-8601; `price` es decimal de escala 2 que se valida, no se redondea. El `code` de cada error y su status son contrato estable; el texto de `message`, no.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: /
  description: 'El host y el puerto son parámetro de despliegue, no diseño: las rutas de este documento
    son relativas a la raíz del servicio.'
tags:
- name: Tienda pública
  description: 'Lo que consume un comprador anónimo: escaparate, ficha y navegación.'
- name: Gestión de productos
  description: 'Back-office: fichas, estado comercial y galería de imágenes.'
- name: Gestión de marcas
  description: 'Back-office: la taxonomía de marcas, reservada al rol catalog-admin.'
- name: Gestión de categorías
  description: 'Back-office: la taxonomía de categorías, reservada al rol catalog-admin.'
- name: Servidor-a-servidor
  description: 'Superficie M2M: resolución de productos por id y por lote con credencial de máquina.'
paths:
  /api/v1/products:
    get:
      operationId: listPublicProducts
      summary: Lista los productos a la venta, con filtros de categoría, marca, nombre y rango de precio.
      description: |-
        Lista los productos a la venta, con filtros de categoría, marca, nombre y rango de precio.

        Acceso público: no exige credencial.

        **Precondiciones**
        - Si llegan los dos extremos del rango, minPrice no es mayor que maxPrice.

        **Reglas**
        - Solo se devuelven productos active; los borradores y los descontinuados nunca salen aquí.
        - Los filtros se combinan con AND: un producto sale solo si cumple todos los que llegan.
        - Los extremos del rango de precio son inclusivos.
        - Un categorySlug o brandSlug que no existe no es un error: la página sale vacía.
      tags:
      - Tienda pública
      parameters:
      - name: categorySlug
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/Slug'
      - name: brandSlug
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/Slug'
      - name: name
        in: query
        required: false
        description: Coincidencia parcial (contiene), sin distinguir mayúsculas ni acentos.
        schema:
          type: string
          maxLength: 140
      - name: minPrice
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/Price'
      - name: maxPrice
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/Price'
      - name: page
        in: query
        required: false
        description: Índice de página, base 0.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Tamaño de página. Por defecto 20; un valor mayor que 100 se recorta a 100.
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageProductPublic'
        '400':
          description: |-
            Códigos posibles con este status:

            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            Códigos posibles con este status:

            - `INVALID_PRICE_RANGE` — minPrice es mayor que maxPrice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/products/{slug}:
    get:
      operationId: getPublicProduct
      summary: Devuelve la ficha pública de un producto a partir de su slug.
      description: |-
        Devuelve la ficha pública de un producto a partir de su slug.

        Acceso público: no exige credencial.

        Respuesta cacheada 60s (clave: slug), invalidada por ProductUpdated, ProductStatusChanged, BrandUpdated, CategoryUpdated.

        **Reglas**
        - Un producto que no está active responde como si no existiera: la tienda no revela borradores ni descontinuados.
      tags:
      - Tienda pública
      parameters:
      - name: slug
        in: path
        required: true
        description: Identificador en la ruta.
        schema:
          $ref: '#/components/schemas/Slug'
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPublic'
        '400':
          description: |-
            Códigos posibles con este status:

            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |-
            Códigos posibles con este status:

            - `PRODUCT_NOT_FOUND` — No hay ningún producto active con ese slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/brands:
    get:
      operationId: listBrands
      summary: Lista las marcas para que la tienda construya su navegación.
      description: |-
        Lista las marcas para que la tienda construya su navegación.

        Acceso público: no exige credencial.
      tags:
      - Tienda pública
      parameters:
      - name: page
        in: query
        required: false
        description: Índice de página, base 0.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Tamaño de página. Por defecto 20; un valor mayor que 100 se recorta a 100.
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBrand'
        '400':
          description: |-
            Códigos posibles con este status:

            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: Lista las categorías para que la tienda construya su navegación.
      description: |-
        Lista las categorías para que la tienda construya su navegación.

        Acceso público: no exige credencial.
      tags:
      - Tienda pública
      parameters:
      - name: page
        in: query
        required: false
        description: Índice de página, base 0.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Tamaño de página. Por defecto 20; un valor mayor que 100 se recorta a 100.
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCategory'
        '400':
          description: |-
            Códigos posibles con este status:

            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/v1/management/products:
    get:
      operationId: listProducts
      summary: Lista los productos para el back-office, en cualquier estado, con filtros de gestión.
      description: |-
        Lista los productos para el back-office, en cualquier estado, con filtros de gestión.

        Exige token de usuario con permisos `product:read`.

        **Reglas**
        - Los filtros se combinan con AND: un producto sale solo si cumple todos los que llegan.
        - Sin filtro de status se devuelven los productos en los tres estados.
        - Un valor de filtro que no corresponde a ninguna marca o categoría no es un error: la página sale vacía.
      tags:
      - Gestión de productos
      parameters:
      - name: status
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/ProductStatus'
      - name: brandId
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: uuid
      - name: categoryId
        in: query
        required: false
        description: ''
        schema:
          type: string
          format: uuid
      - name: name
        in: query
        required: false
        description: Coincidencia parcial (contiene), sin distinguir mayúsculas ni acentos.
        schema:
          type: string
          maxLength: 140
      - name: sku
        in: query
        required: false
        description: ''
        schema:
          $ref: '#/components/schemas/SKU'
      - name: page
        in: query
        required: false
        description: Índice de página, base 0.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        description: Tamaño de página. Por defecto 20; un valor mayor que 100 se recorta a 100.
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageProductDetail'
        '400':
          description: |-
            Códigos posibles con este status:

            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Códigos posibles con este status:

            - `UNAUTHORIZED` — La petición llega sin credencial o con una no válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Códigos posibles con este status:

            - `FORBIDDEN` — La credencial es válida pero no alcanza lo que esta operación exige.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userToken: []
    post:
      operationId: createProduct
      summary: Da de alta un producto en estado draft, invisible para la tienda.
      description: |-
        Da de alta un producto en estado draft, invisible para la tienda.

        Exige token de usuario con permisos `product:write`.

        **Idempotente**: exige la cabecera `Idempotency-Key`. El reintento con la misma clave reproduce la respuesta original; TTL 86400s.

        **Precondiciones**
        - La marca indicada existe.
        - La categoría indicada existe.

        **Reglas**
        - El sku se normaliza a mayúsculas antes de comprobar su unicidad.
        - El producto nace en draft con slugFrozen falso, así que su slug sigue al nombre hasta que se publique.
        - El slug se deriva del name; si el slug resultante ya existe, se le añade un sufijo numérico.

        **Publica** `ProductCreated`.
      tags:
      - Gestión de productos
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Clave con la que el cliente identifica su petición; el reintento con la misma clave
          no produce un segundo efecto.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  $ref: '#/components/schemas/SKU'
                name:
                  type: string
                  maxLength: 140
                description:
                  type: string
                  maxLength: 4000
                price:
                  $ref: '#/components/schemas/Price'
                brandId:
                  type: string
                  format: uuid
                categoryId:
                  type: string
                  format: uuid
              additionalProperties: false
              required:
              - sku
              - name
              - price
              - brandId
              - categoryId
      responses:
        '201':
          description: Respuesta correcta.
          headers:
            Location:
              description: URI del recurso creado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          description: |-
            Códigos posibles con este status:

            - `IDEMPOTENCY_KEY_REQUIRED` — La petición llega sin la cabecera Idempotency-Key, que esta operación exige.
            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Códigos posibles con este status:

            - `UNAUTHORIZED` — La petición llega sin credencial o con una no válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Códigos posibles con este status:

            - `FORBIDDEN` — La credencial es válida pero no alcanza lo que esta operación exige.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Códigos posibles con este status:

            - `SKU_ALREADY_EXISTS` — Ya existe un producto con ese sku.
            - `IDEMPOTENCY_KEY_IN_PROGRESS` — Otra petición con la misma clave de idempotencia se está ejecutando en este momento.
            - `IDEMPOTENCY_KEY_REUSED` — La misma clave de idempotencia llega con un contenido distinto al de la primera petición.
            - `CONCURRENT_MODIFICATION` — Otra escritura modificó el producto mientras se ejecutaba esta. Lo emite el framework por el control de versión de la raíz del agregado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            Códigos posibles con este status:

            - `BRAND_REFERENCE_NOT_FOUND` — El brandId indicado no corresponde a ninguna marca existente.
            - `CATEGORY_REFERENCE_NOT_FOUND` — El categoryId indicado no corresponde a ninguna categoría existente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userToken: []
  /api/v1/management/products/{productId}:
    get:
      operationId: getProduct
      summary: Recupera la ficha completa de un producto para el back-office, con su rastro de autoría.
      description: |-
        Recupera la ficha completa de un producto para el back-office, con su rastro de autoría.

        Exige token de usuario con permisos `product:read`.
      tags:
      - Gestión de productos
      parameters:
      - name: productId
        in: path
        required: true
        description: Identificador en la ruta.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          description: |-
            Códigos posibles con este status:

            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Códigos posibles con este status:

            - `UNAUTHORIZED` — La petición llega sin credencial o con una no válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Códigos posibles con este status:

            - `FORBIDDEN` — La credencial es válida pero no alcanza lo que esta operación exige.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |-
            Códigos posibles con este status:

            - `PRODUCT_NOT_FOUND` — No existe un producto con ese productId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userToken: []
    put:
      operationId: updateProduct
      summary: Cambia la ficha comercial de un producto (nombre, descripción, precio, marca o categoría).
      description: |-
        Cambia la ficha comercial de un producto (nombre, descripción, precio, marca o categoría).

        Exige token de usuario con permisos `product:write`.

        **Precondiciones**
        - El producto existe.
        - La marca y la categoría indicadas existen.

        **Reglas**
        - El sku no se puede cambiar: no forma parte de la entrada.
        - El slug se recalcula a partir del nuevo name solo si slugFrozen es falso.
        - Un producto active no puede quedarse con price igual a cero.
        - La entrada es la representación completa de la ficha: un campo opcional que no viene se vacía, no se conserva.
        - Un producto discontinued sí se puede editar; su ficha la siguen mostrando los pedidos históricos.
        - El control de versión protege frente a escrituras que se solapan: si dos ediciones confirman a la vez sobre la misma versión, la que pierde responde 409 CONCURRENT_MODIFICATION. La versión leída no viaja en la petición, así que dos ediciones sucesivas se aplican en orden y prevalece la última.

        **Publica** `ProductUpdated`.
      tags:
      - Gestión de productos
      parameters:
      - name: productId
        in: path
        required: true
        description: Identificador en la ruta.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 140
                description:
                  type: string
                  maxLength: 4000
                price:
                  $ref: '#/components/schemas/Price'
                brandId:
                  type: string
                  format: uuid
                categoryId:
                  type: string
                  format: uuid
              additionalProperties: false
              required:
              - name
              - price
              - brandId
              - categoryId
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          description: |-
            Códigos posibles con este status:

            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Códigos posibles con este status:

            - `UNAUTHORIZED` — La petición llega sin credencial o con una no válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Códigos posibles con este status:

            - `FORBIDDEN` — La credencial es válida pero no alcanza lo que esta operación exige.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |-
            Códigos posibles con este status:

            - `PRODUCT_NOT_FOUND` — No existe un producto con ese productId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Códigos posibles con este status:

            - `CONCURRENT_MODIFICATION` — Otra escritura modificó el producto mientras se ejecutaba esta. Lo emite el framework por el control de versión de la raíz del agregado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            Códigos posibles con este status:

            - `BRAND_REFERENCE_NOT_FOUND` — El brandId indicado no corresponde a ninguna marca existente.
            - `CATEGORY_REFERENCE_NOT_FOUND` — El categoryId indicado no corresponde a ninguna categoría existente.
            - `PRICE_REQUIRED_FOR_ACTIVE_PRODUCT` — Se intenta dejar en cero el precio de un producto active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userToken: []
    delete:
      operationId: deleteProduct
      summary: Elimina definitivamente un producto que nunca llegó a publicarse.
      description: |-
        Elimina definitivamente un producto que nunca llegó a publicarse.

        Exige token de usuario con permisos `product:delete` y rol `catalog-admin`.

        **Precondiciones**
        - El producto existe y está en draft.
        - El producto no se ha publicado nunca (slugFrozen es falso).

        **Reglas**
        - Las imágenes de la galería se eliminan con el producto, y sus objetos se retiran del bucket.
        - Un producto que ya estuvo publicado no se borra: se descontinúa, porque otros servidores guardan su id.

        **Publica** `ProductDeleted`.
      tags:
      - Gestión de productos
      parameters:
      - name: productId
        in: path
        required: true
        description: Identificador en la ruta.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Operación ejecutada; sin cuerpo de respuesta.
        '400':
          description: |-
            Códigos posibles con este status:

            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Códigos posibles con este status:

            - `UNAUTHORIZED` — La petición llega sin credencial o con una no válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Códigos posibles con este status:

            - `FORBIDDEN` — La credencial es válida pero no alcanza lo que esta operación exige.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |-
            Códigos posibles con este status:

            - `PRODUCT_NOT_FOUND` — No existe un producto con ese productId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Códigos posibles con este status:

            - `PRODUCT_NOT_DELETABLE` — El producto no está en draft o ya estuvo publicado alguna vez.
            - `CONCURRENT_MODIFICATION` — Otra escritura modificó el producto mientras se ejecutaba esta. Lo emite el framework por el control de versión de la raíz del agregado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - userToken: []
  /api/v1/management/products/{productId}/publish:
    post:
      operationId: publishProduct
      summary: Publica un producto en borrador para que la tienda lo muestre.
      description: |-
        Publica un producto en borrador para que la tienda lo muestre.

        Exige token de usuario con permisos `product:write`.

        **Precondiciones**
        - El producto existe y está en draft.
        - El producto tiene un price mayor que cero.
        - El producto tiene al menos una imagen.

        **Reglas**
        - Al publicarse por primera vez, slugFrozen pasa a verdadero y el slug deja de seguir al nombre.

        **Publica** `ProductStatusChanged`.
      tags:
      - Gestión de productos
      parameters:
      - name: productId
        in: path
        required: true
        description: Identificador en la ruta.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Respuesta correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '400':
          description: |-
            Códigos posibles con este status:

            - `VALIDATION_ERROR` — La petición no cumple las cotas declaradas en la entrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Códigos posibles con este status:

