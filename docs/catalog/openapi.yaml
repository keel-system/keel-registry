                BRAND_NOT_FOUND:
                  summary: No existe una marca con ese id.
                  value:
                    status: 404
                    code: BRAND_NOT_FOUND
                    message: No existe una marca con ese id.
        '409':
          description: '`CONCURRENT_MODIFICATION` — Otra escritura sobre la misma raíz se confirmó antes; el cliente
            relee y reintenta con la versión nueva.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                CONCURRENT_MODIFICATION:
                  summary: Otra escritura sobre la misma raíz se confirmó antes; el cliente relee y reintenta con
                    la versión nueva.
                  value:
                    status: 409
                    code: CONCURRENT_MODIFICATION
                    message: Otra escritura sobre la misma raíz se confirmó antes; el cliente relee y reintenta
                      con la versión nueva.
      security:
      - userAuth: []
      x-keel-permissions:
      - taxonomy:write
      x-keel-roles:
      - catalog-admin
