        '403':
          description: '`ACCESS_DENIED` — La credencial no tiene el permiso o scope exigido (o es un token emitido
            para otra audiencia).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                ACCESS_DENIED:
                  summary: La credencial no tiene el permiso o scope exigido (o es un token emitido para otra audiencia).
                  value:
                    status: 403
                    code: ACCESS_DENIED
                    message: La credencial no tiene el permiso o scope exigido (o es un token emitido para otra
                      audiencia).
      security:
      - serviceAuth: &id002
        - product:read-internal
      x-keel-scopes: *id002
      x-keel-audience: services
components:
  securitySchemes:
    userAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de usuario (OIDC) del proveedor de identidad del despliegue. El permiso exigido por cada
        operación está en `x-keel-permissions`; los roles que lo conceden, en `x-keel-roles`.
    serviceAuth:
      type: oauth2
      description: Credencial de máquina (OAuth2 client credentials). El `tokenUrl` real es parámetro de despliegue;
        se valida la audiencia `catalog`, así que un token emitido para otro servicio responde 403.
      flows:
        clientCredentials:
          tokenUrl: https://identity.invalid/oauth2/token
          scopes:
            product:read-internal: Resolver productos por id o por lote desde otro servidor, en cualquier estado.
  schemas:
    SKU:
      type: string
      pattern: ^[A-Z0-9][A-Z0-9_-]{1,31}$
      description: Referencia comercial única del producto, la que comparten el catálogo y los servidores que lo
        consumen.
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: Importe.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Moneda del importe en ISO 4217.
      description: 'Importe con su moneda. El servicio no convierte divisas: todo precio va en la moneda del catálogo.'
    ProductStatus:
      type: string
      enum:
      - draft
      - active
      - retired
      description: Situación comercial del producto.
    Brand:
      type: object
      required:
      - id
      - name
      - description
      - active
      - lockVersion
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre comercial de la marca.
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Texto libre sobre la marca, visible en la tienda.
        active:
          type: boolean
          description: Una marca inactiva no admite productos nuevos ni se ofrece como filtro al público. Nunca
            se borra.
        lockVersion:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
      description: Marca, proyección de gestión (con versión y auditoría).
    BrandPublic:
      type: object
      required:
      - id
      - name
      - description
      - active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nombre comercial de la marca.
        description:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Texto libre sobre la marca, visible en la tienda.
        active:
          type: boolean
          description: Una marca inactiva no admite productos nuevos ni se ofrece como filtro al público. Nunca
            se borra.
      description: Marca, proyección pública y M2M (sin versión ni auditoría).
    Category:
      type: object
      required:
      - id
      - name
      - description
      - active
      - lockVersion
      - createdAt
      - updatedAt
      - createdBy
      - updatedBy
      properties:
