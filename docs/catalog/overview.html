  .card .note { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }

  details.item > summary::before { content: "▸"; color: var(--muted); }
  details.item[open] > summary::before { content: "▾"; }
  details.item[open] > summary { border-bottom: 1px solid var(--border); background: var(--panel-2); }

  .item-desc { color: var(--muted); font-size: 13px; flex: 1 1 200px; }

  .body ul { margin: 0; padding-left: 20px; }
  .body p { margin: 0 0 6px; }

  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }

  footer { margin-top: 44px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--border); padding-top: 12px; }

    {

      "audience": "users",

        "type": "http",
        "method": "POST",
        "path": "/api/v1/admin/products/{productId}/images"

            "list": false

      "rules": [
        "El tamaño y el formato del archivo se comprueban antes que el producto; un archivo rechazado nunca llega a mirar el estado del producto.",
        "La imagen se añade al final, en la position siguiente a la última ocupada; es la imagen nueva la que queda en la última position de la ficha devuelta.",
        "Añadir una imagen sube la lockVersion del producto; dos altas simultáneas sobre el mismo producto no pueden repetir position ni superar el tope de 10, y la que pierde responde CONCURRENT_MODIFICATION.",
        "La primera imagen de un producto queda siempre marcada como principal, se pida o no.",
        "Si se pide main, la imagen que fuera principal hasta entonces deja de serlo.",
        "El formato se comprueba por el contenido del binario (su firma), no solo por el tipo declarado en la petición.",
        "El binario se guarda antes de confirmar la imagen; si la confirmación falla, el binario queda sin referencia y nunca hay una imagen que apunte a un archivo inexistente."
      ],
      "errors": [
        {
          "code": "IDEMPOTENCY_KEY_REQUIRED",
          "http": 400,
          "when": "La petición no trae la cabecera Idempotency-Key; sin ella el servicio no puede garantizar que un reintento no repita el efecto."
        },
        {
          "code": "FILE_TOO_LARGE",
          "http": 413,
          "when": "La imagen supera el tamaño máximo admitido por el bucket."
        },
        {
          "code": "UNSUPPORTED_CONTENT_TYPE",
          "http": 415,
          "when": "El formato de la imagen no está entre los admitidos, o el contenido del archivo no coincide con el tipo declarado."
        },
        {
          "code": "PRODUCT_NOT_FOUND",
          "http": 404,
          "when": "No existe un producto con ese id."
        },
        {
          "code": "PRODUCT_RETIRED",
          "http": 409,
          "when": "El producto está retirado y ya no admite cambios."
        },
        {
          "code": "IMAGE_LIMIT_REACHED",
          "http": 409,
          "when": "El producto ya tiene 10 imágenes."
        },
        {
          "code": "CONCURRENT_MODIFICATION",
          "http": 409,
          "when": "Otra escritura sobre el mismo producto se confirmó durante el alta (p. ej. otra imagen subida a la vez)."
        }
      ],
      "idempotency": {
        "keySource": "client-key",
        "ttlSeconds": 86400
      },
      "cache": null,
      "schedule": null,
      "security": {
        "level": "required",
        "permissions": [

          has(e.relations) ? section('Relaciones', table(['Relación', 'Entidad', 'Cardinalidad'],
            e.relations.map(function (r) { return [r.name, r.entity, r.cardinality]; }), [0, 1])) : null,
          e.lifecycle ? section('Ciclo de vida (' + e.lifecycle.field + ')',
            table(['Estado', 'Transiciona a'], Object.keys(e.lifecycle.transitions || {}).map(function (k) {
              return [k, list(e.lifecycle.transitions[k]) || 'terminal'];
            }), [0, 1])) : null,
          has(e.invariants) ? section('Invariantes', ul(e.invariants)) : null
        ]);
        dh.appendChild(el('details', { class: 'item' }, [
          el('summary', {}, [txt('span', e.name, 'item-name'),
            badge((e.fields || []).length + ' campo(s)', 'tag'),
            e.persisted ? badge('persistida', 'on') : null,
            txt('span', e.description || '', 'item-desc')]),
          b
        ]));
      });
    }
    if (has(dom.types)) {
      dh.appendChild(txt('h3', 'Value types'));
      dh.appendChild(table(['Tipo', 'Forma', 'Detalle', 'Descripción'], dom.types.map(function (t) {
        return [t.name, t.kind, t.detail || '—', t.description || '—'];
      }), [0, 1, 2]));
    }
  }

  document.getElementById('footer').textContent =
    'Derivado del diseño Keel de ' + (svc.name || '—') + ' v' + (svc.version || '—') +
    (svc.generatedAt ? ' · generado el ' + svc.generatedAt : '') +
    ' · La fuente de verdad son los artefactos de specs/. No edites este archivo a mano: regenéralo con /keel-docs.';
})();
</script>
