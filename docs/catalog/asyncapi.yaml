asyncapi: 3.0.0
info:
  title: catalog
  version: 0.1.0
  description: |-
    Gestiona el catálogo comercial —productos con sus imágenes, marcas y categorías—, lo expone filtrable al público de la tienda, lo sirve a otros servidores por contrato y publica las altas y cambios de producto como eventos.

    Contrato asíncrono derivado del diseño Keel (capa messaging). El broker concreto y los nombres físicos de topic/cola se deciden al generar, no aquí.

    Todo evento lleva la **foto completa** del producto tras el cambio. `version` es la `lockVersion` del producto: el consumidor descarta un evento con versión menor o igual a la que ya aplicó. Una retirada llega como `ProductUpdated` con `status: retired`. En los eventos `file` es la **key** del objeto: con el bucket público `productImages`, la URL es la base pública del bucket más la key (o se resuelve por el endpoint M2M).
defaultContentType: application/json
channels:
  productEvents:
    address: productEvents
    title: productEvents
    description: 'Altas y cambios de producto que publica el catálogo, para que otros servidores mantengan su copia.
      Nombre lógico: el topic/cola físico que lo respalda es parámetro de despliegue.'
    messages:
      ProductCreated:
        $ref: '#/components/messages/ProductCreated'
      ProductUpdated:
        $ref: '#/components/messages/ProductUpdated'
operations:
  publishProductCreated:
    action: send
    channel:
      $ref: '#/channels/productEvents'
    summary: Se dio de alta un producto.
    messages:
    - $ref: '#/channels/productEvents/messages/ProductCreated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - createProduct
  publishProductUpdated:
    action: send
    channel:
      $ref: '#/channels/productEvents'
    summary: 'Cambió algo de un producto: sus datos comerciales, su estado (publicación, despublicación, retirada)
      o sus imágenes.'
    messages:
    - $ref: '#/channels/productEvents/messages/ProductUpdated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - updateProduct
    - publishProduct
    - unpublishProduct
    - retireProduct
    - addProductImage
    - updateProductImage
    - removeProductImage
components:
  messages:
    ProductCreated:
      name: ProductCreated
      title: ProductCreated
      contentType: application/json
      summary: Se dio de alta un producto.
      description: Se dio de alta un producto. Lleva la foto completa del producto en el instante del hecho, igual
        que ProductUpdated, para que el consumidor haga un upsert sin llamar a nadie.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProductCreatedPayload'
    ProductUpdated:
      name: ProductUpdated
      title: ProductUpdated
      contentType: application/json
      summary: 'Cambió algo de un producto: sus datos comerciales, su estado (publicación, despublicación, retirada)
        o sus imágenes.'
      description: 'Cambió algo de un producto: sus datos comerciales, su estado (publicación, despublicación, retirada)
        o sus imágenes. Lleva la foto completa tras el cambio; una retirada llega como status retired y el producto
        nunca desaparece de la copia del consumidor. Un cambio nulo (nada distinto) no publica.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProductUpdatedPayload'
  schemas:
    KeelEventMetadata:
      type: object
      description: Metadata transversal de la envoltura Keel; la estampa el servicio al emitir.
      required:
      - eventId
      - eventType
      - eventVersion
      - occurredAt
      - source
      properties:
        eventId:
          type: string
          format: uuid
          description: Id único de esta ocurrencia; clave de deduplicación del consumidor.
        eventType:
          type: string
          description: Nombre del evento en el diseño; discriminador cuando el canal lleva varios tipos.
        eventVersion:
          type: integer
          minimum: 1
          description: Versión del contrato del payload.
        occurredAt:
          type: string
          format: date-time
          description: Instante UTC en que ocurrió el hecho en el dominio, no el del envío.
        source:
          type: string
          description: Nombre del servicio emisor.
        correlationId:
          type:
          - string
          - 'null'
          description: Correlación de la petición que originó el hecho; null si no hubo contexto.
        traceparent:
          type:
          - string
          - 'null'
          description: Contexto de traza W3C (traceparent) del hecho; null si el emisor no tiene telemetría.
    ProductCreatedPayload:
      type: object
      required:
      - productId
      - sku
      - name
      - price
      - status
      - brand
      - category
      - version
      properties:
        productId:
          type: string
          format: uuid
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        price:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/ProductStatus'
        brand:
          $ref: '#/components/schemas/NamedRef'
        category:
          $ref: '#/components/schemas/NamedRef'
        images:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ProductImageRef'
          maxItems: 10
        version:
          type: integer
          format: int32
          description: Versión del producto tras el cambio (su lockVersion); el consumidor descarta un evento con
            versión menor o igual a la que ya aplicó.
    ProductUpdatedPayload:
      type: object
      required:
      - productId
      - sku
      - name
      - price
      - status
      - brand
      - category
      - version
      properties:
        productId:
          type: string
          format: uuid
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        price:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/ProductStatus'
        brand:
          $ref: '#/components/schemas/NamedRef'
        category:
          $ref: '#/components/schemas/NamedRef'
        images:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ProductImageRef'
          maxItems: 10
        version:
          type: integer
          format: int32
          description: Versión del producto tras el cambio (su lockVersion); el consumidor descarta un evento con
            versión menor o igual a la que ya aplicó.
    SKU:
      type: string
      pattern: ^[A-Z0-9][A-Z0-9_-]{1,31}$
      description: Referencia comercial única del producto, la que comparten el catálogo y los servidores que lo
        consumen.
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: Importe.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Moneda del importe en ISO 4217.
      description: 'Importe con su moneda. El servicio no convierte divisas: todo precio va en la moneda del catálogo.'
    ProductStatus:
      type: string
      enum:
      - draft
      - active
      - retired
      description: Situación comercial del producto.
    NamedRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          description: Id de la marca o categoría.
        name:
          type: string
          maxLength: 80
          description: Nombre en el instante del evento; no se refresca si luego se renombra.
      description: 'Referencia a una marca o categoría tal como viaja en los eventos: su id y su nombre en el instante
        del hecho.'
    ProductImageRef:
      type: object
      required:
      - imageId
      - file
      - position
      - main
      properties:
        imageId:
          type: string
          format: uuid
          description: Id de la imagen dentro del producto.
        file:
          type: string
          description: Key del objeto en el bucket lógico `productImages` (viaja la referencia, no el binario ni
            una URL).
        altText:
          type: string
          maxLength: 160
          description: Texto alternativo.
        position:
          type: integer
          format: int32
          minimum: 0
          maximum: 9
          description: Orden de visualización dentro de la ficha.
        main:
          type: boolean
          description: Imagen principal del producto.
      description: Proyección de una imagen de producto tal como viaja en los eventos, sin identidad fuera de su
        producto.
  correlationIds:
    keelCorrelationId:
      description: Correlación end-to-end estampada en la envoltura Keel.
      location: $message.payload#/metadata/correlationId
