asyncapi: 3.0.0
info:
  title: catalog
  version: 0.1.1
  description: |-
    Catálogo comercial de una tienda: es la fuente de verdad de los productos, sus marcas y sus categorías. Los publica a los consumidores con búsqueda y filtros, los gestiona el personal de la tienda con rastro de autoría, y difunde sus altas y sus cambios al resto de servidores por consulta directa y por eventos.

    Contrato asíncrono derivado del diseño Keel (capa messaging). El broker concreto y los nombres físicos de topic/cola se deciden al generar.

    Todo evento publicado viaja en la envoltura estándar Keel (`metadata` + `data`): `data` es el payload declarado en el diseño y `metadata` es transversal e idéntica en los diez eventos. La publicación es `outbox`: el evento se escribe en la misma transacción que el agregado y un relay lo publica después, así que ningún cambio confirmado se queda sin anunciar.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
defaultContentType: application/json
channels:
  productEvents:
    address: productEvents
    title: productEvents
    description: 'Ciclo de vida de los productos del catálogo. Lo consume quien mantiene una copia de
      la ficha o un índice de búsqueda. Nombre lógico: el topic o cola física que lo respalda es parámetro
      de despliegue.'
    messages:
      ProductCreated:
        $ref: '#/components/messages/ProductCreated'
      ProductUpdated:
        $ref: '#/components/messages/ProductUpdated'
      ProductStatusChanged:
        $ref: '#/components/messages/ProductStatusChanged'
      ProductDeleted:
        $ref: '#/components/messages/ProductDeleted'
  taxonomyEvents:
    address: taxonomyEvents
    title: taxonomyEvents
    description: 'Ciclo de vida de marcas y categorías. Canal aparte del de productos a propósito: quien
      solo sigue productos no tiene por qué tragar el ruido de la taxonomía, que cambia mucho menos. Quien
      copie brandName o categoryName dentro de su propia ficha de producto TIENE que escuchar este canal:
      al renombrarse una marca, el catálogo no re-emite los eventos de sus productos —serían miles de
      golpe— así que la corrección llega solo por aquí, y el consumidor actualiza sus copias por brandId
      o categoryId. Nombre lógico: el topic o cola física que lo respalda es parámetro de despliegue.'
    messages:
      BrandCreated:
        $ref: '#/components/messages/BrandCreated'
      BrandUpdated:
        $ref: '#/components/messages/BrandUpdated'
      BrandDeleted:
        $ref: '#/components/messages/BrandDeleted'
      CategoryCreated:
        $ref: '#/components/messages/CategoryCreated'
      CategoryUpdated:
        $ref: '#/components/messages/CategoryUpdated'
      CategoryDeleted:
        $ref: '#/components/messages/CategoryDeleted'
operations:
  publishProductCreated:
    action: send
    channel:
      $ref: '#/channels/productEvents'
    summary: Se dio de alta un producto. Nace en draft, así que todavía no se vende.
    messages:
    - $ref: '#/channels/productEvents/messages/ProductCreated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - createProduct
  publishProductUpdated:
    action: send
    channel:
      $ref: '#/channels/productEvents'
    summary: 'Cambió la ficha comercial de un producto: su nombre, descripción, precio, marca, categoría
      o su galería de imágenes. El payload es el estado resultante, no el diff.'
    messages:
    - $ref: '#/channels/productEvents/messages/ProductUpdated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - updateProduct
    - addProductImage
    - removeProductImage
    - setPrimaryProductImage
    - reorderProductImages
  publishProductStatusChanged:
    action: send
    channel:
      $ref: '#/channels/productEvents'
    summary: Un producto entró o salió de la venta (publicado, retirado a borrador, descontinuado o reactivado).
      Lleva el estado anterior para que el consumidor sepa qué transición fue.
    messages:
    - $ref: '#/channels/productEvents/messages/ProductStatusChanged'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - publishProduct
    - unpublishProduct
    - discontinueProduct
    - reactivateProduct
  publishProductDeleted:
    action: send
    channel:
      $ref: '#/channels/productEvents'
    summary: 'Se eliminó definitivamente un producto en borrador. Es la vía de baja del consumidor: sin
      ella, una copia local se queda rancia para siempre. No repite la ficha porque el producto ya no
      existe — lleva lo justo para localizar la copia y borrarla.'
    messages:
    - $ref: '#/channels/productEvents/messages/ProductDeleted'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - deleteProduct
  publishBrandCreated:
    action: send
    channel:
      $ref: '#/channels/taxonomyEvents'
    summary: Se dio de alta una marca.
    messages:
    - $ref: '#/channels/taxonomyEvents/messages/BrandCreated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - createBrand
  publishBrandUpdated:
    action: send
    channel:
      $ref: '#/channels/taxonomyEvents'
    summary: Cambió el nombre o la reseña de una marca; con el nombre cambia también su slug público.
    messages:
    - $ref: '#/channels/taxonomyEvents/messages/BrandUpdated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - updateBrand
  publishBrandDeleted:
    action: send
    channel:
      $ref: '#/channels/taxonomyEvents'
    summary: Se eliminó una marca que ningún producto referenciaba.
    messages:
    - $ref: '#/channels/taxonomyEvents/messages/BrandDeleted'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - deleteBrand
  publishCategoryCreated:
    action: send
    channel:
      $ref: '#/channels/taxonomyEvents'
    summary: Se dio de alta una categoría.
    messages:
    - $ref: '#/channels/taxonomyEvents/messages/CategoryCreated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - createCategory
  publishCategoryUpdated:
    action: send
    channel:
      $ref: '#/channels/taxonomyEvents'
    summary: Cambió el nombre o el texto de cabecera de una categoría; con el nombre cambia también su
      slug público.
    messages:
    - $ref: '#/channels/taxonomyEvents/messages/CategoryUpdated'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - updateCategory
  publishCategoryDeleted:
    action: send
    channel:
      $ref: '#/channels/taxonomyEvents'
    summary: Se eliminó una categoría que ningún producto referenciaba.
    messages:
    - $ref: '#/channels/taxonomyEvents/messages/CategoryDeleted'
    x-keel-reliability: outbox
    x-keel-emitted-by:
    - deleteCategory
components:
  messages:
    ProductCreated:
      name: ProductCreated
      title: ProductCreated
      contentType: application/json
      summary: Se dio de alta un producto. Nace en draft, así que todavía no se vende.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProductCreatedPayload'
    ProductUpdated:
      name: ProductUpdated
      title: ProductUpdated
      contentType: application/json
      summary: 'Cambió la ficha comercial de un producto: su nombre, descripción, precio, marca, categoría
        o su galería de imágenes. El payload es el estado resultante, no el diff.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProductUpdatedPayload'
    ProductStatusChanged:
      name: ProductStatusChanged
      title: ProductStatusChanged
      contentType: application/json
      summary: Un producto entró o salió de la venta (publicado, retirado a borrador, descontinuado o
        reactivado). Lleva el estado anterior para que el consumidor sepa qué transición fue.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProductStatusChangedPayload'
    ProductDeleted:
      name: ProductDeleted
      title: ProductDeleted
      contentType: application/json
      summary: 'Se eliminó definitivamente un producto en borrador. Es la vía de baja del consumidor:
        sin ella, una copia local se queda rancia para siempre. No repite la ficha porque el producto
        ya no existe — lleva lo justo para localizar la copia y borrarla.'
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/ProductDeletedPayload'
    BrandCreated:
      name: BrandCreated
      title: BrandCreated
      contentType: application/json
      summary: Se dio de alta una marca.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/BrandCreatedPayload'
    BrandUpdated:
      name: BrandUpdated
      title: BrandUpdated
      contentType: application/json
      summary: Cambió el nombre o la reseña de una marca; con el nombre cambia también su slug público.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/BrandUpdatedPayload'
    BrandDeleted:
      name: BrandDeleted
      title: BrandDeleted
      contentType: application/json
      summary: Se eliminó una marca que ningún producto referenciaba.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/BrandDeletedPayload'
    CategoryCreated:
      name: CategoryCreated
      title: CategoryCreated
      contentType: application/json
      summary: Se dio de alta una categoría.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/CategoryCreatedPayload'
    CategoryUpdated:
      name: CategoryUpdated
      title: CategoryUpdated
      contentType: application/json
      summary: Cambió el nombre o el texto de cabecera de una categoría; con el nombre cambia también
        su slug público.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/CategoryUpdatedPayload'
    CategoryDeleted:
      name: CategoryDeleted
      title: CategoryDeleted
      contentType: application/json
      summary: Se eliminó una categoría que ningún producto referenciaba.
      correlationId:
        $ref: '#/components/correlationIds/keelCorrelationId'
      payload:
        type: object
        required:
        - metadata
        - data
        properties:
          metadata:
            $ref: '#/components/schemas/KeelEventMetadata'
          data:
            $ref: '#/components/schemas/CategoryDeletedPayload'
  schemas:
    KeelEventMetadata:
      type: object
      description: Metadata transversal de la envoltura Keel; la estampa el servicio al emitir.
      required:
      - eventId
      - eventType
      - eventVersion
      - occurredAt
      - source
      properties:
        eventId:
          type: string
          format: uuid
          description: Id único de esta ocurrencia; clave de deduplicación del consumidor.
        eventType:
          type: string
          description: Nombre del evento en el diseño; discriminador cuando el canal lleva varios tipos.
        eventVersion:
          type: integer
          minimum: 1
          description: Versión del contrato del payload.
        occurredAt:
          type: string
          format: date-time
          description: Instante UTC en que ocurrió el hecho en el dominio, no el del envío.
        source:
          type: string
          description: Nombre del servicio emisor.
        correlationId:
          type:
          - string
          - 'null'
          description: Correlación de la petición que originó el hecho; null si no hubo contexto.
        traceparent:
          type:
          - string
          - 'null'
          description: Contexto de traza W3C (traceparent) del hecho; null si el emisor no tiene telemetría.
    ProductCreatedPayload:
      type: object
      required:
      - productId
      - sku
      - name
      - slug
      - price
      - status
      - brandId
      - brandName
      - categoryId
      - categoryName
      properties:
        productId:
          type: string
          format: uuid
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        status:
          $ref: '#/components/schemas/ProductStatus'
        brandId:
          type: string
          format: uuid
        brandName:
          type: string
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        primaryImageUrl:
          type: string
          description: URL pública de la imagen principal; ausente mientras el producto no tenga ninguna.
    ProductUpdatedPayload:
      type: object
      required:
      - productId
      - sku
      - name
      - slug
      - price
      - status
      - brandId
      - brandName
      - categoryId
      - categoryName
      properties:
        productId:
          type: string
          format: uuid
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
        price:
          $ref: '#/components/schemas/Price'
        status:
          $ref: '#/components/schemas/ProductStatus'
        brandId:
          type: string
          format: uuid
        brandName:
          type: string
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        primaryImageUrl:
          type: string
          description: URL pública de la imagen principal; ausente si el producto no tiene ninguna.
    ProductStatusChangedPayload:
      type: object
      required:
      - productId
      - sku
      - name
      - slug
      - price
      - previousStatus
      - status
      - brandId
      - brandName
      - categoryId
      - categoryName
      properties:
        productId:
          type: string
          format: uuid
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
        slug:
          $ref: '#/components/schemas/Slug'
        price:
          $ref: '#/components/schemas/Price'
        previousStatus:
          $ref: '#/components/schemas/ProductStatus'
        status:
          $ref: '#/components/schemas/ProductStatus'
        brandId:
          type: string
          format: uuid
        brandName:
          type: string
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        primaryImageUrl:
          type: string
          description: URL pública de la imagen principal; ausente si el producto no tiene ninguna.
    ProductDeletedPayload:
      type: object
      required:
      - productId
      - sku
      - name
      properties:
        productId:
          type: string
          format: uuid
        sku:
          $ref: '#/components/schemas/SKU'
        name:
          type: string
    BrandCreatedPayload:
      type: object
      required:
      - brandId
      - name
      - slug
      properties:
        brandId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
    BrandUpdatedPayload:
      type: object
      required:
      - brandId
      - name
      - slug
      properties:
        brandId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
    BrandDeletedPayload:
      type: object
      required:
      - brandId
      - name
      properties:
        brandId:
          type: string
          format: uuid
        name:
          type: string
    CategoryCreatedPayload:
      type: object
      required:
      - categoryId
      - name
      - slug
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
    CategoryUpdatedPayload:
      type: object
      required:
      - categoryId
      - name
      - slug
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          $ref: '#/components/schemas/Slug'
        description:
          type: string
    CategoryDeletedPayload:
      type: object
      required:
      - categoryId
      - name
      properties:
        categoryId:
          type: string
          format: uuid
        name:
          type: string
    ProductStatus:
      type: string
      enum:
      - draft
      - active
      - discontinued
      description: Situación comercial del producto, que decide si la tienda pública lo muestra.
    SKU:
      type: string
      pattern: ^[A-Z0-9][A-Z0-9-]{2,31}$
      description: 'Código comercial con el que el negocio conoce el artículo (almacén, proveedor, facturas).
        Único e inmutable: identifica al mismo artículo físico durante toda su vida.'
    Price:
      type: number
      minimum: 0
      multipleOf: 0.01
      description: 'Importe de venta al público en la divisa única de la tienda, que es una constante
        del despliegue y no un dato del producto. La escala de dos decimales se valida, no se ajusta:
        un importe con más decimales se rechaza en vez de redondearse, porque el servicio no hace aritmética
        sobre el precio — lo guarda y lo devuelve tal cual llegó.'
    Slug:
      type: string
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      maxLength: 160
      description: Identificador legible usado en las URLs públicas, derivado del nombre.
  correlationIds:
    keelCorrelationId:
      description: Correlación end-to-end estampada en la envoltura Keel.
      location: $message.payload#/metadata/correlationId
